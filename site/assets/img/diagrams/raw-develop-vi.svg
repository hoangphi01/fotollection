-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="12px"><text x="101" y="193">Bản xem trước</text><text x="101" y="207">nhúng của máy</text><text x="101" y="221">→ ảnh nhỏ trong</text><text x="101" y="235">lưới, 9–32 ms</text></g></g></g><g data-cell-id="c21"><g><path d="M 101 92 L 101 156.82" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke"/><path d="M 101 164.32 L 97.25 156.82 L 104.75 156.82 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c22"><g transform="translate(0.5,0.5)"><rect x="226" y="284" width="18" height="18" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g></g><g data-cell-id="c23"><g><rect x="250" y="278" width="330" height="30" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="262" y="298">Mã của riêng Fotollection, trên mọi nhân bộ xử lý</text></g></g></g><g data-cell-id="c24"><g transform="translate(0.5,0.5)"><rect x="626" y="284" width="18" height="18" fill="#f4dfcc" stroke="#b5652a" pointer-events="all"/></g></g><g data-cell-id="c25"><g><rect x="650" y="278" width="330" height="30" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="662" y="298">rawler (LGPL), chỉ giải nén</text></g></g></g><g data-cell-id="c26"><g><rect x="16" y="316" width="1010" height="46" rx="5.52" ry="5.52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#7a6a55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="28" y="337">Theo v0.11.0 (sắp có). Mỗi lần xử lý một ảnh, không bao giờ trên luồng của cửa sổ. Hiện nay rawler hoặc macOS vẫn xử lý</text><text x="28" y="351">các định dạng bộ đọc của chúng tôi chưa nhận; trên Mac, Panasonic và Olympus vẫn do macOS xử lý để được sửa méo ống kính.</text></g></g></g></g></g></g></svg>