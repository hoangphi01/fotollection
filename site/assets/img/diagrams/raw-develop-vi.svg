<svg role="img" aria-label="Một ảnh RAW, từ tệp tới ảnh in" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; " xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1060px" height="396px" viewBox="0 0 1060 396"><title>Một ảnh RAW, từ tệp tới ảnh in</title><style>@media (prefers-color-scheme: dark){[fill="#fffaee"]{fill:#262019}[stroke="#fffaee"]{stroke:#262019}[fill="#efe5cc"]{fill:#211b15}[stroke="#efe5cc"]{stroke:#211b15}[fill="#2b2219"]{fill:#f3ead6}[stroke="#2b2219"]{stroke:#f3ead6}[fill="#514435"]{fill:#d8cab0}[stroke="#514435"]{stroke:#d8cab0}[fill="#7a6a55"]{fill:#a8977c}[stroke="#7a6a55"]{stroke:#a8977c}[fill="#e2d4b3"]{fill:#3b3127}[stroke="#e2d4b3"]{stroke:#3b3127}[fill="#2c836d"]{fill:#c98a52}[stroke="#2c836d"]{stroke:#c98a52}[fill="#dcebe3"]{fill:#3a2c1f}[stroke="#dcebe3"]{stroke:#3a2c1f}[fill="#b5652a"]{fill:#e3a067}[stroke="#b5652a"]{stroke:#e3a067}[fill="#f4dfcc"]{fill:#3a2a1c}[stroke="#f4dfcc"]{stroke:#3a2a1c}}</style><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="16" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#fffaee" stroke="#514435" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle" font-size="13px"><text x="101" y="43.5">Tệp RAW</text><text x="101" y="59.5">CR3 · NEF · ARW</text><text x="101" y="75.5">RW2 · ORF · DNG…</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="226" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="311" y="43.5">1 · Nhận biết</text><text x="311" y="59.5">từ những byte đầu,</text><text x="311" y="75.5">không theo tên tệp</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="426" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#f4dfcc" stroke="#b5652a" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="511" y="43.5">2 · Đọc cảm biến</text><text x="511" y="59.5">DNG: bộ đọc riêng</text><text x="511" y="75.5">khác: rawler giải nén</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><rect x="626" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="711" y="43.5">3 · Mức</text><text x="711" y="59.5">đen về 0, trắng về 1</text><text x="711" y="75.5">theo vị trí tấm lọc</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><rect x="826" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="911" y="43.5">4 · Cân bằng trắng</text><text x="911" y="59.5">hệ số của máy ảnh,</text><text x="911" y="75.5">trước demosaic</text></g></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><rect x="226" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="311" y="198.5">5 · Demosaic</text><text x="311" y="214.5">điểm chết, xanh lá,</text><text x="311" y="230.5">theo hướng, màu giả</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="426" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="syste