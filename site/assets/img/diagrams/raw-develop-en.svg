<svg role="img" aria-label="A RAW photo, from the file to the print" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; " xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1060px" height="396px" viewBox="0 0 1060 396"><title>A RAW photo, from the file to the print</title><style>@media (prefers-color-scheme: dark){[fill="#fffaee"]{fill:#262019}[stroke="#fffaee"]{stroke:#262019}[fill="#efe5cc"]{fill:#211b15}[stroke="#efe5cc"]{stroke:#211b15}[fill="#2b2219"]{fill:#f3ead6}[stroke="#2b2219"]{stroke:#f3ead6}[fill="#514435"]{fill:#d8cab0}[stroke="#514435"]{stroke:#d8cab0}[fill="#7a6a55"]{fill:#a8977c}[stroke="#7a6a55"]{stroke:#a8977c}[fill="#e2d4b3"]{fill:#3b3127}[stroke="#e2d4b3"]{stroke:#3b3127}[fill="#2c836d"]{fill:#c98a52}[stroke="#2c836d"]{stroke:#c98a52}[fill="#dcebe3"]{fill:#3a2c1f}[stroke="#dcebe3"]{stroke:#3a2c1f}[fill="#b5652a"]{fill:#e3a067}[stroke="#b5652a"]{stroke:#e3a067}[fill="#f4dfcc"]{fill:#3a2a1c}[stroke="#f4dfcc"]{stroke:#3a2a1c}}</style><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="16" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#fffaee" stroke="#514435" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle" font-size="13px"><text x="101" y="43.5">RAW file</text><text x="101" y="59.5">CR3 · NEF · ARW</text><text x="101" y="75.5">RW2 · ORF · DNG…</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="226" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="311" y="43.5">1 · Recognise</text><text x="311" y="59.5">from the first bytes,</text><text x="311" y="75.5">not the name</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="426" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#f4dfcc" stroke="#b5652a" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="511" y="43.5">2 · Read the sensor</text><text x="511" y="59.5">DNG: our own reader</text><text x="511" y="75.5">others: rawler unpacks</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><rect x="626" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="711" y="43.5">3 · Levels</text><text x="711" y="59.5">black to 0, white to 1</text><text x="711" y="75.5">per filter position</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><rect x="826" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="911" y="43.5">4 · White balance</text><text x="911" y="59.5">the camera's gains,</text><text x="911" y="75.5">before demosaicing</text></g></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><rect x="226" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="311" y="198.5">5 · Demosaic</text><text x="311" y="214.5">stuck pixels, greens,</text><text x="311" y="230.5">directional, false colour</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="426" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="511" y="198.5">6 · Colour</text><text x="511" y="214.5">camera → XYZ → sRGB</text><text x="511" y="230.5">in linear light</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="626" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="711" y="198.5">7 · Tone and look</text><text x="711" y="214.5">fitted to the camera's</text><text x="711" y="230.5">preview, lens shading</text></g></g></g><g data-cell-id="c11"><g transform="translate(0.5,0.5)"><rect x="826" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#fffaee" stroke="#514435" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle" font-size="13px"><text x="911" y="198.5">Print</text><text x="911" y="214.5">crop · stamp · frame</text><text x="911" y="230.5">JPEG 4:4:4, quality 95</text></g></g></g><g data-cell-id="c12"><g><path d="M 186 54 L 216.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 224.32 54 L 216.82 57.75 L 216.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c13"><g><path d="M 396 54 L 416.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 424.32 54 L 416.82 57.75 L 416.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c14"><g><path d="M 596 54 L 616.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 624.32 54 L 616.82 57.75 L 616.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c15"><g><path d="M 796 54 L 816.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 824.32 54 L 816.82 57.75 L 816.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c16"><g><path d="M 911 92 L 911 119 Q 911 129 901 129 L 321 129 Q 311 129 311 139 L 311 156.82" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 311 164.32 L 307.25 156.82 L 314.75 156.82 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c17"><g><path d="M 396 209 L 416.82 209" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 424.32 209 L 416.82 212.75 L 416.82 205.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c18"><g><path d="M 596 209 L 616.82 209" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 624.32 209 L 616.82 212.75 L 616.82 205.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c19"><g><path d="M 796 209 L 816.82 209" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 824.32 209 L 816.82 212.75 L 816.82 205.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c20"><g transform="translate(0.5,0.5)"><rect x="16" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#efe5cc" stroke="#e2d4b3" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="12px"><text x="101" y="193">The camera's</text><text x="101" y="207">embedded preview</text><text x="101" y="221">→ the grid's</text><text x="101" y="235">thumbnails, 9–32 ms</text></g></g></g><g data-cell-id="c21"><g><path d="M 101 92 L 101 156.82" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke"/><path d="M 101 164.32 L 97.25 156.82 L 104.75 156.82 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c22"><g transform="translate(0.5,0.5)"><rect x="226" y="284" width="18" height="18" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g></g><g data-cell-id="c23"><g><rect x="250" y="278" width="330" height="30" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="262" y="298">Fotollection's own code, on every processor core</text></g></g></g><g data-cell-id="c24"><g transform="translate(0.5,0.5)"><rect x="626" y="284" width="18" height="18" fill="#f4dfcc" stroke="#b5652a" pointer-events="all"/></g></g><g data-cell-id="c25"><g><rect x="650" y="278" width="330" height="30" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="662" y="298">rawler (LGPL), unpacking only</text></g></g></g><g data-cell-id="c26"><g><rect x="16" y="316" width="1010" height="46" rx="5.52" ry="5.52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#7a6a55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="28" y="337">Since v0.11.0: one develop at a time, never on the window's thread. Rawler or macOS develops only the</text><text x="28" y="351">formats our reader does not take yet (X-Trans until v0.15.0); on a Mac, Panasonic and Olympus stay with macOS for its lens correction.</text></g></g></g></g></g></g></svg>