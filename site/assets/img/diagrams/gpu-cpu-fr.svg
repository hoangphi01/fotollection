-size="12px"><text x="568" y="384">Chaque photo est décodée, calculée et encodée sur un cœur :</text><text x="568" y="398">jusqu’à six à la fois, autant que le budget mémoire (1,6 Go) le permet.</text><text x="568" y="412">JPEG de 26 MP : 10,8 photos par seconde. Mêmes octets sur chaque ordinateur.</text></g></g></g></g></g></g></svg>