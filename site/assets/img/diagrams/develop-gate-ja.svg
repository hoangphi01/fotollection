<svg role="img" aria-label="develop-gate" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; " xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1090px" height="430px" viewBox="0 0 1090 430"><title>develop-gate</title><style>@media (prefers-color-scheme: dark){[fill="#fffaee"]{fill:#262019}[stroke="#fffaee"]{stroke:#262019}[fill="#efe5cc"]{fill:#211b15}[stroke="#efe5cc"]{stroke:#211b15}[fill="#2b2219"]{fill:#f3ead6}[stroke="#2b2219"]{stroke:#f3ead6}[fill="#514435"]{fill:#d8cab0}[stroke="#514435"]{stroke:#d8cab0}[fill="#7a6a55"]{fill:#a8977c}[stroke="#7a6a55"]{stroke:#a8977c}[fill="#e2d4b3"]{fill:#3b3127}[stroke="#e2d4b3"]{stroke:#3b3127}[fill="#2c836d"]{fill:#c98a52}[stroke="#2c836d"]{stroke:#c98a52}[fill="#dcebe3"]{fill:#3a2c1f}[stroke="#dcebe3"]{stroke:#3a2c1f}[fill="#b5652a"]{fill:#e3a067}[stroke="#b5652a"]{stroke:#e3a067}[fill="#f4dfcc"]{fill:#3a2a1c}[stroke="#f4dfcc"]{stroke:#3a2a1c}}</style><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="16" y="16" width="1040" height="380" rx="45.6" ry="45.6" fill="#efe5cc" stroke="#e2d4b3" pointer-events="all"/></g></g><g data-cell-id="c3"><g><rect x="36" y="28" width="1000" height="30" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" text-anchor="start" font-size="16px"><text x="48" y="50">現像ゲート：画面上の写真が最優先</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="36" y="76" width="380" height="80" rx="9.6" ry="9.6" fill="#2c836d" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#fffaee" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle" font-size="13px"><text x="226" y="113.5">画面上の写真</text><text x="226" y="129.5">プレビュー · ズーム · トリミング · 表示中のシート</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="36" y="186" width="380" height="100" rx="12" ry="12" fill="#fffaee" stroke="#e2d4b3" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="226" y="225.5">待っていない処理</text><text x="226" y="241.5">標準プレビュー · 先読み · サイズの見積もり</text><text x="226" y="257.5">書き出し · ベストショット分析</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><rect x="486" y="111" width="260" height="140" rx="16.8" ry="16.8" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="616" y="170.5">現像ゲート</text><text x="616" y="186.5">RAW の現像は一度に 1 枚</text><text x="616" y="202.5">優先度順</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><rect x="816" y="141" width="220" height="80" rx="9.6" ry="9.6" fill="#fffaee" stroke="#e2d4b3" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="926" y="178.5">RAW 現像</text><text x="926" y="194.5">1 枚 0.3〜0.7 秒</text></g></g></g><g data-cell-id="c8"><g><path d="M 416 116 L 441 116 Q 451 116 451 126 L 451 171 Q 451 181 461 181 L 476.82 181" fill="none" stroke="#2c836d" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 484.32 181 L 476.82 184.75 L 476.82 177.25 Z" fill="#2c836d" stroke="#2c836d" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g fill="#7a6a55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="11px"><rect fill="#ffffff" stroke="none" x="435" y="143" width="34" height="14" stroke-width="0"/><text x="451" y="153.5">最優先</text></g></g></g><g data-cell-id="c9"><g><path d="M 416 236 L 441 236 Q 451 236 451 226 L 451 191 Q 451 181 461 181 L 476.82 181" fill="none" stroke="#b5652a" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 484.32 181 L 476.82 184.75 L 476.82 177.25 Z" fill="#b5652a" stroke="#b5652a" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g><g><g fill="#7a6a55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="11px"><rect fill="#ffffff" stroke="none" x="440" y="202" width="23" height="14" stroke-width="0"/><text x="451" y="212.5">待機</text></g></g></g><g data-cell-id="c10"><g><path d="M 746 181 L 806.82 181" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 814.32 181 L 806.82 184.75 L 806.82 177.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c11"><g><rect x="36" y="306" width="1000" height="70" rx="8.4" ry="8.4" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="48" y="339">次の写真へ移ると、その写真は最優先でなくなり、順番が来た時点で不要になった現像は取りやめます。</text><text x="48" y="353">そのため、画面上の RAW がバックグラウンド処理の後ろで待つことはありません。</text></g></g></g></g></g></g></svg>