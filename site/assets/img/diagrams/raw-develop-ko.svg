<svg role="img" aria-label="raw-develop" xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; " xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1060px" height="396px" viewBox="0 0 1060 396"><title>raw-develop</title><style>@media (prefers-color-scheme: dark){[fill="#fffaee"]{fill:#262019}[stroke="#fffaee"]{stroke:#262019}[fill="#efe5cc"]{fill:#211b15}[stroke="#efe5cc"]{stroke:#211b15}[fill="#2b2219"]{fill:#f3ead6}[stroke="#2b2219"]{stroke:#f3ead6}[fill="#514435"]{fill:#d8cab0}[stroke="#514435"]{stroke:#d8cab0}[fill="#7a6a55"]{fill:#a8977c}[stroke="#7a6a55"]{stroke:#a8977c}[fill="#e2d4b3"]{fill:#3b3127}[stroke="#e2d4b3"]{stroke:#3b3127}[fill="#2c836d"]{fill:#c98a52}[stroke="#2c836d"]{stroke:#c98a52}[fill="#dcebe3"]{fill:#3a2c1f}[stroke="#dcebe3"]{stroke:#3a2c1f}[fill="#b5652a"]{fill:#e3a067}[stroke="#b5652a"]{stroke:#e3a067}[fill="#f4dfcc"]{fill:#3a2a1c}[stroke="#f4dfcc"]{stroke:#3a2a1c}}</style><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="c3"><g transform="translate(0.5,0.5)"><rect x="16" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#fffaee" stroke="#514435" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle" font-size="13px"><text x="101" y="43.5">RAW 파일</text><text x="101" y="59.5">CR3 · NEF · ARW</text><text x="101" y="75.5">RW2 · ORF · DNG…</text></g></g></g><g data-cell-id="c4"><g transform="translate(0.5,0.5)"><rect x="226" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="311" y="43.5">1 · 판별</text><text x="311" y="59.5">파일 이름이 아니라</text><text x="311" y="75.5">앞부분 바이트로</text></g></g></g><g data-cell-id="c5"><g transform="translate(0.5,0.5)"><rect x="426" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#f4dfcc" stroke="#b5652a" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="511" y="43.5">2 · 센서 읽기</text><text x="511" y="59.5">DNG: 자체 리더</text><text x="511" y="75.5">그 외: rawler가 풀기</text></g></g></g><g data-cell-id="c6"><g transform="translate(0.5,0.5)"><rect x="626" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="711" y="43.5">3 · 레벨</text><text x="711" y="59.5">검정 0, 흰색 1로</text><text x="711" y="75.5">필터 위치마다</text></g></g></g><g data-cell-id="c7"><g transform="translate(0.5,0.5)"><rect x="826" y="16" width="170" height="76" rx="9.12" ry="9.12" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="911" y="43.5">4 · 화이트 밸런스</text><text x="911" y="59.5">카메라의 게인,</text><text x="911" y="75.5">디모자이크 전에</text></g></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><rect x="226" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="311" y="198.5">5 · 디모자이크</text><text x="311" y="214.5">고착 픽셀, 초록 보정,</text><text x="311" y="230.5">방향 판단, 위색</text></g></g></g><g data-cell-id="c9"><g transform="translate(0.5,0.5)"><rect x="426" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="511" y="198.5">6 · 색</text><text x="511" y="214.5">카메라 → XYZ → sRGB</text><text x="511" y="230.5">선형 광에서</text></g></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="626" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="13px"><text x="711" y="198.5">7 · 톤과 룩</text><text x="711" y="214.5">카메라 미리보기 기준,</text><text x="711" y="230.5">렌즈 주변부 광량도</text></g></g></g><g data-cell-id="c11"><g transform="translate(0.5,0.5)"><rect x="826" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#fffaee" stroke="#514435" pointer-events="all"/></g><g><g fill="#2b2219" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle" font-size="13px"><text x="911" y="198.5">인화</text><text x="911" y="214.5">자르기 · 날짜 · 프레임</text><text x="911" y="230.5">JPEG 4:4:4, 품질 95</text></g></g></g><g data-cell-id="c12"><g><path d="M 186 54 L 216.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 224.32 54 L 216.82 57.75 L 216.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c13"><g><path d="M 396 54 L 416.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 424.32 54 L 416.82 57.75 L 416.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c14"><g><path d="M 596 54 L 616.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 624.32 54 L 616.82 57.75 L 616.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c15"><g><path d="M 796 54 L 816.82 54" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 824.32 54 L 816.82 57.75 L 816.82 50.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c16"><g><path d="M 911 92 L 911 119 Q 911 129 901 129 L 321 129 Q 311 129 311 139 L 311 156.82" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 311 164.32 L 307.25 156.82 L 314.75 156.82 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c17"><g><path d="M 396 209 L 416.82 209" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 424.32 209 L 416.82 212.75 L 416.82 205.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c18"><g><path d="M 596 209 L 616.82 209" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 624.32 209 L 616.82 212.75 L 616.82 205.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c19"><g><path d="M 796 209 L 816.82 209" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 824.32 209 L 816.82 212.75 L 816.82 205.25 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c20"><g transform="translate(0.5,0.5)"><rect x="16" y="166" width="170" height="86" rx="10.32" ry="10.32" fill="#efe5cc" stroke="#e2d4b3" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-size="12px"><text x="101" y="193">카메라의</text><text x="101" y="207">내장 미리보기</text><text x="101" y="221">→ 그리드의</text><text x="101" y="235">썸네일, 9~32 ms</text></g></g></g><g data-cell-id="c21"><g><path d="M 101 92 L 101 156.82" fill="none" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke"/><path d="M 101 164.32 L 97.25 156.82 L 104.75 156.82 Z" fill="#7a6a55" stroke="#7a6a55" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="c22"><g transform="translate(0.5,0.5)"><rect x="226" y="284" width="18" height="18" fill="#dcebe3" stroke="#2c836d" pointer-events="all"/></g></g><g data-cell-id="c23"><g><rect x="250" y="278" width="330" height="30" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="262" y="298">Fotollection 자체 코드, 프로세서의 모든 코어에서</text></g></g></g><g data-cell-id="c24"><g transform="translate(0.5,0.5)"><rect x="626" y="284" width="18" height="18" fill="#f4dfcc" stroke="#b5652a" pointer-events="all"/></g></g><g data-cell-id="c25"><g><rect x="650" y="278" width="330" height="30" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#514435" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="662" y="298">rawler (LGPL), 풀기만</text></g></g></g><g data-cell-id="c26"><g><rect x="16" y="316" width="1010" height="46" rx="5.52" ry="5.52" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#7a6a55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-size="12px"><text x="28" y="337">v0.11.0부터: 현상은 한 번에 1장, 창의 스레드에서는 하지 않습니다. rawler 또는 macOS가 현상하는 것은</text><text x="28" y="351">자체 리더가 아직 지원하지 않는 형식(v0.15.0까지는 X-Trans)뿐. Mac에서 Panasonic과 Olympus는 렌즈 보정 때문에 macOS에 남습니다.</text></g></g></g></g></g></g></svg>