<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!-- The link-preview cards (Open Graph, 1200 × 630), one per page and language, rendered by og.mjs with the site's own fonts. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Bitter'; font-weight: 100 900; src: url('/fonts/bitter-latin-wght-normal.woff2') format('woff2-variations'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Bitter'; font-weight: 100 900; src: url('/fonts/bitter-vietnamese-wght-normal.woff2') format('woff2-variations'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Be Vietnam Pro'; font-weight: 400; src: url('/fonts/be-vietnam-pro-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Be Vietnam Pro'; font-weight: 400; src: url('/fonts/be-vietnam-pro-vietnamese-400-normal.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      @font-face { font-family: 'Be Vietnam Pro'; font-weight: 600; src: url('/fonts/be-vietnam-pro-latin-600-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: 'Be Vietnam Pro'; font-weight: 600; src: url('/fonts/be-vietnam-pro-vietnamese-600-normal.woff2') format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: #2c836d radial-gradient(circle at 80% 110%, #4aada4 0, transparent 60%);
        color: #fffaee; font-family: 'Be Vietnam Pro', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif;
        display: grid; grid-template-columns: 500px 1fr; align-items: center;
      }
      .text { padding: 0 0 0 60px; }
      .brand { display: flex; align-items: center; gap: 12px; font: 700 26px 'Bitter', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif; }
      .brand img { width: 44px; height: 44px; border-radius: 10px; }
      /* The VNLF listing (site/_data/i18n/<code>.yml vnlf_badge), beside the name on every card. */
      .vnlf { margin-left: 6px; padding: 4px 10px; border-radius: 8px; border: 1px solid #fffaee66; font: 600 15px 'Be Vietnam Pro', sans-serif; color: #fffaee; }
      h1 { margin-top: 30px; font: 800 44px/1.12 'Bitter', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif; letter-spacing: -0.01em; }
      h1 em { font-style: normal; color: #f6c98b; }
      p { margin-top: 22px; font-size: 21px; line-height: 1.45; color: #e3f1ea; }
      .shield { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 7px 14px; border-radius: 10px; background: #fffaee; color: #3f7d1a; font-weight: 600; font-size: 18px; }
      .shield svg { width: 22px; height: 22px; }
      .shot { position: relative; height: 100%; }
      .kicker { margin-top: 30px; font-weight: 600; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; color: #f6c98b; }
      .kicker + h1 { margin-top: 10px; }
      .shot img {
        position: absolute; left: 20px; top: 70px; width: 900px;
        border-radius: 8px; border: 8px solid #fffaee; outline: 4px solid #9a5a2c; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand"><img src="/mark.png" alt="" />Fotollection<span class="vnlf" id="vnlf"></span></div>
      <p class="kicker" id="kicker" hidden></p>
      <h1 id="title"></h1>
      <p id="sub"></p>
      <div class="shield">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
        <span id="shield"></span>
      </div>
    </div>
    <div class="shot"><img id="shot" alt="" /></div>
    <script>
      // ?lang=<code>&page=<id>&assets=<code>: og.mjs gives the card's words as window.CARD (from
      // site/_data/i18n/<code>.yml og_card_<page>, og_vnlf). Each card: a kicker (none on the
      // home page), the headline with its accent, a line, the shield and a screenshot from
      // site/assets/img in the language whose screenshots the page shows.
      const params = new URLSearchParams(location.search)
      const a = params.get('assets') ?? 'en'
      const shots = {
        // The owner's tram by night on a postcard filled to the edge, "Ahoj Praha!" (shoot.mjs).
        home: `postcard-night-${a}-dark.webp`,
        download: `grid-${a}-dark.webp`,
        performance: `charts/bench-budgets-${a}.svg`,
        manual: `stamp-${a}-dark.webp`,
        story: `collage-preview-${a}-dark.webp`,
        wiki: 'timeline/0.1.0-beta.1-gallery.webp',
        'code-signing': `select-${a}-dark.webp`,
      }
      const card = window.CARD
      if (card.kicker) {
        const k = document.getElementById('kicker')
        k.textContent = card.kicker
        k.hidden = false
      }
      const em = document.createElement('em')
      em.textContent = card.accent
      document.getElementById('title').append(card.before, em, card.after)
      document.getElementById('sub').textContent = card.sub
      document.getElementById('shield').textContent = card.shield
      document.getElementById('vnlf').textContent = card.vnlf
      document.getElementById('shot').src = `/img/${shots[params.get('page')] ?? shots.home}`
    </script>
  </body>
</html>
