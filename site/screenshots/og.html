<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!-- The link-preview card (Open Graph, 1200 × 630), rendered by shoot.mjs. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        background: #2c836d; color: #fffaee;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        background-image: radial-gradient(circle at 80% 110%, #4aada4 0, transparent 60%);
        display: grid; grid-template-columns: 470px 1fr; align-items: center;
      }
      .text { padding: 0 0 0 64px; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
      .brand img { width: 44px; height: 44px; border-radius: 10px; }
      h1 { margin-top: 36px; font-size: 52px; line-height: 1.08; font-weight: 800; letter-spacing: -0.01em; font-family: Rockwell, 'Roboto Slab', Georgia, serif; }
      h1 em { font-style: normal; color: #f6c98b; }
      p { margin-top: 26px; font-size: 22px; line-height: 1.4; color: #e3f1ea; }
      .shot { position: relative; height: 100%; }
      .shot img {
        position: absolute; left: 24px; top: 70px; width: 900px;
        border-radius: 8px; border: 8px solid #fffaee; outline: 4px solid #9a5a2c; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand"><img src="/mark.png" alt="" />Fotollection</div>
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>
    <div class="shot"><img id="shot" alt="" /></div>
    <script>
      const lang = new URLSearchParams(location.search).get('lang') === 'vi' ? 'vi' : 'en'
      const text = {
        en: [['Photos ready to ', 'print', '. Fully offline.'], 'Date stamp, camera info frame, best-shot picks and print-size crops. Free and open source.'],
        vi: [['Ảnh sẵn sàng để ', 'in', '. Hoàn toàn offline.'], 'Dấu ngày, khung thông tin máy ảnh, gợi ý ảnh đẹp và crop đúng khổ in. Miễn phí, mã nguồn mở.'],
      }[lang]
      const [before, accent, after] = text[0]
      const em = document.createElement('em')
      em.textContent = accent
      document.getElementById('title').append(before, em, after)
      document.getElementById('sub').textContent = text[1]
      document.getElementById('shot').src = `/frame-${lang}-dark.png`
    </script>
  </body>
</html>
