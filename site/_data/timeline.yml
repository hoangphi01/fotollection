      - "Giỏ in và chỗ để riêng ảnh: ↑ và ↓ trong màn xem ảnh, hoặc Chọn trong lưới ảnh."
      - "Giữ phím cách để xem nhanh; phần xuất ảnh báo trước dung lượng."
    cs:
      - "Košík k tisku a místo, kam fotky odložit: ↑ a ↓ v náhledu, nebo Select v galerii."
      - "Podrž mezerník pro rychlý náhled; export řekne svou velikost dřív, než začne."
    de:
      - "Ein Druckkorb und ein Platz, um Fotos beiseitezulegen: ↑ und ↓ in der Vorschau, oder Auswählen in der Galerie."
      - "Halte die Leertaste für eine schnelle Vorschau; der Export nennt seine Größe, bevor er beginnt."
    hu:
