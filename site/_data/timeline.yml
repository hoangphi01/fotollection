      - "Egy nappal később az első béta már megtalálta a legjobb képeket, rányomta a dátumot, és nyomtatásra exportált."
    ja:
      - "1 つのウィンドウ：左にライブラリー、右にプリント設定、そして Open folder。"
      - "1 日後には、最初のベータ版がベストショットを見つけ、日付を入れ、プリント用に書き出せるようになりました。"
    ko:
      - "창 하나: 왼쪽에 라이브러리, 오른쪽에 인화 설정, 그리고 Open folder."
      - "하루 뒤, 첫 베타 버전이 베스트 샷을 찾고, 날짜를 넣고, 인화용으로 내보낼 수 있게 되었습니다."
    pl:
      - "Jedno okno: biblioteka po lewej, ustawienia druku po prawej i Otwórz folder."
      - "Dzień później pierwsza beta znajdowała najlepsze ujęcia, dodawała datę na zdjęciu i eksportowała do druku."
  shots:
    - { file: 0.1.0-beta.1-first, w: 1280, h: 820, from: "v0.1.0-beta.1:docs/images/screenshot-dark.png", alt: { en: "The very first screen: an empty library and Open folder", vi: "Màn hình đầu tiên: thư viện trống và nút Mở thư mục", cs: "Úplně první obrazovka: prázdná knihovna a Open folder", de: "Der allererste Bildschirm: eine leere Bibliothek und Open folder", fr: "Le tout premier écran : une bibliothèque vide et Open folder", hu: "A legelső képernyő: üres könyvtár és az Open folder gomb", ja: "いちばん最初の画面：空のライブラリーと Open folder", ko: "맨 처음 화면: 빈 라이브러리와 Open folder", pl: "Pierwszy ekran: pusta biblioteka i Otwórz folder" } }
    - { file: 0.1.0-beta.1-gallery, w: 1600, h: 1000, from: "v0.1.0-beta.1:site/assets/img/grid-en-dark.webp", alt: { en: "The first beta's gallery with its print settings", vi: "Lưới ảnh của bản beta đầu tiên cùng cài đặt in", cs: "Galerie první bety s nastavením tisku", de: "Die Galerie der ersten Beta mit ihren Druckeinstellungen", fr: "La galerie de la première bêta avec ses réglages d’impression", hu: "Az első béta galériája a nyomtatási beállításokkal", ja: "最初のベータ版のギャラリーとプリント設定", ko: "첫 베타 버전의 갤러리와 인화 설정", pl: "Galeria pierwszej bety z ustawieniami druku" } }
- version: "0.1"
  date: 2026-10-24
  title: { en: "First public preview", vi: "Bản xem trước công khai đầu tiên", cs: "První veřejná ukázka", de: "Erste öffentliche Vorschau", fr: "Premier aperçu public", hu: "Az első nyilvános előzetes", ja: "初の公開プレビュー", ko: "첫 공개 미리보기", pl: "Pierwsza publiczna wersja próbna" }
