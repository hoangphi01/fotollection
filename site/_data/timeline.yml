      - "회전과 수평 맞추기를 갖춘 인화 크기 자르기. 원본 화질 그대로 내보내기."
    pl:
      - "Na macOS i Windows, po angielsku i po wietnamsku."
      - "Podpowiedzi najlepszych ujęć, data na zdjęciu jak z kliszy z nazwami miejsc offline, ramka z danymi aparatu."
      - "Kadry na wymiar odbitki z obracaniem i prostowaniem; eksport w oryginalnej jakości."
  shots:
    - { file: 0.1-gallery, w: 1600, h: 1000, from: "v0.1.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.1.0: the gallery and the print settings", vi: "v0.1.0: lưới ảnh và cài đặt in", cs: "v0.1.0: galerie a nastavení tisku", de: "v0.1.0: die Galerie und die Druckeinstellungen", fr: "v0.1.0 : la galerie et les réglages d’impression", hu: "v0.1.0: a galéria és a nyomtatási beállítások", ja: "v0.1.0：ギャラリーとプリント設定", ko: "v0.1.0: 갤러리와 인화 설정", pl: "v0.1.0: galeria i ustawienia druku" } }
- version: "0.2"
