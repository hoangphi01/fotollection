      - "Pro macOS a Windows, anglicky a vietnamsky."
      - "Návrhy nejlepších snímků, datum na fotce jako z filmu s názvy míst offline, rámeček s údaji o fotoaparátu."
      - "Ořez na formáty tisku s otáčením a vyrovnáním; export v původní kvalitě."
    de:
