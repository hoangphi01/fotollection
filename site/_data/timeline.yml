- version: "0.14"
  date: 2026-11-09
  fn: [fn_lut]
  title: { en: "Looks", vi: "Looks", cs: "Looky", de: "Looks", hu: "Lookok", ja: "ルック", pl: "Looki" }
  points:
    en:
      - "One tap gives a photo a colour: looks of our own, your Lightroom presets and LUTs, a Color Mixer and Dehaze."
      - "A look for many photos at once; thumbnails show each photo's colour."
      - "Move to another computer with one file; a part that fails no longer takes Fotollection down."
    vi:
      - "Một chạm là ảnh có màu: look của Fotollection, preset Lightroom và LUT của bạn, Color Mixer và Khử sương."
      - "Áp một look cho nhiều ảnh cùng lúc; ảnh thu nhỏ hiện màu của từng ảnh."
      - "Chuyển sang máy khác bằng một tệp; một phần lỗi không còn làm sập Fotollection."
    cs:
      - "Jedno ťuknutí dá fotce barvu: naše vlastní looky, tvoje presety z Lightroomu a LUTy, Color Mixer a Dehaze."
      - "Look pro mnoho fotek najednou; miniatury ukazují každou fotku v jejích barvách."
      - "Přesun na jiný počítač v jednom souboru; část, která selže, už Fotollection neshodí."
    de:
      - "Ein Tippen gibt einem Foto eine Farbe: eigene Looks, deine Lightroom-Presets und LUTs, ein Color Mixer und Dunst entfernen."
      - "Ein Look für viele Fotos auf einmal; Vorschaubilder zeigen jedes Foto in seiner Farbe."
      - "Mit einer Datei auf einen anderen Computer umziehen; ein Teil, der ausfällt, reißt Fotollection nicht mehr mit."
    hu:
      - "Egy koppintás, és a fotó színt kap: saját lookok, a Lightroom presetjeid és LUT-jaid, Color Mixer és Dehaze."
      - "Egy look sok fotónak egyszerre; a bélyegképek minden fotót a saját színeivel mutatnak."
      - "Költözés másik gépre egyetlen fájllal; egy hibázó rész már nem dönti le a Fotollectiont."
    ja:
      - "ワンタップで写真に色を：独自のルック、手持ちの Lightroom プリセットと LUT、Color Mixer、Dehaze。"
      - "多くの写真に一度にルックを適用。サムネイルはそれぞれの写真の色で表示されます。"
      - "1 つのファイルで別のコンピューターへ移行。一部が失敗しても Fotollection 全体が落ちることはなくなりました。"
    pl:
      - "Jedno dotknięcie nadaje zdjęciu kolor: nasze własne looki, twoje presety Lightroom i LUT-y, Color Mixer i Dehaze."
      - "Look dla wielu zdjęć naraz; miniatury pokazują kolor każdego zdjęcia."
      - "Przenieś się na inny komputer w jednym pliku; awaria jednej części nie zamyka już całego Fotollection."
  shots:
    - { file: 0.14-looks, w: 1600, h: 1000, from: "v0.14.0:site/assets/img/window-en-dark.webp", alt: { en: "v0.14.0: looks under the photo, Presets & LUTs on the left", vi: "v0.14.0: looks dưới ảnh, Presets & LUTs bên trái", cs: "v0.14.0: looky pod fotkou, Presets & LUTs vlevo", de: "v0.14.0: Looks unter dem Foto, Presets & LUTs links", hu: "v0.14.0: lookok a fotó alatt, bal oldalt a Presets & LUTs", ja: "v0.14.0：写真の下にルック、左に Presets & LUTs", pl: "v0.14.0: looki pod zdjęciem, Presety i LUT-y po lewej" } }
    - { file: 0.14-simple, w: 1600, h: 1000, from: "v0.14.0:site/assets/img/simple-en-light.webp", alt: { en: "v0.14.0: Simple mode's numbered looks", vi: "v0.14.0: dải look đánh số ở chế độ Đơn giản", cs: "v0.14.0: očíslované looky v režimu Simple", de: "v0.14.0: die nummerierten Looks im Simple-Modus", hu: "v0.14.0: a Simple mód számozott lookjai", ja: "v0.14.0：Simple モードの番号付きルック", pl: "v0.14.0: numerowane looki w trybie Prostym" } }
    - { file: 0.14-gallery, w: 1600, h: 1000, from: "v0.14.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.14.0: thumbnails in their colours", vi: "v0.14.0: ảnh thu nhỏ theo màu của từng ảnh", cs: "v0.14.0: miniatury v jejich barvách", de: "v0.14.0: Vorschaubilder in ihren Farben", hu: "v0.14.0: bélyegképek a saját színeikben", ja: "v0.14.0：それぞれの色で表示されるサムネイル", pl: "v0.14.0: miniatury w swoich kolorach" } }
