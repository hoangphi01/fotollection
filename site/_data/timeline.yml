# The Wiki page's timeline (site/_includes/wiki.html): Fotollection from its first screen to
# now, one milestone per MINOR version, kept oldest first here and shown newest first (owner,
# 2026-11-09, as Apple lists its releases); a new one goes at the end. Every picture is the
# app as that version shipped, taken from the git history by scripts/timeline-shot.sh, never
# made again; its tag and path are in `from`. A MINOR release adds its milestone here with one
# to three of its new screenshots (docs/DOCS_GUIDE.md, "A release"; check-docs checks it).
# A milestone without screenshots says why in `note` (its look did not change). `fn` lists the
# notes its words need (site/_data/footnotes.yml, the page's list in the same order).
- version: "0.1.0-beta.1"
  date: 2026-10-24
  title: { en: "The first screen", vi: "Màn hình đầu tiên", cs: "První obrazovka", de: "Der erste Bildschirm", hu: "Az első képernyő", ja: "最初の画面", pl: "Pierwszy ekran" }
  points:
    en:
      - "One window: a library on the left, print settings on the right, and Open folder."
      - "A day later the first beta found best shots, stamped the date and exported to print."
    vi:
      - "Một cửa sổ: thư viện bên trái, cài đặt in bên phải, và nút Mở thư mục."
      - "Một ngày sau, bản beta đầu tiên đã chọn ảnh đẹp nhất, đóng dấu ngày và xuất ảnh để in."
    cs:
      - "Jedno okno: knihovna vlevo, nastavení tisku vpravo a Open folder."
      - "O den později první beta našla nejlepší snímky, přidala datum na fotku a exportovala k tisku."
    de:
      - "Ein Fenster: links eine Bibliothek, rechts die Druckeinstellungen, und Open folder."
      - "Einen Tag später fand die erste Beta die besten Aufnahmen, druckte das Datum ein und exportierte für den Druck."
    hu:
      - "Egyetlen ablak: bal oldalt a könyvtár, jobb oldalt a nyomtatási beállítások, és az Open folder gomb."
      - "Egy nappal később az első béta már megtalálta a legjobb képeket, rányomta a dátumot, és nyomtatásra exportált."
    ja:
      - "1 つのウィンドウ：左にライブラリー、右にプリント設定、そして Open folder。"
      - "1 日後には、最初のベータ版がベストショットを見つけ、日付を入れ、プリント用に書き出せるようになりました。"
    pl:
      - "Jedno okno: biblioteka po lewej, ustawienia druku po prawej i Otwórz folder."
      - "Dzień później pierwsza beta znajdowała najlepsze ujęcia, dodawała datę na zdjęciu i eksportowała do druku."
  shots:
    - { file: 0.1.0-beta.1-first, w: 1280, h: 820, from: "v0.1.0-beta.1:docs/images/screenshot-dark.png", alt: { en: "The very first screen: an empty library and Open folder", vi: "Màn hình đầu tiên: thư viện trống và nút Mở thư mục", cs: "Úplně první obrazovka: prázdná knihovna a Open folder", de: "Der allererste Bildschirm: eine leere Bibliothek und Open folder", hu: "A legelső képernyő: üres könyvtár és az Open folder gomb", ja: "いちばん最初の画面：空のライブラリーと Open folder", pl: "Pierwszy ekran: pusta biblioteka i Otwórz folder" } }
    - { file: 0.1.0-beta.1-gallery, w: 1600, h: 1000, from: "v0.1.0-beta.1:site/assets/img/grid-en-dark.webp", alt: { en: "The first beta's gallery with its print settings", vi: "Lưới ảnh của bản beta đầu tiên cùng cài đặt in", cs: "Galerie první bety s nastavením tisku", de: "Die Galerie der ersten Beta mit ihren Druckeinstellungen", hu: "Az első béta galériája a nyomtatási beállításokkal", ja: "最初のベータ版のギャラリーとプリント設定", pl: "Galeria pierwszej bety z ustawieniami druku" } }
- version: "0.1"
  date: 2026-10-24
  title: { en: "First public preview", vi: "Bản xem trước công khai đầu tiên", cs: "První veřejná ukázka", de: "Erste öffentliche Vorschau", hu: "Az első nyilvános előzetes", ja: "初の公開プレビュー", pl: "Pierwsza publiczna wersja próbna" }
  points:
    en:
      - "For macOS and Windows, in English and Vietnamese."
      - "Best-shot suggestions, a film-style date stamp with offline place names, a camera info frame."
      - "Crop to print sizes with rotate and straighten; export at the original quality."
    vi:
      - "Cho macOS và Windows, bằng tiếng Anh và tiếng Việt."
      - "Gợi ý ảnh đẹp nhất, dấu ngày kiểu máy phim với tên nơi chụp không cần mạng, khung thông tin máy ảnh."
      - "Cắt theo khổ in, xoay và chỉnh thẳng; xuất ảnh giữ nguyên chất lượng."
    cs:
      - "Pro macOS a Windows, anglicky a vietnamsky."
      - "Návrhy nejlepších snímků, datum na fotce jako z filmu s názvy míst offline, rámeček s údaji o fotoaparátu."
      - "Ořez na formáty tisku s otáčením a vyrovnáním; export v původní kvalitě."
    de:
      - "Für macOS und Windows, auf Englisch und Vietnamesisch."
      - "Vorschläge für die besten Aufnahmen, ein Datumsstempel wie vom Film mit Ortsnamen offline, ein Rahmen mit Kameradaten."
      - "Zuschnitt auf Druckformate mit Drehen und Geraderichten; Export in Originalqualität."
    hu:
      - "macOS-re és Windowsra, angolul és vietnámiul."
      - "A legjobb kép ajánlása, filmes stílusú dátum offline helynevekkel, keret a fényképezőgép adataival."
      - "Vágás nyomatméretre forgatással és kiegyenesítéssel; exportálás eredeti minőségben."
    ja:
      - "macOS と Windows 向け、英語とベトナム語で。"
      - "ベストショットの提案、オフラインの地名入りのフィルム風日付、カメラ情報のフレーム。"
      - "回転と傾き補正つきでプリントサイズにトリミング。元の画質のまま書き出し。"
    pl:
      - "Na macOS i Windows, po angielsku i po wietnamsku."
      - "Podpowiedzi najlepszych ujęć, data na zdjęciu jak z kliszy z nazwami miejsc offline, ramka z danymi aparatu."
      - "Kadry na wymiar odbitki z obracaniem i prostowaniem; eksport w oryginalnej jakości."
  shots:
    - { file: 0.1-gallery, w: 1600, h: 1000, from: "v0.1.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.1.0: the gallery and the print settings", vi: "v0.1.0: lưới ảnh và cài đặt in", cs: "v0.1.0: galerie a nastavení tisku", de: "v0.1.0: die Galerie und die Druckeinstellungen", hu: "v0.1.0: a galéria és a nyomtatási beállítások", ja: "v0.1.0：ギャラリーとプリント設定", pl: "v0.1.0: galeria i ustawienia druku" } }
