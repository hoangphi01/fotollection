- version: "0.12"
  date: 2026-11-06
  title: { en: "Settings and Develop", vi: "Cài đặt và chỉnh ảnh", cs: "Nastavení a úpravy", de: "Einstellungen und Entwicklung", fr: "Réglages et développement", hu: "Beállítások és kidolgozás", ja: "設定と現像", ko: "설정과 현상", pl: "Ustawienia i wywoływanie" }
  points:
    en:
      - "One Settings window in two columns, as on an iPad, with the memory and the cache to manage."
      - "A develop view a Lightroom user can read: one toolbar above the photo, Lightroom's keys, Before and After."
    vi:
      - "Một cửa sổ Cài đặt hai cột như trên iPad, quản lý được bộ nhớ và bộ đệm."
      - "Màn chỉnh ảnh người dùng Lightroom đọc được ngay: một thanh công cụ trên ảnh, phím tắt của Lightroom, Trước và Sau."
    cs:
      - "Jedno okno Settings ve dvou sloupcích, jako na iPadu, se správou paměti a mezipaměti."
      - "Zobrazení úprav, které uživatel Lightroomu přečte: jeden panel nástrojů nad fotkou, klávesy z Lightroomu, Before a After."
    de:
      - "Ein Einstellungsfenster in zwei Spalten, wie auf dem iPad, mit Speicher und Cache zum Verwalten."
      - "Eine Entwicklungsansicht, die Lightroom-Nutzer lesen können: eine Werkzeugleiste über dem Foto, die Tasten von Lightroom, Vorher und Nachher."
    fr:
      - "Une seule fenêtre Settings en deux colonnes, comme sur iPad, avec la mémoire et le cache à gérer."
      - "Une vue de développement lisible pour un utilisateur de Lightroom : une barre d’outils au-dessus de la photo, les raccourcis de Lightroom, Before et After."
    hu:
      - "Egyetlen, kétoszlopos Settings ablak, mint az iPaden, a memória és a gyorsítótár kezelésével."
      - "Kidolgozó nézet, amelyet egy Lightroom-felhasználó is elsőre ért: egy eszköztár a fotó fölött, a Lightroom billentyűi, Before és After."
    ja:
      - "iPad のような 2 列の Settings ウィンドウを 1 つに。メモリーとキャッシュもここで管理。"
      - "Lightroom ユーザーがすぐ読める現像ビュー：写真の上に 1 本のツールバー、Lightroom と同じキー、Before と After。"
    ko:
      - "iPad 같은 2열 Settings 창 하나로. 메모리와 캐시도 여기서 관리."
      - "Lightroom 사용자가 바로 알아보는 현상 보기: 사진 위의 도구 막대 하나, Lightroom과 같은 키, Before와 After."
    pl:
      - "Jedno okno Ustawień w dwóch kolumnach, jak na iPadzie, z zarządzaniem pamięcią i pamięcią podręczną."
      - "Widok wywoływania czytelny dla użytkownika Lightrooma: jeden pasek narzędzi nad zdjęciem, skróty Lightrooma, Przed i Po."
  shots:
    - { file: 0.12-gallery, w: 1600, h: 1000, from: "v0.12.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.12.0: the gallery", vi: "v0.12.0: lưới ảnh", cs: "v0.12.0: galerie", de: "v0.12.0: die Galerie", fr: "v0.12.0 : la galerie", hu: "v0.12.0: a galéria", ja: "v0.12.0：ギャラリー", ko: "v0.12.0: 갤러리", pl: "v0.12.0: galeria" } }
    - { file: 0.12-settings, w: 1600, h: 1000, from: "v0.12.0:site/assets/img/settings-en-dark.webp", alt: { en: "v0.12.0: the new Settings window", vi: "v0.12.0: cửa sổ Cài đặt mới", cs: "v0.12.0: nové okno Settings", de: "v0.12.0: das neue Einstellungsfenster", fr: "v0.12.0 : la nouvelle fenêtre Settings", hu: "v0.12.0: az új Settings ablak", ja: "v0.12.0：新しい Settings ウィンドウ", ko: "v0.12.0: 새 Settings 창", pl: "v0.12.0: nowe okno Ustawień" } }
- version: "0.13"
  date: 2026-11-06
  title: { en: "The interface", vi: "Giao diện mới", cs: "Rozhraní", de: "Die Oberfläche", fr: "L’interface", hu: "A felület", ja: "インターフェース", ko: "인터페이스", pl: "Interfejs" }
  points:
    en:
      - "Controls with depth, the Be Vietnam Pro font, one panel width."
      - "An export dialog as Lightroom's; a full-window develop view with the Navigator, History and a histogram."
      - "A welcome on the first launch, and the manual inside Fotollection."
    vi:
      - "Nút bấm có chiều sâu, phông Be Vietnam Pro, các cột cùng một độ rộng."
      - "Hộp thoại xuất ảnh như Lightroom; màn chỉnh ảnh toàn cửa sổ với Navigator, History và biểu đồ màu."
      - "Màn chào mừng lần đầu mở Fotollection, và sách hướng dẫn ngay bên trong."
    cs:
      - "Ovládací prvky s hloubkou, písmo Be Vietnam Pro, jedna šířka panelu."
      - "Dialog exportu jako v Lightroomu; zobrazení úprav přes celé okno s Navigátorem, Historií a histogramem."
      - "Uvítání při prvním spuštění a příručka přímo ve Fotollection."
    de:
      - "Bedienelemente mit Tiefe, die Schrift Be Vietnam Pro, eine Breite für die Bedienfelder."
      - "Ein Exportdialog wie der von Lightroom; eine Entwicklungsansicht im ganzen Fenster mit Navigator, Protokoll und Histogramm."
      - "Eine Begrüßung beim ersten Start, und das Handbuch in Fotollection."
    fr:
      - "Des commandes avec du relief, la police Be Vietnam Pro, une seule largeur de panneau."
      - "Une boîte de dialogue d’export comme celle de Lightroom ; une vue de développement en pleine fenêtre avec le Navigateur, l’Historique et un histogramme."
      - "Un accueil au premier lancement, et le manuel dans Fotollection."
    hu:
      - "Mélységet kapott vezérlők, Be Vietnam Pro betűtípus, egyetlen panelszélesség."
      - "Exportálási ablak, mint a Lightroomé; teljes ablakos kidolgozó nézet a Navigátorral, az Előzményekkel és hisztogrammal."
      - "Üdvözlés az első indításkor, és a kézikönyv a Fotollectionön belül."
    ja:
      - "奥行きのあるコントロール、Be Vietnam Pro フォント、統一したパネル幅。"
      - "Lightroom のような書き出しダイアログ。ナビゲーター、ヒストリー、ヒストグラムつきのウィンドウ全体の現像ビュー。"
      - "初回起動時のウェルカム画面と、Fotollection に内蔵したマニュアル。"
    ko:
      - "깊이감 있는 컨트롤, Be Vietnam Pro 글꼴, 통일한 패널 너비."
      - "Lightroom 같은 내보내기 대화 상자. 내비게이터, 히스토리, 히스토그램을 갖춘 창 전체 현상 보기."
      - "첫 실행 시 환영 화면과 Fotollection에 내장된 매뉴얼."
    pl:
      - "Kontrolki z głębią, czcionka Be Vietnam Pro, jedna szerokość paneli."
      - "Okno eksportu jak w Lightroomie; widok wywoływania na całe okno z Nawigatorem, Historią i histogramem."
      - "Powitanie przy pierwszym uruchomieniu i instrukcja w samym Fotollection."
  shots:
    - { file: 0.13-gallery, w: 1600, h: 1000, from: "v0.13.4:site/assets/img/grid-en-dark.webp", alt: { en: "v0.13.4: the new look", vi: "v0.13.4: giao diện mới", cs: "v0.13.4: nový vzhled", de: "v0.13.4: das neue Aussehen", fr: "v0.13.4 : le nouveau look", hu: "v0.13.4: az új megjelenés", ja: "v0.13.4：新しい見た目", ko: "v0.13.4: 새로운 모습", pl: "v0.13.4: nowy wygląd" } }
    - { file: 0.13-window, w: 1600, h: 1000, from: "v0.13.4:site/assets/img/window-en-dark.webp", alt: { en: "v0.13.4: the full-window develop view", vi: "v0.13.4: màn chỉnh ảnh toàn cửa sổ", cs: "v0.13.4: zobrazení úprav přes celé okno", de: "v0.13.4: die Entwicklungsansicht im ganzen Fenster", fr: "v0.13.4 : la vue de développement en pleine fenêtre", hu: "v0.13.4: a teljes ablakos kidolgozó nézet", ja: "v0.13.4：ウィンドウ全体の現像ビュー", ko: "v0.13.4: 창 전체 현상 보기", pl: "v0.13.4: widok wywoływania na całe okno" } }
    - { file: 0.13-export, w: 1600, h: 1000, from: "v0.13.4:site/assets/img/export-dialog-en-light.webp", alt: { en: "v0.13.4: the export dialog", vi: "v0.13.4: hộp thoại xuất ảnh", cs: "v0.13.4: dialog exportu", de: "v0.13.4: der Exportdialog", fr: "v0.13.4 : la boîte de dialogue d’export", hu: "v0.13.4: az exportálás ablaka", ja: "v0.13.4：書き出しダイアログ", ko: "v0.13.4: 내보내기 대화 상자", pl: "v0.13.4: okno eksportu" } }
- version: "0.14"
  date: 2026-11-09
  fn: [fn_lut]
  title: { en: "Looks", vi: "Looks", cs: "Looky", de: "Looks", fr: "Looks", hu: "Lookok", ja: "ルック", ko: "룩", pl: "Looki" }
  points:
    en:
      - "One tap gives a photo a colour: looks of our own, your Lightroom presets and LUTs, a Color Mixer and Dehaze."
      - "A look for many photos at once; thumbnails show each photo's colour."
      - "Move to another computer with one file; a part that fails no longer takes Fotollection down."
    vi:
      - "Một chạm là ảnh có màu: look của Fotollection, preset Lightroom và LUT của bạn, Color Mixer và Khử sương."
      - "Áp một look cho nhiều ảnh cùng lúc; ảnh thu nhỏ hiện màu của từng ảnh."
      - "Chuyển sang máy khác bằng một tệp; một phần lỗi không còn làm sập Fotollection."
    cs:
      - "Jedno ťuknutí dá fotce barvu: naše vlastní looky, tvoje presety z Lightroomu a LUTy, Color Mixer a Dehaze."
      - "Look pro mnoho fotek najednou; miniatury ukazují každou fotku v jejích barvách."
      - "Přesun na jiný počítač v jednom souboru; část, která selže, už Fotollection neshodí."
    de:
      - "Ein Tippen gibt einem Foto eine Farbe: eigene Looks, deine Lightroom-Presets und LUTs, ein Color Mixer und Dunst entfernen."
      - "Ein Look für viele Fotos auf einmal; Vorschaubilder zeigen jedes Foto in seiner Farbe."
      - "Mit einer Datei auf einen anderen Computer umziehen; ein Teil, der ausfällt, reißt Fotollection nicht mehr mit."
    fr:
      - "Un toucher donne une couleur à une photo : nos propres looks, vos presets Lightroom et LUT, un Color Mixer et Dehaze."
      - "Un look pour de nombreuses photos à la fois ; les vignettes montrent la couleur de chaque photo."
      - "Passez à un autre ordinateur avec un seul fichier ; une partie qui échoue ne fait plus tomber Fotollection."
    hu:
      - "Egy koppintás, és a fotó színt kap: saját lookok, a Lightroom presetjeid és LUT-jaid, Color Mixer és Dehaze."
      - "Egy look sok fotónak egyszerre; a bélyegképek minden fotót a saját színeivel mutatnak."
      - "Költözés másik gépre egyetlen fájllal; egy hibázó rész már nem dönti le a Fotollectiont."
    ja:
      - "ワンタップで写真に色を：独自のルック、手持ちの Lightroom プリセットと LUT、Color Mixer、Dehaze。"
      - "多くの写真に一度にルックを適用。サムネイルはそれぞれの写真の色で表示されます。"
      - "1 つのファイルで別のコンピューターへ移行。一部が失敗しても Fotollection 全体が落ちることはなくなりました。"
    ko:
      - "한 번의 탭으로 사진에 색을: 자체 룩, 가지고 있는 Lightroom 프리셋과 LUT, Color Mixer, Dehaze."
      - "여러 사진에 한 번에 룩 적용. 썸네일은 각 사진의 색으로 표시됩니다."
      - "파일 하나로 다른 컴퓨터로 옮기기. 일부가 실패해도 Fotollection 전체가 멈추는 일은 이제 없습니다."
    pl:
      - "Jedno dotknięcie nadaje zdjęciu kolor: nasze własne looki, twoje presety Lightroom i LUT-y, Color Mixer i Dehaze."
      - "Look dla wielu zdjęć naraz; miniatury pokazują kolor każdego zdjęcia."
      - "Przenieś się na inny komputer w jednym pliku; awaria jednej części nie zamyka już całego Fotollection."
  shots:
    - { file: 0.14-looks, w: 1600, h: 1000, from: "v0.14.0:site/assets/img/window-en-dark.webp", alt: { en: "v0.14.0: looks under the photo, Presets & LUTs on the left", vi: "v0.14.0: looks dưới ảnh, Presets & LUTs bên trái", cs: "v0.14.0: looky pod fotkou, Presets & LUTs vlevo", de: "v0.14.0: Looks unter dem Foto, Presets & LUTs links", fr: "v0.14.0 : les looks sous la photo, Presets & LUTs à gauche", hu: "v0.14.0: lookok a fotó alatt, bal oldalt a Presets & LUTs", ja: "v0.14.0：写真の下にルック、左に Presets & LUTs", ko: "v0.14.0: 사진 아래의 룩, 왼쪽의 Presets & LUTs", pl: "v0.14.0: looki pod zdjęciem, Presety i LUT-y po lewej" } }
    - { file: 0.14-simple, w: 1600, h: 1000, from: "v0.14.0:site/assets/img/simple-en-light.webp", alt: { en: "v0.14.0: Simple mode's numbered looks", vi: "v0.14.0: dải look đánh số ở chế độ Đơn giản", cs: "v0.14.0: očíslované looky v režimu Simple", de: "v0.14.0: die nummerierten Looks im Simple-Modus", fr: "v0.14.0 : les looks numérotés du mode Simple", hu: "v0.14.0: a Simple mód számozott lookjai", ja: "v0.14.0：Simple モードの番号付きルック", ko: "v0.14.0: Simple 모드의 번호가 붙은 룩", pl: "v0.14.0: numerowane looki w trybie Prostym" } }
    - { file: 0.14-gallery, w: 1600, h: 1000, from: "v0.14.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.14.0: thumbnails in their colours", vi: "v0.14.0: ảnh thu nhỏ theo màu của từng ảnh", cs: "v0.14.0: miniatury v jejich barvách", de: "v0.14.0: Vorschaubilder in ihren Farben", fr: "v0.14.0 : les vignettes dans leurs couleurs", hu: "v0.14.0: bélyegképek a saját színeikben", ja: "v0.14.0：それぞれの色で表示されるサムネイル", ko: "v0.14.0: 각자의 색으로 표시되는 썸네일", pl: "v0.14.0: miniatury w swoich kolorach" } }
