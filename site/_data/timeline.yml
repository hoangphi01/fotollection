      - "One window: a library on the left, print settings on the right, and Open folder."
      - "A day later the first beta found best shots, stamped the date and exported to print."
    vi:
      - "Một cửa sổ: thư viện bên trái, cài đặt in bên phải, và nút Mở thư mục."
      - "Một ngày sau, bản beta đầu tiên đã chọn ảnh đẹp nhất, đóng dấu ngày và xuất ảnh để in."
    cs:
      - "Jedno okno: knihovna vlevo, nastavení tisku vpravo a Open folder."
      - "O den později první beta našla nejlepší snímky, přidala datum na fotku a exportovala k tisku."
    de:
      - "Ein Fenster: links eine Bibliothek, rechts die Druckeinstellungen, und Open folder."
      - "Einen Tag später fand die erste Beta die besten Aufnahmen, druckte das Datum ein und exportierte für den Druck."
    fr:
      - "Une fenêtre : une bibliothèque à gauche, les réglages d’impression à droite, et Open folder."
      - "Un jour plus tard, la première bêta trouvait les meilleures photos, incrustait la date et exportait pour le tirage."
    hu:
