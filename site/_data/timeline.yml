- version: "0.9"
  date: 2026-11-02
  title: { en: "Three modes", vi: "Ba chế độ", cs: "Tři režimy", de: "Drei Modi", hu: "Három mód", ja: "3 つのモード", pl: "Trzy tryby" }
  points:
    en:
      - "Simple, Collage and Pro: one photo full screen, two photos on one print, or every tool."
      - "Postcards: a photo on one side, the back with a stamp box and your words."
      - "The first colour cards, Faves and Tools, with Before and After."
    vi:
      - "Đơn giản, Ghép ảnh và Pro: một ảnh toàn màn hình, hai ảnh trên một tấm in, hoặc đủ mọi công cụ."
      - "Bưu thiếp: một mặt là ảnh, mặt sau có ô tem và lời của bạn."
      - "Những thẻ màu đầu tiên, Cơ bản và Công cụ, có Trước và Sau."
    cs:
      - "Simple, Collage a Pro: jedna fotka přes celou obrazovku, dvě fotky na jednom tisku, nebo všechny nástroje."
      - "Pohlednice: fotka na jedné straně, na zadní políčko na známku a tvoje slova."
      - "První barevné karty, Faves a Tools, s Before a After."
    de:
      - "Simple, Collage und Pro: ein Foto im Vollbild, zwei Fotos auf einem Abzug, oder jedes Werkzeug."
      - "Postkarten: auf einer Seite ein Foto, auf der Rückseite ein Briefmarkenfeld und deine Worte."
      - "Die ersten Farbkarten, Faves und Tools, mit Vorher und Nachher."
    hu:
      - "Simple, Collage és Pro: egy fotó teljes képernyőn, két fotó egy képen, vagy minden eszköz."
      - "Képeslapok: az egyik oldalon a fotó, a hátoldalon bélyegkeret és a saját szavaid."
      - "Az első színkártyák, a Faves és a Tools, Before és After nézettel."
    ja:
      - "Simple、Collage、Pro：1 枚を全画面で、1 枚のプリントに 2 枚の写真を、またはすべてのツールを。"
      - "ポストカード：片面に写真、裏面に切手枠とあなたのメッセージ。"
      - "最初のカラーカード Faves と Tools、Before と After 表示つき。"
    pl:
      - "Prosty, Kolaż i Pro: jedno zdjęcie na pełnym ekranie, dwa zdjęcia na jednej odbitce albo każde narzędzie."
      - "Pocztówki: zdjęcie z jednej strony, a z tyłu pole na znaczek i twoje słowa."
      - "Pierwsze karty kolorów, Ulubione i Narzędzia, z widokiem Przed i Po."
  shots:
    - { file: 0.9-gallery, w: 1600, h: 1000, from: "v0.9.9:site/assets/img/grid-en-dark.webp", alt: { en: "v0.9.9: the three modes above the library", vi: "v0.9.9: ba chế độ phía trên thư viện", cs: "v0.9.9: tři režimy nad knihovnou", de: "v0.9.9: die drei Modi über der Bibliothek", hu: "v0.9.9: a három mód a könyvtár fölött", ja: "v0.9.9：ライブラリーの上の 3 つのモード", pl: "v0.9.9: trzy tryby nad biblioteką" } }
    - { file: 0.9-collage, w: 1600, h: 1000, from: "v0.9.9:site/assets/img/collage-en-dark.webp", alt: { en: "v0.9.9: two photos on one print in Collage mode", vi: "v0.9.9: hai ảnh trên một tấm in ở chế độ Ghép ảnh", cs: "v0.9.9: dvě fotky na jednom tisku v režimu Collage", de: "v0.9.9: zwei Fotos auf einem Abzug im Collage-Modus", hu: "v0.9.9: két fotó egy képen Collage módban", ja: "v0.9.9：Collage モードで 1 枚のプリントに 2 枚の写真", pl: "v0.9.9: dwa zdjęcia na jednej odbitce w trybie Kolażu" } }
    - { file: 0.9-postcard, w: 1600, h: 1000, from: "v0.9.9:site/assets/img/postcard-en-dark.webp", alt: { en: "v0.9.9: a postcard and its back", vi: "v0.9.9: một bưu thiếp và mặt sau", cs: "v0.9.9: pohlednice a její zadní strana", de: "v0.9.9: eine Postkarte und ihre Rückseite", hu: "v0.9.9: egy képeslap és a hátoldala", ja: "v0.9.9：ポストカードとその裏面", pl: "v0.9.9: pocztówka i jej tył" } }
- version: "0.10"
  date: 2026-11-05
  title: { en: "Core", vi: "Lõi", cs: "Jádro", de: "Der Kern", hu: "A mag", ja: "コア", pl: "Rdzeń" }
  points:
    en:
      - "Our own RAW develop for every Bayer camera, written in Rust: neutral colour by default, the camera's look in one click."
      - "Sliders work in linear light on RAW, with headroom above white."
    vi:
      - "Bộ develop RAW riêng cho mọi máy ảnh Bayer, viết bằng Rust: màu trung tính mặc định, màu của máy ảnh chỉ một cú bấm."
      - "Các thanh trượt làm việc trong ánh sáng tuyến tính với RAW, còn dư khoảng trên điểm trắng."
    cs:
      - "Vlastní vyvolávání RAW pro každý fotoaparát Bayer, napsané v Rustu: ve výchozím stavu neutrální barvy, vzhled fotoaparátu jedním kliknutím."
      - "Posuvníky pracují u RAW v lineárním světle, s rezervou nad bílou."
    de:
      - "Unsere eigene RAW-Entwicklung für jede Bayer-Kamera, geschrieben in Rust: standardmäßig neutrale Farbe, der Look der Kamera mit einem Klick."
      - "Regler arbeiten bei RAW in linearem Licht, mit Reserven über Weiß."
    hu:
      - "Saját, Rustban írt RAW-kidolgozás minden Bayer-érzékelős géphez: alapból semleges szín, egy kattintással a gép saját lookja."
      - "RAW-on a csúszkák lineáris fényben dolgoznak, tartalékkal a fehér fölött."
    ja:
      - "Rust で書いた独自の RAW 現像をすべての Bayer 機に。標準はニュートラルな色、ワンクリックでカメラ本来のルックに。"
      - "RAW ではスライダーがリニア光で動作し、白の上にも余裕を残します。"
    pl:
      - "Własne wywoływanie RAW dla każdego aparatu z matrycą Bayera, napisane w Ruście: domyślnie neutralny kolor, wygląd z aparatu jednym kliknięciem."
      - "Suwaki działają w świetle liniowym na RAW-ach, z zapasem powyżej bieli."
  note: { en: "The look stayed as in 0.9; what changed is inside, drawn here.", vi: "Giao diện giữ như 0.9; thay đổi nằm bên trong, như sơ đồ này.", cs: "Vzhled zůstal jako v 0.9; změnilo se to, co je uvnitř, a to je nakreslené tady.", de: "Das Aussehen blieb wie in 0.9; was sich geändert hat, steckt im Inneren und ist hier gezeichnet.", hu: "A külső maradt, mint a 0.9-ben; a belseje változott, ezt rajzoltuk le itt.", ja: "見た目は 0.9 のまま。変わったのは内部で、ここに図で示しています。", pl: "Wygląd został taki jak w 0.9; zmieniło się wnętrze, narysowane tutaj." }
  diagram: raw-develop
- version: "0.11"
  date: 2026-11-06
  title: { en: "Instant previews", vi: "Xem ảnh tức thì", cs: "Okamžité náhledy", de: "Sofortige Vorschauen", hu: "Azonnali előnézetek", ja: "一瞬で開くプレビュー", pl: "Natychmiastowe podglądy" }
  points:
    en:
      - "Standard previews kept on disk and a quarter of the memory for the photo on screen."
      - "Any photo opens in 27 ms, where it took 274 to 531 ms."
    vi:
      - "Ảnh xem trước chuẩn lưu trên đĩa, một phần tư bộ nhớ dành cho ảnh đang xem."
      - "Mọi ảnh mở trong 27 ms, trước đây mất 274 đến 531 ms."
    cs:
      - "Standardní náhledy uložené na disku a čtvrtina paměti pro fotku na obrazovce."
      - "Kterákoli fotka se otevře za 27 ms, dřív to trvalo 274 až 531 ms."
    de:
      - "Standardvorschauen auf der Festplatte und ein Viertel des Speichers für das Foto auf dem Bildschirm."
      - "Jedes Foto öffnet sich in 27 ms, wo es 274 bis 531 ms dauerte."
    hu:
      - "Normál előnézetek a lemezen, és a memória negyede a képernyőn lévő fotónak."
      - "Bármelyik fotó 27 ms alatt nyílik meg, ahol korábban 274–531 ms kellett."
    ja:
      - "標準プレビューをディスクに保持し、メモリーの 4 分の 1 を画面上の写真に使います。"
      - "どの写真も 27 ms で開きます。以前は 274〜531 ms かかっていました。"
    pl:
      - "Standardowe podglądy trzymane na dysku i jedna czwarta pamięci na zdjęcie na ekranie."
      - "Każde zdjęcie otwiera się w 27 ms, a wcześniej zajmowało to od 274 do 531 ms."
  note: { en: "The look stayed as in 0.9; what changed is inside, drawn here.", vi: "Giao diện giữ như 0.9; thay đổi nằm bên trong, như sơ đồ này.", cs: "Vzhled zůstal jako v 0.9; změnilo se to, co je uvnitř, a to je nakreslené tady.", de: "Das Aussehen blieb wie in 0.9; was sich geändert hat, steckt im Inneren und ist hier gezeichnet.", hu: "A külső maradt, mint a 0.9-ben; a belseje változott, ezt rajzoltuk le itt.", ja: "見た目は 0.9 のまま。変わったのは内部で、ここに図で示しています。", pl: "Wygląd został taki jak w 0.9; zmieniło się wnętrze, narysowane tutaj." }
