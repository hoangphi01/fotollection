      - "Tartsd lenyomva a Space-t egy gyors előnézethez; az exportálás indulás előtt megmondja a méretét."
    ja:
      - "プリントバスケットと、写真をよけておく場所。プレビューでは ↑ と ↓、ギャラリーでは Select で。"
      - "Space を押し続けるとクイックプレビュー。書き出しは始める前にサイズを表示します。"
    pl:
      - "Koszyk do druku i miejsce na odłożone zdjęcia: ↑ i ↓ w podglądzie albo Zaznacz w galerii."
      - "Przytrzymaj Spację, by szybko podejrzeć zdjęcie; eksport podaje swój rozmiar, zanim się zacznie."
  shots:
    - { file: 0.5-gallery, w: 1600, h: 1000, from: "v0.5.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.5.0: the print basket and Set aside in the library", vi: "v0.5.0: giỏ in và Để riêng trong thư viện", cs: "v0.5.0: košík k tisku a Set aside v knihovně", de: "v0.5.0: der Druckkorb und die beiseitegelegten Fotos in der Bibliothek", hu: "v0.5.0: a nyomtatási kosár és a Set aside a könyvtárban", ja: "v0.5.0：ライブラリーのプリントバスケットと Set aside", pl: "v0.5.0: koszyk do druku i Odłożone w bibliotece" } }
    - { file: 0.5-basket, w: 1600, h: 1000, from: "v0.5.0:site/assets/img/swipe-en-dark.webp", alt: { en: "v0.5.0: a photo going into the print basket", vi: "v0.5.0: một ảnh được cho vào giỏ in", cs: "v0.5.0: fotka jde do košíku k tisku", de: "v0.5.0: ein Foto auf dem Weg in den Druckkorb", hu: "v0.5.0: egy fotó a nyomtatási kosárba kerül", ja: "v0.5.0：プリントバスケットに入る写真", pl: "v0.5.0: zdjęcie trafia do koszyka do druku" } }
