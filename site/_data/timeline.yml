      - "Vorschläge für die besten Aufnahmen, ein Datumsstempel wie vom Film mit Ortsnamen offline, ein Rahmen mit Kameradaten."
      - "Zuschnitt auf Druckformate mit Drehen und Geraderichten; Export in Originalqualität."
    fr:
      - "Pour macOS et Windows, en anglais et en vietnamien."
