- version: "0.4"
  date: 2026-10-25
  fn: [fn_srgb]
  title: { en: "Sharing and folders", vi: "Chia sẻ và thư mục", cs: "Sdílení a složky", de: "Teilen und Ordner", fr: "Partage et dossiers", hu: "Megosztás és mappák", ja: "共有とフォルダー", ko: "공유와 폴더", pl: "Udostępnianie i foldery" }
  points:
    en:
      - "Export for social media in sRGB, never with GPS."
      - "Folders work like tabs; zoom with a pinch; drag the photo to reframe it, or fit it whole like an instax print."
    vi:
      - "Xuất ảnh cho mạng xã hội theo sRGB, không bao giờ kèm GPS."
      - "Thư mục hoạt động như tab; chụm hai ngón để phóng to; kéo ảnh để chọn lại khung, hoặc để vừa cả ảnh như ảnh instax."
    cs:
      - "Export pro sociální sítě v sRGB, nikdy s GPS."
      - "Složky fungují jako karty; zoom sevřením prstů; přetažením fotku přerámuješ, nebo ji celou vlož jako tisk instax."
    de:
      - "Export für soziale Medien in sRGB, nie mit GPS."
      - "Ordner funktionieren wie Tabs; Zoomen mit zwei Fingern; zieh das Foto, um den Ausschnitt zu ändern, oder zeig es ganz wie einen instax-Abzug."
    fr:
      - "Export pour les réseaux sociaux en sRGB, jamais avec le GPS."
      - "Les dossiers fonctionnent comme des onglets ; zoom en pinçant ; faites glisser la photo pour la recadrer, ou affichez-la en entier comme un tirage instax."
    hu:
      - "Exportálás közösségi médiára sRGB-ben, sosem GPS-szel."
      - "A mappák fülként működnek; nagyítás csippentéssel; húzd a fotót az újrakomponáláshoz, vagy illeszd be egészben, mint egy instax képet."
    ja:
      - "SNS 向けに sRGB で書き出し。GPS は常に削除。"
      - "フォルダーはタブとして動作。ピンチでズーム。写真をドラッグして構図を直すか、instax のように写真全体を収めます。"
    ko:
      - "SNS용 sRGB 내보내기. GPS는 항상 삭제."
      - "폴더는 탭으로 동작. 핀치로 확대/축소. 사진을 끌어 구도를 고치거나, instax처럼 사진 전체를 담습니다."
    pl:
      - "Eksport do mediów społecznościowych w sRGB, nigdy z GPS."
      - "Foldery działają jak karty; zoom gestem szczypania; przeciągnij zdjęcie, by zmienić kadr, albo dopasuj je w całości jak odbitkę instax."
  shots:
    - { file: 0.4-gallery, w: 1600, h: 1000, from: "v0.4.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.4.0: the library with All photos and folders", vi: "v0.4.0: thư viện với Tất cả ảnh và các thư mục", cs: "v0.4.0: knihovna se All photos a složkami", de: "v0.4.0: die Bibliothek mit All photos und Ordnern", fr: "v0.4.0 : la bibliothèque avec All photos et les dossiers", hu: "v0.4.0: a könyvtár az All photos nézettel és a mappákkal", ja: "v0.4.0：All photos とフォルダーが並ぶライブラリー", ko: "v0.4.0: All photos와 폴더가 있는 라이브러리", pl: "v0.4.0: biblioteka ze Wszystkimi zdjęciami i folderami" } }
- version: "0.5"
  date: 2026-10-25
  title: { en: "The print basket", vi: "Giỏ in", cs: "Košík k tisku", de: "Der Druckkorb", fr: "Le panier d’impression", hu: "A nyomtatási kosár", ja: "プリントバスケット", ko: "인화 바구니", pl: "Koszyk do druku" }
  points:
    en:
      - "A print basket and a place to set photos aside: ↑ and ↓ in the preview, or Select in the gallery."
      - "Hold Space for a quick preview; the export says its size before it starts."
    vi:
      - "Giỏ in và chỗ để riêng ảnh: ↑ và ↓ trong màn xem ảnh, hoặc Chọn trong lưới ảnh."
      - "Giữ phím cách để xem nhanh; phần xuất ảnh báo trước dung lượng."
    cs:
      - "Košík k tisku a místo, kam fotky odložit: ↑ a ↓ v náhledu, nebo Select v galerii."
      - "Podrž mezerník pro rychlý náhled; export řekne svou velikost dřív, než začne."
    de:
      - "Ein Druckkorb und ein Platz, um Fotos beiseitezulegen: ↑ und ↓ in der Vorschau, oder Auswählen in der Galerie."
      - "Halte die Leertaste für eine schnelle Vorschau; der Export nennt seine Größe, bevor er beginnt."
    fr:
      - "Un panier d’impression et une place pour mettre des photos de côté : ↑ et ↓ dans l’aperçu, ou Select dans la galerie."
      - "Maintenez Espace pour un aperçu rapide ; l’export annonce sa taille avant de commencer."
    hu:
      - "Nyomtatási kosár és egy hely a félretett fotóknak: ↑ és ↓ az előnézetben, vagy Kijelölés a galériában."
      - "Tartsd lenyomva a Space-t egy gyors előnézethez; az exportálás indulás előtt megmondja a méretét."
    ja:
      - "プリントバスケットと、写真をよけておく場所。プレビューでは ↑ と ↓、ギャラリーでは Select で。"
      - "Space を押し続けるとクイックプレビュー。書き出しは始める前にサイズを表示します。"
    ko:
      - "인화 바구니와 사진을 치워 두는 곳. 미리보기에서는 ↑와 ↓, 갤러리에서는 Select로."
      - "Space를 누르고 있으면 빠른 미리보기. 내보내기는 시작하기 전에 크기를 보여 줍니다."
    pl:
      - "Koszyk do druku i miejsce na odłożone zdjęcia: ↑ i ↓ w podglądzie albo Zaznacz w galerii."
      - "Przytrzymaj Spację, by szybko podejrzeć zdjęcie; eksport podaje swój rozmiar, zanim się zacznie."
  shots:
