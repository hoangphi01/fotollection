    - { file: 0.2-dark, w: 1600, h: 1000, from: "v0.2.0:site/assets/img/grid-en-dark.webp", alt: { en: "v0.2.0 in the dark theme", vi: "v0.2.0 ở giao diện tối", cs: "v0.2.0 v tmavém motivu", de: "v0.2.0 im dunklen Thema", hu: "A v0.2.0 sötét témában", ja: "ダークテーマの v0.2.0", pl: "v0.2.0 w ciemnym motywie" } }
