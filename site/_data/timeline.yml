- version: "0.9"
  date: 2026-11-02
  title: { en: "Three modes", vi: "Ba chế độ", cs: "Tři režimy", de: "Drei Modi", fr: "Trois modes", hu: "Három mód", ja: "3 つのモード", ko: "세 가지 모드", pl: "Trzy tryby" }
  points:
    en:
      - "Simple, Collage and Pro: one photo full screen, two photos on one print, or every tool."
      - "Postcards: a photo on one side, the back with a stamp box and your words."
      - "The first colour cards, Faves and Tools, with Before and After."
    vi:
      - "Đơn giản, Ghép ảnh và Pro: một ảnh toàn màn hình, hai ảnh trên một tấm in, hoặc đủ mọi công cụ."
      - "Bưu thiếp: một mặt là ảnh, mặt sau có ô tem và lời của bạn."
      - "Những thẻ màu đầu tiên, Cơ bản và Công cụ, có Trước và Sau."
    cs:
      - "Simple, Collage a Pro: jedna fotka přes celou obrazovku, dvě fotky na jednom tisku, nebo všechny nástroje."
      - "Pohlednice: fotka na jedné straně, na zadní políčko na známku a tvoje slova."
      - "První barevné karty, Faves a Tools, s Before a After."
    de:
      - "Simple, Collage und Pro: ein Foto im Vollbild, zwei Fotos auf einem Abzug, oder jedes Werkzeug."
      - "Postkarten: auf einer Seite ein Foto, auf der Rückseite ein Briefmarkenfeld und deine Worte."
      - "Die ersten Farbkarten, Faves und Tools, mit Vorher und Nachher."
    fr:
      - "Simple, Collage et Pro : une photo en plein écran, deux photos sur un tirage, ou tous les outils."
      - "Cartes postales : une photo d’un côté, au dos une case pour le timbre et vos mots."
      - "Les premières cartes de couleur, Faves et Tools, avec Before et After."
    hu:
      - "Simple, Collage és Pro: egy fotó teljes képernyőn, két fotó egy képen, vagy minden eszköz."
      - "Képeslapok: az egyik oldalon a fotó, a hátoldalon bélyegkeret és a saját szavaid."
      - "Az első színkártyák, a Faves és a Tools, Before és After nézettel."
    ja:
      - "Simple、Collage、Pro：1 枚を全画面で、1 枚のプリントに 2 枚の写真を、またはすべてのツールを。"
      - "ポストカード：片面に写真、裏面に切手枠とあなたのメッセージ。"
      - "最初のカラーカード Faves と Tools、Before と After 表示つき。"
    ko:
      - "Simple, Collage, Pro: 한 장을 전체 화면으로, 인화지 한 장에 사진 두 장을, 또는 모든 도구를."
      - "엽서: 한쪽에는 사진, 뒷면에는 우표 칸과 나의 메시지."
      - "첫 색 카드 Faves와 Tools, Before와 After 보기 포함."
    pl:
      - "Prosty, Kolaż i Pro: jedno zdjęcie na pełnym ekranie, dwa zdjęcia na jednej odbitce albo każde narzędzie."
      - "Pocztówki: zdjęcie z jednej strony, a z tyłu pole na znaczek i twoje słowa."
      - "Pierwsze karty kolorów, Ulubione i Narzędzia, z widokiem Przed i Po."
  shots:
    - { file: 0.9-gallery, w: 1600, h: 1000, from: "v0.9.9:site/assets/img/grid-en-dark.webp", alt: { en: "v0.9.9: the three modes above the library", vi: "v0.9.9: ba chế độ phía trên thư viện", cs: "v0.9.9: tři režimy nad knihovnou", de: "v0.9.9: die drei Modi über der Bibliothek", fr: "v0.9.9 : les trois modes au-dessus de la bibliothèque", hu: "v0.9.9: a három mód a könyvtár fölött", ja: "v0.9.9：ライブラリーの上の 3 つのモード", ko: "v0.9.9: 라이브러리 위의 세 가지 모드", pl: "v0.9.9: trzy tryby nad biblioteką" } }
    - { file: 0.9-collage, w: 1600, h: 1000, from: "v0.9.9:site/assets/img/collage-en-dark.webp", alt: { en: "v0.9.9: two photos on one print in Collage mode", vi: "v0.9.9: hai ảnh trên một tấm in ở chế độ Ghép ảnh", cs: "v0.9.9: dvě fotky na jednom tisku v režimu Collage", de: "v0.9.9: zwei Fotos auf einem Abzug im Collage-Modus", fr: "v0.9.9 : deux photos sur un tirage en mode Collage", hu: "v0.9.9: két fotó egy képen Collage módban", ja: "v0.9.9：Collage モードで 1 枚のプリントに 2 枚の写真", ko: "v0.9.9: Collage 모드에서 인화지 한 장에 사진 두 장", pl: "v0.9.9: dwa zdjęcia na jednej odbitce w trybie Kolażu" } }
    - { file: 0.9-postcard, w: 1600, h: 1000, from: "v0.9.9:site/assets/img/postcard-en-dark.webp", alt: { en: "v0.9.9: a postcard and its back", vi: "v0.9.9: một bưu thiếp và mặt sau", cs: "v0.9.9: pohlednice a její zadní strana", de: "v0.9.9: eine Postkarte und ihre Rückseite", fr: "v0.9.9 : une carte postale et son dos", hu: "v0.9.9: egy képeslap és a hátoldala", ja: "v0.9.9：ポストカードとその裏面", ko: "v0.9.9: 엽서와 그 뒷면", pl: "v0.9.9: pocztówka i jej tył" } }
- version: "0.10"
  date: 2026-11-05
  title: { en: "Core", vi: "Lõi", cs: "Jádro", de: "Der Kern", fr: "Le cœur", hu: "A mag", ja: "コア", ko: "코어", pl: "Rdzeń" }
  points:
    en:
      - "Our own RAW develop for every Bayer camera, written in Rust: neutral colour by default, the camera's look in one click."
      - "Sliders work in linear light on RAW, with headroom above white."
    vi:
      - "Bộ develop RAW riêng cho mọi máy ảnh Bayer, viết bằng Rust: màu trung tính mặc định, màu của máy ảnh chỉ một cú bấm."
      - "Các thanh trượt làm việc trong ánh sáng tuyến tính với RAW, còn dư khoảng trên điểm trắng."
    cs:
      - "Vlastní vyvolávání RAW pro každý fotoaparát Bayer, napsané v Rustu: ve výchozím stavu neutrální barvy, vzhled fotoaparátu jedním kliknutím."
      - "Posuvníky pracují u RAW v lineárním světle, s rezervou nad bílou."
    de:
      - "Unsere eigene RAW-Entwicklung für jede Bayer-Kamera, geschrieben in Rust: standardmäßig neutrale Farbe, der Look der Kamera mit einem Klick."
      - "Regler arbeiten bei RAW in linearem Licht, mit Reserven über Weiß."
    fr:
      - "Notre propre développement RAW pour tous les appareils Bayer, écrit en Rust : couleur neutre par défaut, le rendu de l’appareil en un clic."
      - "Sur le RAW, les curseurs travaillent en lumière linéaire, avec de la marge au-dessus du blanc."
    hu:
      - "Saját, Rustban írt RAW-kidolgozás minden Bayer-érzékelős géphez: alapból semleges szín, egy kattintással a gép saját lookja."
      - "RAW-on a csúszkák lineáris fényben dolgoznak, tartalékkal a fehér fölött."
    ja:
      - "Rust で書いた独自の RAW 現像をすべての Bayer 機に。標準はニュートラルな色、ワンクリックでカメラ本来のルックに。"
      - "RAW ではスライダーがリニア光で動作し、白の上にも余裕を残します。"
    ko:
      - "Rust로 작성한 자체 RAW 현상을 모든 Bayer 카메라에. 기본은 중립 색, 클릭 한 번으로 카메라 본래의 룩으로."
      - "RAW에서는 슬라이더가 선형 광에서 동작해, 흰색 위에도 여유를 남깁니다."
    pl:
      - "Własne wywoływanie RAW dla każdego aparatu z matrycą Bayera, napisane w Ruście: domyślnie neutralny kolor, wygląd z aparatu jednym kliknięciem."
      - "Suwaki działają w świetle liniowym na RAW-ach, z zapasem powyżej bieli."
  note: { en: "The look stayed as in 0.9; what changed is inside, drawn here.", vi: "Giao diện giữ như 0.9; thay đổi nằm bên trong, như sơ đồ này.", cs: "Vzhled zůstal jako v 0.9; změnilo se to, co je uvnitř, a to je nakreslené tady.", de: "Das Aussehen blieb wie in 0.9; was sich geändert hat, steckt im Inneren und ist hier gezeichnet.", fr: "L’apparence est restée celle de la 0.9 ; ce qui a changé est à l’intérieur, dessiné ici.", hu: "A külső maradt, mint a 0.9-ben; a belseje változott, ezt rajzoltuk le itt.", ja: "見た目は 0.9 のまま。変わったのは内部で、ここに図で示しています。", ko: "모습은 0.9 그대로. 바뀐 것은 내부이며, 여기에 그림으로 보여 줍니다.", pl: "Wygląd został taki jak w 0.9; zmieniło się wnętrze, narysowane tutaj." }
