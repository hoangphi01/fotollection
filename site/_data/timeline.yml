  date: 2026-11-06
  title: { en: "Instant previews", vi: "Xem ảnh tức thì", cs: "Okamžité náhledy", de: "Sofortige Vorschauen", fr: "Aperçus instantanés", hu: "Azonnali előnézetek", ja: "一瞬で開くプレビュー", ko: "즉시 열리는 미리보기", pl: "Natychmiastowe podglądy" }
  points:
