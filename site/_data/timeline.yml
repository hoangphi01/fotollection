      - "Standard previews kept on disk and a quarter of the memory for the photo on screen."
      - "Any photo opens in 27 ms, where it took 274 to 531 ms."
    vi:
      - "Ảnh xem trước chuẩn lưu trên đĩa, một phần tư bộ nhớ dành cho ảnh đang xem."
      - "Mọi ảnh mở trong 27 ms, trước đây mất 274 đến 531 ms."
    cs:
      - "Standardní náhledy uložené na disku a čtvrtina paměti pro fotku na obrazovce."
      - "Kterákoli fotka se otevře za 27 ms, dřív to trvalo 274 až 531 ms."
    de:
      - "Standardvorschauen auf der Festplatte und ein Viertel des Speichers für das Foto auf dem Bildschirm."
      - "Jedes Foto öffnet sich in 27 ms, wo es 274 bis 531 ms dauerte."
    fr:
      - "Des aperçus standard gardés sur le disque et un quart de la mémoire pour la photo à l’écran."
      - "Toute photo s’ouvre en 27 ms, là où il fallait de 274 à 531 ms."
    hu:
      - "Normál előnézetek a lemezen, és a memória negyede a képernyőn lévő fotónak."
      - "Bármelyik fotó 27 ms alatt nyílik meg, ahol korábban 274–531 ms kellett."
    ja:
      - "標準プレビューをディスクに保持し、メモリーの 4 分の 1 を画面上の写真に使います。"
      - "どの写真も 27 ms で開きます。以前は 274〜531 ms かかっていました。"
    ko:
      - "표준 미리보기를 디스크에 보관하고, 메모리의 4분의 1을 화면의 사진에 씁니다."
      - "모든 사진이 27 ms에 열립니다. 이전에는 274~531 ms가 걸렸습니다."
    pl:
      - "Standardowe podglądy trzymane na dysku i jedna czwarta pamięci na zdjęcie na ekranie."
      - "Każde zdjęcie otwiera się w 27 ms, a wcześniej zajmowało to od 274 do 531 ms."
  note: { en: "The look stayed as in 0.9; what changed is inside, drawn here.", vi: "Giao diện giữ như 0.9; thay đổi nằm bên trong, như sơ đồ này.", cs: "Vzhled zůstal jako v 0.9; změnilo se to, co je uvnitř, a to je nakreslené tady.", de: "Das Aussehen blieb wie in 0.9; was sich geändert hat, steckt im Inneren und ist hier gezeichnet.", fr: "L’apparence est restée celle de la 0.9 ; ce qui a changé est à l’intérieur, dessiné ici.", hu: "A külső maradt, mint a 0.9-ben; a belseje változott, ezt rajzoltuk le itt.", ja: "見た目は 0.9 のまま。変わったのは内部で、ここに図で示しています。", ko: "모습은 0.9 그대로. 바뀐 것은 내부이며, 여기에 그림으로 보여 줍니다.", pl: "Wygląd został taki jak w 0.9; zmieniło się wnętrze, narysowane tutaj." }
