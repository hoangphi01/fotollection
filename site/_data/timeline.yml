- version: "0.8"
  date: 2026-10-27
  fn: [fn_lightroom, fn_compare]
  title: { en: "Places and Lightroom", vi: "Nơi chụp và Lightroom", cs: "Místa a Lightroom", de: "Orte und Lightroom", fr: "Lieux et Lightroom", hu: "Helyek és Lightroom", ja: "撮影地と Lightroom", ko: "촬영 장소와 Lightroom", pl: "Miejsca i Lightroom" }
  points:
    en:
      - "Dates and places by hand, or borrowed from your phone's photos of the same scene."
      - "Stars and rejects come in from Lightroom, Bridge, Capture One and darktable."
      - "RAW read by Fotollection itself; Linux joins Windows and macOS."
    vi:
      - "Sửa ngày và nơi chụp bằng tay, hoặc lấy từ ảnh điện thoại chụp cùng cảnh."
      - "Nhận sao và ảnh loại từ Lightroom, Bridge, Capture One và darktable."
      - "RAW được Fotollection tự đọc; Linux có mặt cùng Windows và macOS."
    cs:
      - "Data a místa ručně, nebo vypůjčená z fotek stejné scény z tvého telefonu."
      - "Hvězdičky a zamítnutí přicházejí z Lightroomu, Bridge, Capture One a darktable."
      - "RAW čte sám Fotollection; k Windows a macOS se přidává Linux."
    de:
      - "Datum und Ort von Hand, oder übernommen von den Smartphone-Fotos derselben Szene."
      - "Sterne und Ablehnungen kommen aus Lightroom, Bridge, Capture One und darktable mit."
      - "RAW, gelesen von Fotollection selbst; Linux kommt zu Windows und macOS hinzu."
    fr:
      - "Dates et lieux à la main, ou empruntés aux photos de la même scène prises avec votre téléphone."
      - "Les étoiles et les rejets arrivent de Lightroom, Bridge, Capture One et darktable."
      - "Le RAW lu par Fotollection elle-même ; Linux rejoint Windows et macOS."
    hu:
      - "Dátumok és helyek kézzel, vagy kölcsönvéve a telefonod ugyanarról a jelenetről készült fotóiból."
      - "A csillagok és az elvetések átjönnek a Lightroomból, a Bridge-ből, a Capture One-ból és a darktable-ből."
      - "A RAW-ot maga a Fotollection olvassa; a Windows és a macOS mellé a Linux is csatlakozik."
    ja:
      - "日付と撮影地を手入力、または同じ場面をスマートフォンで撮った写真から借用。"
      - "Lightroom、Bridge、Capture One、darktable の星と除外フラグを取り込みます。"
      - "RAW を Fotollection 自身で読み込み。Windows と macOS に Linux が加わりました。"
    ko:
      - "날짜와 촬영 장소를 직접 입력하거나, 같은 장면을 스마트폰으로 찍은 사진에서 빌려 옵니다."
      - "Lightroom, Bridge, Capture One, darktable의 별점과 제외 플래그를 가져옵니다."
      - "RAW를 Fotollection이 직접 읽습니다. Windows와 macOS에 Linux가 더해졌습니다."
    pl:
      - "Daty i miejsca ręcznie albo pożyczone ze zdjęć tej samej sceny z twojego telefonu."
      - "Gwiazdki i odrzucenia przychodzą z Lightrooma, Bridge, Capture One i darktable."
      - "RAW czytany przez samo Fotollection; Linux dołącza do Windows i macOS."
  shots:
    - { file: 0.8-gallery, w: 1600, h: 1000, from: "v0.8.3:site/assets/img/grid-en-dark.webp", alt: { en: "v0.8.3: the gallery", vi: "v0.8.3: lưới ảnh", cs: "v0.8.3: galerie", de: "v0.8.3: die Galerie", fr: "v0.8.3 : la galerie", hu: "v0.8.3: a galéria", ja: "v0.8.3：ギャラリー", ko: "v0.8.3: 갤러리", pl: "v0.8.3: galeria" } }
