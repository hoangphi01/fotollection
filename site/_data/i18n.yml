  faq_title: "Câu hỏi trước khi tải về"
  faq_lead: "Vì sao lại thêm một ứng dụng ảnh, và ứng dụng này khác ở đâu."
  faq_groups:
    - label: "Vì sao chọn Fotollection"
      items:
        - q: "Sao không dùng luôn Lightroom?"
          a: "Lightroom, ứng dụng Ảnh có sẵn và IrfanView được làm ra để chỉnh sửa và xem ảnh; chưa có ứng dụng nào được thiết kế cho máy in ảnh. Muốn in, bạn phải tự cắt từng ảnh theo tỉ lệ khổ giấy, hoặc giao tệp cho tiệm để máy hay nhân viên ở đó tự căn, và thường bị cắt mất đầu người hay mép tấm biển. Fotollection bắt đầu từ chính bản in: biết sẵn các khổ in ở dm và Rossmann, cắt từng ảnh đúng khổ để ảnh bạn thấy chính là ảnh in ra, báo khi ảnh quá nhỏ, in ngày chụp như máy phim và xuất tệp đúng chuẩn máy in ở tiệm. Ứng dụng nhẹ, nhanh, miễn phí và dùng song song với Lightroom được: ảnh gốc không bao giờ bị thay đổi."
        - q: "Máy tôi đã có sẵn Ảnh (Photos), hoặc tôi dùng IrfanView. Sao phải thêm ứng dụng?"
          a: "Ứng dụng Ảnh có sẵn và IrfanView đều là trình xem ảnh tốt, mỗi cái trên một hệ điều hành. Không cái nào biết khổ ảnh 10 × 15 ở dm hay Rossmann, báo khi ảnh quá nhỏ để in khổ đó, in ngày chụp như máy phim, hay gom ảnh đẹp nhất của năm thư mục vào một giỏ in. Fotollection làm được, dùng giống hệt nhau trên Mac, Windows lẫn Linux, và còn có thể là trình xem ảnh của bạn: bấm chuột phải vào ảnh, chọn Mở bằng, Fotollection, kể cả ảnh RAW."
    - label: "Tốc độ và độ nhẹ"
      items:
        - q: "Ứng dụng có nặng không? Máy cũ có chạy được không?"
          a: "Rất nhẹ: bộ cài cho Windows chỉ khoảng 18 MB, vì cửa sổ dùng trình hiển thị web có sẵn của hệ điều hành thay vì mang theo cả một trình duyệt. Phần lõi viết bằng Rust và chạy trực tiếp trên máy. Ảnh xem trước không bao giờ lớn hơn 1600 px, nên ảnh 32 MP mở nhanh như ảnh nhỏ, và ảnh gốc chỉ được tải khi bạn phóng to. Ngay cả khi xuất 5.035 ảnh, RAM dùng nhiều nhất chỉ khoảng 1,45 GB."
        - q: "Với hàng nghìn ảnh thì nhanh đến đâu?"
          a: "Mở 1.000 ảnh mất khoảng 0,12 giây, vì Fotollection đọc ảnh thu nhỏ có sẵn trong mỗi tệp trước. Đổi một thiết lập thì ảnh xem trước vẽ lại trong 17 ms, xuất ảnh đạt 18 ảnh cỡ đầy đủ mỗi giây, và từ lần thứ hai trở đi ứng dụng mở trong khoảng 0,4 giây. Mọi con số đều đo trên một chiếc máy tính xách tay bình thường, và trang Hiệu năng hướng dẫn bạn tự đo lại."
    - label: "Nền tảng và chi phí"
      items:
        - q: "Có chạy trên Mac, Windows và Linux không, có thật sự miễn phí không?"
          a: "Có. Một bản tải cho macOS 11 trở lên, chạy được cả trên chip Apple lẫn Intel, một bản cho Windows 10 và 11, và với Linux 64-bit thì có AppImage hoặc .deb, cho máy Intel/AMD lẫn ARM, chạy trên mọi distro có glibc 2.35 trở lên. Bản Linux là bản gọn: chưa mở được ảnh HEIC (ảnh iPhone), chưa chụp qua cáp USB từ máy ảnh, và ảnh RAW không có phần hiệu chỉnh ống kính như trên macOS; bảng ở mục Tính năng liệt kê đủ mọi khác biệt. Ứng dụng miễn phí, không quảng cáo, không cần tài khoản, không mua thêm trong ứng dụng, và mã nguồn công khai theo giấy phép GPL-3.0, ai cũng có thể kiểm tra ứng dụng làm gì."
  tabs_title: "Chỉnh ảnh như lướt web"
  tabs_lead: "Mỗi thư mục bạn mở trở thành một tab trong cùng một không gian làm việc, nên một chuyến đi nằm rải trên nhiều thẻ nhớ và điện thoại vẫn gọn ở một chỗ."
  tabs_row_title: "Thư mục là tab, ô tích đi theo bạn"
  tabs_text: "Bấm một thư mục để chỉ làm việc với thư mục đó, hoặc Tất cả ảnh để xem hết. Tích ảnh ở thư mục này, chuyển sang thư mục khác rồi tích tiếp: thanh chọn đếm tất cả, nên ảnh đẹp nhất của mọi thư mục vào giỏ in chỉ với một lần bấm. Tích nhiều thư mục để xuất chung hoặc mỗi thư mục một nơi, và đóng tab bằng dấu × khi xong việc; ảnh vẫn nằm nguyên trên ổ đĩa."
  show_tabs: "Ba thư mục là ba tab: ảnh đã tích ở hai thư mục, và nút đóng trên một tab"
  modes_title: "Ba chế độ, ba việc"
  modes_lead: "Chọn chế độ theo việc bạn cần làm, ở đầu thanh bên hoặc bằng Cmd/Ctrl+1, 2, 3. Ảnh, giỏ in và thiết lập của bạn giữ nguyên ở mọi chế độ."
  mode_simple: "Đơn giản"
  mode_simple_for: "Đi chơi về và muốn in ảnh thật nhanh."
  mode_simple_s1: "Thả thư mục ảnh vào app."
  mode_simple_s2: "Phím lên giữ ảnh, phím xuống bỏ ảnh sang Để riêng."
  mode_simple_s3: "Chọn khổ in và dấu ngày, rồi bấm Xuất."
  mode_collage: "Ghép ảnh"
  mode_collage_for: "Hai ảnh trên một tấm in cho rẻ một nửa, hoặc làm bưu thiếp."
  mode_collage_s1: "Cho những ảnh muốn in vào giỏ in."
  mode_collage_s2: "Ảnh được ghép hai tấm một; kéo một ảnh để đổi chỗ."
  mode_collage_s3: "Bật Bưu thiếp nếu muốn gửi qua bưu điện, rồi bấm Xuất."
  mode_pro: "Pro"
  mode_pro_for: "Hàng trăm ảnh, cần chọn và chỉnh kỹ."
  mode_pro_s1: "Gắn sao, cờ, và chọn tấm nét nhất trong mỗi loạt chụp."
  mode_pro_s2: "Cắt, xoay thẳng, dấu ngày và khung thông tin."
  mode_pro_s3: "Xuất để in ở kiosk, hoặc bản nhẹ để chia sẻ."
  modes_manual: "Hướng dẫn đầy đủ"
  postcard_title: "Bưu thiếp từ chính ảnh của bạn"
  postcard_text: "Trong chế độ Ghép ảnh, một công tắc biến mỗi tấm in thành bưu thiếp: ảnh của bạn ở một nửa, nửa kia là ô dán tem nét đứt và dòng kẻ để viết lời nhắn hoặc địa chỉ. Gõ chữ, in bằng font máy đánh chữ, hoặc viết tay bằng bút dạ dầu nét mảnh. Tấm 10 × 15 nằm trong khổ bưu thiếp mà Deutsche Post nhận."
  show_postcard: "Chế độ Ghép ảnh khi bật Bưu thiếp: mỗi tấm in có một ảnh và mặt sau bưu thiếp"
  postcard_coming: Mới trong v0.9.4
  pc_title: "Gửi về nhà một tấm bưu thiếp từ chính chuyến đi"
  pc_lead: "Không phải tấm bưu thiếp cây cầu bán ở tiệm, mà là chuyến tram bạn đã đứng chờ. Fotollection biến bất kỳ tấm ảnh in nào ở máy in ảnh thành bưu thiếp gửi được qua bưu điện."
  pc_s1: "Bật Bưu thiếp trong chế độ Ghép ảnh: mỗi ảnh thành một tấm riêng, cầm ngang hoặc dọc."
  pc_s2: "Gõ lời nhắn và địa chỉ, hoặc để trống dòng kẻ để tự viết tay."
  pc_s3: "In ở dm hoặc Rossmann như mọi ảnh khác, dán tem và gửi đi."
  pc_type_title: "Gõ chữ, hoặc viết tay"
  pc_type_text: "Lời nhắn và địa chỉ có dòng riêng, chỉnh được đậm, nghiêng, gạch chân, bằng font máy đánh chữ hoặc font của bạn. Font có đủ chữ cái của các tiếng châu Âu viết bằng chữ Latin, nên một địa chỉ ở Praha hay Kraków in ra đúng như khi gõ. Chọn màu mực đen, xanh, nâu sepia hoặc đỏ, và thêm một dòng ghi công nhỏ ở chân tấm. Nửa ảnh chỉnh như trong chế độ Ghép ảnh: có viền trắng bao quanh, hoặc ảnh phủ kín tới mép."
  pc_pens: "Viết lên giấy ảnh? Dùng bút dạ dầu nét mảnh, thử ở ô tem trước và để khô khoảng một phút: bút bi và bút gel dễ mất nét hoặc bị lem."
  show_postcard_text: "Xem trước một bưu thiếp: chuyến tram đêm phủ kín nửa ảnh, không viền, bên cạnh là \"Ahoj Praha!\" và địa chỉ"
  collage_title: "Hai ảnh trên một tấm in"
  collage_text: "Lấy cảm hứng từ máy ảnh film half-frame: một tấm 10 × 15 chứa hai ảnh 10 × 7,5, nên in cả bộ chỉ tốn một nửa. Ảnh được ghép theo thứ tự, kéo-thả để đổi chỗ, và app gợi ý cỡ ảnh có chừa viền trắng, 6 × 9 cm cho ảnh 2:3. Một đường cắt mảnh chia tấm làm đôi, hoặc tắt đi để giữ dải half-frame liền nhau."
  show_collage: "Chế độ Ghép ảnh: các tấm đúng như khi in, cùng tỷ lệ ảnh, cỡ gợi ý và đường cắt"
  collage_preview_title: "Xem tấm in trước khi in"
  collage_preview_text: "Mở một tấm như mở một ảnh: tấm in hiện lớn, đúng như máy in ở kiosk sẽ làm ra, hai ảnh cạnh nhau cùng dấu ngày và viền. Chọn ảnh nào bằng phím 1 hoặc 2 để cắt hoặc xoay, và dùng phím mũi tên để xem các tấm khác."
  show_collage_preview: "Xem trước một tấm ghép: chuyến tram đêm và Bảo tàng Quốc gia Praha trên một tấm in 10 × 15"
  simple_title: "Đơn giản: giữ hay bỏ, rồi in"
  simple_text: "Từng ảnh một, đúng như khi in. Phím lên để giữ, phím xuống để bỏ, và ảnh kế tiếp hiện ra ngay. Chọn khổ và dấu ngày, rồi xuất những ảnh đã giữ."
  show_simple: "Chế độ Đơn giản: ảnh đúng như khi in, nút Giữ và Bỏ, và Xuất những ảnh đã giữ"
  basket_title: "Chọn ảnh để in chỉ với một phím"
  basket_lead: "Một chuyến đi để lại hàng trăm tấm ảnh, nhưng chỉ vài tấm đáng đem in. Fotollection biến việc chọn ấy thành trò chơi thích hay bỏ qua."
  swipe_title: "↑ để in, ↓ để riêng"
  swipe_text: "Mở tấm đầu tiên rồi quyết bằng một phím: ↑ cho ảnh vào giỏ in, ↓ để riêng sang một bên, và tấm kế tiếp đã hiện sẵn. Không ảnh nào bị xoá: giỏ in và chồng ảnh để riêng nằm chờ ở thanh bên, đổi ý lúc nào cũng được."
  show_swipe: "Một tấm ảnh đã vào giỏ in, cùng các phím để lướt tiếp"
  select_title: "Hoặc tích chọn ngay trong lưới ảnh"
  select_text: "Nút Chọn biến cả lưới ảnh thành ô tích như trên iPhone, Shift+click để chọn cả một dải. Giữ Space trên một ảnh để xem to, đúng như khi in ra, rồi thả tay là chọn tiếp."
  show_select: "Chế độ Chọn: ảnh đã tích, giỏ in và chồng ảnh để riêng"
  estimate_title: "Biết trước dung lượng trước khi xuất"
  estimate_text: "Thẻ Xuất ảnh cho biết tệp sẽ nặng bao nhiêu trước khi ghi ra ổ đĩa, tính từ vài ảnh mã hoá thử với đúng thiết lập của bạn. Ảnh máy ảnh xuất cho Facebook nhẹ đi khoảng sáu lần, và bạn thấy trước khi bấm."
  show_estimate: "Ô ước tính dung lượng ngay trên nút xuất ảnh, khi xuất cho Facebook"
  key_up: "giỏ in"
  key_down: "để riêng"
