  show_crop: Straightening a horizon in the crop editor
  show_groups: Similar shots grouped, the best one suggested
  faq_title: "Questions before you download"
  faq_lead: "Why another photo app, and what makes this one different."
  faq_groups:
    - label: "Why Fotollection"
      items:
        - q: "Why not just use Lightroom?"
          a: "Lightroom, the built-in Photos apps and IrfanView are made for editing and viewing; none of them is designed for a photo printer. To print with them, you crop every photo to the paper's ratio yourself, or hand the files over and let the shop's machine or staff crop them, which often cuts off a head or the edge of a sign. Fotollection starts from the print: it knows the sizes at dm and Rossmann, crops each photo to them so what you see is exactly what comes out, warns when a photo is too small, stamps the date like a film camera and exports files the kiosk takes. It is light and fast, free, and works next to Lightroom: your originals are never changed."
        - q: "My computer already has Photos, or I use IrfanView. Why another app?"
          a: "The built-in Photos apps and IrfanView are great viewers, each on its own system. None of them knows the size of a 10 × 15 print at dm or Rossmann, warns you when a photo is too small for it, stamps the date like a film camera, or sends the best shots of five folders to one print basket. Fotollection does, it looks and works the same on a Mac and on Windows, and it can be the viewer you open photos with: right-click a photo, Open with, Fotollection, camera RAW included."
    - label: "Speed and weight"
      items:
        - q: "Is it heavy? Will it run on my older laptop?"
          a: "It is small: the Windows installer is 13.7 MB, because the window uses the web view the system already has instead of shipping a whole browser. The core is written in Rust and runs directly on your computer. A preview is never larger than 1600 px, so even a 32 MP photo opens as fast as a small one, and the full-size image is loaded only when you zoom in. Even exporting 5,035 photos, memory peaks at about 1.45 GB."
        - q: "How fast is it with thousands of photos?"
          a: "Opening 1,000 photos takes about 0.12 s, because Fotollection reads each file's small built-in thumbnail first. Changing a setting redraws the preview in 17 ms, export runs at 18 full-size photos per second, and after the first launch the app opens in about 0.4 s. Every number was measured on an ordinary laptop, and the Performance page explains how to measure them yourself."
    - label: "Platforms and cost"
      items:
        - q: "Does it work on Mac and Windows, and is it really free?"
          a: "Yes. One download for macOS 11 or later, on Apple silicon and Intel alike, and one for Windows 10 and 11. It is free with no ads, no account and no in-app purchases, and the source code is public under GPL-3.0, so anyone can check what it does."
  tabs_title: "Work like browsing the web"
  tabs_lead: "Every folder you open becomes a tab in the same workspace, so a trip spread over several memory cards and phones stays in one place."
  tabs_row_title: "Folders as tabs, ticks that follow you"
  tabs_text: "Click a folder to work on it alone, or All photos for everything. Tick photos in one folder, switch to another and keep ticking: the bar counts them all, so the best of every folder goes to the print basket in one move. Tick several folders to export them together or each into its own folder, and close a tab with × when you are done; the photos stay on your disk."
  show_tabs: "Three folders as tabs: photos ticked in two of them, and the close button on a tab"
  basket_title: "Choose your prints with one key"
  basket_lead: "A trip leaves hundreds of photos, and only a handful should be printed. Fotollection turns that choice into a game of thumbs up and thumbs down."
  swipe_title: "↑ to print, ↓ to set aside"
  swipe_text: "Open the first photo and decide with one key: ↑ puts it in the print basket, ↓ puts it aside, and the next photo is already on screen. Nothing is ever deleted: the basket and the set-aside pile wait in the sidebar, so you can change your mind."
  show_swipe: "A photo in the print basket, with the keys to keep going"
  select_title: "Or tick them in the gallery"
  select_text: "Select turns the grid into tick boxes, like on an iPhone, with Shift-click for a whole run. Hold Space over a photo to see it large, exactly as it will print, then let go and carry on."
  show_select: "Select mode: ticked photos, the print basket and the set-aside pile"
  estimate_title: "Know the size before you export"
  estimate_text: "The export card tells you how heavy the files will be before anything is written, from a few photos encoded with your settings. Camera photos shared for Facebook come out about six times lighter, and you see it before you click."
  show_estimate: "The size estimate above the export button, sharing for Facebook"
