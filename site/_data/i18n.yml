  story_title: The story
  story_kicker: A diary
  story_description: "The story behind Fotollection: twenty years of photos never looked at again, a winter of looking back, and the first kilometres of a marathon to turn memories back into prints."
  story_lead: "Why Fotollection exists, and how it found its own way: a diary of the first kilometres, told from the project's notes and the history of its code."
  footer_story: The story
  man_title: Manual
  man_kicker: Help
  man_description: "How to use Fotollection, step by step, with a screenshot of each step: choosing the photos to print, zoom, RAW, camera clocks, dates and places, shooting with a camera connected, and every shortcut."
  man_lead: "Every step, as the app shows it. The manual follows the app: when a version changes something you can see, this page changes with it."
  man_toc: Chapters
  man_source: This manual on GitHub
  cs_title: Code signing policy
  cs_kicker: Trust
  cs_description: "How Fotollection's installers are built and published, who approves each release, and what the app does and does not send over the network."
  cs_lead: "The installers are not signed with a certificate yet: Windows shows a SmartScreen warning on the first launch, macOS builds carry an ad-hoc signature only, and the Linux AppImage and .deb are unsigned too. Every release lists SHA-256 checksums in SHA256SUMS.txt, so you can check that a download is the one published here. The APT repository at fotollection.org/apt is signed with the project's GPG key, so apt checks every package it installs from it."
  cs_parts:
    - id: team
      title: Team roles
      lead: "Every installer is built by GitHub Actions from the public repository, from a tagged release; nothing built on a personal computer is published. The build workflow is"
      items:
        - title: Committers and reviewers
          author: true
          text: Writes and reviews every change to the source code.
        - title: Release approver
          author: true
          text: Checks and publishes every release by hand.
    - id: privacy
      title: Privacy policy
      lead: "This program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it."
      items:
        - title: Works offline
          text: "Photos, folders, projects and settings never leave your computer. There is no account, no telemetry and no crash upload."
        - title: Check for updates, only on click
          text: "The only network request: it asks GitHub (api.github.com) for this project's latest release. GitHub's privacy statement applies to it."
        - title: No location in exports
          text: GPS coordinates are removed from exported photos by default.
        - title: This website
          text: "The website, not the app, counts visits and clicks on its download links with Google Analytics; Google's privacy policy applies to it. The download count comes from GitHub."
    - id: system
      title: Changes to your system
      lead: Installing adds only what the app needs, and uninstalling removes it.
      items:
        - title: Open with
          text: "The installer, and on Linux the .deb, adds Fotollection to the Open with menu for photo files. It never makes itself the default app."
        - title: Uninstall
          text: "Remove it from Windows Settings, or delete the app on macOS. The Windows uninstaller also removes the Open with entries. On Linux, run sudo apt remove fotollection, or delete the AppImage, or run the install script with --uninstall, which also removes the APT repository and its key. Settings and projects stay in your home folder."
  footer_signing: Code signing policy
  perf_title: "Performance"
  perf_description: "Every measurement behind Fotollection, explained in plain words: speed, memory, print quality, photos for social media and best-shot suggestions, with what ΔE, SSIM, JPEG and colour profiles mean."
  perf_kicker: "Measured, not promised"
  perf_lead: "Every number on this page comes from real photos on an ordinary laptop (Apple M3, 16 GB), and the scripts that produced them are in the repository, so anyone can run them again. Below each chart is what it means for your prints, and at the end, the words behind the numbers."
  perf_speed_title: "Speed: a thousand photos in a blink"
  perf_speed_text: "Opening a folder reads each photo's EXIF and its small embedded thumbnail, not the whole image: 1,000 photos take 0.12 seconds, eight times under the budget we set before writing the code. Changing a setting re-renders the preview in 17 ms, faster than a screen refreshes twice. Export runs at 18 photos per second at full 16 MP quality. Native Rust also beats a web browser doing the same job: the same speed for export, a faster preview, and a quarter less memory. Camera RAW works the same way: thumbnails come from the preview stored in each RAW file in 9 to 80 ms, and only the print preview develops the full photo, in about a second."
  perf_memory_title: "Memory: 5,035 photos, and it stays flat"
  perf_memory_text: "A trip can mean thousands of photos. Fotollection keeps only a few bytes per photo in memory, writes thumbnails to a disk cache and works on only as many full-size images at a time as fit its memory budget. With 53 times more photos, peak memory grows by 0.1 GB: 1.35 GB for 95 photos, 1.45 GB for 5,035, under the 2 GB ceiling. Larger photos need more: a real folder of 20 MP files peaks at 1.31 GB (above)."
  perf_print_title: "Print quality: the print looks like the photo"
  perf_print_text: "Prints made through a web editor often look flat. We measured why: the editor drops the colour profile (13 % of the saturation of iPhone photos lost), shrinks the photo to 2,000 px and lets the lab blow it up again (87 % of the fine detail lost), and saves at quality 80 with halved colour resolution. Fotollection keeps the profile, exports at full resolution in 4:4:4 at quality 95, and its colour error stays at 0.19, far below the 1 where an eye starts to notice."
  perf_share_title: "Photos for Facebook and Instagram: light, and still the photo"
  perf_share_text: "Facebook shrinks every photo to 2,048 px and recompresses it, and it ignores colour profiles. The Share export does that work properly first: the photo is converted to sRGB, resized with a high-quality filter, lightly sharpened and saved at a size Facebook does not touch again. After Facebook's own recompression, the result stays closer to the photo than the usual way, and iPhone-style Display P3 photos keep 99.6 % of their colour instead of 86 %. The Original size option keeps every pixel at half the file, with a colour error under 1."
  chart_raw: "Camera RAW: from the file to the screen, per camera and against Adobe DNG Converter"
  perf_raw_title: "Camera RAW: open it as it is"
  perf_raw_text: "Fotollection opens RAW files from nine common cameras without converting them first. The thumbnail comes from the preview the camera stores in the file, in 9 to 32 ms. The full picture for the print preview and the export takes 0.4 to 2.2 s, 0.9 s for the median camera. Adobe DNG Converter, by comparison, takes about 1.2 to 1.8 s per file only to turn one RAW file into another, before anything can be seen or printed. Measured on macOS. On Windows and Linux, RAW opens through the reader built into Fotollection, with nothing to install."
  perf_raw_fn: [13]
  perf_best_title: "Best-shot suggestions: checked against a person's choice"
  perf_best_text: "We sorted 95 real photos by hand into 22 moments, and picked the best photo where there was a clear one. Fotollection finds 15 of those moments without ever grouping two different ones, and its suggestion is acceptable in all six moments with a clear best. Each photo takes 17 ms to analyse, 28 ms when it has faces."
  perf_explain_title: "The words behind the numbers"
  perf_explain_lead: "Photo and print jargon, explained the way we would explain it to a friend."
  perf_faq:
    - q: "What is ΔE (Delta E)?"
      fn: [6]
      a: "ΔE measures how far apart two colours look to a human eye, computed in a colour space built to match how we see (CIELAB, with the 2000 formula). 0 means identical. Around 1 is the smallest difference a trained eye can spot side by side; 2 to 3 is visible to most people; above 5 the colours look different. Fotollection's print export averages 0.19."
    - q: "What is SSIM?"
      fn: [7]
      a: "SSIM, the structural similarity index, compares the shapes and textures of two images rather than single pixels, which is closer to how we notice blur or blocky compression. 1 means identical. Above about 0.98, most people cannot tell the two apart without zooming in."
    - q: "How many colours can a JPEG hold?"
      fn: [8]
      a: "A JPEG stores 8 bits for each of red, green and blue: 256 levels each, about 16.7 million colours. That is also what photo labs print from. Camera RAW files hold 12 to 14 bits and recent iPhones can save 10-bit HEIC, which helps when editing; for a finished print, a well-made 8-bit JPEG shows no steps between tones."
    - q: "JPG or JPEG? And should I use PNG?"
      a: "JPG and JPEG are the same format: old Windows only allowed three-letter extensions. PNG is lossless, so nothing is ever thrown away, but a photo saved as PNG is often three to five times larger, and most kiosks and labs expect JPEG. A JPEG at quality 95 with full colour resolution (4:4:4), as Fotollection exports for print, is indistinguishable from the original on paper."
    - q: "What do 4:4:4 and 4:2:0 mean?"
      a: "Our eyes see detail mostly in brightness, less in colour, so JPEG can store colour at lower resolution. 4:4:4 keeps full colour resolution; 4:2:0 keeps a quarter of it, which makes files smaller but softens coloured edges, such as red text or a blue sky behind leaves. Prints deserve 4:4:4; social media recompresses everything to 4:2:0 anyway."
    - q: "sRGB, Display P3, Adobe RGB and colour profiles"
      fn: [9, 10, 11]
      a: "A colour profile tells software what the numbers in a file mean. sRGB is the classic range of colours used on the web. Display P3, used by iPhones and recent cameras, reaches about 25 % more colours, especially reds and greens. If a P3 photo loses its profile, its numbers are read as sRGB and it looks washed out: that is the 13 % saturation loss we measured. Adobe RGB, which some cameras offer for print work, is wider than sRGB too, mostly in greens and cyans. Fotollection keeps whichever profile a photo has for prints and converts properly to sRGB for social media."
    - q: "What DPI does a print need?"
      a: "DPI is how many pixels land on each inch of paper. At 300 DPI a print looks sharp even up close; 150 to 200 DPI is fine at arm's length. A 10 × 15 cm print at 300 DPI needs 1,800 × 1,200 pixels, so any phone or camera photo is enough; the size advice in the app tells you how large each photo can go."
    - q: "Why do photos look worse on Facebook?"
      a: "Facebook resizes every photo to at most 2,048 px, recompresses it at a lower quality with halved colour resolution, and drops colour profiles. A photo that arrives too large is resized twice, once by you and once by Facebook. Sending it already at 2,048 px, in sRGB and lightly sharpened, means Facebook only recompresses it once, and the colours are already right."
  perf_repro_title: "Run the measurements yourself"
  perf_repro_text: "Everything is reproducible on your own photos. The scripts never upload or copy a photo; only numbers are kept. The full tables, with every run, are in RESULT.md."
  perf_repro_link: "Read RESULT.md on GitHub"
  perf_back: "Back to the home page"
  install_title: Install in a minute
  install_lead: The installers are not signed with a paid certificate yet, so the first launch needs one extra click.
  mac_title: macOS
  mac_1: Open the .dmg and drag Fotollection to Applications.
  mac_2: Open it. macOS blocks the first launch.
  mac_3: In System Settings → Privacy & Security, click Open Anyway.
  win_title: Windows
  win_1: Run the -setup.exe (or the .msi).
  win_2: If SmartScreen says "Windows protected your PC", click More info.
  win_3: Click Run anyway.
  linux_title: Linux
  linux_soon: "If the download links are missing, the release page has every file."
  linux_script_title: One command
  linux_script_text: "Picks the right package for your system: Ubuntu, Debian and Mint get the APT repository, other distributions the AppImage in ~/.local. To remove it:"
  linux_apt_title: Or add the APT repository
  linux_apt_text: "For Ubuntu, Debian, Mint and the rest of that family. Updates then come with"
  linux_appimage_title: Or run the AppImage
  linux_appimage_text: "Download it, make it executable and start it. On ARM, the file ends in _aarch64."
  linux_files: "The files"
  linux_appimage_x64: AppImage, x86_64
  linux_appimage_arm: AppImage, ARM64
  linux_deb_x64: .deb, amd64
  linux_deb_arm: .deb, arm64
  linux_which: Which distributions?
  distro_title: Which Linux distributions
  distro_lead: "Fotollection runs on 64-bit Linux, x86_64 or ARM64, with glibc 2.35 or later."
  distro_groups:
    - title: Works
      items:
        - text: "AppImage: Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Pop!_OS 22.04+, elementary OS 7+, Zorin OS 17+, Fedora 36+, openSUSE Tumbleweed, Arch, Manjaro and others of that age."
        - text: ".deb and the APT repository: Ubuntu, Debian, Mint, Pop!_OS, elementary OS and Zorin OS."
    - title: Works with a step
      items:
        - text: "Ubuntu 24.04 and newer: the AppImage needs FUSE 2 once,"
          code: sudo apt install libfuse2t64
          after: ", or run it with"
          code2: "--appimage-extract-and-run"
          after2: ". The .deb needs nothing."
        - text: "NixOS: start it through"
          code: appimage-run
        - text: "Fedora Silverblue and other immutable systems: use the AppImage."
        - text: "NVIDIA graphics: nothing to do, the app avoids WebKit's blank-window issue by itself."
          fn: 21
    - title: Does not run
      items:
        - text: "glibc older than 2.35: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky or Alma 8, openSUSE Leap 15."
        - text: "musl systems such as Alpine."
        - text: "32-bit machines."
        - text: "ChromeOS without its Linux container."
    - title: Limits on every distribution
      items:
        - text: "No HEIC (iPhone) photos yet: convert them to JPEG first."
          fn: 16
        - text: "No shooting with a camera over USB."
        - text: "RAW opens without the lens corrections macOS adds."
          fn: 14
