  install_title: Cài đặt trong một phút
  install_lead: Bộ cài chưa được ký bằng chứng chỉ trả phí, nên lần mở đầu tiên cần thêm một cú nhấp.
  mac_title: macOS
  mac_1: Mở tệp .dmg và kéo Fotollection vào Applications.
  mac_2: Mở ứng dụng. macOS sẽ chặn lần mở đầu tiên.
  mac_3: Vào System Settings → Privacy & Security, bấm Open Anyway.
  win_title: Windows
  win_1: Chạy tệp -setup.exe (hoặc .msi).
  win_2: Nếu SmartScreen báo "Windows protected your PC", bấm More info.
  win_3: Bấm Run anyway.
  linux_title: Linux
  linux_soon: "Nếu thiếu liên kết tải về, trang phát hành có đủ mọi tệp."
  linux_script_title: Một lệnh là xong
  linux_script_text: "Tự chọn gói hợp với máy bạn: Ubuntu, Debian và Mint dùng kho APT, các distro khác dùng AppImage đặt trong ~/.local. Muốn gỡ:"
  linux_apt_title: Hoặc thêm kho APT
  linux_apt_text: "Cho Ubuntu, Debian, Mint và các distro cùng họ. Sau đó, bản mới về cùng lệnh"
