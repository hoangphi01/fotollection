  title: Fotollection - ảnh sẵn sàng để in, không cần internet
  description: Ứng dụng máy tính miễn phí, mã nguồn mở, chuẩn bị ảnh để in ngay trên máy của bạn. Dấu ngày kiểu máy film, khung thông tin máy ảnh, gợi ý ảnh đẹp nhất, cắt đúng khổ in và xuất giữ nguyên chất lượng gốc, không cần tài khoản, không tải ảnh lên đâu cả.
  nav_features: Tính năng
  nav_quality: Chất lượng
  nav_download: Tải về
  nav_coffee: Cà phê
  nav_manual: Hướng dẫn
