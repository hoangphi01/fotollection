  changelog_latest: Bản phát hành mới nhất
  changelog_full: Changelog đầy đủ trên GitHub
  changelog_hint: Bấm để cuộn
  support_title: Ủng hộ một cốc cà phê
  support_text: Fotollection do một du học sinh Việt ở châu Âu làm trong thời gian rảnh, giữa giờ học và giờ làm thêm. Ứng dụng miễn phí và mã nguồn mở; nếu nó giúp bạn đỡ được một buổi tối ngồi lọc ảnh, một cốc cà phê (hay một bữa cơm sinh viên 😄) sẽ giúp mình tiếp tục làm.
  support_sponsor: Tài trợ qua GitHub
  support_note: Ở bất kỳ nước nào, GitHub Sponsors nhận thẻ, hằng tháng hoặc một lần. Mã VietQR chỉ dùng được với ứng dụng ngân hàng tại Việt Nam (Napas 247).
  support_alt: Mã VietQR ủng hộ cà phê (Techcombank)
  kiosk_title: Sẵn sàng cho máy in ảnh ở
  kiosk_and: và
  kiosk_lead: Dịch vụ in ảnh của dm và Rossmann đều do CEWE thực hiện. Fotollection có sẵn mọi khổ trong bảng giá của họ, nên khung cắt bạn thấy chính là ảnh máy in trả ra, không bị xén mép bất ngờ.
  kiosk_standard: Tiêu chuẩn
  kiosk_square: Vuông
  kiosk_strip: Dải dài
  kiosk_more: Giữ tỉ lệ gốc (không cắt) và mọi khổ tùy chỉnh, theo cm hoặc inch
  kiosk_steps_title: Từ chuyến đi đến xấp ảnh in
  kiosk_s1: Chọn ảnh đẹp nhất và chọn khổ in.
  kiosk_s2: Xuất ra một thư mục, USB hoặc thẻ SD.
  kiosk_s3: In ngay tại máy trong cửa hàng, hoặc tải lên dịch vụ in trực tuyến của cửa hàng.
  fn_title: Chú thích
  fn_label: Chú thích
  fn_back: Quay lại đoạn văn
  fn_open: Miễn phí là không thu tiền, không quảng cáo, không mua thêm trong ứng dụng; mời tác giả một ly cà phê là lựa chọn của bạn, để tác giả có thêm động lực phát triển và hoàn thiện Fotollection. Mã nguồn mở là toàn bộ mã nguồn được công khai trên GitHub theo giấy phép GPL-3.0, ai cũng có thể đọc, tự xây dựng và kiểm tra ứng dụng làm gì. Không cần tài khoản là ứng dụng không bao giờ hỏi bạn là ai và không có gì để đăng nhập.
  perf_speed_fn: [4, 5]
  fn_rust: "Rust và logo Rust là nhãn hiệu của Rust Foundation. Phần lõi của Fotollection viết bằng Rust và chạy trực tiếp trên máy của bạn."
  fn_webview: "Cửa sổ ứng dụng được làm bằng Tauri và hiển thị bằng trình hiển thị web (web view) có sẵn của hệ điều hành: WebKit (WKWebView) trên macOS và Microsoft Edge WebView2 trên Windows. Tauri là dự án của Tauri Programme thuộc Commons Conservancy; WebKit là nhãn hiệu của Apple Inc.; Microsoft Edge và WebView2 là nhãn hiệu của Microsoft Corporation. Phép so sánh với trình duyệt chạy cùng một việc trong Chromium 156 không giao diện, dự án mã nguồn mở phía sau Google Chrome, mỗi nhân xử lý một Web Worker."
  fn_de: "ΔE2000 (CIEDE2000) là công thức tính sai lệch màu của Uỷ ban Quốc tế về Chiếu sáng (CIE), được chuẩn hoá thành ISO/CIE 11664-6; không gian màu CIELAB mà công thức dùng là ISO/CIE 11664-4."
  fn_ssim: "SSIM do Zhou Wang, Alan C. Bovik, Hamid R. Sheikh và Eero P. Simoncelli giới thiệu trong bài Image quality assessment: from error visibility to structural similarity, IEEE Transactions on Image Processing, 13(4), 2004."
  fn_jpeg: "JPEG là định dạng ảnh của nhóm Joint Photographic Experts Group, được chuẩn hoá thành ISO/IEC 10918-1 và ITU-T T.81."
  fn_srgb: "sRGB do HP và Microsoft tạo ra năm 1996, được chuẩn hoá thành IEC 61966-2-1."
  fn_p3: "Display P3 là không gian màu do Apple Inc. định nghĩa, dựa trên không gian màu DCI-P3 của ngành điện ảnh (SMPTE)."
  fn_adobe: "Adobe RGB (1998) là không gian màu do Adobe Inc. đặc tả; Adobe là nhãn hiệu đã đăng ký của Adobe Inc."
  fn_charts: "Mọi biểu đồ: số liệu mang tính tham khảo, đo trên một máy tính xách tay bình thường (Apple M3, 16 GB), và phụ thuộc vào cấu hình máy tính bạn sử dụng."
  fn_dng: "Chúng tôi không chạy Adobe DNG Converter cho trang này. Con số là ước tính của bên thứ ba (1.000 tệp CR3 trong 20–30 phút trên máy hiện đại, không nói rõ máy), theo bài viết về chuyển hàng loạt RAW sang DNG trên blog của convertintomp4.com. Adobe là nhãn hiệu đã đăng ký của Adobe Inc."
  fn_dm: dm và logo dm là thương hiệu của dm-drogerie markt GmbH + Co. KG.
  fn_rossmann: ROSSMANN và logo ROSSMANN là thương hiệu của Dirk Rossmann GmbH.
  fn_cewe: Dịch vụ in ảnh của dm và Rossmann do CEWE thực hiện; CEWE là thương hiệu của CEWE Stiftung & Co. KGaA. Khổ in được đối chiếu với bảng giá của dm vào tháng 10/2026; cửa hàng có thể thay đổi.
  fn_photos: "Ảnh demo trong các ảnh chụp màn hình thuộc phạm vi công cộng (CC0) trên Wikimedia Commons, của Dktue (18 ảnh), Pierre Blaché from Paris, France (3 ảnh) và Kate Branch (1 ảnh). Chú mèo trong ảnh chụp màn hình phần giỏ in và ảnh đẹp nhất do @hoangphi01 chụp bằng Lumix GX9, giữ mọi quyền; các bản mờ hơn, rung tay và tối hơn bên cạnh được tạo từ chính tấm ảnh đó, để minh hoạ cách chọn ảnh đẹp nhất."
  fn_photos_link: "Danh sách từng tệp, trang gốc và mã kiểm tra."
  fn_rawsamples: "Các số đo RAW dùng chín tệp mẫu thuộc phạm vi công cộng (CC0) từ raw.pixls.us, mỗi định dạng một tệp; scripts/fetch-raw-samples.py tải về và kiểm tra chúng."
  fn_rawformats: "Các định dạng RAW nhắc đến trên trang này thuộc về hãng máy ảnh đã tạo ra chúng: RW2 (Panasonic Holdings Corporation), CR2 và CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) và ORF (OM Digital Solutions Corporation, trước đây là Olympus). DNG là đặc tả mở do Adobe Inc. công bố. Fotollection đọc các định dạng này qua bộ giải mã có sẵn của macOS và Windows; ứng dụng không do hãng nào trong số này làm ra hay bảo trợ."
  fn_cameras: "Tên và logo máy ảnh trong ảnh chụp màn hình và trong khung thông tin của ứng dụng là thương hiệu của chủ sở hữu, chỉ dùng để cho biết ảnh được chụp bằng máy nào: Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) và Sony (Sony Group Corporation)."
  fn_others: Apple và macOS là thương hiệu của Apple Inc.; Windows của Microsoft Corporation; Facebook và Instagram của Meta Platforms, Inc.; GitHub của GitHub, Inc.; Google Analytics của Google LLC; Lightroom của Adobe Inc.; IrfanView của Irfan Škiljan; VietQR của NAPAS; Wikimedia Commons của Wikimedia Foundation.
  fn_brand: "Tên và logo Fotollection dùng để nhận biết ứng dụng chính thức do @hoangphi01 làm. Bản tải chính thức chỉ có ở fotollection.org và trang phát hành GitHub của dự án. Giấy phép GPL-3.0 cho phép bất kỳ ai chia sẻ hay bán bản sao, có sửa hay không, miễn là giữ nguyên giấy phép này và cung cấp mã nguồn; bản đã sửa hoặc bán lại không được dùng tên hay logo Fotollection theo cách khiến người khác nghĩ đó là ứng dụng chính thức."
  fn_notify: "Bạn muốn phân phối, bán lại hay phát triển tiếp từ Fotollection? Xin hãy báo cho tác giả trước bằng một mục góp ý (issue) trên GitHub (github.com/hoangphi01/fotollection/issues). Ứng dụng miễn phí và được làm trong thời gian rảnh; một lời báo ngắn là cách công bằng để cảm ơn."
  fn_cite: Khi trích dẫn, viết bài, giới thiệu ứng dụng hay dùng ảnh chụp màn hình này, xin ghi nguồn Fotollection và dẫn link về fotollection.org.
  fn_independent: Fotollection là dự án mã nguồn mở độc lập, không liên kết, không được tài trợ hay bảo trợ bởi bất kỳ công ty nào kể trên; mọi thương hiệu khác thuộc về chủ sở hữu của chúng.
  shield: Riêng tư - ảnh không bao giờ rời khỏi máy của bạn
  privacy_title: Ảnh của bạn là của bạn
  privacy_lead: Fotollection được làm để chạy hoàn toàn không cần internet. Không tải lên, không theo dõi, và bạn có thể tự kiểm tra từng dòng mã nguồn.
  p1_title: Không tải lên, không lưu trữ đám mây
  p1_text: Ảnh được đọc và ghi ngay trên ổ đĩa của bạn. Không có máy chủ nào để gửi ảnh tới.
  p2_title: Không tài khoản, không theo dõi
  p2_text: Không cần đăng ký, và ứng dụng không đo lường hay gửi đi bất kỳ dữ liệu sử dụng nào. Ứng dụng không bao giờ tự lên mạng, kể cả để kiểm tra cập nhật.
  p6_title: Không quảng cáo
  p6_text: Không bán gì cho bạn và không ai trả tiền để tiếp cận bạn. Không quảng cáo, không gợi ý được tài trợ, không mua thêm trong ứng dụng, bây giờ và cả sau này.
  p3_title: Địa điểm không cần dịch vụ bản đồ
  p3_text: Tên nơi chụp lấy từ cơ sở dữ liệu bản đồ có sẵn trong ứng dụng, nên GPS của bạn không đến tay bên thứ ba nào.
  p4_title: Xóa GPS khi xuất ảnh
  p4_text: Ảnh xuất ra mặc định được xóa vị trí, nên ảnh gửi tiệm in không để lộ nơi bạn sống.
  p5_title: Mã nguồn mở
  p5_text: Mã nguồn công khai theo giấy phép GPL-3.0. Ai cũng có thể đọc, tự xây dựng và kiểm chứng ứng dụng làm đúng như trang này nói.
  charts_title: Đo thật, không hứa suông
  charts_lead: Mọi con số đều đo trên ảnh thật, bằng một chiếc máy tính xách tay bình thường (Apple M3, 16 GB); chương trình đo nằm ngay trong kho mã nguồn.
  chart_budgets: Tốc độ và RAM, so với ngân sách đặt ra trước khi viết mã nguồn
  chart_quality: Bản xuất giữ lại được bao nhiêu so với ảnh gốc, so với một trình sửa ảnh web thông thường
  chart_bestshot: Gợi ý ảnh đẹp nhất, chấm điểm so với ảnh do người chọn tay
  charts_more: "Xem toàn bộ số đo và giải thích"
  chart_share: "Ảnh đăng Facebook: người xem thấy gì sau khi Facebook nén lại"
  chart_memory: "RAM dùng nhiều nhất khi số ảnh tăng lên 5.035 tấm"
  chart_browser: "Cùng một việc, trên Fotollection và trên trình duyệt web"
  man_title: Hướng dẫn
  man_kicker: Trợ giúp
  man_description: "Cách dùng Fotollection từng bước, mỗi bước kèm ảnh chụp màn hình: chọn ảnh để in, phóng to, ảnh RAW, đồng hồ máy ảnh, ngày và nơi chụp, chụp với máy ảnh cắm vào máy tính, và mọi phím tắt."
  man_lead: "Từng bước, đúng như app hiển thị. Hướng dẫn đi theo app: khi một phiên bản đổi điều bạn nhìn thấy, trang này đổi theo."
  man_toc: Các chương
  man_source: Bản hướng dẫn này trên GitHub
  cs_title: Chính sách ký mã
  cs_kicker: Tin cậy
  cs_description: "Bộ cài Fotollection được xây dựng và phát hành thế nào, ai duyệt mỗi bản phát hành, và ứng dụng gửi gì, không gửi gì qua mạng."
  cs_lead: "Bộ cài chưa được ký bằng chứng chỉ: Windows hiện cảnh báo SmartScreen ở lần mở đầu, và bản macOS chỉ có chữ ký ad-hoc. Mỗi bản phát hành kèm mã SHA-256, để bạn kiểm tra tệp tải về đúng là tệp được phát hành ở đây."
  cs_parts:
    - id: team
      title: Vai trò trong nhóm
      lead: "Mọi bộ cài đều do GitHub Actions xây dựng từ kho mã công khai, từ một bản phát hành có gắn tag; không phát hành bản nào xây dựng trên máy cá nhân. Workflow xây dựng là"
      items:
        - title: Người viết và duyệt mã
          author: true
          text: Viết và duyệt mọi thay đổi trong mã nguồn.
        - title: Người phê duyệt
          author: true
          text: Tự tay kiểm tra và phát hành từng bản.
    - id: privacy
      title: Chính sách riêng tư
      lead: "Ứng dụng này không gửi bất kỳ thông tin nào tới hệ thống mạng khác, trừ khi người dùng, hoặc người cài đặt hay vận hành nó, yêu cầu cụ thể."
      items:
        - title: Chạy offline
          text: "Ảnh, thư mục, dự án và cài đặt không bao giờ rời khỏi máy của bạn. Không tài khoản, không thu thập dữ liệu sử dụng, không gửi báo lỗi."
        - title: Kiểm tra cập nhật, chỉ khi bạn bấm
          text: "Lần lên mạng duy nhất: ứng dụng hỏi GitHub (api.github.com) bản phát hành mới nhất của dự án. Chính sách riêng tư của GitHub áp dụng cho lần hỏi đó."
        - title: Ảnh xuất không có vị trí
          text: Toạ độ GPS được xoá khỏi ảnh xuất theo mặc định.
        - title: Trang web này
          text: "Trang web, không phải ứng dụng, đếm lượt truy cập bằng Google Analytics; chính sách riêng tư của Google áp dụng cho việc đó."
    - id: system
      title: Thay đổi trên máy của bạn
      lead: Cài đặt chỉ thêm những gì ứng dụng cần, và gỡ cài đặt sẽ xoá chúng.
      items:
        - title: Mở bằng
          text: "Bộ cài thêm Fotollection vào menu Mở bằng cho các tệp ảnh. Ứng dụng không bao giờ tự đặt mình làm ứng dụng mặc định."
        - title: Gỡ cài đặt
          text: "Gỡ trong Cài đặt Windows, hoặc xoá ứng dụng trên macOS. Trình gỡ của Windows cũng xoá các mục Mở bằng."
  footer_signing: Chính sách ký mã
  perf_title: "Hiệu năng"
  perf_description: "Mọi số đo phía sau Fotollection, giải thích bằng lời dễ hiểu: tốc độ, RAM, chất lượng in, ảnh đăng mạng xã hội, gợi ý ảnh đẹp nhất, kèm ý nghĩa của ΔE, SSIM, JPEG và hồ sơ màu."
  perf_kicker: "Đo thật, không hứa suông"
  perf_lead: "Mọi con số trên trang này đều đo trên ảnh thật, bằng một chiếc máy tính xách tay bình thường (Apple M3, 16 GB). Chương trình đo nằm ngay trong kho mã nguồn, ai cũng có thể chạy lại. Dưới mỗi biểu đồ là ý nghĩa của nó với ảnh in của bạn, và cuối trang là giải thích cho các thuật ngữ đứng sau con số."
  perf_speed_title: "Tốc độ: một nghìn ảnh trong chớp mắt"
  perf_speed_text: "Khi mở một thư mục, Fotollection chỉ đọc thông tin EXIF và ảnh thu nhỏ có sẵn trong tệp, chứ không đọc cả ảnh: 1.000 ảnh mất 0,12 giây, nhanh gấp tám lần mức ngân sách đặt ra trước khi viết mã nguồn. Đổi một thiết lập thì bản xem trước vẽ lại trong 17 ms, chưa bằng hai lần màn hình làm tươi. Xuất ảnh đạt 18 ảnh mỗi giây ở chất lượng đầy đủ 16 MP. Rust chạy trực tiếp trên máy cũng hơn trình duyệt web làm cùng việc: xuất ảnh nhanh ngang, xem trước nhanh hơn và tốn ít hơn một phần tư RAM. Ảnh RAW cũng vậy: ảnh thu nhỏ lấy từ bản xem trước lưu sẵn trong mỗi tệp RAW, mất 9 đến 80 ms, và chỉ bản xem trước để in mới giải mã đầy đủ ảnh, mất khoảng một giây."
  perf_memory_title: "RAM: 5.035 ảnh vẫn không tăng"
  perf_memory_text: "Một chuyến đi có thể có hàng nghìn ảnh. Fotollection chỉ giữ vài byte cho mỗi ảnh trong RAM, ghi ảnh thu nhỏ ra ổ đĩa và xử lý tối đa sáu ảnh cỡ lớn cùng lúc. Với số ảnh gấp 53 lần, RAM dùng nhiều nhất chỉ tăng 0,1 GB: 1,35 GB với 95 ảnh, 1,45 GB với 5.035 ảnh, dưới xa mức trần 2 GB."
  perf_print_title: "Chất lượng in: ảnh in giống ảnh gốc"
  perf_print_text: "Ảnh in qua trình chỉnh sửa ảnh trên web thường trông nông màu. Chúng tôi đã đo xem vì sao: trình chỉnh sửa đó bỏ mất hồ sơ màu (ảnh iPhone mất 13 % độ bão hoà màu), thu ảnh xuống 2.000 px rồi để tiệm in phóng to lại (mất 87 % chi tiết nhỏ), và lưu ở chất lượng 80 với độ phân giải màu giảm một nửa. Fotollection giữ nguyên hồ sơ màu, xuất ở độ phân giải đầy đủ, 4:4:4, chất lượng 95, và sai lệch màu chỉ 0,19, thấp hơn rất xa mức 1 mà mắt người bắt đầu nhận ra."
  perf_share_title: "Ảnh cho Facebook và Instagram: nhẹ mà vẫn đúng là ảnh của bạn"
  perf_share_text: "Facebook thu mọi ảnh về 2.048 px, nén lại và bỏ qua hồ sơ màu. Kiểu xuất Mạng xã hội làm trước những việc đó cho đúng: chuyển ảnh sang sRGB, thu nhỏ bằng bộ lọc chất lượng cao, làm nét nhẹ và lưu đúng cỡ để Facebook không phải thu nhỏ thêm. Sau khi Facebook nén lại, ảnh vẫn giống ảnh gốc hơn cách làm thông thường, và ảnh Display P3 kiểu iPhone giữ được 99,6 % màu thay vì 86 %. Lựa chọn Giữ cỡ gốc giữ nguyên từng điểm ảnh mà tệp chỉ còn khoảng một nửa, sai lệch màu dưới 1."
  chart_raw: "Ảnh RAW: từ tệp đến màn hình, theo từng máy và so với Adobe DNG Converter"
  perf_raw_title: "Ảnh RAW: mở thẳng, không cần chuyển đổi"
  perf_raw_text: "Fotollection mở tệp RAW của chín dòng máy ảnh phổ biến mà không cần chuyển đổi trước. Ảnh thu nhỏ lấy từ bản xem trước máy ảnh lưu sẵn trong tệp, mất 9 đến 32 ms. Ảnh đầy đủ cho bản xem trước để in và cho bản xuất mất 0,4 đến 2,2 giây, trung vị 0,9 giây. Để so sánh, Adobe DNG Converter mất khoảng 1,2 đến 1,8 giây mỗi tệp chỉ để đổi từ RAW này sang RAW khác, trước khi xem hay in được gì. Đo trên macOS. Trên Windows, hiện vẫn cần cài Raw Image Extension miễn phí của Microsoft; bộ đọc RAW tích hợp sẵn đang được làm."
  perf_raw_fn: [13]
  perf_best_title: "Gợi ý ảnh đẹp nhất: đối chiếu với lựa chọn của người thật"
  perf_best_text: "Chúng tôi tự tay chia 95 ảnh thật thành 22 khoảnh khắc, và chọn ảnh đẹp nhất ở những khoảnh khắc có ảnh đẹp rõ ràng. Fotollection tìm ra 15 khoảnh khắc mà không bao giờ gộp nhầm hai khoảnh khắc khác nhau, và ảnh được gợi ý đều chấp nhận được ở cả sáu khoảnh khắc có ảnh đẹp nhất rõ ràng. Mỗi ảnh được phân tích trong 17 ms, 28 ms nếu có khuôn mặt."
  perf_explain_title: "Giải thích các thuật ngữ"
  perf_explain_lead: "Những từ chuyên môn về ảnh và in ảnh, giải thích như kể cho một người bạn."
  perf_faq:
    - q: "ΔE (Delta E) là gì?"
      fn: [6]
      a: "ΔE đo hai màu trông khác nhau bao nhiêu với mắt người, tính trong một không gian màu được dựng theo cách mắt người cảm nhận (CIELAB, theo công thức năm 2000). 0 là giống hệt. Khoảng 1 là mức khác biệt nhỏ nhất mà một người có mắt tinh nhận ra khi đặt hai màu cạnh nhau; 2 đến 3 thì phần lớn mọi người đều thấy; trên 5 là hai màu khác hẳn. Bản xuất để in của Fotollection có ΔE trung bình 0,19."
    - q: "SSIM là gì?"
      fn: [7]
      a: "SSIM (chỉ số tương đồng cấu trúc) so hình dạng và kết cấu của hai ảnh thay vì từng điểm ảnh riêng lẻ, gần với cách mắt ta nhận ra ảnh bị mờ hay bị nén vỡ khối. 1 là giống hệt. Từ khoảng 0,98 trở lên, đa số người không phân biệt được hai ảnh nếu không phóng to."
    - q: "Một tệp JPEG chứa được bao nhiêu màu?"
      fn: [8]
      a: "JPEG lưu 8 bit cho mỗi kênh đỏ, xanh lá và xanh dương: mỗi kênh 256 mức, tổng cộng khoảng 16,7 triệu màu. Đó cũng là thứ máy in ảnh dùng để in. Tệp RAW của máy ảnh có 12 đến 14 bit, iPhone đời mới có thể lưu HEIC 10 bit, rất có ích khi chỉnh sửa; còn với ảnh in hoàn chỉnh, một tệp JPEG 8 bit làm tốt không lộ vệt chuyển màu."
    - q: "JPG hay JPEG? Có nên dùng PNG không?"
      a: "JPG và JPEG là cùng một định dạng: Windows ngày xưa chỉ cho phép đuôi tệp ba chữ. PNG nén không mất dữ liệu nên không bỏ đi chút nào, nhưng ảnh chụp lưu dạng PNG thường nặng gấp ba đến năm lần, và đa số máy in ảnh, tiệm in đều yêu cầu JPEG. Một tệp JPEG chất lượng 95, đủ độ phân giải màu (4:4:4) như Fotollection xuất để in, in ra không phân biệt được với ảnh gốc."
    - q: "4:4:4 và 4:2:0 nghĩa là gì?"
      a: "Mắt ta nhìn chi tiết chủ yếu qua độ sáng, ít qua màu, nên JPEG có thể lưu màu ở độ phân giải thấp hơn. 4:4:4 giữ đủ độ phân giải màu; 4:2:0 chỉ giữ một phần tư, tệp nhẹ hơn nhưng các viền có màu bị mềm đi, như chữ đỏ hay bầu trời xanh sau tán lá. Ảnh in nên dùng 4:4:4; còn mạng xã hội thì đằng nào cũng nén mọi ảnh về 4:2:0."
    - q: "sRGB, Display P3, Adobe RGB và hồ sơ màu (colour profile)"
      fn: [9, 10, 11]
      a: "Hồ sơ màu (colour profile) cho phần mềm biết các con số trong tệp nghĩa là màu nào. sRGB là dải màu cổ điển dùng trên web. Display P3, dùng trên iPhone và các máy ảnh mới, rộng hơn khoảng 25 %, nhất là màu đỏ và xanh lá. Nếu ảnh P3 bị mất hồ sơ màu, các con số bị đọc như sRGB và ảnh trông nhạt: đó chính là 13 % độ bão hoà bị mất mà chúng tôi đo được. Adobe RGB, có trên một số máy ảnh dành cho in ấn, cũng rộng hơn sRGB, chủ yếu ở màu xanh lá và xanh lơ. Fotollection giữ nguyên hồ sơ màu của ảnh khi xuất để in, và chuyển đúng sang sRGB khi xuất cho mạng xã hội."
    - q: "Ảnh in cần bao nhiêu DPI?"
      a: "DPI là số điểm ảnh trên mỗi inch giấy. Ở 300 DPI, ảnh in trông nét kể cả khi nhìn sát; 150 đến 200 DPI vẫn ổn khi cầm xem. Một ảnh 10 × 15 cm ở 300 DPI cần 1.800 × 1.200 điểm ảnh, nên ảnh từ điện thoại hay máy ảnh nào cũng đủ; phần gợi ý khổ in trong ứng dụng cho biết mỗi ảnh in được to tới đâu."
    - q: "Vì sao ảnh đăng Facebook trông xấu đi?"
      a: "Facebook thu mọi ảnh về tối đa 2.048 px, nén lại ở chất lượng thấp hơn với độ phân giải màu giảm một nửa, và bỏ hồ sơ màu. Ảnh gửi lên quá to sẽ bị thu nhỏ hai lần, một lần bởi bạn và một lần bởi Facebook. Gửi sẵn ảnh 2.048 px, sRGB và đã làm nét nhẹ thì Facebook chỉ nén lại một lần, và màu đã đúng từ trước."
  perf_repro_title: "Tự chạy lại các phép đo"
  perf_repro_text: "Mọi phép đo đều chạy lại được trên ảnh của chính bạn. Các chương trình đo không bao giờ tải ảnh lên hay sao chép ảnh; chỉ giữ lại các con số. Bảng đầy đủ, kèm từng lần chạy, nằm trong RESULT.md."
