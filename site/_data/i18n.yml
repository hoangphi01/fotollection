  linux_deb_arm: .deb, arm64
  linux_which: Chạy trên những distro nào?
  distro_title: Những distro Linux nào chạy được
  distro_lead: "Fotollection chạy trên Linux 64-bit, x86_64 hoặc ARM64, có glibc 2.35 trở lên."
  distro_groups:
    - title: Chạy được
      items:
        - text: "AppImage: Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Pop!_OS 22.04+, elementary OS 7+, Zorin OS 17+, Fedora 36+, openSUSE Tumbleweed, Arch, Manjaro và các distro cùng thời."
        - text: ".deb và kho APT: Ubuntu, Debian, Mint, Pop!_OS, elementary OS và Zorin OS."
    - title: Chạy được, thêm một bước
      items:
        - text: "Ubuntu 24.04 trở lên: AppImage cần FUSE 2, cài một lần"
          code: sudo apt install libfuse2t64
          after: ", hoặc chạy với"
          code2: "--appimage-extract-and-run"
          after2: ". Bản .deb thì không cần gì thêm."
        - text: "NixOS: mở qua"
          code: appimage-run
        - text: "Fedora Silverblue và các hệ bất biến khác: dùng AppImage."
        - text: "Card đồ hoạ NVIDIA: không cần làm gì, ứng dụng tự tránh lỗi cửa sổ trắng của WebKit."
          fn: 21
    - title: Không chạy
      items:
        - text: "glibc cũ hơn 2.35: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky hoặc Alma 8, openSUSE Leap 15."
        - text: "Hệ dùng musl như Alpine."
        - text: "Máy 32-bit."
        - text: "ChromeOS khi chưa bật Linux."
    - title: Giới hạn trên mọi distro
      items:
        - text: "Chưa mở được ảnh HEIC (ảnh iPhone): hãy chuyển sang JPEG trước."
          fn: 16
        - text: "Chưa chụp được qua cáp USB từ máy ảnh."
        - text: "Ảnh RAW không có phần hiệu chỉnh ống kính như trên macOS."
          fn: 14
