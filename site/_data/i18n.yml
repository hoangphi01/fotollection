  faq_title: "Questions before you download"
  faq_lead: "Why another photo app, and what makes this one different."
  faq_groups:
    - label: "Why Fotollection"
      items:
        - q: "Why not just use Lightroom?"
          a: "Lightroom, the built-in Photos apps and IrfanView are made for editing and viewing; none of them is designed for a photo printer. To print with them, you crop every photo to the paper's ratio yourself, or hand the files over and let the shop's machine or staff crop them, which often cuts off a head or the edge of a sign. Fotollection starts from the print: it knows the sizes at dm and Rossmann, crops each photo to them so what you see is exactly what comes out, warns when a photo is too small, stamps the date like a film camera and exports files the kiosk takes. It is light and fast, free, and works next to Lightroom: your originals are never changed, and your Lightroom presets work in it as looks."
        - q: "My computer already has Photos, or I use IrfanView. Why another app?"
          a: "The built-in Photos apps and IrfanView are great viewers, each on its own system. None of them knows the size of a 10 × 15 print at dm or Rossmann, warns you when a photo is too small for it, stamps the date like a film camera, or sends the best shots of five folders to one print basket. Fotollection does, it looks and works the same on a Mac, on Windows and on Linux, and it can be the viewer you open photos with: right-click a photo, Open with, Fotollection, camera RAW included."
    - label: "Speed and weight"
      items:
        - q: "Is it heavy? Will it run on my older laptop?"
          a: "It is small: the Windows installer is about 18 MB, because the window uses the web view the system already has instead of shipping a whole browser. The core is written in Rust and runs directly on your computer. A preview is never larger than 1600 px, so even a 32 MP photo opens as fast as a small one, and the full-size image is loaded only when you zoom in. Even exporting 5,035 photos, memory peaks at about 1.45 GB."
        - q: "How fast is it with thousands of photos?"
          a: "Opening 1,000 photos takes about 0.12 s, because Fotollection reads each file's small built-in thumbnail first. Changing a setting redraws the preview in 17 ms, export runs at 18 full-size photos per second, and after the first launch the app opens in about 0.4 s. Every number was measured on an ordinary laptop, and the Performance page explains how to measure them yourself."
    - label: "Platforms and cost"
      items:
        - q: "Does it work on Mac, Windows and Linux, and is it really free?"
          a: "Yes. One download for macOS 11 or later, on Apple silicon and Intel alike, one for Windows 10 and 11, and for 64-bit Linux an AppImage or a .deb, on Intel/AMD or ARM, for any distribution with glibc 2.35 or later. Linux gets the lean build: no HEIC (iPhone) photos yet, no shooting with a camera over USB, and RAW without the lens corrections macOS adds; the table under Features shows every difference. It is free with no ads, no account and no in-app purchases, and the source code is public under GPL-3.0, so anyone can check what it does."
          fn: [fn_heic, fn_arch, fn_linux_pkg]
  tabs_row_title: "Folders as tabs, ticks that follow you"
  tabs_text: "Click a folder to work on it alone, or the Workspace for every folder at once. Tick photos in one folder, switch to another and keep ticking: the bar counts them all, so the best of every folder goes to the print basket in one move. Tick several folders to export them together or each into its own folder, and close a tab with × when you are done; the photos stay on your disk."
  modes_title: "Three modes, three jobs"
  modes_lead: "Pick the one for what you want to do, at the top of the sidebar or with Cmd/Ctrl+1, 2 and 3. Your photos, print basket and settings stay the same in every mode."
  mode_simple: "Simple"
  mode_simple_for: "Back from a trip, and you want prints fast."
  mode_simple_s1: "Drop a folder of photos onto the app."
  mode_simple_s2: "A number key gives it a look; up keeps it, down sets it aside."
  mode_simple_s3: "Pick the print size and the date stamp, then Export."
  mode_collage: "Collage"
  mode_collage_for: "Two photos on one print for half the cost, or postcards."
  mode_collage_s1: "Put the photos you want in the print basket."
  mode_collage_s2: "They pair two to a print; drag one to swap them."
  mode_collage_s3: "Turn on Postcard to send them by post, then Export."
  mode_pro: "Pro"
  mode_pro_for: "Hundreds of photos, chosen and finished with care."
  mode_pro_s1: "Stars, flags and the sharpest shot of each burst."
  mode_pro_s2: "Crop, straighten, the date stamp and the info frame."
  mode_pro_s3: "Export for the kiosk, or lighter to share online."
  modes_manual: "The full manual"
  postcard_title: "A postcard from your own photo"
  postcard_text: "In Collage mode, one switch turns each print into a postcard: your photo on one half, and on the other a dashed stamp box and lines for a message or an address. Type the text, set in a typewriter face, or write it by hand with a fine permanent marker. A 10 × 15 print is within the postcard sizes Deutsche Post takes."
  pc_type_title: "Typed, or written by hand"
  pc_type_text: "The message and the address each have their own lines, with bold, italic and underline, in a typewriter face or a font of your own. Every letter of the European languages written in Latin script is there, so an address in Praha or Kraków prints as typed. Pick the ink, black, blue, sepia or red, and add a small credit line at the foot. The photo half works as in Collage mode: a white border round it, or the photo filling it to the edge."
  collage_title: "Two photos on one print"
  collage_text: "Inspired by half-frame film cameras: a 10 × 15 print holds two 10 × 7.5 photos, so a set costs half as much. Photos pair in order, a drag swaps them, and the app suggests a size with white round it, 6 × 9 cm for a 2:3 photo. A thin cut line splits the print in two, or leave it off for a half-frame strip."
  show_collage: "Collage mode: sheets as they will print, with the photo ratio, the suggested size and the cut line"
  collage_preview_title: "See the print before it is printed"
  collage_preview_text: "Open a sheet as you open a photo: the print large, exactly as the kiosk will make it, two photos side by side with the date stamp and the border. Choose either photo with 1 or 2 to crop it or turn it, and flip through the other sheets with the arrow keys."
  show_collage_preview: "A sheet's preview: a tram by night and the National Museum in Prague on one 10 × 15 print"
  simple_title: "Simple: keep or drop, then print"
  simple_text: "One photo at a time, as it will print. A number key gives it a look, up keeps it, down drops it, and the next one comes at once. Pick a size and the date stamp, then export what you kept."
  show_simple: "Simple mode: the photo as it will print, Keep and Drop, and Export of the kept photos"
  swipe_title: "↑ to print, ↓ to set aside"
  swipe_text: "Open the first photo and decide with one key: ↑ puts it in the print basket, ↓ puts it aside, and the next photo is already on screen. Nothing is ever deleted: the basket and the set-aside pile wait in the sidebar, so you can change your mind."
  select_title: "Or tick them in the gallery"
  select_text: "Select turns the grid into tick boxes, like on an iPhone, with Shift-click for a whole run. Hold Space over a photo to see it large, exactly as it will print, then let go and carry on."
  estimate_title: "Know the size before you export"
  estimate_text: "The export card tells you how heavy the files will be before anything is written, from a few photos encoded with your settings. Camera photos shared for Facebook come out about six times lighter, and you see it before you click."
