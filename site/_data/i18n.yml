# Every string on the website, in English and Vietnamese. Keys match between the two.
en:
  locale: en_GB
  html_lang: en
  other: vi
  other_label: Tiếng Việt
  title: Fotollection — photos ready to print, fully offline
  description: Free, open-source desktop app that prepares photos for printing on your own computer. Retro date stamp, camera info frame, best-shot suggestions, print-size crops and original-quality export, with no account and no upload.
  nav_features: Features
  nav_quality: Quality
  nav_download: Download
  nav_coffee: Coffee
  to_top: Back to top
  star: Star on GitHub
  badge: Free · Open source · No account
  hero_title_1: Thousands of photos, only looked at
  hero_accent: on the plane
  hero_title_2: " home?"
  hero_lead: No internet up there, and still no idea which ones to keep. Take one real look back with Fotollection — it finds the best shots, stamps the date and gets them ready to print. Automatic, free and fully offline.
  download_mac: Download for macOS
  download_win: Download for Windows
  download_note: macOS 11+ (Apple Silicon and Intel) · Windows 10/11
  latest: Latest version
  no_release: Releases are on GitHub
  shot_grid: The library, culled with stars and picks
  features_title: Everything a print order needs
  features_lead: Made for the evening after a trip, when hundreds of photos need to become a short stack of prints.
  f_stamp_title: Film-style date stamp
  f_stamp_text: The orange LED date of an old film camera, with the town on the same line and your own words below. Set per photo or for all.
  f_frame_title: Camera info frame
  f_frame_text: A clean "Shot on" border with the camera's logo, lens, focal length, aperture, shutter and ISO, straight from EXIF.
  f_best_title: Best-shot suggestions
  f_best_text: Bursts and re-framings are grouped, and the sharpest, steadiest shot with open eyes is suggested, with the reasons.
  f_crop_title: Crops that fit the print
  f_crop_text: Every photo is cropped to the print size with live DPI. Rotate a quarter turn or straighten a horizon by up to 15°.
  f_quality_title: Original quality
  f_quality_text: Full resolution, the colour profile kept, 4:4:4 JPEG. What comes out looks like what went in.
  f_private_title: Private and offline
  f_private_text: No account, no upload, no telemetry. Place names come from a map bundled in the app, and GPS is removed on export.
  show_stamp: Date stamp with the town from the photo's GPS
  show_frame: The "Shot on" info frame with the camera's logo
  show_crop: Straightening a horizon in the crop editor
  show_groups: Similar shots grouped, the best one suggested
  quality_title: The print looks like the photo
  quality_lead: Measured pixel by pixel on real photos, against the export of a typical web editor.
  q1_value: "0.19"
  q1_label: mean colour difference (ΔE2000). Below 1 nobody can see it.
  q2_value: 100 %
  q2_label: of the fine detail kept. A typical web editor keeps 13 %.
  q3_value: 0 bytes
  q3_label: sent anywhere. The app works without a network.
  quality_more: How it was measured
  nav_numbers: Numbers
  nav_privacy: Privacy
  nav_kiosk: Print shops
  nav_changelog: What's new
  changelog_title: What's new
  changelog_lead: Every change, newest first. "Unreleased" is what the next version will bring.
  changelog_latest: Latest release
  changelog_full: Full changelog on GitHub
  changelog_hint: Click to scroll
  support_title: Buy me a coffee
  support_text: Fotollection is made by a Vietnamese student in the EU, between classes and a part-time job. It's free and open source; if it saved you an evening of sorting photos, a coffee (or a student lunch 😄) keeps it going.
  support_note: This VietQR code works only with banking apps in Vietnam (Napas 247). A way to support from abroad is coming soon.
  support_alt: VietQR code for a coffee, Techcombank, Pham Hoang Phi
  kiosk_title: Ready for the photo kiosk at
  kiosk_and: and
  kiosk_lead: The photo services at dm and Rossmann are made by CEWE. Fotollection has every size of their price list built in, so the crop you see is exactly what comes out of the printer, with no surprise trimming at the edges.
  kiosk_standard: Standard
  kiosk_square: Square
  kiosk_strip: Strip
  kiosk_more: Your own ratio (no crop) and any custom size, in cm or inches
  kiosk_steps_title: From trip to prints
  kiosk_s1: Pick the best shots and choose the print size.
  kiosk_s2: Export to a folder, a USB stick or an SD card.
  kiosk_s3: Print at the kiosk in store, or upload to the shop's online service.
  kiosk_note: Fotollection is independent and not affiliated with CEWE, dm or Rossmann; their names and logos are trademarks of their owners, shown only to say where the prints can be made. Sizes checked against dm's price list in October 2026.
  shield: Private — your photos never leave your computer
  privacy_title: Your photos stay yours
  privacy_lead: Fotollection is built to work with no internet at all. Nothing is uploaded, nothing is tracked, and you can check every line of it.
  p1_title: No upload, no cloud
  p1_text: Photos are read and written on your own disk. There is no server to send them to.
  p2_title: No account, no tracking
  p2_text: No sign-up, and the app has no analytics or telemetry. It never goes online by itself, not even to check for updates.
  p3_title: Places without a map service
  p3_text: Town names come from a map database bundled inside the app, so your GPS never reaches a third party.
  p4_title: GPS removed on export
  p4_text: Exported prints have their location stripped by default, so a photo handed to a print lab does not reveal where you live.
  p5_title: Open source
  p5_text: The code is public under GPL-3.0. Anyone can read it, build it and confirm that it does what this page says.
  charts_title: Measured, not promised
  charts_lead: Every number comes from real photos on an ordinary laptop (Apple M3, 16 GB), and the scripts are in the repository.
  chart_budgets: Speed and memory, against the budgets set before the code was written
  chart_quality: What the export keeps of the original, against a typical web editor
  chart_bestshot: Best-shot suggestions, scored against photos sorted by hand
  install_title: Install in a minute
  install_lead: The installers are not signed with a paid certificate yet, so the first launch needs one extra click.
  mac_title: macOS
  mac_1: Open the .dmg and drag Fotollection to Applications.
  mac_2: Open it. macOS blocks the first launch.
  mac_3: In System Settings → Privacy & Security, click Open Anyway.
  win_title: Windows
  win_1: Run the -setup.exe (or the .msi).
  win_2: If SmartScreen says "Windows protected your PC", click More info.
  win_3: Click Run anyway.
  checksums: Every release lists SHA-256 checksums next to the downloads.
  updates: There is no auto-update, so the app never goes online. New versions are announced here and on GitHub.
  footer_tagline: Photos ready to print, fully offline.
  footer_license: GPL-3.0 licence
  footer_changelog: What's new
  footer_source: Source code
  footer_blog: The author's blog
  footer_photos: Demo photos are CC0, from Wikimedia Commons.
  footer_analytics: This website counts visits with Google Analytics; the app does not.
  by: by

