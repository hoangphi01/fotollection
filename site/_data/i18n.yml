    - { v: "19 ms", l: "preview re-render, p95 (budget 50 ms)" }
    - { v: "0.35 s", l: "to develop a 20 MP RAW (median)" }
    - { v: "21 ms", l: "to redraw ten postcards (budget 100 ms)" }
