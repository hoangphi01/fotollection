  fn_trip: "The Prague folder is the author's own and is not published (© @hoangphi01, all rights reserved). Medians of 3 runs of bench/trip.sh and of measure_folder on its JPEGs, on an Apple M3 with 16 GB, with other apps open, on 2026-11-04, with the export of v0.9.7; run them on a folder of your own to compare."
  fn_downloads: "Counted by GitHub."
  fn_payment: "VietQR and NAPAS 247 and their logos are trademarks of the National Payment Corporation of Vietnam (NAPAS); Techcombank of Vietnam Technological and Commercial Joint Stock Bank. Shown as the marks of the payment the code uses; Fotollection is not connected with them."
  fn_rust: "Rust and the Rust logo are trademarks of the Rust Foundation. Fotollection's core is written in Rust and runs directly on your computer."
  fn_webview: "The app's window is built with Tauri and drawn by the system's own web view: WebKit (WKWebView) on macOS, Microsoft Edge WebView2 on Windows and WebKitGTK, the GTK port of WebKit, on Linux. Tauri is a project of the Tauri Programme within the Commons Conservancy; WebKit is a trademark of Apple Inc.; GTK is a project of the GNOME Foundation; Microsoft Edge and WebView2 are trademarks of Microsoft Corporation. The browser comparison ran the same job in headless Chromium 156, the open-source project behind Google Chrome, with one Web Worker per processor core."
  fn_de: "ΔE2000 (CIEDE2000) is the colour-difference formula of the International Commission on Illumination (CIE), standardised as ISO/CIE 11664-6; the CIELAB colour space it works in is ISO/CIE 11664-4."
  fn_ssim: "SSIM was introduced by Zhou Wang, Alan C. Bovik, Hamid R. Sheikh and Eero P. Simoncelli in Image quality assessment: from error visibility to structural similarity, IEEE Transactions on Image Processing, 13(4), 2004."
  fn_jpeg: "JPEG is the image format of the Joint Photographic Experts Group, standardised as ISO/IEC 10918-1 and ITU-T T.81."
  fn_srgb: "sRGB was created by HP and Microsoft in 1996 and standardised as IEC 61966-2-1."
  fn_p3: "Display P3 is a colour space defined by Apple Inc., based on the DCI-P3 colour space of the cinema industry (SMPTE)."
  fn_adobe: "Adobe RGB (1998) is a colour space specified by Adobe Inc.; Adobe is a registered trademark of Adobe Inc."
  fn_charts: "Every chart: figures are for reference, measured on an ordinary laptop (Apple M3, 16 GB); yours depend on the computer you use."
  fn_dng: "Adobe DNG Converter was not run for this page. The figure is a third-party estimate (1,000 CR3 files in 20–30 minutes on modern hardware, machine not stated), from convertintomp4.com's blog post on batch RAW-to-DNG conversion. Adobe is a registered trademark of Adobe Inc."
  fn_pf_raw: "On macOS, RAW formats other than DNG are developed by the system, with its lens corrections. Linux and Windows use the reader built into Fotollection, without them; on Windows, Microsoft's Raw Image Extension, when installed, is only a last fallback."
  fn_pf_heic_win: "With Microsoft's free HEIF Image Extensions and HEVC Video Extensions, from the Microsoft Store."
  fn_pf_heic_linux: "HEIC needs an HEVC decoder, which Linux does not ship and Fotollection will not bundle, because of its patents. A later version will use the libheif your distribution installs. Until then, convert HEIC photos to JPEG."
  fn_pf_tether: "Sony a6400 first; other cameras will follow."
  fn_pf_openwith: "With the .deb, or with the install script. An AppImage you run by itself is not registered with the file manager, unless a tool such as AppImageLauncher does it."
  fn_pf_update: "The AppImage downloads the new AppImage; the .deb opens the release page, and with the APT repository, sudo apt upgrade brings the new version."
  fn_glibc: "glibc, the GNU C Library, is the base library every Linux program runs on. To see yours, type ldd --version in a terminal. Fotollection is built on Ubuntu 22.04, which has glibc 2.35, so it needs that version or a newer one."
  fn_nvidia: "With NVIDIA's own driver, WebKitGTK's DMA-BUF renderer can leave the window blank. When that driver is loaded, Fotollection restarts itself once with that renderer turned off."
  fn_dm: dm and the dm logo are trademarks of dm-drogerie markt GmbH + Co. KG.
  fn_rossmann: ROSSMANN and the ROSSMANN logo are trademarks of Dirk Rossmann GmbH.
  fn_cewe: The photo services at dm and Rossmann are made by CEWE, a trademark of CEWE Stiftung & Co. KGaA. Print sizes were checked against dm's price list in October 2026; the shops may change them.
  fn_photos: "The Prague photos in the screenshots (the trams, the streets, the Vltava) were taken by @hoangphi01 on a Lumix GX9 in November 2026: © @hoangphi01, all rights reserved. They are not covered by the app's licence and may not be reused. The other demo photos are in the public domain (CC0) on Wikimedia Commons, by Dktue (7 photos), Pierre Blaché from Paris, France (2) and Kate Branch (1). The cat in the print-basket and best-shot screenshots was also photographed by @hoangphi01 on the GX9, all rights reserved; the softer, shaken and darker copies beside it were made from that one photo, to show how the best shot is chosen."
  fn_photos_link: "Every file, its page and its checksum."
  fn_rawsamples: "The RAW measurements use nine samples in the public domain (CC0) from raw.pixls.us, one per format; scripts/fetch-raw-samples.py downloads and checks them."
  fn_rawformats: "RAW formats named on this site belong to the camera makers that define them: RW2 (Panasonic Holdings Corporation), CR2 and CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) and ORF (OM Digital Solutions Corporation, formerly Olympus). DNG is an open specification published by Adobe Inc. Fotollection reads them through a reader built into Fotollection, and on macOS through the system's codecs first (on Windows, Microsoft's Raw Image Extension is a last fallback when installed); it is not made or endorsed by any of these companies."
  fn_cameras: "Camera names and logos in the screenshots and in the app's info frame are trademarks of their owners, used only to show which camera took a photo: Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) and Sony (Sony Group Corporation)."
  fn_others: Apple and macOS are trademarks of Apple Inc.; Windows of Microsoft Corporation; Linux is the registered trademark of Linus Torvalds in the U.S. and other countries; Ubuntu of Canonical Ltd.; Debian of Software in the Public Interest, Inc.; Fedora, Red Hat, RHEL and CentOS of Red Hat, Inc.; openSUSE of SUSE LLC; Pop!_OS of System76, Inc.; Rocky Linux of the Rocky Enterprise Software Foundation; AlmaLinux of the AlmaLinux OS Foundation; ChromeOS of Google LLC; NVIDIA of NVIDIA Corporation; the names of the other Linux distributions belong to their projects; Facebook and Instagram of Meta Platforms, Inc.; GitHub of GitHub, Inc.; Google Analytics of Google LLC; Lightroom of Adobe Inc.; IrfanView of Irfan Škiljan; VietQR of NAPAS; Wikimedia Commons of the Wikimedia Foundation. The Apple, Windows and Linux (Tux, first drawn by Larry Ewing) marks are drawn from Simple Icons (CC0) and only show which system a column or a step is about.
  fn_brand: "The Fotollection name and logo identify the official app, made by @hoangphi01. Official downloads come only from fotollection.org and the project's GitHub releases. The GPL-3.0 licence lets anyone share or sell copies, changed or not, as long as they keep this licence and offer the source code; a changed or resold copy must not use the Fotollection name or logo in a way that suggests it is the official app."
  fn_notify: "Sharing or selling Fotollection, or building on it? Please tell the author first by opening an issue on GitHub (github.com/hoangphi01/fotollection/issues). The app is free and made in spare time; a short note is the fair way to say thanks."
  fn_cite: Quoting, reviewing or showing the app, or using these screenshots? Please credit Fotollection and link to fotollection.org.
  fn_independent: Fotollection is an independent open-source project. It is not affiliated with, sponsored or endorsed by any of these companies, and every other trademark belongs to its owner.
  shield: Private - your photos never leave your computer
  privacy_title: Your photos stay yours
  privacy_lead: Fotollection is built to work with no internet at all. Nothing is uploaded, nothing is tracked, and you can check every line of it.
  p1_title: No upload, no cloud
  p1_text: Photos are read and written on your own disk. There is no server to send them to.
  p2_title: No account, no tracking
  p2_text: No sign-up, and the app has no analytics or telemetry. It never goes online by itself, not even to check for updates.
  p6_title: No ads
  p6_text: Nothing to sell you and no one paying to reach you. No adverts, no sponsored suggestions, no in-app purchases, not now and not later.
  p3_title: Places without a map service
  p3_text: Town names come from a map database bundled inside the app, so your GPS never reaches a third party.
  p4_title: GPS removed on export
  p4_text: Exported prints have their location stripped by default, so a photo handed to a print lab does not reveal where you live.
  p5_title: Open source
  p5_text: The code is public under GPL-3.0. Anyone can read it, build it and confirm that it does what this page says.
  charts_title: Measured, not promised
  charts_lead: Every number comes from real photos on an ordinary laptop (Apple M3, 16 GB), and the scripts are in the repository.
