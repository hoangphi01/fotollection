  hero_title_1: Chụp hàng nghìn ảnh, chỉ xem lại khi
  hero_accent: ngồi trên máy bay
  hero_title_2: "?"
  hero_lead: Không có internet, và vẫn chưa biết giữ tấm nào. Hãy thử một lần nhìn lại cùng Fotollection - tự tìm ảnh đẹp nhất, in ngày chụp và chuẩn bị sẵn để in. Tự động, miễn phí và không cần internet.
  download_mac: Tải cho macOS
  download_win: Tải cho Windows
  download_note: macOS 11+ (Apple Silicon và Intel) · Windows 10/11
  latest: Phiên bản mới nhất
  no_release: Các bản phát hành ở trên GitHub
  shot_grid: Thư viện ảnh, đã chấm sao và chọn ảnh
  features_title: Đủ mọi thứ cho một lần in ảnh
  features_lead: Làm cho buổi tối sau chuyến đi, khi vài trăm tấm ảnh cần trở thành một xấp ảnh in nhỏ.
  f_stamp_title: Dấu ngày kiểu máy film
  f_stamp_text: Dòng ngày LED màu cam của máy film ngày xưa, tên nơi chụp cùng dòng và một dòng chữ của bạn bên dưới. Đặt riêng từng ảnh hoặc cho tất cả.
  f_frame_title: Khung thông tin máy ảnh
  f_frame_text: Viền "Shot on" gọn gàng với logo hãng, ống kính, tiêu cự, khẩu độ, tốc độ và ISO, lấy thẳng từ EXIF.
  f_best_title: Gợi ý ảnh đẹp nhất
  f_best_text: Ảnh chụp liên tiếp và các khung hình gần giống nhau được gom nhóm; ứng dụng gợi ý tấm nét nhất, ít rung, không nhắm mắt, kèm lý do.
  f_crop_title: Cắt vừa khổ in
  f_crop_text: Mỗi ảnh được cắt đúng khổ in, hiện DPI ngay khi kéo. Xoay ¼ vòng hoặc cân lại đường chân trời tới 15°.
  f_quality_title: Giữ nguyên chất lượng gốc
  f_quality_text: Đủ độ phân giải, giữ hồ sơ màu, JPEG 4:4:4. Ảnh in ra giống ảnh bạn đã chụp.
  f_raw_title: Ảnh RAW, không cần chuyển đổi
  f_raw_text: "RW2, CR2, CR3, NEF, ARW, RAF, ORF và DNG mở được nguyên dạng, đủ ngày chụp và thông số. Ảnh thu nhỏ lấy từ bản xem trước có sẵn trong mỗi tệp, nên duyệt RAW nhanh như JPEG. Trên Windows, hiện vẫn cần cài Raw Image Extension miễn phí của Microsoft; bộ đọc RAW tích hợp sẵn đang được làm."
  f_open_title: Mở ảnh từ bất cứ đâu
  f_speed_title: Nhanh trên mọi máy
  f_speed_text: Một nghìn ảnh mở trong 0,12 giây, đổi một thiết lập thì ảnh xem trước vẽ lại trong 17 ms, và từ lần mở thứ hai ứng dụng khởi động trong khoảng 0,4 giây. Ảnh 32 MP xem trước nhanh như ảnh nhỏ.
  f_open_text: Bấm chuột phải vào một ảnh trong Finder hoặc Explorer và chọn Fotollection. Ảnh mở ngay, và thư mục của ảnh thành một tab.
  f_private_title: Riêng tư, không cần internet
  f_private_text: Không tài khoản, không tải lên, không theo dõi. Tên địa điểm lấy từ bản đồ có sẵn trong ứng dụng, GPS được xóa khi xuất.
  show_stamp: Dấu ngày kèm tên nơi chụp từ GPS của ảnh
  show_frame: Khung "Shot on" với logo của hãng máy ảnh
  show_crop: Cân lại đường chân trời trong màn cắt ảnh
  show_groups: Ảnh giống nhau được gom nhóm, gợi ý tấm đẹp nhất
  faq_title: "Câu hỏi trước khi tải về"
  faq_lead: "Vì sao lại thêm một ứng dụng ảnh, và ứng dụng này khác ở đâu."
  faq_groups:
    - label: "Vì sao chọn Fotollection"
      items:
        - q: "Sao không dùng luôn Lightroom?"
          a: "Lightroom, ứng dụng Ảnh có sẵn và IrfanView được làm ra để chỉnh sửa và xem ảnh; chưa có ứng dụng nào được thiết kế cho máy in ảnh. Muốn in, bạn phải tự cắt từng ảnh theo tỉ lệ khổ giấy, hoặc giao tệp cho tiệm để máy hay nhân viên ở đó tự căn, và thường bị cắt mất đầu người hay mép tấm biển. Fotollection bắt đầu từ chính bản in: biết sẵn các khổ in ở dm và Rossmann, cắt từng ảnh đúng khổ để ảnh bạn thấy chính là ảnh in ra, báo khi ảnh quá nhỏ, in ngày chụp như máy phim và xuất tệp đúng chuẩn máy in ở tiệm. Ứng dụng nhẹ, nhanh, miễn phí và dùng song song với Lightroom được: ảnh gốc không bao giờ bị thay đổi."
        - q: "Máy tôi đã có sẵn Ảnh (Photos), hoặc tôi dùng IrfanView. Sao phải thêm ứng dụng?"
          a: "Ứng dụng Ảnh có sẵn và IrfanView đều là trình xem ảnh tốt, mỗi cái trên một hệ điều hành. Không cái nào biết khổ ảnh 10 × 15 ở dm hay Rossmann, báo khi ảnh quá nhỏ để in khổ đó, in ngày chụp như máy phim, hay gom ảnh đẹp nhất của năm thư mục vào một giỏ in. Fotollection làm được, dùng giống hệt nhau trên Mac lẫn Windows, và còn có thể là trình xem ảnh của bạn: bấm chuột phải vào ảnh, chọn Mở bằng, Fotollection, kể cả ảnh RAW."
    - label: "Tốc độ và độ nhẹ"
      items:
        - q: "Ứng dụng có nặng không? Máy cũ có chạy được không?"
          a: "Rất nhẹ: bộ cài cho Windows chỉ 13,7 MB, vì cửa sổ dùng trình hiển thị web có sẵn của hệ điều hành thay vì mang theo cả một trình duyệt. Phần lõi viết bằng Rust và chạy trực tiếp trên máy. Ảnh xem trước không bao giờ lớn hơn 1600 px, nên ảnh 32 MP mở nhanh như ảnh nhỏ, và ảnh gốc chỉ được tải khi bạn phóng to. Ngay cả khi xuất 5.035 ảnh, RAM dùng nhiều nhất chỉ khoảng 1,45 GB."
        - q: "Với hàng nghìn ảnh thì nhanh đến đâu?"
          a: "Mở 1.000 ảnh mất khoảng 0,12 giây, vì Fotollection đọc ảnh thu nhỏ có sẵn trong mỗi tệp trước. Đổi một thiết lập thì ảnh xem trước vẽ lại trong 17 ms, xuất ảnh đạt 18 ảnh cỡ đầy đủ mỗi giây, và từ lần thứ hai trở đi ứng dụng mở trong khoảng 0,4 giây. Mọi con số đều đo trên một chiếc máy tính xách tay bình thường, và trang Hiệu năng hướng dẫn bạn tự đo lại."
    - label: "Nền tảng và chi phí"
      items:
        - q: "Có chạy trên Mac và Windows không, có thật sự miễn phí không?"
          a: "Có. Một bản tải cho macOS 11 trở lên, chạy được cả trên chip Apple lẫn Intel, và một bản cho Windows 10 và 11. Ứng dụng miễn phí, không quảng cáo, không cần tài khoản, không mua thêm trong ứng dụng, và mã nguồn công khai theo giấy phép GPL-3.0, ai cũng có thể kiểm tra ứng dụng làm gì."
  tabs_title: "Chỉnh ảnh như lướt web"
  tabs_lead: "Mỗi thư mục bạn mở trở thành một tab trong cùng một không gian làm việc, nên một chuyến đi nằm rải trên nhiều thẻ nhớ và điện thoại vẫn gọn ở một chỗ."
  tabs_row_title: "Thư mục là tab, ô tích đi theo bạn"
  tabs_text: "Bấm một thư mục để chỉ làm việc với thư mục đó, hoặc Tất cả ảnh để xem hết. Tích ảnh ở thư mục này, chuyển sang thư mục khác rồi tích tiếp: thanh chọn đếm tất cả, nên ảnh đẹp nhất của mọi thư mục vào giỏ in chỉ với một lần bấm. Tích nhiều thư mục để xuất chung hoặc mỗi thư mục một nơi, và đóng tab bằng dấu × khi xong việc; ảnh vẫn nằm nguyên trên ổ đĩa."
  show_tabs: "Ba thư mục là ba tab: ảnh đã tích ở hai thư mục, và nút đóng trên một tab"
  basket_title: "Chọn ảnh để in chỉ với một phím"
  basket_lead: "Một chuyến đi để lại hàng trăm tấm ảnh, nhưng chỉ vài tấm đáng đem in. Fotollection biến việc chọn ấy thành trò chơi thích hay bỏ qua."
  swipe_title: "↑ để in, ↓ để riêng"
  swipe_text: "Mở tấm đầu tiên rồi quyết bằng một phím: ↑ cho ảnh vào giỏ in, ↓ để riêng sang một bên, và tấm kế tiếp đã hiện sẵn. Không ảnh nào bị xoá: giỏ in và chồng ảnh để riêng nằm chờ ở thanh bên, đổi ý lúc nào cũng được."
  show_swipe: "Một tấm ảnh đã vào giỏ in, cùng các phím để lướt tiếp"
  select_title: "Hoặc tích chọn ngay trong lưới ảnh"
  select_text: "Nút Chọn biến cả lưới ảnh thành ô tích như trên iPhone, Shift+click để chọn cả một dải. Giữ Space trên một ảnh để xem to, đúng như khi in ra, rồi thả tay là chọn tiếp."
  show_select: "Chế độ Chọn: ảnh đã tích, giỏ in và chồng ảnh để riêng"
  estimate_title: "Biết trước dung lượng trước khi xuất"
  estimate_text: "Thẻ Xuất ảnh cho biết tệp sẽ nặng bao nhiêu trước khi ghi ra ổ đĩa, tính từ vài ảnh mã hoá thử với đúng thiết lập của bạn. Ảnh máy ảnh xuất cho Facebook nhẹ đi khoảng sáu lần, và bạn thấy trước khi bấm."
  show_estimate: "Ô ước tính dung lượng ngay trên nút xuất ảnh, khi xuất cho Facebook"
  key_up: "giỏ in"
  key_down: "để riêng"
  quality_title: Ảnh in giống hệt ảnh gốc
  quality_lead: Đo từng điểm ảnh trên ảnh thật, so với bản xuất của một trình sửa ảnh trên web thông thường.
  q1_value: "0,19"
  q1_label: sai lệch màu trung bình (ΔE2000). Dưới 1 thì mắt không phân biệt được.
  q2_value: 100 %
  q2_label: chi tiết nhỏ được giữ lại. Trình sửa ảnh web thông thường chỉ giữ 13 %.
  q3_value: 0 byte
  q3_label: gửi đi bất kỳ đâu. Ứng dụng chạy không cần mạng.
