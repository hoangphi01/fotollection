compare_title: "Jak wypada na tle innych"
compare_lead: "Fotollection nie próbuje zastąpić pełnego edytora RAW. Powstało do kroku, który tamte zostawiają tobie: od folderu z podróży do odbitek, które trzymasz w dłoni."
compare_caption: "Fotollection obok Lightroom Classic, darktable i RawTherapee"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["Do czego", "Wybór, datowanie i dopasowanie zdjęć z podróży do druku", "Pełny workflow: katalog, wywoływanie, druk i udostępnianie", "Workflow fotograficzny i wywoływarka RAW", "Wywoływanie RAW"], ["Pocztówki ze stroną na adres", "Tak", "Nie", "Nie", "Nie"], ["Data i miejsce na zdjęciu", "Tak, w stylu filmu", "Nie", "Tak, znak wodny", "Nie"], ["Kadr pod formaty labu", "Tak, ze sprawdzeniem ostrości", "Tak, moduł Print", "Tak, widok druku", "Nie"], ["Najlepsze ujęcie z serii", "Tak, najostrzejsze z otwartymi oczami", "Tak, Assisted Culling", "Nie", "Nie"], ["Zostaw albo odrzuć, zdjęcie po zdjęciu", "Tak, tryb Simple", "Tak, flagi", "Tak, gwiazdki", "Tak, oceny"], ["Dwa zdjęcia na jednej odbitce", "Tak", "Tak", "Tak", "Nie"], ["Looki jednym kliknięciem", "Tak", "Tak, presety", "Tak, style", "Tak, profile"], ["Presety Lightrooma", "Tak, importowane", "Tak", "Nie", "Nie"], ["LUT-y", "Tak, .cube i HaldCLUT", "Jako profile", "Tak", "Tak, HaldCLUT"], ["Wywoływanie RAW", "Tak", "Tak", "Tak", "Tak"], ["Cena", "Za darmo", "Subskrypcja Creative Cloud", "Za darmo", "Za darmo"], ["Kod źródłowy", "Otwarty, GPL-3.0", "Zamknięty", "Otwarty, GPL-3.0 lub nowsza", "Otwarty, GPL-3.0"], ["Systemy", "macOS, Windows, Linux", "macOS, Windows", "macOS (Apple silicon), Windows, Linux", "macOS, Windows, Linux"], ["Konto", "Brak", "Konto Adobe", "Brak", "Brak"]]
compare_note: "Jeśli chcesz pójść dalej: darktable i RawTherapee do najgłębszego wywoływania RAW, Lightroom do zdjęć z całego życia w jednym katalogu."
fn_lightroom: "Adobe, Lightroom i Lightroom Classic są znakami towarowymi Adobe Inc. w Stanach Zjednoczonych i innych krajach. Fotollection nie jest powiązane z Adobe ani przez nie wspierane; korzysta ze skrótów i układu, które znają użytkownicy Lightrooma. Logo Lightroom pochodzi z Wikimedia Commons, gdzie jako logo tekstowe jest w domenie publicznej."
fn_lut: "LUT (tablica przekodowania, look-up table) przypisuje każdemu kolorowi kolor, którym się staje; Fotollection czyta pliki .cube i obrazy HaldCLUT. LUMIX jest znakiem towarowym Panasonic Holdings Corporation; Fotollection nie jest powiązane z Panasonic ani przez niego wspierane."
fn_compare: "Creative Cloud jest znakiem towarowym Adobe Inc.; darktable i RawTherapee to projekty wolnego oprogramowania ich własnych społeczności. Fakty pochodzą z darktable.org i jego podręcznika, rawtherapee.com, pomocy Adobe do Lightroom Classic i podsumowania licencji i wymagań Adobe w Wikipedii, sprawdzonych 14 listopada 2026. Fotollection nie jest powiązane z żadnym z nich."
fn_exif: "EXIF (Exchangeable Image File Format) to standard, prowadzony przez japońskie JEITA i CIPA, dla informacji, które aparat zapisuje w każdym zdjęciu: aparat i obiektyw, data i godzina, ekspozycja, często pozycja GPS i mała osadzona miniatura."
fn_units: "Jednostki: px to piksel, jeden punkt obrazu; MP (megapiksel) to milion pikseli, więc zdjęcie 20 MP ma około 5472 × 3648 px; ms to milisekunda, tysięczna część sekundy; MB i GB to megabajty i gigabajty; RAM (pamięć o dostępie swobodnym) to pamięć robocza komputera."
fn_raw: "Plik RAW zawiera to, co zarejestrowała matryca, zanim aparat zamienił to w obraz, więc o kolorze, jasności i szczegółach można zdecydować później, podobnie jak przy wywoływaniu negatywu. Każdy producent ma własny format (CR3 Canona, NEF Nikona, ARW Sony, RW2 Panasonica i inne); DNG (Digital Negative) to otwarty format RAW opublikowany przez Adobe."
fn_heic: "HEIF (High Efficiency Image File Format) to format obrazu normy ISO/IEC 23008-12; HEIC to jego wariant kompresowany HEVC (H.265), w którym iPhone'y domyślnie zapisują zdjęcia. Zdjęcie HEIC jest mniej więcej o połowę mniejsze od JPEG-a o podobnej jakości."
fn_png: "PNG (Portable Network Graphics) to bezstratny format obrazu, opublikowany jako ISO/IEC 15948: każdy piksel zostaje zachowany dokładnie, co pasuje do grafik i zrzutów ekranu, za to zdjęcie wychodzi kilka razy większe niż w JPEG-u."
fn_dpi: "DPI (punkty na cal) mówi, ile pikseli zdjęcia przypada na każdy cal (2,54 cm) odbitki. Około 300 DPI wygląda ostro w dłoni; mniej wciąż wygląda dobrze na większej odbitce oglądanej z dalszej odległości."
fn_444: "4:4:4 i 4:2:0 opisują podpróbkowanie chrominancji, czyli ile szczegółów koloru JPEG zachowuje obok jasności. 4:4:4 zachowuje kolor każdego piksela; 4:2:0 jeden kolor na każdy blok czterech pikseli, co zmniejsza plik, ale zmiękcza drobne kolorowe krawędzie, takie jak czerwony tekst czy ostry horyzont."
fn_usb: "USB (Universal Serial Bus) to standard USB Implementers Forum do podłączania urządzeń. Karta SD to karta pamięci w standardzie Secure Digital stowarzyszenia SD Association, taka, jakiej używa większość aparatów."
fn_gps: "GPS (Global Positioning System) to satelitarny system nawigacji Stanów Zjednoczonych. Telefony i wiele aparatów korzysta z niego, często razem z Galileo, GLONASS lub BeiDou, by zapisać, gdzie zrobiono zdjęcie."
fn_iso: "ISO to czułość aparatu na światło, zdefiniowana normą ISO 12232: każde podwojenie, z ISO 100 do 200, wymaga o połowę mniej światła, kosztem większego szumu."
fn_gpl: "GPL-3.0 to wersja 3 Powszechnej Licencji Publicznej GNU, wydana przez Free Software Foundation: każdy może używać, badać, udostępniać i zmieniać program, a kto go udostępnia, zmieniony czy nie, udostępnia też kod źródłowy na tych samych warunkach."
fn_vnlf: "VNLF (Vietnam Linux Family) to wietnamska społeczność wolnego oprogramowania i Linuksa. Jej App Explorer zawiera wolne aplikacje dla wietnamskich użytkowników, a CaramOS to jej dystrybucja Linuksa."
fn_led: "LED (dioda elektroluminescencyjna): aparaty na kliszę z lat 80. i 90. naświetlały datę na kliszy małymi pomarańczowymi cyframi LED – ten wygląd odtwarza data na zdjęciu."
fn_arch: "x86_64, zwana też amd64, to architektura procesorów większości komputerów z Windows i Linuksem; ARM64, czyli aarch64 lub arm64, to architektura Apple silicon, wielu laptopów i małych płytek, takich jak Raspberry Pi. Każda potrzebuje własnej kompilacji."
fn_linux_pkg: "Plik .deb to pakiet Debiana, format instalatora Debiana, Ubuntu, Linux Mint i ich krewnych; APT (Advanced Package Tool) instaluje i aktualizuje takie pakiety z repozytorium. AppImage to jeden plik z aplikacją i wszystkim, czego potrzebuje, który działa na większości dystrybucji bez instalacji."
fn_fuse: "FUSE (Filesystem in Userspace) pozwala programowi udostępnić system plików bez zmiany jądra. AppImage używa go, by się otworzyć, a Ubuntu 24.04 nie instaluje już domyślnie jego wersji 2."
fn_sha: "SHA-256 to kryptograficzna funkcja skrótu z rodziny SHA-2, ustandaryzowana przez amerykański NIST w FIPS 180-4. Zamienia plik w 64-znakowy odcisk; zmień choć jeden bit pliku, a odcisk się zmieni."
fn_jpeg: "JPEG to format obrazu Joint Photographic Experts Group, ustandaryzowany jako ISO/IEC 10918-1 i ITU-T T.81."
fn_pf_raw: "Na macOS formaty RAW inne niż DNG wywołuje system, z jego korekcjami obiektywu. Linux i Windows korzystają z czytnika wbudowanego w Fotollection, bez nich; na Windows rozszerzenie Raw Image Extension Microsoftu, jeśli jest zainstalowane, służy tylko jako ostatnie wyjście."
fn_pf_heic_win: "Z darmowymi rozszerzeniami HEIF Image Extensions i HEVC Video Extensions Microsoftu, ze sklepu Microsoft Store."
fn_pf_heic_linux: "HEIC wymaga dekodera HEVC, którego Linux nie dostarcza, a Fotollection nie dołączy z powodu patentów. Późniejsza wersja użyje libheif zainstalowanego przez twoją dystrybucję. Do tego czasu konwertuj zdjęcia HEIC do JPEG."
fn_pf_tether: "Najpierw Sony a6400; inne aparaty dojdą później."
fn_pf_openwith: "Z pakietem .deb albo ze skryptem instalacyjnym. Uruchamiany samodzielnie AppImage nie jest rejestrowany w menedżerze plików, chyba że zrobi to narzędzie takie jak AppImageLauncher."
fn_pf_update: "AppImage pobiera nowy AppImage; .deb otwiera stronę wydania, a z repozytorium APT nową wersję przynosi sudo apt upgrade."
fn_glibc: "glibc, czyli GNU C Library, to biblioteka bazowa, na której działa każdy program w Linuksie. Aby sprawdzić swoją, wpisz ldd --version w terminalu. Fotollection jest budowane na Ubuntu 22.04 z glibc 2.35, więc potrzebuje tej wersji lub nowszej."
fn_nvidia: "Z własnym sterownikiem NVIDIA renderer DMA-BUF w WebKitGTK może zostawić puste okno. Gdy ten sterownik jest załadowany, Fotollection raz uruchamia się ponownie z wyłączonym tym rendererem."
fn_dm: "dm i logo dm są znakami towarowymi dm-drogerie markt GmbH + Co. KG."
fn_rossmann: "ROSSMANN i logo ROSSMANN są znakami towarowymi Dirk Rossmann GmbH."
fn_cewe: "Usługi fotograficzne w dm i Rossmannie prowadzi CEWE, znak towarowy CEWE Stiftung & Co. KGaA. Formaty odbitek sprawdzono z cennikiem dm w październiku 2026; sklepy mogą je zmienić."
fn_photos: "Praskie zdjęcia na zrzutach ekranu (tramwaje, ulice, Wełtawa) zrobił @hoangphi01 aparatem Lumix GX9 w listopadzie 2026: © @hoangphi01, wszelkie prawa zastrzeżone. Nie obejmuje ich licencja aplikacji i nie wolno ich ponownie wykorzystywać. Pozostałe zdjęcia demonstracyjne są w domenie publicznej (CC0) na Wikimedia Commons, autorstwa Dktue (7 zdjęć), Pierre Blaché z Paryża, Francja (2) i Kate Branch (1). Kota na zrzutach koszyka do druku i najlepszego ujęcia także sfotografował @hoangphi01 aparatem GX9, wszelkie prawa zastrzeżone; łagodniejsze, poruszone i ciemniejsze kopie obok powstały z tego jednego zdjęcia, by pokazać, jak wybierane jest najlepsze ujęcie."
fn_photos_link: "Każdy plik, jego strona i suma kontrolna."
fn_rawsamples: "Pomiary RAW korzystają z dziewięciu próbek w domenie publicznej (CC0) z raw.pixls.us, po jednej na format; scripts/fetch-raw-samples.py je pobiera i sprawdza."
fn_rawformats: "Formaty RAW wymienione na tej stronie należą do producentów aparatów, którzy je definiują: RW2 (Panasonic Holdings Corporation), CR2 i CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) i ORF (OM Digital Solutions Corporation, dawniej Olympus). DNG to otwarta specyfikacja opublikowana przez Adobe Inc. Fotollection czyta je czytnikiem wbudowanym w Fotollection, a na macOS najpierw kodekami systemu (na Windows rozszerzenie Raw Image Extension Microsoftu jest ostatnim wyjściem, jeśli jest zainstalowane); żadna z tych firm go nie tworzy ani nie wspiera."
fn_cameras: "Nazwy i logo aparatów na zrzutach ekranu i w ramce z danymi w aplikacji są znakami towarowymi ich właścicieli, użytymi tylko po to, by pokazać, jakim aparatem zrobiono zdjęcie: Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) i Sony (Sony Group Corporation)."
fn_others: "Apple i macOS są znakami towarowymi Apple Inc.; Windows – Microsoft Corporation; Linux jest zarejestrowanym znakiem towarowym Linusa Torvaldsa w USA i innych krajach; Ubuntu – Canonical Ltd.; Debian – Software in the Public Interest, Inc.; Fedora, Red Hat, RHEL i CentOS – Red Hat, Inc.; openSUSE – SUSE LLC; Pop!_OS – System76, Inc.; Rocky Linux – Rocky Enterprise Software Foundation; AlmaLinux – AlmaLinux OS Foundation; ChromeOS – Google LLC; NVIDIA – NVIDIA Corporation; nazwy innych dystrybucji Linuksa należą do ich projektów; Facebook i Instagram – Meta Platforms, Inc.; GitHub – GitHub, Inc.; Google Analytics – Google LLC; Lightroom – Adobe Inc.; IrfanView – Irfan Škiljan; VietQR – NAPAS; Wikimedia Commons – Wikimedia Foundation. Znaki Apple, Windows i Linux (Tux, pierwotnie narysowany przez Larry'ego Ewinga) pochodzą z Simple Icons (CC0) i pokazują tylko, którego systemu dotyczy kolumna lub krok."
fn_brand: "Nazwa i logo Fotollection oznaczają oficjalną aplikację, tworzoną przez @hoangphi01. Oficjalne pliki do pobrania pochodzą wyłącznie z fotollection.org i z wydań projektu na GitHubie. Licencja GPL-3.0 pozwala każdemu udostępniać lub sprzedawać kopie, zmienione czy nie, o ile zachowa tę licencję i udostępni kod źródłowy; zmieniona lub odsprzedawana kopia nie może używać nazwy ani logo Fotollection tak, by sugerować, że jest oficjalną aplikacją."
fn_notify: "Udostępniasz lub sprzedajesz Fotollection albo budujesz na nim? Najpierw daj znać autorowi, zakładając zgłoszenie na GitHubie (github.com/hoangphi01/fotollection/issues). Aplikacja jest darmowa i powstaje w wolnym czasie; krótka wiadomość to uczciwy sposób, by podziękować."
fn_cite: "Cytujesz, recenzujesz lub pokazujesz aplikację albo używasz tych zrzutów ekranu? Podaj Fotollection jako źródło i dodaj link do fotollection.org."
fn_independent: "Fotollection to niezależny projekt open source. Nie jest powiązane z żadną z tych firm, sponsorowane ani wspierane przez nie, a każdy inny znak towarowy należy do swojego właściciela."
shield: "Prywatnie – twoje zdjęcia nigdy nie opuszczają komputera"
privacy_title: "Twoje zdjęcia zostają twoje"
privacy_lead: "Fotollection działa zupełnie bez internetu. Nic nie jest wysyłane, nic nie jest śledzone, a każdą linijkę możesz sprawdzić."
p1_title: "Bez wysyłania, bez chmury"
p1_text: "Zdjęcia są czytane i zapisywane na twoim dysku. Nie ma serwera, na który mogłyby trafić."
p2_title: "Bez konta, bez śledzenia"
p2_text: "Bez rejestracji, a aplikacja nie ma analityki ani telemetrii. Od v0.13.0 przy starcie raz pyta GitHub, czy jest nowsza wersja – możesz to wyłączyć w Ustawieniach."
p6_title: "Bez reklam"
p6_text: "Nic do sprzedania i nikt nie płaci, by do ciebie dotrzeć. Bez reklam, bez sponsorowanych podpowiedzi, bez zakupów w aplikacji – ani teraz, ani później."
p3_title: "Miejsca bez usługi map"
p3_text: "Nazwy miejscowości pochodzą z bazy map wbudowanej w aplikację, więc twój GPS nigdy nie trafia do nikogo z zewnątrz."
p4_title: "GPS usuwany przy eksporcie"
p4_text: "Wyeksportowane odbitki domyślnie nie mają lokalizacji, więc zdjęcie oddane do punktu foto nie zdradzi, gdzie mieszkasz."
p5_title: "Open source"
p5_text: "Kod jest publiczny na licencji GPL-3.0. Każdy może go przeczytać, zbudować i potwierdzić, że robi to, co mówi ta strona."
charts_more: "Wszystkie pomiary, z wyjaśnieniem"
footer_story: "Historia"
footer_wiki: "Wiki"
footer_signing: "Zasady podpisywania kodu"
dl_warn_title: "Zaktualizuj do v0.14.0 lub nowszej."
dl_warn_text: "Wcześniejsze wersje mogły zgubić zmiany folderu na dysku niepodłączonym przy starcie, a jeden błąd mógł zamknąć całą aplikację. v0.14.0 naprawia oba problemy; ustawienia i projekty przechodzą bez zmian."
install_title: "Instalacja w minutę"
install_lead: "Instalatory nie są jeszcze podpisane płatnym certyfikatem, więc przy pierwszym uruchomieniu potrzebne jest jedno dodatkowe kliknięcie."
mac_title: "macOS"
mac_1: "Otwórz plik .dmg i przeciągnij Fotollection do Aplikacji."
mac_2: "Otwórz je. macOS zablokuje pierwsze uruchomienie."
mac_3: "W Ustawieniach systemowych → Prywatność i ochrona kliknij Otwórz mimo to."
win_title: "Windows"
win_1: "Uruchom plik -setup.exe (lub .msi)."
win_2: "Jeśli SmartScreen pokaże „System Windows ochronił ten komputer”, kliknij Więcej informacji."
win_3: "Kliknij Uruchom mimo to."
linux_title: "Linux"
linux_script_title: "Jedno polecenie"
linux_script_text: "Dobiera właściwy pakiet do systemu: Ubuntu, Debian i Mint dostają repozytorium APT, inne dystrybucje AppImage w ~/.local. Aby odinstalować:"
linux_apt_title: "Albo dodaj repozytorium APT"
