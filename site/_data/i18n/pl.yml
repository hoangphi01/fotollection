mode_pro_s2: "Kadrowanie, prostowanie, data na zdjęciu i ramka z danymi."
mode_pro_s3: "Eksport do kiosku albo lżejszy do udostępnienia w sieci."
modes_manual: "Pełna instrukcja"
postcard_title: "Pocztówka z twojego zdjęcia"
postcard_text: "W trybie Collage jeden przełącznik zmienia każdą odbitkę w pocztówkę: twoje zdjęcie na jednej połowie, a na drugiej przerywane pole na znaczek i linie na wiadomość lub adres. Wpisz tekst czcionką maszynową albo napisz go ręcznie cienkim markerem permanentnym. Odbitka 10 × 15 mieści się w formatach pocztówek, które przyjmuje Deutsche Post."
pc_type_title: "Wpisane albo pisane ręcznie"
pc_type_text: "Wiadomość i adres mają własne linie, z pogrubieniem, kursywą i podkreśleniem, czcionką maszynową albo twoją własną. Jest każda litera języków europejskich zapisywanych alfabetem łacińskim, więc adres w Pradze czy Krakowie wydrukuje się tak, jak go wpiszesz. Wybierz atrament – czarny, niebieski, sepię lub czerwony – i dodaj u dołu małą linijkę z podpisem. Połowa ze zdjęciem działa jak w trybie Collage: biała ramka wokół albo zdjęcie aż do krawędzi."
collage_title: "Dwa zdjęcia na jednej odbitce"
collage_text: "Inspirowane aparatami half-frame na kliszę: odbitka 10 × 15 mieści dwa zdjęcia 10 × 7,5, więc komplet kosztuje o połowę mniej. Zdjęcia łączą się w pary po kolei, przeciągnięcie je zamienia, a aplikacja podpowiada rozmiar z białym marginesem, 6 × 9 cm dla zdjęcia 2:3. Cienka linia cięcia dzieli odbitkę na pół – albo wyłącz ją, by mieć pasek half-frame."
show_collage: "Tryb Kolażu: arkusze tak, jak się wydrukują, z proporcjami zdjęcia, podpowiadanym rozmiarem i linią cięcia"
collage_preview_title: "Zobacz odbitkę, zanim powstanie"
collage_preview_text: "Otwórz arkusz tak jak zdjęcie: duża odbitka, dokładnie taka, jaką zrobi kiosk, dwa zdjęcia obok siebie z datą i ramką. Wybierz zdjęcie klawiszem 1 lub 2, by je przyciąć lub obrócić, a strzałkami przeglądaj kolejne arkusze."
show_collage_preview: "Podgląd arkusza: nocny tramwaj i Muzeum Narodowe w Pradze na jednej odbitce 10 × 15"
simple_title: "Prosty: zostaw albo odrzuć, potem drukuj"
simple_text: "Jedno zdjęcie naraz, tak jak się wydrukuje. Klawisz z cyfrą nadaje look, w górę zostawia, w dół odrzuca, a następne pojawia się od razu. Wybierz format i datę na zdjęciu, potem wyeksportuj to, co zostawiłeś."
show_simple: "Tryb Prosty: zdjęcie tak, jak się wydrukuje, Zostaw i Odrzuć oraz Eksport zostawionych zdjęć"
swipe_title: "↑ do druku, ↓ na bok"
swipe_text: "Otwórz pierwsze zdjęcie i zdecyduj jednym klawiszem: ↑ wkłada je do koszyka do druku, ↓ odkłada na bok, a następne zdjęcie już jest na ekranie. Nic nigdy nie znika: koszyk i odłożone czekają w pasku bocznym, więc możesz zmienić zdanie."
select_title: "Albo zaznacz je w galerii"
select_text: "Zaznacz zmienia siatkę w pola wyboru, jak na iPhonie, a Shift+klik zaznacza cały ciąg. Przytrzymaj Spację nad zdjęciem, by zobaczyć je w dużym rozmiarze, dokładnie tak, jak się wydrukuje, potem puść i działaj dalej."
estimate_title: "Znaj rozmiar przed eksportem"
estimate_text: "Karta eksportu mówi, ile będą ważyć pliki, zanim cokolwiek zostanie zapisane, na podstawie kilku zdjęć zakodowanych z twoimi ustawieniami. Zdjęcia z aparatu udostępniane na Facebooka wychodzą około sześć razy lżejsze, a widzisz to, zanim klikniesz."
