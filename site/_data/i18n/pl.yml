wiki_title: "Wiki"
wiki_kicker: "Od pierwszego ekranu"
wiki_description: "Jak Fotollection wyrosło z pierwszego ekranu, wersja po wersji: co przyniosła każda z nich, z Fotollection takim, jakie zostało wydane."
wiki_lead: "Każda wersja, od dzisiejszej aż po pierwsze puste okno: co przyniosła i Fotollection takie, jakie zostało wydane, wzięte z historii projektu."
wiki_first: "Przejdź do pierwszego ekranu"
wiki_toc: "Wersje"
wiki_foot: "Każdy obraz to Fotollection takie, jakie wydała ta wersja, wzięte z historii projektu; najwcześniejsze są tylko po angielsku. Każda nowa wersja dodaje tu własny."
man_title: "Instrukcja"
man_kicker: "Pomoc"
man_description: "Jak używać Fotollection, krok po kroku, ze zrzutem ekranu do każdego kroku: wybór zdjęć do druku, looki i kolor, zoom, RAW, zegary aparatów, daty i miejsca, fotografowanie z podłączonym aparatem i każdy skrót."
man_lead: "Każdy krok tak, jak pokazuje go aplikacja. Instrukcja podąża za aplikacją: gdy nowa wersja zmienia coś, co widać, ta strona zmienia się razem z nią."
man_toc: "Rozdziały"
man_source: "Ta instrukcja na GitHubie"
cs_title: "Zasady podpisywania kodu"
cs_kicker: "Zaufanie"
cs_description: "Jak powstają i są publikowane instalatory Fotollection, kto zatwierdza każde wydanie i co aplikacja wysyła przez sieć, a czego nie."
cs_lead: "Instalatory nie są jeszcze podpisane certyfikatem: Windows przy pierwszym uruchomieniu pokazuje ostrzeżenie SmartScreen, kompilacje na macOS mają tylko podpis ad hoc, a AppImage i .deb dla Linuksa też nie są podpisane. Każde wydanie podaje sumy kontrolne SHA-256 w pliku SHA256SUMS.txt, więc możesz sprawdzić, że pobrany plik jest tym opublikowanym tutaj. Repozytorium APT pod adresem fotollection.org/apt jest podpisane kluczem GPG projektu, więc apt sprawdza każdy pakiet, który z niego instaluje."
cs_parts:
  - id: team
    title: "Role w zespole"
    lead: "Każdy instalator buduje GitHub Actions z publicznego repozytorium, z otagowanego wydania; nic, co zbudowano na prywatnym komputerze, nie jest publikowane. Workflow budowania to"
    items:
      - title: "Autorzy zmian i recenzenci"
        author: true
        text: "Pisze i recenzuje każdą zmianę w kodzie źródłowym."
      - title: "Zatwierdzający wydania"
        author: true
        text: "Ręcznie sprawdza i publikuje każde wydanie."
  - id: privacy
    title: "Polityka prywatności"
    lead: "Ten program nie przekaże żadnych informacji innym systemom sieciowym, chyba że wyraźnie zażąda tego użytkownik albo osoba, która go instaluje lub obsługuje."
    items:
      - title: "Działa offline"
        text: "Zdjęcia, foldery, projekty i ustawienia nigdy nie opuszczają twojego komputera. Nie ma konta, telemetrii ani wysyłania raportów o awariach."
      - title: "Sprawdzanie aktualizacji"
        text: "Jedyne zapytanie sieciowe: gdy klikniesz, a od v0.13.0 także raz przy starcie, chyba że wyłączysz to w Ustawieniach, aplikacja pyta GitHub (api.github.com) o najnowsze wydanie tego projektu. Nic nie jest pobierane samo. Dotyczy go oświadczenie o prywatności GitHuba."
      - title: "Bez lokalizacji w eksportach"
        text: "Współrzędne GPS są domyślnie usuwane z eksportowanych zdjęć."
        fn: [fn_gps]
      - title: "Ta strona"
        text: "Strona internetowa, a nie aplikacja, liczy odwiedziny i kliknięcia w linki do pobrania za pomocą Google Analytics; dotyczy jej polityka prywatności Google. Liczba pobrań pochodzi z GitHuba."
      - title: "Płatności na wsparcie"
        text: "Ko-fi, GitHub Sponsors i bank stojący za kodem VietQR przetwarzają płatności na wsparcie Fotollection, każdy według własnej polityki prywatności. Strona tylko do nich linkuje i niczego z nich nie wczytuje, a płatność nie ma nic wspólnego z aplikacją ani z twoimi danymi w Fotollection."
  - id: system
    title: "Zmiany w twoim systemie"
    lead: "Instalacja dodaje tylko to, czego aplikacja potrzebuje, a odinstalowanie to usuwa."
    items:
      - title: "Otwórz za pomocą"
        text: "Instalator, a na Linuksie pakiet .deb, dodaje Fotollection do menu Otwórz za pomocą dla plików zdjęć. Nigdy nie ustawia się jako aplikacja domyślna."
      - title: "Odinstalowanie"
        text: "Usuń ją w Ustawieniach systemu Windows albo skasuj aplikację na macOS. Deinstalator na Windows usuwa też wpisy Otwórz za pomocą. Na Linuksie uruchom sudo apt remove fotollection, usuń AppImage albo uruchom skrypt instalacyjny z --uninstall, który usuwa też repozytorium APT i jego klucz. Ustawienia i projekty zostają w twoim folderze domowym."
perf_title: "Wydajność"
perf_description: "Każdy pomiar stojący za Fotollection, wyjaśniony prostymi słowami: szybkość, pamięć, jakość druku, zdjęcia do mediów społecznościowych i podpowiedzi najlepszych ujęć, wraz z tym, co znaczą ΔE, SSIM, JPEG i profile kolorów."
perf_kicker: "Zmierzone, nie obiecane"
perf_lead: "Każda liczba na tej stronie pochodzi z prawdziwych zdjęć na zwykłym laptopie (Apple M3, 16 GB), a skrypty, które ją dały, są w repozytorium, więc każdy może uruchomić je ponownie. Pod każdym wykresem jest wyjaśnienie, co oznacza on dla twoich odbitek, a na końcu – słowa stojące za liczbami."
perf_how_title: "Dlaczego Fotollection jest szybkie"
perf_how_lead: "Żadnej magii. Kilka decyzji podjętych przed pierwszą linijką kodu, każda zmierzona."
perf_how_items:
  - { t: "Kod natywny na każdym rdzeniu", d: "Praca Fotollection odbywa się w Ruście, skompilowanym dla twojego procesora i rozłożonym na wszystkie jego rdzenie, z instrukcjami wektorowymi (SIMD), które procesory oferują do pikseli.", v: "23,5 / s", l: "eksportowanych zdjęć 16 MP", fn: [fn_simd, fn_units, fn_rust] }
  - { t: "Tylko to, co potrzebne", d: "Otwarcie folderu odczytuje EXIF każdego pliku i jego małą wbudowaną miniaturę, nigdy całe zdjęcie. Miniatury są trzymane w pamięci podręcznej na dysku.", v: "0,12 s", l: "na otwarcie 1000 zdjęć", fn: [fn_exif] }
  - { t: "Nigdy więcej pikseli niż ekran", d: "Podgląd ma najwyżej 1600 px i powstaje z kopii 2048 px trzymanej w pamięci. Pełne zdjęcie jest wczytywane dopiero przy powiększeniu, fragment po fragmencie.", v: "17 ms", l: "na odświeżenie podglądu" }
  - { t: "Gotowe, zanim klikniesz", d: "Gdy miniatury są gotowe, podgląd każdego zdjęcia jest przygotowywany w tle i trzymany na dysku, a jedna czwarta pamięci przechowuje zdjęcia wokół tego na ekranie.", v: "27 ms", l: "na otwarcie dowolnego zdjęcia" }
  - { t: "Nic nie jest robione dwa razy", d: "Suwak koloru zmienia tylko kolor, nigdy rozmiar. Wszystkie suwaki koloru są składane w jedną tablicę 33 × 33 × 33 kolorów, więc dziesięć suwaków kosztuje tyle co jeden.", v: "2 ms", l: "dla dziesięciu suwaków koloru na podglądzie" }
  - { t: "Pamięć w budżecie", d: "Fotollection pracuje naraz tylko na tylu pełnowymiarowych zdjęciach, na ile pozwala jego budżet pamięci, ustalany według największego zdjęcia w eksporcie.", v: "1,45 GB", l: "szczytowe zużycie pamięci przy 5035 zdjęciach" }
  - { t: "Kodery dostrojone pomiarami", d: "Pliki do druku pomijają optymalizację tablic, która zmniejszała je o mniej niż 1 %, a kosztowała jedną trzecią czasu kodowania.", v: "−33 %", l: "czasu kodowania plików do druku" }
  - { t: "Karta graficzna podczas edycji", d: "Gdy suwak koloru się przesuwa, karta graficzna rysuje z tablicy, którą buduje rdzeń. Eksporty zostają na procesorze, więc odbitka jest identyczna na każdym komputerze.", v: "1–2 ms", l: "na krok suwaka, zamiast 26 ms" }
perf_gpu_title: "Karta graficzna przy edycji, każdy rdzeń przy eksporcie"
perf_gpu_text: "Gdy przeciągasz suwak koloru, karta graficzna rysuje look z tej samej tablicy, którą buduje rdzeń Fotollection, a gdy go puścisz, przejmuje dokładny render. Eksporty zostają na procesorze, więc odbitka wychodzi taka sama na każdym komputerze."
gpu_stats:
  - { v: "1–2 ms", l: "krok suwaka na karcie graficznej, wobec około 26 ms" }
  - { v: "0,13", l: "ΔE2000 między lookiem z karty a dokładnym renderem" }
  - { v: "10,8", l: "zdjęcia 26 MP eksportowane na sekundę, sześć naraz" }
chart_gpu: "Jeden krok suwaka koloru: procesor wobec karty graficznej"
chart_inflight: "Szybkość eksportu a liczba zdjęć przetwarzanych naraz"
chart_open: "Otwieranie zdjęcia: v0.9.0 i v0.10.0 wobec v0.11.0, na 422 zdjęciach z jednej podróży"
perf_open_title: "Do 20× szybciej. Nowy sposób korzystania z pamięci."
perf_open_text: "v0.11.0 od nowa układa sposób, w jaki Fotollection przechowuje twoje zdjęcia. Podgląd każdego zdjęcia jest przygotowywany w tle, gdy tylko gotowa jest jego miniatura, i trzymany na dysku, jedna czwarta pamięci komputera przechowuje zdjęcia wokół tego, które widzisz, a zdjęcie na ekranie zawsze ma pierwszeństwo. Efekt: każde zdjęcie, bliskie czy dalekie, JPEG czy RAW, otwiera się w 27 milisekund. Otwarcie RAW-a jest do 20 razy szybsze niż w v0.9.0, a JPEG-a 10 razy szybsze, zmierzone na tych samych 422 zdjęciach z jednej podróży."
perf_open_fn: [fn_raw, fn_jpeg]
open_stats:
  - { v: "20×", l: "szybsze otwarcie zdjęcia RAW niż w v0.9.0 (531 → 27 ms)" }
  - { v: "10×", l: "szybsze otwarcie JPEG-a niż w v0.9.0 (274 → 27 ms)" }
  - { v: "27 ms", l: "na otwarcie dowolnego zdjęcia, bliskiego czy dalekiego (budżet 100 ms)" }
perf_speed_title: "Szybkość: tysiąc zdjęć w mgnieniu oka"
perf_speed_text: "Otwarcie folderu odczytuje EXIF każdego zdjęcia i jego małą wbudowaną miniaturę, a nie cały obraz, a zmiana ustawienia odświeża tylko podgląd. Natywny Rust wygrywa też z przeglądarką internetową wykonującą to samo zadanie: ta sama szybkość eksportu, szybszy podgląd i o jedną czwartą mniej pamięci."
speed_stats:
  - { v: "0,12 s", l: "na odczyt folderu z 1000 zdjęć, osiem razy poniżej budżetu" }
  - { v: "17 ms", l: "na odświeżenie podglądu po zmianie" }
  - { v: "23,5", l: "zdjęcia 16 MP eksportowane na sekundę" }
perf_memory_title: "Pamięć: 5035 zdjęć, a zużycie stoi w miejscu"
perf_memory_text: "Fotollection trzyma w pamięci tylko kilka bajtów na zdjęcie, zapisuje miniatury w pamięci podręcznej na dysku i pracuje naraz tylko na tylu pełnowymiarowych obrazach, ile mieści się w jego budżecie pamięci. Dlatego zużycie pamięci stoi w miejscu, nawet gdy podróż rośnie do tysięcy zdjęć."
memory_stats:
  - { v: "1,45 GB", l: "szczytowe zużycie pamięci przy 5035 zdjęciach" }
  - { v: "1,35 GB", l: "szczytowe zużycie pamięci przy 95 zdjęciach" }
  - { v: "53×", l: "więcej zdjęć za 0,1 GB więcej" }
perf_print_title: "Jakość druku: odbitka wygląda jak zdjęcie"
perf_print_text: "Odbitki zrobione przez edytor internetowy często wyglądają płasko: usuwa on profil kolorów, zmniejsza zdjęcie do 2000 px i zapisuje je w jakości 80 z kolorem w połowie rozdzielczości. Fotollection zachowuje profil i eksportuje w pełnej rozdzielczości w 4:4:4."
print_stats:
  - { v: "0,19", l: "błąd koloru; oko zaczyna go zauważać przy 1" }
  - { v: "4:4:4", l: "pełna rozdzielczość koloru; edytor internetowy ją połowi" }
  - { v: "87 %", l: "drobnych szczegółów, które edytor internetowy traci przy 2000 px" }
perf_share_title: "Zdjęcia na Facebooka i Instagrama: lekkie, a wciąż to samo zdjęcie"
perf_share_text: "Facebook zmniejsza każde zdjęcie do 2048 px, ponownie je kompresuje i ignoruje profile kolorów. Eksport do udostępniania najpierw porządnie wykonuje tę pracę, więc po Facebooku zdjęcie pozostaje bliższe sobie niż przy zwykłym sposobie."
