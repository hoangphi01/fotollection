faq_title: "Pytania przed pobraniem"
faq_lead: "Po co kolejna aplikacja do zdjęć i czym ta się wyróżnia."
faq_groups:
  - label: "Dlaczego Fotollection"
    items:
      - q: "Czemu nie po prostu Lightroom?"
        a: "Lightroom, wbudowane aplikacje Zdjęcia i IrfanView służą do edycji i przeglądania; żadna z nich nie powstała z myślą o drukowaniu zdjęć. Żeby z nimi drukować, sam przycinasz każde zdjęcie do proporcji papieru albo oddajesz pliki i zostawiasz kadrowanie maszynie lub obsłudze punktu, co często ucina głowę albo brzeg szyldu. Fotollection zaczyna od odbitki: zna formaty w dm i Rossmannie, przycina do nich każde zdjęcie, więc to, co widzisz, jest dokładnie tym, co wyjdzie, ostrzega, gdy zdjęcie jest za małe, dodaje datę jak aparat na kliszę i eksportuje pliki, które kiosk przyjmie. Jest lekkie i szybkie, darmowe i działa obok Lightrooma: oryginały nigdy się nie zmieniają, a twoje presety Lightroom działają w nim jako looki."
      - q: "Mój komputer ma już Zdjęcia albo używam IrfanView. Po co kolejna aplikacja?"
        a: "Wbudowane aplikacje Zdjęcia i IrfanView to świetne przeglądarki, każda w swoim systemie. Żadna nie zna wymiaru odbitki 10 × 15 w dm czy Rossmannie, nie ostrzeże, że zdjęcie jest na nią za małe, nie doda daty jak aparat na kliszę ani nie wyśle najlepszych ujęć z pięciu folderów do jednego koszyka do druku. Fotollection to robi, wygląda i działa tak samo na Macu, Windows i Linuksie i może być przeglądarką, którą otwierasz zdjęcia: prawy przycisk na zdjęciu, Otwórz za pomocą, Fotollection – także RAW z aparatu."
  - label: "Szybkość i rozmiar"
    items:
      - q: "Czy jest ciężka? Pójdzie na moim starszym laptopie?"
        a: "Jest mała: instalator na Windows ma około 18 MB, bo okno korzysta z widoku WWW, który system już ma, zamiast dołączać całą przeglądarkę. Rdzeń jest napisany w Ruście i działa bezpośrednio na twoim komputerze. Podgląd nigdy nie przekracza 1600 px, więc nawet zdjęcie 32 MP otwiera się tak szybko jak małe, a obraz w pełnym rozmiarze wczytuje się dopiero przy powiększeniu. Nawet przy eksporcie 5035 zdjęć zużycie pamięci dochodzi najwyżej do około 1,45 GB."
      - q: "Jak szybko działa z tysiącami zdjęć?"
        a: "Otwarcie 1000 zdjęć zajmuje około 0,12 s, bo Fotollection najpierw czyta małą miniaturę wbudowaną w każdy plik. Zmiana ustawienia odświeża podgląd w 17 ms, eksport idzie w tempie 18 pełnowymiarowych zdjęć na sekundę, a po pierwszym uruchomieniu aplikacja otwiera się w około 0,4 s. Każdą liczbę zmierzono na zwykłym laptopie, a strona Wydajność wyjaśnia, jak zmierzyć je samemu."
  - label: "Systemy i cena"
    items:
      - q: "Czy działa na Macu, Windows i Linuksie i czy naprawdę jest za darmo?"
        a: "Tak. Jedna wersja na macOS 11 lub nowszy, zarówno na Apple silicon, jak i Intel, jedna na Windows 10 i 11, a na 64-bitowego Linuksa AppImage lub .deb, na Intel/AMD lub ARM, dla każdej dystrybucji z glibc 2.35 lub nowszym. Linux dostaje lżejszą wersję: na razie bez zdjęć HEIC (z iPhone'a), bez fotografowania z aparatem przez USB, a RAW bez korekcji obiektywu, które dodaje macOS; tabela pod Funkcjami pokazuje każdą różnicę. Jest za darmo, bez reklam, bez konta i bez zakupów w aplikacji, a kod źródłowy jest publiczny na licencji GPL-3.0, więc każdy może sprawdzić, co robi."
        fn: [fn_heic, fn_arch, fn_linux_pkg]
tabs_row_title: "Foldery jako karty, zaznaczenia, które idą za tobą"
tabs_text: "Kliknij folder, by pracować tylko nad nim, albo Obszar roboczy, by mieć wszystkie foldery naraz. Zaznacz zdjęcia w jednym folderze, przejdź do innego i zaznaczaj dalej: pasek liczy wszystkie, więc najlepsze z każdego folderu trafiają do koszyka do druku jednym ruchem. Zaznacz kilka folderów, by wyeksportować je razem albo każdy do osobnego folderu, a gdy skończysz, zamknij kartę przyciskiem ×; zdjęcia zostają na dysku."
modes_title: "Trzy tryby, trzy zadania"
modes_lead: "Wybierz ten, który pasuje do tego, co chcesz zrobić – na górze paska bocznego lub skrótem Cmd/Ctrl+1, 2 i 3. Zdjęcia, koszyk do druku i ustawienia są takie same w każdym trybie."
mode_simple: "Prosty"
mode_simple_for: "Wracasz z podróży i chcesz szybko mieć odbitki."
