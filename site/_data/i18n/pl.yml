perf_trip_title: "Prawdziwa podróż: 422 pliki z Pragi"
perf_trip_text: "Zestawy testowe potrafią schlebiać, więc oto jeden folder dokładnie taki, jaki zszedł z aparatu Lumix GX9 po weekendzie w Pradze: 396 JPEG-ów 20 MP, każdy około 11 MB, i 26 plików RAW obok nich, łącznie 4,7 GB. Otwarcie go odczytuje EXIF każdego pliku w 0,23 sekundy. Podgląd renderuje się ponownie w 19 ms, RAW wywołuje się w 0,35 sekundy, a dziesięć pocztówek odświeża się w 21 ms. 2026-11-03 dwie liczby przekroczyły budżet na tych dużych plikach: eksport szedł w tempie 7,6 zdjęcia na sekundę, a szczytowe zużycie pamięci sięgnęło 2,14 GB. Przyczynę znaleziono i usunięto w v0.9.7: JPEG-i eksportują się teraz w tempie 10,1 na sekundę, a cały przebieg mieści się poniżej 1,31 GB."
trip_stats:
  - { v: "0,23 s", l: "na otwarcie wszystkich 422 plików, razem z EXIF" }
  - { v: "19 ms", l: "ponowny render podglądu, p95 (budżet 50 ms)" }
  - { v: "0,35 s", l: "na wywołanie RAW-a 20 MP (mediana)" }
  - { v: "21 ms", l: "na odświeżenie dziesięciu pocztówek (budżet 100 ms)" }
  - { v: "10,1 / s", l: "eksportowanych JPEG-ów (budżet 8 / s)" }
  - { v: "1,31 GB", l: "szczytowe zużycie pamięci, JPEG i RAW (pułap 2 GB)" }
fn_trip: "Praski folder należy do autora i nie jest publikowany (© @hoangphi01, wszelkie prawa zastrzeżone). Mediany z 3 przebiegów bench/trip.sh oraz measure_folder na jego JPEG-ach, na Apple M3 z 16 GB, przy otwartych innych aplikacjach, 2026-11-04, z eksportem z v0.9.7; uruchom je na własnym folderze, by porównać."
fn_simd: "SIMD (single instruction, multiple data – jedna instrukcja, wiele danych) pozwala procesorowi pracować na wielu wartościach naraz: jedna instrukcja działa na kilku liczbach ułożonych obok siebie w szerokim rejestrze wektorowym, na przykład na czerwieni, zieleni i błękicie wielu pikseli. Procesory Intel i AMD zapewniają je jako SSE i AVX, a Apple silicon i inne procesory Arm jako NEON. Intel, AMD i Arm są znakami towarowymi ich właścicieli."
fn_pct: "p50 i p95 to percentyle: p50, czyli mediana, to czas, w którym zmieściła się połowa przebiegów; p95 to czas, w którym zmieściło się 95 przebiegów na 100, więc pokazuje wolne przypadki, które ukrywa średnia."
fn_psnr: "PSNR (szczytowy stosunek sygnału do szumu, peak signal-to-noise ratio) porównuje dwa obrazy piksel po pikselu i podaje ich różnicę w decybelach: im wyżej, tym bliżej. Powyżej około 40 dB różnicę trudno zobaczyć."
fn_sensor: "CMOS i CCD to dwa rodzaje matryc, czyli siatek światłoczułych komórek, które zamieniają światło w ładunek elektryczny. Prawie każdy dzisiejszy aparat i telefon używa CMOS (complementary metal-oxide-semiconductor); CCD (charge-coupled device) było powszechne we wcześniejszych aparatach."
fn_tiff: "TIFF (Tagged Image File Format) to elastyczny format obrazu, dziś utrzymywany przez Adobe; wiele formatów RAW, w tym DNG, opiera się na jego strukturze."
fn_gpg: "GPG (GNU Privacy Guard) to wolna implementacja standardu OpenPGP. Repozytorium APT jest podpisane kluczem GPG, więc twój system może sprawdzić, że każdy pakiet pochodzi właśnie z niego i nie został zmieniony."
fn_rust: "Rust i logo Rust są znakami towarowymi Rust Foundation. Rdzeń Fotollection jest napisany w Ruście i działa bezpośrednio na twoim komputerze."
fn_webview: "Okno aplikacji jest zbudowane w Tauri i rysowane przez własny widok WWW systemu: WebKit (WKWebView) na macOS, Microsoft Edge WebView2 na Windows i WebKitGTK, czyli port WebKit dla GTK, na Linuksie. Tauri to projekt Tauri Programme w ramach Commons Conservancy; WebKit jest znakiem towarowym Apple Inc.; GTK to projekt GNOME Foundation; Microsoft Edge i WebView2 są znakami towarowymi Microsoft Corporation. Porównanie z przeglądarką wykonało to samo zadanie w Chromium 156 bez interfejsu (headless), projekcie open source, na którym opiera się Google Chrome, z jednym Web Workerem na rdzeń procesora."
fn_de: "ΔE2000 (CIEDE2000) to wzór na różnicę barw Międzynarodowej Komisji Oświetleniowej (CIE), ustandaryzowany jako ISO/CIE 11664-6; przestrzeń barw CIELAB, w której działa, to ISO/CIE 11664-4."
fn_ssim: "SSIM wprowadzili Zhou Wang, Alan C. Bovik, Hamid R. Sheikh i Eero P. Simoncelli w pracy Image quality assessment: from error visibility to structural similarity, IEEE Transactions on Image Processing, 13(4), 2004."
fn_srgb: "sRGB stworzyły HP i Microsoft w 1996 roku, a ustandaryzowano je jako IEC 61966-2-1."
fn_p3: "Display P3 to przestrzeń barw zdefiniowana przez Apple Inc., oparta na przestrzeni DCI-P3 branży kinowej (SMPTE)."
fn_adobe: "Adobe RGB (1998) to przestrzeń barw określona przez Adobe Inc.; Adobe jest zarejestrowanym znakiem towarowym Adobe Inc."
fn_charts: "Każdy wykres: liczby są orientacyjne, zmierzone na zwykłym laptopie (Apple M3, 16 GB); twoje zależą od komputera, którego używasz."
fn_dng: "Adobe DNG Converter nie był uruchamiany na potrzeby tej strony. Ta liczba to szacunek z zewnętrznego źródła (1000 plików CR3 w 20–30 minut na nowoczesnym sprzęcie, bez podania maszyny), z wpisu na blogu convertintomp4.com o wsadowej konwersji RAW do DNG. Adobe jest zarejestrowanym znakiem towarowym Adobe Inc."
