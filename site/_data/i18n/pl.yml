fn_back: "Wróć do tekstu"
fn_open: "Za darmo znaczy: bez ceny, bez reklam i bez zakupów w aplikacji; postawienie autorowi kawy to twój wybór i pomaga mu dalej ulepszać Fotollection. Open source znaczy, że pełny kod źródłowy jest publiczny na GitHubie na licencji GPL-3.0, więc każdy może go przeczytać, zbudować i sprawdzić, co robi aplikacja. Bez konta znaczy, że aplikacja nigdy nie pyta, kim jesteś, i nie ma się do czego logować."
fn_photo: "Zdjęcie tramwaju jest autorstwa twórcy aplikacji (© @hoangphi01, wszelkie prawa zastrzeżone), zrobione aparatem Lumix GX9 w Pradze w listopadzie 2026; każdy look renderuje własny silnik Fotollection, bez retuszu gdziekolwiek indziej."
fn_downloads: "Liczone przez GitHub."
