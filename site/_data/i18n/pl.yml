distro_lead: "Fotollection działa na 64-bitowym Linuksie, x86_64 lub ARM64, z glibc 2.35 lub nowszym."
distro_groups:
  - title: "Działa"
    items:
      - text: "AppImage: Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Pop!_OS 22.04+, elementary OS 7+, Zorin OS 17+, Fedora 36+, openSUSE Tumbleweed, Arch, Manjaro i inne z tego okresu."
      - text: ".deb i repozytorium APT: Ubuntu, Debian, Mint, Pop!_OS, elementary OS i Zorin OS."
  - title: "Działa po jednym kroku"
    items:
      - text: "Ubuntu 24.04 i nowsze: AppImage raz potrzebuje FUSE 2,"
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: " albo uruchom go z"
        code2: "--appimage-extract-and-run"
        after2: ". Pakiet .deb nie potrzebuje niczego."
      - text: "NixOS: uruchom przez"
        code: appimage-run
      - text: "Fedora Silverblue i inne systemy niezmienne: użyj AppImage."
      - text: "Grafika NVIDIA: nic nie trzeba robić, aplikacja sama omija problem pustego okna w WebKit."
        fn: [fn_nvidia]
  - title: "Nie działa"
    items:
      - text: "glibc starsze niż 2.35: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky lub Alma 8, openSUSE Leap 15."
      - text: "Systemy z musl, takie jak Alpine."
      - text: "Komputery 32-bitowe."
      - text: "ChromeOS bez kontenera Linuksa."
  - title: "Ograniczenia na każdej dystrybucji"
    items:
      - text: "Na razie bez zdjęć HEIC (z iPhone'a): najpierw przekonwertuj je do JPEG."
        fn: [fn_pf_heic_linux]
      - text: "Bez fotografowania z aparatem przez USB."
      - text: "RAW otwiera się bez korekcji obiektywu, które dodaje macOS."
        fn: [fn_pf_raw]
