perf_explain_lead: "Żargon fotograficzny i drukarski, wyjaśniony tak, jak wyjaśnilibyśmy go przyjacielowi."
perf_faq:
  - q: "Co to jest ΔE (Delta E)?"
    fn: [fn_de]
    a: "ΔE mierzy, jak bardzo dwa kolory różnią się dla ludzkiego oka, liczone w przestrzeni barw zbudowanej tak, by odpowiadała temu, jak widzimy (CIELAB, ze wzorem z 2000 roku). 0 oznacza kolory identyczne. Około 1 to najmniejsza różnica, jaką wprawne oko dostrzeże, patrząc na nie obok siebie; od 2 do 3 widzi większość ludzi; powyżej 5 kolory wyglądają na różne. Eksport do druku w Fotollection daje średnio 0,19."
  - q: "Co to jest SSIM?"
    fn: [fn_ssim]
    a: "SSIM, wskaźnik podobieństwa strukturalnego, porównuje kształty i faktury dwóch obrazów, a nie pojedyncze piksele, co jest bliższe temu, jak zauważamy rozmycie albo blokową kompresję. 1 oznacza obrazy identyczne. Powyżej około 0,98 większość ludzi nie odróżni ich bez powiększenia."
  - q: "Ile kolorów mieści JPEG?"
    fn: [fn_jpeg, fn_heic]
    a: "JPEG zapisuje po 8 bitów na czerwony, zielony i niebieski: po 256 poziomów na każdy, czyli około 16,7 miliona kolorów. Z tego drukują też laboratoria fotograficzne. Pliki RAW z aparatu mają od 12 do 14 bitów, a nowsze iPhone'y potrafią zapisywać 10-bitowe HEIC, co pomaga przy edycji; na gotowej odbitce dobrze zrobiony 8-bitowy JPEG nie pokazuje schodków między tonami."
  - q: "JPG czy JPEG? I czy używać PNG?"
    a: "JPG i JPEG to ten sam format: stary Windows pozwalał tylko na trzyliterowe rozszerzenia. PNG jest bezstratny, więc nic nie zostaje odrzucone, ale zdjęcie zapisane jako PNG jest często od trzech do pięciu razy większe, a większość kiosków i laboratoriów oczekuje JPEG-a. JPEG w jakości 90 lub wyższej z pełną rozdzielczością koloru (4:4:4), taki, jaki Fotollection eksportuje do druku, jest na papierze nie do odróżnienia od oryginału."
  - q: "Co znaczą 4:4:4 i 4:2:0?"
    a: "Nasze oczy widzą szczegóły głównie w jasności, mniej w kolorze, więc JPEG może zapisać kolor w niższej rozdzielczości. 4:4:4 zachowuje pełną rozdzielczość koloru; 4:2:0 jej jedną czwartą, co zmniejsza pliki, ale zmiękcza kolorowe krawędzie, takie jak czerwony tekst albo niebieskie niebo za liśćmi. Odbitki zasługują na 4:4:4; media społecznościowe i tak kompresują wszystko ponownie do 4:2:0."
  - q: "sRGB, Display P3, Adobe RGB i profile kolorów"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "Profil kolorów mówi programowi, co znaczą liczby w pliku. sRGB to klasyczny zakres kolorów używany w internecie. Display P3, używany przez iPhone'y i nowsze aparaty, obejmuje około 25 % więcej kolorów, zwłaszcza czerwieni i zieleni. Jeśli zdjęcie P3 straci profil, jego liczby są czytane jako sRGB i wygląda ono na wyblakłe: to właśnie zmierzona przez nas utrata 13 % nasycenia. Adobe RGB, które niektóre aparaty oferują do pracy pod druk, też jest szersze niż sRGB, głównie w zieleniach i cyjanach. Fotollection zachowuje przy odbitkach profil, jaki ma zdjęcie, i poprawnie konwertuje do sRGB dla mediów społecznościowych."
  - q: "Ile DPI potrzebuje odbitka?"
    a: "DPI to liczba pikseli przypadających na każdy cal papieru. Przy 300 DPI odbitka wygląda ostro nawet z bliska; od 150 do 200 DPI wystarcza z odległości wyciągniętej ręki. Odbitka 10 × 15 cm przy 300 DPI potrzebuje 1800 × 1200 pikseli, więc wystarczy każde zdjęcie z telefonu czy aparatu; podpowiedź rozmiaru w aplikacji mówi, jak duże może być każde zdjęcie."
  - q: "Dlaczego zdjęcia wyglądają gorzej na Facebooku?"
    a: "Facebook zmniejsza każde zdjęcie do najwyżej 2048 px, kompresuje je ponownie w niższej jakości z kolorem w połowie rozdzielczości i usuwa profile kolorów. Zdjęcie, które przychodzi za duże, jest zmniejszane dwa razy: raz przez ciebie, raz przez Facebooka. Gdy wyślesz je już w 2048 px, w sRGB i lekko wyostrzone, Facebook kompresuje je tylko raz, a kolory są już właściwe."
