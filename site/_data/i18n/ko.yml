faq_title: "다운로드하기 전에."
faq_lead: "왜 또 다른 사진 앱인지, 무엇이 다른지."
faq_groups:
  - label: "왜 Fotollection인가"
    items:
      - q: "Lightroom이면 충분하지 않나요?"
        a: "Lightroom, 운영체제 기본 사진 앱, IrfanView는 편집과 감상을 위한 앱이고, 사진 프린트를 위해 만들어지지 않았습니다. 이런 앱으로 프린트하려면 모든 사진을 직접 용지 비율에 맞춰 자르거나, 파일을 그대로 넘겨 매장의 기계나 직원에게 맡겨야 하는데, 그러면 머리나 간판 끝이 잘리는 일이 흔합니다. Fotollection은 프린트에서 출발합니다. CU, GS25 등 편의점에 있는 프린팅박스 키오스크의 크기를 알고 있고, 사진을 그 크기에 맞춰 자르기 때문에 보이는 그대로 프린트됩니다. 사진이 너무 작으면 알려 주고, 필름 카메라처럼 날짜를 넣고, 키오스크가 받는 파일로 내보냅니다. 가볍고 빠르며 무료이고, Lightroom과 함께 쓸 수 있습니다. 원본 사진은 절대 바뀌지 않고, Lightroom 프리셋은 룩으로 쓸 수 있습니다."
      - q: "컴퓨터에 이미 사진 앱이 있고, IrfanView도 씁니다. 왜 또 다른 앱인가요?"
        a: "운영체제 기본 사진 앱과 IrfanView는 각자의 운영체제에서 훌륭한 뷰어입니다. 하지만 편의점 프린팅박스의 4×6 프린트가 어떤 크기인지 모르고, 사진이 그 크기에 너무 작아도 알려 주지 않으며, 필름 카메라처럼 날짜를 넣지도, 다섯 폴더의 베스트 샷을 하나의 프린트 바구니에 모으지도 못합니다. Fotollection은 이 모든 것을 할 수 있고, Mac에서도 Windows에서도 Linux에서도 같은 모습과 사용감으로 작동합니다. 사진을 여는 뷰어로도 쓸 수 있습니다. 사진을 오른쪽 클릭하고 ‘연결 프로그램’에서 Fotollection을 고르면 되고, 카메라 RAW도 열립니다."
  - label: "속도와 가벼움"
    items:
      - q: "무겁지 않나요? 오래된 노트북에서도 돌아가나요?"
        a: "작습니다. Windows 설치 파일은 약 18 MB입니다. 브라우저를 통째로 담지 않고, 운영체제에 이미 있는 웹 뷰로 창을 그리기 때문입니다. 코어는 Rust로 작성되어 컴퓨터에서 직접 실행됩니다. 미리 보기는 최대 1600 px라서 32 MP 사진도 작은 사진만큼 빠르게 열리고, 원본 크기의 이미지는 확대할 때만 불러옵니다. 사진 5,035장을 내보낼 때도 메모리 최대치는 약 1.45 GB입니다."
      - q: "사진이 수천 장이면 얼마나 빠른가요?"
        a: "사진 1,000장을 여는 데 약 0.12초가 걸립니다. Fotollection은 먼저 각 파일에 들어 있는 작은 썸네일을 읽기 때문입니다. 설정을 바꾸면 17 ms에 미리 보기를 다시 그리고, 내보내기는 원본 크기 사진을 초당 18장 처리하며, 처음 실행한 뒤에는 약 0.4초에 열립니다. 모든 수치는 평범한 노트북에서 측정했고, 직접 측정하는 방법은 성능 페이지에서 설명합니다."
  - label: "운영체제와 가격"
    items:
      - q: "Mac, Windows, Linux에서 작동하나요? 정말 무료인가요?"
        a: "네. macOS 11 이상용(Apple 실리콘과 Intel 모두) 하나, Windows 10과 11용 하나가 있고, 64비트 Linux용으로는 AppImage 또는 .deb가 있어 Intel/AMD든 ARM이든 glibc 2.35 이상인 모든 배포판에서 작동합니다. Linux 버전은 가벼운 빌드로, HEIC(iPhone) 사진은 아직 지원하지 않고, USB로 연결한 카메라로 촬영할 수 없으며, RAW에는 macOS가 더하는 렌즈 보정이 없습니다. 모든 차이는 ‘기능’ 아래의 표에 있습니다. 광고, 계정, 앱 내 구매 없이 무료이고, 소스 코드는 GPL-3.0으로 공개되어 있어 누구나 앱이 무엇을 하는지 확인할 수 있습니다."
tabs_row_title: "폴더는 탭으로. 체크는 어디서나."
tabs_text: "폴더를 클릭하면 그 폴더만, 작업 공간을 클릭하면 모든 폴더를 한꺼번에 다룹니다. 한 폴더에서 사진을 체크하고 다른 폴더로 옮겨 가도 계속 체크할 수 있습니다. 막대가 모두 세어 주니, 폴더마다 고른 베스트를 한 번에 프린트 바구니로 보낼 수 있습니다. 여러 폴더를 체크해 한꺼번에, 또는 폴더별로 내보내고, 끝나면 × 로 탭을 닫으세요. 사진은 디스크에 그대로 남습니다."
modes_title: "세 가지 모드. 세 가지 일."
modes_lead: "하고 싶은 일에 맞는 모드를 사이드바 위쪽이나 Cmd/Ctrl+1, 2, 3으로 고르세요. 사진, 프린트 바구니, 설정은 어느 모드에서나 같습니다."
mode_simple: "심플"
mode_simple_for: "여행에서 돌아와, 빨리 프린트하고 싶을 때."
mode_simple_s1: "사진 폴더를 앱에 끌어다 놓습니다."
mode_simple_s2: "숫자 키로 룩. ↑ 로 남기고, ↓ 로 옆에 둡니다."
mode_simple_s3: "프린트 크기와 날짜를 고르고, 내보내기."
mode_collage: "콜라주"
mode_collage_for: "프린트 한 장에 사진 두 장으로 절반 가격에. 또는 엽서로."
mode_collage_s1: "쓰고 싶은 사진을 프린트 바구니에 넣습니다."
mode_collage_s2: "두 장씩 한 프린트에. 드래그로 자리 바꾸기."
mode_collage_s3: "엽서를 켜서 우편으로 보낼 수 있게. 그리고 내보내기."
mode_pro: "Pro"
mode_pro_for: "수백 장의 사진을, 꼼꼼하게 골라 마무리."
mode_pro_s1: "별점, 플래그, 연사마다 가장 선명한 한 장."
mode_pro_s2: "자르기, 수평 맞추기, 날짜 표시, 정보 프레임."
mode_pro_s3: "키오스크용으로, 또는 가볍게 SNS 공유용으로 내보내기."
modes_manual: "매뉴얼 전체"
postcard_title: "내 사진이, 엽서로."
postcard_text: "콜라주 모드에서는 스위치 하나로 모든 프린트가 엽서가 됩니다. 한쪽에는 내 사진, 다른 쪽에는 점선 우표 칸과 메시지나 주소를 쓸 줄. 타자기 글꼴로 입력하거나, 가는 유성 펜으로 직접 쓸 수도 있습니다. 10 × 15 프린트는 우체국 엽서 규격(90–120 × 140–170 mm) 안에 들어갑니다."
pc_type_title: "타자로도, 손글씨로도"
pc_type_text: "메시지와 주소에는 각각 전용 줄이 있고, 굵게·기울임·밑줄을 쓸 수 있으며, 타자기 글꼴이나 내 글꼴로 씁니다. 라틴 문자로 쓰는 유럽 언어의 글자가 모두 있어서, 프라하나 크라쿠프의 주소도 입력한 그대로 프린트됩니다. 잉크는 검정·파랑·세피아·빨강 중에서 고르고, 아래에 작은 크레디트 줄도 넣을 수 있습니다. 사진 쪽은 콜라주 모드와 같이, 둘레에 흰 테두리를 두거나 가장자리까지 사진으로 채웁니다."
collage_title: "프린트 한 장에, 사진 두 장."
collage_text: "하프 프레임 필름 카메라에서 얻은 아이디어. 10 × 15 프린트 한 장에 10 × 7.5 사진 두 장이 들어가니, 한 세트의 비용이 절반이 됩니다. 사진은 순서대로 짝을 이루고, 드래그로 자리를 바꿀 수 있습니다. 앱은 흰 테두리를 둔 크기를 제안하며, 2:3 사진이라면 6 × 9 cm입니다. 가는 절취선으로 프린트를 둘로 나누거나, 선 없이 하프 프레임 스트립으로 만들 수도 있습니다."
show_collage: "콜라주 모드: 프린트될 모습 그대로의 시트, 사진 비율, 제안 크기, 절취선과 함께"
collage_preview_title: "프린트하기 전에, 확인하세요."
collage_preview_text: "시트를 사진처럼 열 수 있습니다. 키오스크가 만들어 낼 모습 그대로 크게, 두 사진이 날짜 표시와 테두리와 함께 나란히 보입니다. 1이나 2로 사진 하나를 골라 자르거나 돌리고, 다른 시트는 방향 키로 넘겨 봅니다."
show_collage_preview: "시트 미리 보기: 밤의 트램과 프라하 국립 박물관을 10 × 15 프린트 한 장에"
simple_title: "남기거나, 빼거나. 그리고 프린트."
simple_text: "한 번에 한 장씩, 프린트될 모습 그대로. 숫자 키로 룩을 입히고, ↑ 로 남기고, ↓ 로 빼면 바로 다음 사진이 나옵니다. 크기와 날짜를 고르고, 남긴 사진을 내보내세요."
show_simple: "심플 모드: 프린트될 모습 그대로의 사진, 남기기와 빼기, 남긴 사진 내보내기"
swipe_title: "↑ 는 프린트로, ↓ 는 옆으로"
swipe_text: "첫 사진을 열고 키 하나로 정하세요. ↑ 는 프린트 바구니로, ↓ 는 옆으로 보내고, 다음 사진이 이미 화면에 있습니다. 아무것도 지워지지 않습니다. 바구니와 옆에 둔 사진은 사이드바에서 기다리니, 마음을 바꿀 수도 있습니다."
select_title: "갤러리에서 체크해도"
select_text: "‘선택’을 누르면 그리드가 iPhone처럼 체크 상자로 바뀌고, Shift 클릭으로 연사를 한꺼번에 고를 수 있습니다. 사진 위에서 스페이스 키를 누르고 있으면 프린트될 모습 그대로 크게 보이고, 손을 떼면 이어서 계속합니다."
estimate_title: "내보내기 전에, 크기를 알 수 있습니다."
estimate_text: "내보내기 카드는 파일을 쓰기 전에 얼마나 무거울지 알려 줍니다. 내 설정으로 사진 몇 장을 인코딩해 추정합니다. Facebook용 카메라 사진은 약 6분의 1로 가벼워지고, 클릭하기 전에 그것을 알 수 있습니다."
nav_numbers: "성능"
nav_privacy: "개인 정보"
nav_kiosk: "사진 인화"
changelog_title: "새로운 기능"
changelog_lead: "출시한 모든 버전을, 여기서 받는 최신 버전부터 차례로."
changelog_latest: "최신 릴리스"
changelog_full: "GitHub의 전체 변경 내역"
changelog_hint: "클릭해서 스크롤"
support_title: "커피로 응원하기."
support_text: "Fotollection은 사진 찍기는 좋아하지만 찍은 사진을 고르는 일은 번거로워하는 한 사람이 만듭니다. 무료이고 오픈 소스입니다. 사진을 고르는 저녁 시간을 덜어 주었다면, 커피 한 잔이 개발을 이어 가는 힘이 됩니다."
support_sponsor: "GitHub에서 후원하기"
support_kofi: "커피 한 잔으로 응원하기"
support_kofi_sub: "Ko-fi · 카드/PayPal"
support_note_card: "₩5,000 정도면 충분합니다. Ko-fi 페이지는 영어로 되어 있습니다. ‘Tip’을 누르고 금액(유로로 표시)을 고른 뒤, 카드나 PayPal로 결제하세요. GitHub Sponsors는 카드로, 한 번 또는 매달 후원할 수 있습니다."
kiosk_title: "그대로 프린트:"
kiosk_and: "·"
kiosk_lead: "CU와 GS25 등 편의점의 프린팅박스 키오스크는 사진을 4×6(10 × 15 cm) 크기로 프린트합니다. Fotollection에는 이 크기가 들어 있어서 보이는 그대로 프린트되고, 가장자리가 뜻밖에 잘려 나가는 일이 없습니다."
kiosk_standard: "일반 사진"
kiosk_square: "정사각형"
kiosk_strip: "스트립"
kiosk_more: "내 사진의 비율(자르기 없음)이나, cm 또는 인치로 정하는 원하는 크기로도"
kiosk_steps_title: "여행에서 프린트까지"
kiosk_s1: "베스트 샷을 고르고, 프린트 크기를 정합니다."
kiosk_s2: "폴더나 USB 메모리로 내보내거나, 이메일로 보냅니다."
kiosk_s3: "편의점의 프린팅박스 키오스크에서 프린트합니다."
fn_title: "주석"
fn_label: "주석"
fn_back: "본문으로 돌아가기"
fn_open: "무료란 가격도, 광고도, 앱 내 구매도 없다는 뜻입니다. 만든 사람에게 커피를 사 줄지는 자유이며, Fotollection을 계속 발전시키는 힘이 됩니다. 오픈 소스란 소스 코드 전체가 GitHub에 GPL-3.0 라이선스로 공개되어 있어, 누구나 읽고 빌드하고 앱이 무엇을 하는지 확인할 수 있다는 뜻입니다. 계정 없음이란 앱이 당신이 누구인지 묻지 않고, 로그인할 것도 없다는 뜻입니다."
fn_photo: "트램 사진은 만든 사람이 직접 찍은 것으로(© @hoangphi01, 무단 전재 금지), 2026년 11월 프라하에서 Lumix GX9로 촬영했습니다. 모든 룩은 Fotollection 자체 엔진으로 렌더링했으며, 다른 곳에서 보정하지 않았습니다."
fn_downloads: "GitHub 집계 기준."
compare_title: "다른 앱과 비교하면."
compare_lead: "Fotollection은 본격적인 RAW 편집기를 대신하려 하지 않습니다. 그런 앱이 남겨 두는 단계, 여행 폴더에서 손에 쥘 수 있는 프린트까지를 위해 만들었습니다."
compare_caption: "Fotollection과 Lightroom Classic, darktable, RawTherapee 비교"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["용도", "여행 사진을 고르고, 날짜를 넣고, 프린트 크기에 맞추기", "카탈로그, 현상, 프린트, 공유까지 이어지는 전체 워크플로", "사진 워크플로와 RAW 현상", "RAW 현상"], ["주소 면이 있는 엽서", "있음", "없음", "없음", "없음"], ["사진에 날짜와 장소", "있음, 필름 감성", "없음", "있음, 워터마크", "없음"], ["사진관 프린트 크기로 자르기", "있음, 선명도 확인 포함", "있음, 프린트 모듈", "있음, 프린트 보기", "없음"], ["연사 중 베스트 샷", "있음, 눈을 뜬 가장 선명한 한 장", "있음, Assisted Culling", "없음", "없음"], ["한 장씩 남기기 또는 빼기", "있음, 심플 모드", "있음, 플래그", "있음, 별점", "있음, 순위"], ["프린트 한 장에 사진 두 장", "있음", "있음", "있음", "없음"], ["탭 한 번으로 룩", "있음", "있음, 프리셋", "있음, 스타일", "있음, 프로파일"], ["Lightroom 프리셋", "있음, 가져오기", "있음", "없음", "없음"], ["LUT", "있음, .cube와 HaldCLUT", "프로파일로", "있음", "있음, HaldCLUT"], ["RAW 현상", "있음", "있음", "있음", "있음"], ["가격", "무료", "Creative Cloud 구독", "무료", "무료"], ["소스 코드", "공개, GPL-3.0", "비공개", "공개, GPL-3.0 이상", "공개, GPL-3.0"], ["운영체제", "macOS, Windows, Linux", "macOS, Windows", "macOS(Apple 실리콘), Windows, Linux", "macOS, Windows, Linux"], ["계정", "필요 없음", "Adobe 계정", "필요 없음", "필요 없음"]]
compare_note: "더 나아가려면, 가장 깊은 RAW 현상에는 darktable과 RawTherapee, 평생의 사진을 하나의 카탈로그로 관리하려면 Lightroom."
fn_lightroom: "Adobe, Lightroom, Lightroom Classic은 미국 및 기타 국가에서 Adobe Inc.의 상표입니다. Fotollection은 Adobe와 제휴하거나 Adobe의 승인을 받지 않았으며, Lightroom 사용자가 이미 아는 단축키와 레이아웃을 따릅니다. Lightroom 로고는 문자 로고로서 퍼블릭 도메인인 Wikimedia Commons의 것을 사용했습니다."
fn_lut: "LUT(룩업 테이블)는 각 색이 어떤 색이 될지를 정한 표입니다. Fotollection은 .cube 파일과 HaldCLUT 이미지를 읽습니다. LUMIX는 Panasonic Holdings Corporation의 상표입니다. Fotollection은 Panasonic과 제휴하거나 Panasonic의 승인을 받지 않았습니다."
fn_compare: "Creative Cloud는 Adobe Inc.의 상표입니다. darktable과 RawTherapee는 각자의 커뮤니티가 만드는 자유 소프트웨어 프로젝트입니다. 정보는 darktable.org와 그 사용자 매뉴얼, rawtherapee.com, Adobe의 Lightroom Classic 도움말, Wikipedia의 Adobe 라이선스와 요구 사항 요약에서 가져왔으며, 2026년 11월 14일에 확인했습니다. Fotollection은 이들 중 어느 것과도 관계가 없습니다."
fn_privacy_site: "이는 앱에 관한 설명입니다. 이 웹사이트는 Google 애널리틱스로 방문 수를 익명으로 셉니다(국가와 페이지별). 개인과 연결하지 않습니다."
fn_exif: "EXIF(Exchangeable Image File Format)는 일본의 JEITA와 CIPA가 관리하는 표준으로, 카메라가 사진마다 기록하는 정보를 정합니다. 카메라와 렌즈, 날짜와 시간, 노출, 흔히 GPS 위치, 그리고 작은 내장 썸네일입니다."
fn_units: "단위: px는 픽셀로, 이미지를 이루는 점 하나입니다. MP(메가픽셀)는 100만 픽셀로, 20 MP 사진은 약 5472 × 3648 px입니다. ms는 밀리초로, 1초의 1000분의 1입니다. MB와 GB는 메가바이트와 기가바이트입니다. RAM(랜덤 액세스 메모리)은 컴퓨터의 작업용 메모리입니다."
fn_raw: "RAW 파일에는 카메라가 이미지로 바꾸기 전에 센서가 기록한 것이 담겨 있어서, 색, 밝기, 디테일을 필름을 현상하듯 나중에 정할 수 있습니다. 제조사마다 고유한 형식이 있으며(Canon은 CR3, Nikon은 NEF, Sony는 ARW, Panasonic은 RW2 등), DNG(Digital Negative)는 Adobe가 공개한 개방형 RAW 형식입니다."
fn_heic: "HEIF(High Efficiency Image File Format)는 ISO/IEC 23008-12의 이미지 형식이고, HEIC는 이를 HEVC(H.265)로 압축한 것으로 iPhone이 기본으로 사진을 저장하는 형식입니다. HEIC 사진은 비슷한 품질의 JPEG의 약 절반 크기입니다."
fn_png: "PNG(Portable Network Graphics)는 ISO/IEC 15948로 공개된 무손실 이미지 형식입니다. 모든 픽셀이 그대로 남아 그래픽과 스크린샷에 알맞지만, 사진은 JPEG보다 몇 배나 커집니다."
fn_arch: "x86_64(amd64라고도 함)는 대부분의 Windows·Linux PC의 프로세서 아키텍처입니다. ARM64(aarch64, arm64라고도 함)는 Apple 실리콘, 많은 노트북, Raspberry Pi 같은 작은 보드의 아키텍처입니다. 각각 전용 빌드가 필요합니다."
fn_linux_pkg: ".deb는 Debian 패키지로, Debian, Ubuntu, Linux Mint와 그 계열의 설치 형식입니다. APT(Advanced Package Tool)가 저장소에서 이런 패키지를 설치하고 업데이트합니다. AppImage는 앱과 실행에 필요한 모든 것을 담은 파일 하나로, 대부분의 배포판에서 설치 없이 실행됩니다."
fn_fuse: "FUSE(Filesystem in Userspace)를 쓰면 프로그램이 커널을 바꾸지 않고 파일 시스템을 제공할 수 있습니다. AppImage는 이를 이용해 자기 자신을 열며, Ubuntu 24.04부터는 그 버전 2가 기본으로 설치되지 않습니다."
fn_sha: "SHA-256은 SHA-2 계열의 암호학적 해시 함수로, 미국 NIST가 FIPS 180-4로 표준화했습니다. 파일에서 64자의 지문을 만들며, 파일이 1비트라도 바뀌면 지문도 바뀝니다."
fn_jpeg: "JPEG는 Joint Photographic Experts Group의 이미지 형식으로, ISO/IEC 10918-1 및 ITU-T T.81로 표준화되었습니다."
fn_pf_raw: "macOS에서는 DNG를 제외한 RAW 형식을 운영체제가 렌즈 보정과 함께 현상합니다. Linux와 Windows에서는 Fotollection에 내장된 리더가 렌즈 보정 없이 처리합니다. Windows에서는 Microsoft Raw Image Extension이 설치되어 있으면 마지막 수단으로만 사용합니다."
fn_pf_heic_win: "Microsoft Store의 무료 HEIF Image Extensions와 HEVC Video Extensions를 사용합니다."
fn_pf_heic_linux: "HEIC에는 HEVC 디코더가 필요한데, Linux에는 기본으로 들어 있지 않고 Fotollection도 특허 때문에 함께 담지 않습니다. 이후 버전에서는 배포판이 설치한 libheif를 사용할 예정입니다. 그때까지는 HEIC 사진을 JPEG로 변환하세요."
fn_pf_tether: "먼저 Sony a6400부터. 다른 카메라도 이어서 지원합니다."
fn_pf_openwith: ".deb 패키지나 설치 스크립트를 쓴 경우입니다. 따로 실행한 AppImage는 AppImageLauncher 같은 도구가 등록하지 않는 한 파일 관리자에 등록되지 않습니다."
fn_pf_update: "AppImage는 새 AppImage를 다운로드합니다. .deb는 릴리스 페이지를 열며, APT 저장소를 쓰고 있다면 sudo apt upgrade로 새 버전을 받습니다."
fn_glibc: "glibc(GNU C Library)는 모든 Linux 프로그램이 기반으로 삼는 라이브러리입니다. 내 버전은 터미널에 ldd --version을 입력하면 확인할 수 있습니다. Fotollection은 glibc 2.35를 갖춘 Ubuntu 22.04에서 빌드하므로, 이 버전 이상이 필요합니다."
fn_nvidia: "NVIDIA 자체 드라이버에서는 WebKitGTK의 DMA-BUF 렌더러가 창을 빈 화면으로 둘 수 있습니다. 이 드라이버가 로드되어 있으면, Fotollection은 그 렌더러를 끄고 한 번만 스스로 다시 시작합니다."
fn_dm: "dm 및 dm 로고는 dm-drogerie markt GmbH + Co. KG의 상표입니다."
fn_rossmann: "ROSSMANN 및 ROSSMANN 로고는 Dirk Rossmann GmbH의 상표입니다."
fn_cewe: "dm과 Rossmann의 사진 서비스는 CEWE가 제공하며, CEWE는 CEWE Stiftung & Co. KGaA의 상표입니다. 프린트 크기는 2026년 10월 dm의 가격표와 대조했습니다. 매장에서 바꿀 수 있습니다."
fn_cu: "CU 및 CU 로고는 BGF리테일(BGF Retail Co., Ltd.)의 상표입니다."
fn_gs25: "GS25 및 GS25 로고는 GS리테일(GS Retail Co., Ltd.)의 상표입니다."
fn_printingbox: "한국의 편의점에서는 사진을 프린팅박스 키오스크(printingbox.kr, CU, GS25, 이마트24에 약 1,300대)에서 4 × 6인치, 즉 10 × 15 cm로 프린트하며, 이 크기는 Fotollection에 들어 있습니다. 2026년 11월에 확인했으며, 키오스크에서 바꿀 수 있습니다."
fn_photos: "스크린샷 속 프라하 사진(트램, 거리, 블타바강)은 @hoangphi01이 2026년 11월 Lumix GX9로 촬영한 것입니다: © @hoangphi01, 무단 전재 금지. 앱의 라이선스에 포함되지 않으며 재사용할 수 없습니다. 그 밖의 데모 사진은 Wikimedia Commons의 퍼블릭 도메인(CC0)으로, 작가는 Dktue(7장), 프랑스 파리의 Pierre Blaché(2장), Kate Branch(1장)입니다. 프린트 바구니와 베스트 샷 스크린샷의 고양이도 @hoangphi01이 GX9로 촬영했으며, 무단 전재 금지입니다. 옆의 더 흐리고, 흔들리고, 어두운 사본은 베스트 샷이 어떻게 골라지는지 보여 주려고 이 한 장에서 만들었습니다."
fn_photos_link: "모든 파일과 그 페이지, 체크섬."
fn_rawsamples: "RAW 측정에는 raw.pixls.us의 퍼블릭 도메인(CC0) 샘플을 형식마다 하나씩, 모두 9개 사용합니다. scripts/fetch-raw-samples.py가 다운로드하고 검증합니다."
fn_rawformats: "이 사이트에서 언급한 RAW 형식은 그것을 정한 카메라 제조사의 것입니다: RW2(Panasonic Holdings Corporation), CR2와 CR3(Canon Inc.), NEF(Nikon Corporation), ARW(Sony Group Corporation), RAF(FUJIFILM Corporation), ORF(OM Digital Solutions Corporation, 옛 Olympus). DNG는 Adobe Inc.가 공개한 개방형 사양입니다. Fotollection은 내장 리더로 이를 읽고, macOS에서는 운영체제의 코덱을 먼저 사용합니다(Windows에서는 Microsoft Raw Image Extension이 설치되어 있으면 마지막 수단으로). 이 회사들 중 어느 곳도 Fotollection을 만들거나 승인하지 않았습니다."
fn_cameras: "스크린샷과 앱의 정보 프레임에 나오는 카메라 이름과 로고는 각 소유자의 상표이며, 어떤 카메라로 찍은 사진인지 보여 주기 위해서만 사용합니다: Apple(Apple Inc.), Canon(Canon Inc.), Fujifilm(FUJIFILM Corporation), Hasselblad(Victor Hasselblad AB), Leica(Leica Camera AG), Lumix(Panasonic Holdings Corporation), Nikon(Nikon Corporation), Noritsu(Noritsu Koki Co., Ltd.), Phase One(Phase One A/S), Ricoh(Ricoh Company, Ltd.), Samsung(Samsung Electronics Co., Ltd.), Sony(Sony Group Corporation)."
fn_others: "Apple과 macOS는 Apple Inc.의 상표입니다. Windows는 Microsoft Corporation의, Linux는 미국 및 기타 국가에서 Linus Torvalds의 등록 상표입니다. Ubuntu는 Canonical Ltd.의, Debian은 Software in the Public Interest, Inc.의, Fedora, Red Hat, RHEL, CentOS는 Red Hat, Inc.의, openSUSE는 SUSE LLC의, Pop!_OS는 System76, Inc.의, Rocky Linux는 Rocky Enterprise Software Foundation의, AlmaLinux는 AlmaLinux OS Foundation의, ChromeOS는 Google LLC의, NVIDIA는 NVIDIA Corporation의 상표입니다. 그 밖의 Linux 배포판 이름은 각 프로젝트의 것입니다. Facebook과 Instagram은 Meta Platforms, Inc.의, GitHub은 GitHub, Inc.의, Google Analytics는 Google LLC의, Lightroom은 Adobe Inc.의, IrfanView는 Irfan Škiljan의, VietQR은 NAPAS의, Wikimedia Commons는 Wikimedia Foundation의 것입니다. Apple, Windows, Linux(Tux, 처음 그린 사람은 Larry Ewing) 마크는 Simple Icons(CC0)에서 가져왔으며, 열이나 단계가 어느 운영체제에 관한 것인지 보여 주기 위해서만 사용합니다."
fn_brand: "Fotollection 이름과 로고는 @hoangphi01이 만드는 공식 앱을 나타냅니다. 공식 다운로드는 fotollection.org와 프로젝트의 GitHub 릴리스에서만 제공됩니다. GPL-3.0 라이선스에 따라, 이 라이선스를 유지하고 소스 코드를 제공하는 한 누구나 수정 여부와 관계없이 사본을 공유하거나 판매할 수 있습니다. 수정하거나 재판매한 사본은 공식 앱인 것처럼 보이도록 Fotollection 이름이나 로고를 사용할 수 없습니다."
fn_notify: "Fotollection을 공유하거나 판매하거나, 그 위에 무언가를 만들 계획인가요? 먼저 GitHub에 이슈를 열어(github.com/hoangphi01/fotollection/issues) 만든 사람에게 알려 주세요. 앱은 무료이고 여가 시간에 만들어집니다. 짧은 메시지가 가장 좋은 감사 인사입니다."
fn_cite: "앱을 인용하거나, 리뷰하거나, 소개하거나, 이 스크린샷을 사용하나요? Fotollection을 출처로 밝히고 fotollection.org로 링크해 주세요."
fn_independent: "Fotollection은 독립적인 오픈 소스 프로젝트입니다. 이 회사들과 제휴, 후원, 승인 관계가 없으며, 그 밖의 모든 상표는 각 소유자에게 있습니다."
shield: "프라이빗 – 사진이 컴퓨터 밖으로 나가지 않습니다"
privacy_title: "내 사진은, 나의 것."
privacy_lead: "Fotollection은 인터넷 없이 작동하도록 만들었습니다. 아무것도 업로드하지 않고, 아무것도 추적하지 않으며, 모든 코드를 직접 확인할 수 있습니다."
p1_title: "업로드 없음, 클라우드 없음"
p1_text: "사진을 읽고 쓰는 일은 모두 내 디스크에서 이루어집니다. 사진을 보낼 서버가 없습니다."
p2_title: "계정 없음, 추적 없음"
p2_text: "가입할 필요가 없고, 앱에는 애널리틱스나 원격 측정이 없습니다. v0.13.0부터는 시작할 때 한 번 GitHub에 새 버전이 나왔는지 확인하며, 설정에서 끌 수 있습니다."
p6_title: "광고 없음"
p6_text: "팔려는 것도 없고, 당신에게 닿으려고 돈을 내는 사람도 없습니다. 광고도, 스폰서 추천도, 앱 내 구매도 지금도 앞으로도 없습니다."
p3_title: "지도 서비스 없이 지명을"
p3_text: "도시 이름은 앱에 내장된 지도 데이터베이스에서 가져오므로, GPS 정보가 제3자에게 넘어가지 않습니다."
p4_title: "내보낼 때 GPS 삭제"
p4_text: "내보낸 이미지에서는 기본으로 위치 정보가 지워지므로, 사진관에 맡긴 사진으로 내가 사는 곳이 드러나지 않습니다."
p5_title: "오픈 소스"
p5_text: "코드는 GPL-3.0으로 공개되어 있습니다. 누구나 읽고, 빌드하고, 이 페이지에 쓰인 그대로 작동하는지 확인할 수 있습니다."
charts_more: "모든 측정을, 알기 쉽게"
footer_story: "이야기"
footer_wiki: "Wiki"
footer_signing: "코드 서명 정책"
dl_warn_title: "v0.14.0 이상으로 업데이트하세요."
dl_warn_text: "이전 버전에서는 시작할 때 연결되어 있지 않던 드라이브의 폴더에서 편집 내용이 사라질 수 있었고, 오류 하나로 앱 전체가 닫힐 수 있었습니다. v0.14.0에서 둘 다 고쳤습니다. 설정과 프로젝트는 그대로 유지됩니다."
install_title: "1분이면 설치 완료."
install_lead: "설치 파일은 아직 유료 인증서로 서명되지 않아서, 처음 실행할 때 한 번 더 클릭해야 합니다."
mac_title: "macOS"
mac_1: ".dmg 파일을 열고, Fotollection을 응용 프로그램 폴더로 드래그합니다."
mac_2: "앱을 엽니다. macOS가 처음 실행을 막습니다."
mac_3: "시스템 설정 → 개인정보 보호 및 보안에서 ‘그래도 열기’를 클릭합니다."
win_title: "Windows"
win_1: "-setup.exe 파일(또는 .msi)을 실행합니다."
win_2: "SmartScreen에 ‘Windows의 PC 보호’가 나타나면 ‘추가 정보’를 클릭합니다."
win_3: "‘실행’을 클릭합니다."
linux_title: "Linux"
linux_script_title: "명령어 하나로"
linux_script_text: "시스템에 맞는 패키지를 고릅니다. Ubuntu, Debian, Mint에는 APT 저장소를, 다른 배포판에는 AppImage를 ~/.local에 설치합니다. 제거하려면:"
linux_apt_title: "또는 APT 저장소 추가"
linux_apt_text: "Ubuntu, Debian, Mint와 그 계열용. 이후 업데이트는 다음으로 받습니다:"
linux_appimage_title: "또는 AppImage 실행"
linux_appimage_text: "다운로드해서 실행 권한을 주고, 실행합니다. ARM에서는 파일 이름이 _aarch64로 끝납니다."
linux_files: "파일"
linux_appimage_x64: "AppImage, x86_64"
linux_appimage_arm: "AppImage, ARM64"
linux_deb_x64: ".deb, amd64"
linux_deb_arm: ".deb, arm64"
linux_which: "어떤 배포판?"
distro_title: "작동하는 Linux 배포판"
distro_lead: "Fotollection은 64비트 Linux(x86_64 또는 ARM64), glibc 2.35 이상에서 작동합니다."
distro_groups:
  - title: "작동합니다"
    items:
      - text: "AppImage: Ubuntu 22.04 이상, Debian 12 이상, Linux Mint 21 이상, Pop!_OS 22.04 이상, elementary OS 7 이상, Zorin OS 17 이상, Fedora 36 이상, openSUSE Tumbleweed, Arch, Manjaro, 그리고 같은 시기의 다른 시스템."
      - text: ".deb와 APT 저장소: Ubuntu, Debian, Mint, Pop!_OS, elementary OS, Zorin OS."
  - title: "한 단계를 거치면 작동합니다"
    items:
      - text: "Ubuntu 24.04 이상: AppImage에는 한 번만 FUSE 2가 필요합니다:"
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: ". 또는 다음과 같이 실행합니다:"
        code2: "--appimage-extract-and-run"
        after2: ". .deb에는 아무것도 필요 없습니다."
      - text: "NixOS: 다음 명령어로 실행합니다:"
        code: appimage-run
      - text: "Fedora Silverblue 같은 불변 시스템: AppImage를 사용하세요."
      - text: "NVIDIA 그래픽: 할 일이 없습니다. 앱이 WebKit의 빈 창 문제를 스스로 피합니다."
        fn: [fn_nvidia]
  - title: "작동하지 않습니다"
    items:
      - text: "glibc 2.35보다 오래된 시스템: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky 또는 Alma 8, openSUSE Leap 15."
      - text: "Alpine 같은 musl 기반 시스템."
      - text: "32비트 컴퓨터."
      - text: "Linux 컨테이너가 없는 ChromeOS."
  - title: "모든 배포판에 공통인 제한"
    items:
      - text: "HEIC(iPhone) 사진은 아직 지원하지 않습니다. 먼저 JPEG로 변환하세요."
        fn: [fn_pf_heic_linux]
      - text: "USB로 연결한 카메라로 촬영할 수 없습니다."
