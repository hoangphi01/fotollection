perf_explain_lead: "사진과 프린트의 전문 용어를, 친구에게 설명하듯이."
perf_faq:
  - q: "ΔE(델타 E)란?"
    fn: [fn_de]
    a: "ΔE는 두 색이 사람의 눈에 얼마나 다르게 보이는지를, 우리가 보는 방식에 맞춘 색 공간(CIELAB, 2000년 공식)에서 계산한 값입니다. 0은 똑같다는 뜻입니다. 약 1은 훈련된 눈이 나란히 놓고 알아챌 수 있는 가장 작은 차이이고, 2–3은 대부분의 사람에게 보이며, 5를 넘으면 다른 색으로 보입니다. Fotollection의 프린트용 내보내기는 평균 0.19입니다."
  - q: "SSIM이란?"
    fn: [fn_ssim]
    a: "SSIM(구조적 유사도 지수)은 픽셀 하나하나가 아니라 두 이미지의 형태와 질감을 비교합니다. 흐림이나 블록 모양의 압축 흔적을 우리가 알아채는 방식에 더 가깝습니다. 1은 똑같다는 뜻이고, 약 0.98을 넘으면 대부분의 사람은 확대하지 않고는 둘을 구별하지 못합니다."
  - q: "JPEG는 몇 가지 색을 담을 수 있나요?"
    fn: [fn_jpeg, fn_heic]
    a: "JPEG는 빨강, 초록, 파랑에 각각 8비트, 즉 256단계씩, 약 1670만 색을 담습니다. 사진관도 이것으로 프린트합니다. 카메라 RAW 파일은 12–14비트를 담고 최근 iPhone은 10비트 HEIC로도 저장할 수 있어 편집할 때 도움이 됩니다. 완성된 프린트라면, 잘 만든 8비트 JPEG에서 톤 사이에 계단이 보이지 않습니다."
  - q: "JPG와 JPEG의 차이는? PNG를 써야 하나요?"
    a: "JPG와 JPEG는 같은 형식입니다. 옛 Windows가 세 글자 확장자만 허용했을 뿐입니다. PNG는 무손실이라 아무것도 버려지지 않지만, PNG로 저장한 사진은 흔히 3–5배 커지고, 대부분의 키오스크와 사진관은 JPEG를 받습니다. Fotollection이 프린트용으로 내보내는, 품질 90 이상에 색 해상도가 그대로인(4:4:4) JPEG라면 종이 위에서는 원본과 구별되지 않습니다."
  - q: "4:4:4와 4:2:0이란?"
    a: "우리 눈은 디테일을 주로 밝기로 보고 색으로는 덜 봅니다. 그래서 JPEG는 색을 낮은 해상도로 저장할 수 있습니다. 4:4:4는 색 해상도를 모두 유지하고, 4:2:0은 4분의 1만 유지합니다. 파일은 작아지지만 빨간 글씨나 나뭇잎 너머의 파란 하늘 같은 색의 경계가 번집니다. 프린트에는 4:4:4가 어울리고, SNS는 어차피 모든 것을 4:2:0으로 다시 압축합니다."
  - q: "sRGB, Display P3, Adobe RGB와 색 프로필"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "색 프로필은 파일 속 숫자가 무엇을 뜻하는지 소프트웨어에 알려 줍니다. sRGB는 웹에서 쓰는 전형적인 색 범위입니다. iPhone과 최근 카메라가 쓰는 Display P3는 특히 빨강과 초록에서 약 25 % 더 많은 색을 표현합니다. P3 사진이 프로필을 잃으면 그 숫자가 sRGB로 읽혀 색이 바래 보입니다. 우리가 측정한 13 % 의 채도 손실이 바로 이것입니다. 일부 카메라가 프린트용으로 제공하는 Adobe RGB도 sRGB보다 넓으며, 주로 초록과 청록에서 차이가 납니다. Fotollection은 프린트용으로는 사진의 프로필을 무엇이든 그대로 유지하고, SNS용으로는 sRGB로 제대로 변환합니다."
  - q: "프린트에는 몇 DPI가 필요한가요?"
    a: "DPI는 용지 1인치에 놓이는 픽셀 수입니다. 300 DPI면 가까이서 봐도 선명하고, 팔을 뻗은 거리라면 150–200 DPI로 충분합니다. 10 × 15 cm 프린트는 300 DPI에서 1800 × 1200 픽셀이 필요하므로, 스마트폰이나 카메라 사진이면 어떤 것이든 충분합니다. 앱의 크기 안내가 사진마다 얼마나 크게 프린트할 수 있는지 알려 줍니다."
  - q: "Facebook에서 사진이 덜 예뻐 보이는 이유는?"
    a: "Facebook은 모든 사진을 최대 2048 px로 줄이고, 더 낮은 품질과 절반의 색 해상도로 다시 압축하며, 색 프로필을 버립니다. 너무 크게 올린 사진은 나와 Facebook이 한 번씩, 두 번 크기가 바뀝니다. 처음부터 2048 px, sRGB, 가볍게 샤프닝해서 보내면 Facebook은 한 번만 다시 압축하고, 색도 처음부터 올바릅니다."
