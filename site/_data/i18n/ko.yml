# The landing page's keynote video (site/_data/keynote.yml): *…* is the accent; on this page {cu} and {gs25} are the stores' marks.
kn_1: "여행의 모든 사진을, *한 장도 빠짐없이.*"
kn_2: "베스트만. 날짜를 넣고. *선명한 색으로.*"
kn_3: "사진 두 장. *프린트 한 장.*"
kn_4: "가격은 *절반*으로."
kn_4_sub: "10 × 15 프린트 한 장에 10 × 7.5 사진 두 장."
kn_5: "내 사진이. *내 엽서로.*"
kn_5_sub: "10 × 15, 우체국 엽서 규격 안에."
kn_6: "{cu}·{gs25}의 사진 크기 그대로."
kn_7: "내보내고. 꽂고. *프린트.*"
kn_8: "오프라인. 모든 컴퓨터에서 *무료.*"
kn_label: "20초로 보는 Fotollection: 여행의 모든 사진, 날짜를 넣고 선명한 색으로 고른 베스트, 프린트 한 장에 사진 두 장, 내 사진을 엽서로, CU·GS25의 사진 크기 그대로, 그리고 내보내서 프린트. macOS, Windows, Linux에서 무료, 오프라인."
kn_pause: "동영상 일시 정지"
kn_play: "동영상 재생"
