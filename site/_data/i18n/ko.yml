perf_trip_fn: [fn_trip, fn_pct]
perf_trip_title: "실제 여행: 프라하의 파일 422개"
perf_trip_text: "테스트용 세트는 실제보다 좋게 보일 수 있습니다. 그래서 프라하에서 주말을 보낸 뒤 Lumix GX9에서 옮긴 그대로의 폴더를 썼습니다. 한 장에 약 11 MB인 20 MP JPEG 396장과 RAW 파일 26개, 모두 4.7 GB입니다. 열면 0.23초에 모든 파일의 EXIF를 읽습니다. 미리 보기는 19 ms에 다시 그리고, RAW는 0.35초에 현상하며, 엽서 10장은 21 ms에 다시 그립니다. 2026년 11월 3일, 이 큰 파일들에서 두 수치가 예산을 넘었습니다. 내보내기는 초당 7.6장, 메모리 최대치는 2.14 GB였습니다. 원인을 찾아 v0.9.7에서 고쳤고, 이제 JPEG는 초당 10.1장씩 내보내며 전체 실행이 1.31 GB 이하로 유지됩니다."
trip_stats:
  - { v: "0.23초", l: "파일 422개를 EXIF까지 모두 열기" }
  - { v: "19 ms", l: "미리 보기 다시 그리기, p95(예산 50 ms)" }
  - { v: "0.35초", l: "20 MP RAW 한 장 현상(중앙값)" }
  - { v: "21 ms", l: "엽서 10장 다시 그리기(예산 100 ms)" }
  - { v: "10.1 / 초", l: "JPEG 내보내기(예산 8 / 초)" }
  - { v: "1.31 GB", l: "메모리 최대치, JPEG와 RAW(상한 2 GB)" }
fn_trip: "프라하 폴더는 만든 사람의 것으로 공개하지 않습니다(© @hoangphi01, 무단 전재 금지). bench/trip.sh와 그 JPEG에 대한 measure_folder를 각각 3회 실행한 중앙값으로, Apple M3·16 GB에서 다른 앱을 연 상태로, 2026년 11월 4일, v0.9.7의 내보내기로 측정했습니다. 비교하려면 내 폴더로 실행해 보세요."
fn_simd: "SIMD(single instruction, multiple data)는 프로세서가 많은 값을 한 번에 처리하는 방식입니다. 명령어 하나가 넓은 벡터 레지스터에 나란히 놓인 여러 수, 예를 들어 많은 픽셀의 빨강·초록·파랑에 동시에 작용합니다. Intel과 AMD 프로세서에서는 SSE와 AVX로, Apple 실리콘 등 Arm 프로세서에서는 NEON으로 제공됩니다. Intel, AMD, Arm은 각 소유자의 상표입니다."
fn_pct: "p50과 p95는 백분위수입니다. p50(중앙값)은 실행의 절반이 그 안에 끝난 시간이고, p95는 100번 중 95번이 그 안에 끝난 시간으로, 평균이 가리는 느린 경우를 보여 줍니다."
fn_psnr: "PSNR(최대 신호 대 잡음비)은 두 이미지를 픽셀마다 비교해 그 차이를 데시벨로 나타냅니다. 높을수록 가깝고, 약 40 dB를 넘으면 차이가 거의 보이지 않습니다."
fn_sensor: "CMOS와 CCD는 두 종류의 이미지 센서로, 빛을 전하로 바꾸는 감광 셀의 격자입니다. 오늘날 거의 모든 카메라와 스마트폰이 CMOS(상보형 금속 산화막 반도체)를 쓰며, CCD(전하 결합 소자)는 이전 카메라에서 흔했습니다."
fn_tiff: "TIFF(Tagged Image File Format)는 유연한 이미지 형식으로, 지금은 Adobe가 관리합니다. DNG를 비롯한 많은 RAW 형식이 그 구조를 바탕으로 합니다."
fn_gpg: "GPG(GNU Privacy Guard)는 OpenPGP 표준의 자유 구현입니다. APT 저장소는 GPG 키로 서명되어 있어서, 시스템이 모든 패키지가 저장소에서 바뀌지 않고 왔는지 확인할 수 있습니다."
fn_rust: "Rust 및 Rust 로고는 Rust Foundation의 상표입니다. Fotollection의 코어는 Rust로 작성되어 컴퓨터에서 직접 실행됩니다."
fn_webview: "앱의 창은 Tauri로 만들었고, 운영체제 자체의 웹 뷰가 그립니다. macOS에서는 WebKit(WKWebView), Windows에서는 Microsoft Edge WebView2, Linux에서는 WebKit의 GTK 포트인 WebKitGTK입니다. Tauri는 Commons Conservancy 내 Tauri Programme의 프로젝트이고, WebKit은 Apple Inc.의 상표, GTK는 GNOME Foundation의 프로젝트, Microsoft Edge와 WebView2는 Microsoft Corporation의 상표입니다. 브라우저 비교는 같은 작업을 Google Chrome의 바탕인 오픈 소스 프로젝트 헤드리스 Chromium 156에서, 프로세서 코어마다 Web Worker 하나를 써서 실행했습니다."
fn_de: "ΔE2000(CIEDE2000)은 국제조명위원회(CIE)의 색차 공식으로, ISO/CIE 11664-6으로 표준화되었습니다. 계산에 쓰는 CIELAB 색 공간은 ISO/CIE 11664-4입니다."
fn_ssim: "SSIM은 Zhou Wang, Alan C. Bovik, Hamid R. Sheikh, Eero P. Simoncelli가 논문 ‘Image quality assessment: from error visibility to structural similarity’(IEEE Transactions on Image Processing, 13(4), 2004)에서 제안했습니다."
fn_srgb: "sRGB는 1996년 HP와 Microsoft가 만들었고, IEC 61966-2-1로 표준화되었습니다."
fn_p3: "Display P3는 Apple Inc.가 정의한 색 공간으로, 영화 업계(SMPTE)의 DCI-P3 색 공간을 바탕으로 합니다."
fn_adobe: "Adobe RGB (1998)는 Adobe Inc.가 사양을 정한 색 공간입니다. Adobe는 Adobe Inc.의 등록 상표입니다."
fn_charts: "모든 차트: 수치는 참고용으로, 평범한 노트북(Apple M3, 16 GB)에서 측정했습니다. 실제 값은 사용하는 컴퓨터에 따라 다릅니다."
fn_dng: "이 페이지를 위해 Adobe DNG Converter를 실행하지는 않았습니다. 수치는 외부 추정치(최신 하드웨어에서 CR3 파일 1,000개에 20–30분, 컴퓨터 사양은 밝히지 않음)로, convertintomp4.com의 RAW에서 DNG로 일괄 변환하는 방법에 관한 블로그 글에서 가져왔습니다. Adobe는 Adobe Inc.의 등록 상표입니다."
chart_budgets: "속도와 메모리, 코드를 쓰기 전에 정한 예산과 비교"
chart_quality: "내보내기가 원본에서 무엇을 남기는지, 일반적인 웹 편집기와 비교"
chart_bestshot: "베스트 샷 추천, 사람이 직접 고른 사진과 비교"
chart_share: "Facebook용 사진: Facebook이 다시 압축한 뒤 보는 사람이 보게 되는 것"
chart_memory: "한 번에 처리하는 사진이 5,035장까지 늘어날 때의 메모리 최대치"
chart_browser: "같은 작업을 Fotollection과 웹 브라우저에서"
wiki_title: "Wiki"
wiki_kicker: "첫 화면부터"
wiki_description: "Fotollection이 첫 화면부터 어떻게 자라 왔는지, 버전별로. 각 버전이 무엇을 가져왔고, 출시될 때 어떤 모습이었는지."
wiki_lead: "오늘부터 첫 빈 창까지, 모든 버전. 무엇을 가져왔는지, 그리고 출시될 때의 Fotollection을 프로젝트의 역사에서."
wiki_first: "첫 화면으로"
wiki_toc: "버전"
wiki_foot: "모든 그림은 그 버전이 출시될 때의 Fotollection을 프로젝트의 역사에서 담은 것입니다. 초기 버전은 영어로만 되어 있습니다. 새 버전도 모두 여기에 더해집니다."
man_title: "매뉴얼"
man_kicker: "도움말"
man_description: "Fotollection 사용법을 단계마다 스크린샷과 함께. 프린트할 사진 고르기, 룩과 색, 확대, RAW, 카메라 시계, 날짜와 장소, 연결한 카메라로 촬영, 모든 단축키."
man_lead: "모든 단계를 앱에 보이는 그대로. 매뉴얼은 앱을 따라갑니다. 버전이 바뀌어 화면이 달라지면, 이 페이지도 함께 바뀝니다."
man_toc: "장"
man_source: "GitHub의 이 매뉴얼"
cs_title: "코드 서명 정책"
cs_kicker: "신뢰"
cs_description: "Fotollection의 설치 파일이 어떻게 만들어지고 공개되는지, 누가 릴리스를 승인하는지, 앱이 네트워크로 무엇을 보내고 무엇을 보내지 않는지."
cs_lead: "설치 파일은 아직 인증서로 서명되지 않았습니다. Windows는 처음 실행할 때 SmartScreen 경고를 보여 주고, macOS 빌드는 애드혹 서명만 있으며, Linux의 AppImage와 .deb도 서명되지 않았습니다. 모든 릴리스는 SHA256SUMS.txt에 SHA-256 체크섬을 싣고 있어서, 다운로드한 파일이 여기서 공개한 것과 같은지 확인할 수 있습니다. fotollection.org/apt의 APT 저장소는 프로젝트의 GPG 키로 서명되어 있어서, apt가 그곳에서 설치하는 모든 패키지를 검증합니다."
cs_parts:
  - id: team
    title: "역할"
    lead: "모든 설치 파일은 공개 저장소의 태그가 달린 릴리스에서 GitHub Actions가 빌드합니다. 개인 컴퓨터에서 빌드한 것은 공개하지 않습니다. 빌드 워크플로:"
    items:
      - title: "커미터와 리뷰어"
        author: true
        text: "소스 코드의 모든 변경을 작성하고 리뷰합니다."
      - title: "릴리스 승인자"
        author: true
        text: "모든 릴리스를 직접 확인하고 공개합니다."
  - id: privacy
    title: "개인 정보 처리 방침"
    lead: "이 프로그램은 사용자나 설치·운영하는 사람이 명시적으로 요청하지 않는 한, 다른 네트워크 시스템에 어떤 정보도 보내지 않습니다."
    items:
      - title: "오프라인으로 작동"
        text: "사진, 폴더, 프로젝트, 설정이 컴퓨터 밖으로 나가지 않습니다. 계정도, 원격 측정도, 충돌 보고서 업로드도 없습니다."
      - title: "업데이트 확인"
        text: "유일한 네트워크 요청입니다. 클릭할 때, 그리고 v0.13.0부터는 설정에서 끄지 않는 한 시작할 때 한 번, 이 프로젝트의 최신 릴리스를 GitHub(api.github.com)에 묻습니다. 스스로 다운로드되는 것은 없습니다. 여기에는 GitHub의 개인정보 보호 정책이 적용됩니다."
      - title: "내보낸 사진에 위치 정보 없음"
        text: "내보낸 사진에서는 기본으로 GPS 좌표가 지워집니다."
      - title: "이 웹사이트"
        text: "앱이 아니라 웹사이트가 Google Analytics로 방문 수와 다운로드 링크 클릭 수를 셉니다. 여기에는 Google의 개인정보처리방침이 적용됩니다. 다운로드 수는 GitHub에서 가져옵니다."
      - title: "후원"
        text: "Fotollection을 후원하는 결제는 Ko-fi, GitHub Sponsors, VietQR 코드 뒤의 은행이 각자의 개인정보 처리 방침에 따라 처리합니다. 웹사이트는 그곳으로 링크할 뿐 아무것도 불러오지 않으며, 후원은 앱이나 Fotollection 안의 내 데이터와 아무 관련이 없습니다."
  - id: system
    title: "시스템 변경 사항"
    lead: "설치할 때는 앱에 필요한 것만 추가하고, 제거하면 지워집니다."
    items:
      - title: "연결 프로그램"
        text: "설치 프로그램(Linux에서는 .deb)이 사진 파일의 ‘연결 프로그램’ 메뉴에 Fotollection을 추가합니다. 스스로 기본 앱이 되지는 않습니다."
      - title: "제거"
        text: "Windows 설정에서 제거하거나, macOS에서는 앱을 삭제합니다. Windows 제거 프로그램은 ‘연결 프로그램’ 항목도 지웁니다. Linux에서는 sudo apt remove fotollection을 실행하거나, AppImage를 삭제하거나, 설치 스크립트를 --uninstall과 함께 실행하면 APT 저장소와 키도 지워집니다. 설정과 프로젝트는 홈 폴더에 남습니다."
perf_title: "성능"
perf_description: "Fotollection을 뒷받침하는 모든 측정을 쉬운 말로. 속도, 메모리, 프린트 품질, SNS용 사진, 베스트 샷 추천. ΔE, SSIM, JPEG, 색 프로필의 뜻과 함께."
perf_kicker: "약속이 아닌, 측정"
perf_lead: "이 페이지의 모든 수치는 평범한 노트북(Apple M3, 16 GB)에서 실제 사진으로 측정했고, 그 수치를 낸 스크립트가 저장소에 있어 누구나 다시 실행할 수 있습니다. 각 차트 아래에는 프린트에 어떤 의미인지를, 마지막에는 수치 뒤의 용어 설명을 실었습니다."
perf_how_title: "Fotollection이 빠른 이유"
perf_how_lead: "마법은 없습니다. 첫 코드를 쓰기 전에 정한 몇 가지 결정, 그리고 그 모든 측정."
perf_how_items:
