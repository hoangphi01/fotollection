support_title: "コーヒーをおごる"
support_text: "Fotollection は、EU で暮らすベトナム人の学生が、授業とアルバイトの合間に作っています。無料でオープンソース。写真の整理にかかる一晩を節約できたなら、コーヒー 1 杯（または学食のランチ 😄）が開発を続ける力になります。"
support_sponsor: "GitHub で支援する"
support_kofi: "コーヒー 1 杯で応援する（Ko-fi・カード／PayPal 可）"
support_note_card: "目安は ¥500 くらい。Ko-fi は PayPal またはカード、GitHub Sponsors はカードで、1 回でも毎月でも、好きな金額で支援できます。"
kiosk_title: "そのままプリント："
kiosk_and: "・"
kiosk_lead: "セブン‐イレブン、ローソン、ファミリーマートのマルチコピー機は、L 判、2L 判、ましかくでプリントします。Fotollection は各写真をコピー機がプリントする形にトリミングするので、見たとおりにプリントされ、端が思わぬところで切れることはありません。"
kiosk_standard: "写真プリント"
kiosk_square: "ましかく"
kiosk_strip: "ストリップ"
kiosk_more: "自分の比率（トリミングなし）や、cm またはインチで指定する任意のサイズにも"
kiosk_steps_title: "旅からプリントまで"
kiosk_s1: "ベストショットを選び、プリントサイズを決める。"
kiosk_s2: "フォルダー、USB メモリ、SD カードに書き出す（またはお店のアプリへ）。"
kiosk_s3: "コンビニのマルチコピー機でプリント。"
