wiki_title: "Wiki"
wiki_kicker: "最初の画面から"
wiki_description: "Fotollection が最初の画面からどう育ってきたか、バージョンごとに。それぞれが何をもたらし、リリース時にどんな姿だったか。"
wiki_lead: "今日から最初の空っぽのウインドウまで、すべてのバージョン。何をもたらし、リリース時の Fotollection がどんな姿だったかを、プロジェクトの歴史から。"
wiki_first: "最初の画面へ"
wiki_toc: "バージョン"
wiki_foot: "どの画像も、そのバージョンがリリースされたときの Fotollection を、プロジェクトの歴史から写したものです。初期のものは英語のみです。新しいバージョンもすべてここに加わります。"
man_title: "マニュアル"
man_kicker: "ヘルプ"
man_description: "Fotollection の使い方を、手順ごとにスクリーンショット付きで。プリントする写真の選び方、ルックと色、拡大、RAW、カメラの時計、日付と場所、接続したカメラでの撮影、すべてのキーボードショートカット。"
man_lead: "どの手順も、アプリに表示されるとおりに。マニュアルはアプリに合わせて更新され、バージョンアップで画面が変われば、このページも一緒に変わります。"
man_toc: "章"
man_source: "GitHub のこのマニュアル"
cs_title: "コード署名ポリシー"
cs_kicker: "信頼"
cs_description: "Fotollection のインストーラーがどのように作られ公開されるか、誰がリリースを承認するか、アプリがネットワークに何を送り、何を送らないか。"
cs_lead: "インストーラーはまだ証明書で署名されていません。Windows は初回起動時に SmartScreen の警告を表示し、macOS のビルドはアドホック署名のみ、Linux の AppImage と .deb も未署名です。各リリースでは SHA-256 チェックサムを SHA256SUMS.txt に掲載しているので、ダウンロードしたものがここで公開したものと同じかを確認できます。fotollection.org/apt の APT リポジトリはプロジェクトの GPG 鍵で署名されているので、apt がそこからインストールするすべてのパッケージを検証します。"
cs_parts:
  - id: team
    title: "役割"
    lead: "すべてのインストーラーは、公開リポジトリのタグ付きリリースから GitHub Actions がビルドします。個人のマシンでビルドしたものは公開しません。ビルドのワークフロー："
    items:
      - title: "コミッターとレビュアー"
        author: true
        text: "ソースコードのすべての変更を書き、レビューします。"
      - title: "リリース承認者"
        author: true
        text: "すべてのリリースを手作業で確認し、公開します。"
  - id: privacy
    title: "プライバシーポリシー"
    lead: "このプログラムは、ユーザーまたはインストール・運用する人から明示的に求められない限り、ほかのネットワークシステムに一切の情報を送信しません。"
    items:
      - title: "オフラインで動作"
        text: "写真、フォルダー、プロジェクト、設定がパソコンの外に出ることはありません。アカウントも、テレメトリーも、クラッシュレポートのアップロードもありません。"
      - title: "アップデートの確認"
        text: "唯一のネットワークリクエストです。クリックしたとき、そして v0.13.0 からは設定でオフにしない限り起動時に一度、プロジェクトの最新リリースを GitHub（api.github.com）に問い合わせます。自動でダウンロードされるものはありません。これには GitHub のプライバシーに関する声明が適用されます。"
      - title: "書き出しに位置情報なし"
        text: "書き出した写真からは、標準で GPS 座標が削除されます。"
        fn: [fn_gps]
      - title: "このウェブサイト"
        text: "アプリではなくウェブサイトが、Google Analytics で訪問数とダウンロードリンクのクリック数を数えています。これには Google のプライバシーポリシーが適用されます。ダウンロード数は GitHub から取得しています。"
      - title: "支援"
        text: "Fotollection への支援金は、Ko-fi、GitHub Sponsors、VietQR コードの先の銀行がそれぞれのプライバシーポリシーに従って扱います。ウェブサイトはそれらにリンクするだけで、何も読み込みません。支援はアプリや Fotollection 内のあなたのデータとは一切関係ありません。"
  - id: system
    title: "システムへの変更"
    lead: "インストールではアプリに必要なものだけを追加し、アンインストールで削除します。"
    items:
      - title: "このアプリケーションで開く"
        text: "インストーラー（Linux では .deb）が、写真ファイルの「このアプリケーションで開く」メニューに Fotollection を追加します。勝手に既定のアプリになることはありません。"
      - title: "アンインストール"
        text: "Windows の設定からアンインストールするか、macOS ではアプリを削除します。Windows のアンインストーラーは「このアプリケーションで開く」の項目も削除します。Linux では sudo apt remove fotollection を実行するか、AppImage を削除するか、インストールスクリプトを --uninstall 付きで実行すると APT リポジトリと鍵も削除されます。設定とプロジェクトはホームフォルダーに残ります。"
