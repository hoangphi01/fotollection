fn_back: "本文に戻る"
fn_open: "無料とは、価格も広告もアプリ内課金もないということです。作者にコーヒーをおごるかどうかはあなたの自由で、Fotollectionの開発を続ける力になります。オープンソースとは、ソースコードのすべてがGitHubでGPL-3.0ライセンスのもとに公開されていて、誰でも読み、ビルドし、アプリが何をしているかを確かめられるということです。アカウント不要とは、アプリがあなたが誰かを尋ねることはなく、ログインするものも何もないということです。"
fn_photo: "路面電車の写真は作者自身のもので（© @hoangphi01、無断転載禁止）、2026年11月にプラハでLumix GX9で撮影しました。ルックはすべてFotollection独自のエンジンで描画しており、ほかでレタッチはしていません。"
fn_downloads: "GitHubの集計による。"
compare_title: "ほかのアプリとの違い。"
compare_lead: "Fotollectionは、本格的なRAWエディターの代わりではありません。旅のフォルダーから、手に取れるプリントまで。その間をつなぐアプリです。"
compare_caption: "FotollectionとLightroom Classic、darktable、RawTherapeeの比較"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["用途", "旅の写真を選び、日付を入れ、プリント用のサイズに", "カタログ、現像、プリント、共有までの一連のワークフロー", "写真のワークフローとRAW現像", "RAW現像"], ["宛名面付きのポストカード", "あり", "なし", "なし", "なし"], ["写真に日付と場所", "あり、フィルム風", "なし", "あり、透かし", "なし"], ["ラボのプリントサイズにトリミング", "あり、シャープネスの確認付き", "あり、プリントモジュール", "あり、プリントビュー", "なし"], ["連写のベストショット", "あり、目を開けたいちばんシャープな1枚", "あり、Assisted Culling", "なし", "なし"], ["1枚ずつ残すか捨てるか", "あり、シンプルモード", "あり、フラグ", "あり、スター", "あり、ランク"], ["1枚のプリントに2枚の写真", "あり", "あり", "あり", "なし"], ["ワンタップでルック", "あり", "あり、プリセット", "あり、スタイル", "あり、プロファイル"], ["Lightroomプリセット", "あり、読み込み", "あり", "なし", "なし"], ["LUT", "あり、.cubeとHaldCLUT", "プロファイルとして", "あり", "あり、HaldCLUT"], ["RAW現像", "あり", "あり", "あり", "あり"], ["価格", "無料", "Creative Cloudのサブスクリプション", "無料", "無料"], ["ソースコード", "オープン、GPL-3.0", "非公開", "オープン、GPL-3.0以降", "オープン、GPL-3.0"], ["対応OS", "macOS、Windows、Linux", "macOS、Windows", "macOS（Appleシリコン）、Windows、Linux", "macOS、Windows、Linux"], ["アカウント", "不要", "Adobeアカウント", "不要", "不要"]]
compare_note: "さらに先へ進むなら、いちばん深いRAW現像にはdarktableとRawTherapee、一生分の写真をひとつのカタログで管理するならLightroom。"
fn_lightroom: "Adobe、Lightroom、Lightroom Classicは、米国およびその他の国におけるAdobe Inc. の商標です。FotollectionはAdobeと提携しておらず、Adobeの承認も受けていません。Lightroomのユーザーが知っているショートカットとレイアウトに合わせています。Lightroomのロゴは、文字のみのロゴとしてパブリックドメインであるWikimedia Commonsのものです。"
fn_lut: "LUT（ルックアップテーブル）は、各色がどの色になるかを定めたものです。Fotollectionは .cubeファイルとHaldCLUT画像を読み込みます。LUMIXはPanasonic Holdings Corporationの商標です。FotollectionはPanasonicと提携しておらず、Panasonicの承認も受けていません。"
fn_compare: "Creative CloudはAdobe Inc. の商標です。darktableとRawTherapeeは、それぞれのコミュニティによるフリーソフトウェアのプロジェクトです。情報はdarktable.orgとそのユーザーマニュアル、rawtherapee.com、AdobeのLightroom Classicヘルプ、WikipediaのAdobeのライセンスと動作環境の概要によるもので、2026年11月14日に確認しました。Fotollectionはいずれとも関係ありません。"
fn_privacy_site: "これはアプリについての説明です。このウェブサイトはGoogleアナリティクスで訪問数を匿名で数えています（国とページごと）。個人と結びつけることはありません。"
fn_exif: "EXIF（Exchangeable Image File Format）は、日本のJEITAとCIPAが管理する規格で、カメラが写真ごとに書き込む情報を定めています。カメラとレンズ、日付と時刻、露出、しばしばGPSの位置、そして小さな埋め込みサムネールです。"
fn_units: "単位：pxはピクセルで、画像を構成する1つの点。MP（メガピクセル）は100万ピクセルで、20 MPの写真は約5472 × 3648 px。msはミリ秒で、1秒の1000分の1。MBとGBはメガバイトとギガバイト。RAM（ランダムアクセスメモリ）はパソコンの作業用メモリです。"
fn_raw: "RAWファイルは、カメラが画像に変換する前にセンサーがとらえたものを記録しています。そのため色、明るさ、ディテールを、ネガを現像するように後から決められます。メーカーごとに独自の形式があり（CanonはCR3、NikonはNEF、SonyはARW、PanasonicはRW2など）、DNG（Digital Negative）はAdobeが公開したオープンなRAW形式です。"
fn_heic: "HEIF（High Efficiency Image File Format）はISO/IEC 23008-12の画像形式で、HEICはそれをHEVC（H.265）で圧縮したもの。iPhoneは標準でこの形式で写真を保存します。HEICの写真は、同程度の品質のJPEGのおよそ半分のサイズです。"
fn_png: "PNG（Portable Network Graphics）はISO/IEC 15948として公開された可逆圧縮の画像形式です。すべてのピクセルがそのまま残るのでグラフィックやスクリーンショットに向いていますが、写真はJPEGの何倍ものサイズになります。"
fn_arch: "x86_64（amd64とも）は、ほとんどのWindows・Linux PCのプロセッサーアーキテクチャです。ARM64（aarch64、arm64とも）はAppleシリコン、多くのノートパソコン、Raspberry Piのような小型ボードのものです。それぞれに専用のビルドが必要です。"
fn_linux_pkg: ".debはDebianパッケージで、Debian、Ubuntu、Linux Mintとその仲間のインストール形式です。APT（Advanced Package Tool）がリポジトリからそれらをインストール・更新します。AppImageは、アプリとその実行に必要なものすべてを含む単一のファイルで、ほとんどのディストリビューションでインストールせずに動きます。"
fn_fuse: "FUSE（Filesystem in Userspace）を使うと、プログラムがカーネルを変更せずにファイルシステムを提供できます。AppImageはこれを使って自分自身を開きますが、Ubuntu 24.04ではそのバージョン2が標準でインストールされなくなりました。"
fn_sha: "SHA-256はSHA-2ファミリーの暗号学的ハッシュ関数で、米国NISTがFIPS 180-4で標準化しました。ファイルから64文字のフィンガープリントを作り、ファイルが1ビットでも変わればフィンガープリントも変わります。"
fn_jpeg: "JPEGはJoint Photographic Experts Groupの画像形式で、ISO/IEC 10918-1およびITU-T T.81として標準化されています。"
fn_pf_raw: "macOSでは、DNG以外のRAW形式はOSがレンズ補正付きで現像します。LinuxとWindowsではFotollectionに内蔵されたリーダーがそれらなしで処理します。Windowsでは、Microsoft Raw Image Extensionがインストールされていれば最後の手段としてだけ使います。"
fn_pf_heic_win: "Microsoft Storeの無料のHEIF Image ExtensionsとHEVC Video Extensionsを使います。"
fn_pf_heic_linux: "HEICにはHEVCデコーダーが必要ですが、Linuxには同梱されておらず、Fotollectionも特許のため同梱していません。今後のバージョンでは、ディストリビューションがインストールしたlibheifを使う予定です。それまではHEICの写真をJPEGに変換してください。"
fn_pf_tether: "まずSony a6400から。ほかのカメラも続きます。"
fn_pf_openwith: ".debパッケージまたはインストールスクリプトを使った場合。単体で実行したAppImageは、AppImageLauncherのようなツールが登録しない限りファイルマネージャーに登録されません。"
fn_pf_update: "AppImageは新しいAppImageをダウンロードします。.debはリリースページを開き、APTリポジトリを使っていればsudo apt upgradeで新しいバージョンになります。"
fn_glibc: "glibc（GNU C Library）は、すべてのLinuxプログラムが動く土台のライブラリです。自分のバージョンはターミナルでldd --versionと入力すれば確認できます。Fotollectionはglibc 2.35を搭載したUbuntu 22.04でビルドしているため、このバージョン以降が必要です。"
fn_nvidia: "NVIDIA独自のドライバーでは、WebKitGTKのDMA-BUFレンダラーがウインドウを空白のままにすることがあります。このドライバーが読み込まれている場合、Fotollectionはそのレンダラーをオフにして一度だけ自身を再起動します。"
fn_dm: "dmおよびdmロゴはdm-drogerie markt GmbH + Co. KGの商標です。"
fn_rossmann: "ROSSMANNおよびROSSMANNロゴはDirk Rossmann GmbHの商標です。"
fn_cewe: "dmとRossmannの写真サービスはCEWEが提供しており、CEWEはCEWE Stiftung & Co. KGaAの商標です。プリントサイズは2026年10月にdmの価格表と照合しました。店舗が変更する場合があります。"
fn_seven: "7-Elevenおよび7-Elevenロゴは7-Eleven, Inc. の商標です。"
fn_lawson: "LAWSONおよびLAWSONロゴは株式会社ローソン（Lawson, Inc.）の商標です。"
fn_familymart: "FamilyMartおよびFamilyMartロゴは株式会社ファミリーマート（FamilyMart Co., Ltd.）の商標です。"
fn_konbini: "L判（89 × 127 mm）と2L判（127 × 178 mm）は3社共通です。スクエアはセブン‐イレブンが89 × 89 mm（L判の用紙に印刷して切り取り）、ローソンが127 × 127 mm、ファミリーマートはサイズの記載がありません。2026年11月に各社のページで確認しました。Fotollectionの9 × 13と13 × 18は縦横比の差が約1 %、10 × 10と13 × 13は正方形です。ミリ単位で合わせるときはカスタムサイズで指定できます。サイズは店舗が変更する場合があります。"
fn_photos: "スクリーンショットのプラハの写真（路面電車、街並み、ヴルタヴァ川）は、@hoangphi01が2026年11月にLumix GX9で撮影したものです：© @hoangphi01、無断転載禁止。アプリのライセンスの対象外で、再利用はできません。そのほかのデモ写真はWikimedia Commonsのパブリックドメイン（CC0）で、作者はDktue（7枚）、パリのPierre Blaché（2枚）、Kate Branch（1枚）です。プリントバスケットとベストショットのスクリーンショットに写っている猫も @hoangphi01がGX9で撮影したもので、無断転載禁止です。隣の、よりソフトな・ブレた・暗いコピーは、ベストショットがどう選ばれるかを示すためにこの1枚から作りました。"
fn_photos_link: "すべてのファイルとそのページ、チェックサム。"
fn_rawsamples: "RAWの計測にはraw.pixls.usのパブリックドメイン（CC0）のサンプルを形式ごとに1つ、計9つ使っています。scripts/fetch-raw-samples.pyがダウンロードと検証を行います。"
fn_rawformats: "このページで触れているRAW形式は、それを定めたメーカーのものです：RW2（Panasonic Holdings Corporation）、CR2とCR3（Canon Inc.）、NEF（Nikon Corporation）、ARW（Sony Group Corporation）、RAF（FUJIFILM Corporation）、ORF（OM Digital Solutions Corporation、旧Olympus）。DNGはAdobe Inc. が公開したオープンな仕様です。Fotollectionは内蔵のリーダーでこれらを読み、macOSではまずOSのコーデックを使います（WindowsではMicrosoft Raw Image Extensionがインストールされていれば最後の手段として）。いずれの会社もFotollectionを作っておらず、承認もしていません。"
fn_cameras: "スクリーンショットやアプリの情報フレームに表示されるカメラの名前とロゴは各所有者の商標で、どのカメラで撮った写真かを示すためだけに表示しています：Apple（Apple Inc.）、Canon（Canon Inc.）、Fujifilm（FUJIFILM Corporation）、Hasselblad（Victor Hasselblad AB）、Leica（Leica Camera AG）、Lumix（Panasonic Holdings Corporation）、Nikon（Nikon Corporation）、Noritsu（Noritsu Koki Co., Ltd.）、Phase One（Phase One A/S）、Ricoh（Ricoh Company, Ltd.）、Samsung（Samsung Electronics Co., Ltd.）、Sony（Sony Group Corporation）。"
fn_others: "AppleとmacOSはApple Inc. の商標です。WindowsはMicrosoft Corporationの、Linuxは米国およびその他の国におけるLinus Torvaldsの登録商標です。UbuntuはCanonical Ltd. の、DebianはSoftware in the Public Interest, Inc. の、Fedora、Red Hat、RHEL、CentOSはRed Hat, Inc. の、openSUSEはSUSE LLCの、Pop!_OSはSystem76, Inc. の、Rocky LinuxはRocky Enterprise Software Foundationの、AlmaLinuxはAlmaLinux OS Foundationの、ChromeOSはGoogle LLCの、NVIDIAはNVIDIA Corporationの商標です。その他のLinuxディストリビューションの名前は各プロジェクトのものです。FacebookとInstagramはMeta Platforms, Inc. の、GitHubはGitHub, Inc. の、Google AnalyticsはGoogle LLCの、LightroomはAdobe Inc. の、IrfanViewはIrfan Škiljanの、VietQRはNAPASの、Wikimedia CommonsはWikimedia Foundationのものです。Apple、Windows、Linux（Tux、最初の作者はLarry Ewing）のマークはSimple Icons（CC0）のもので、列や手順がどのOSのものかを示すためだけに使っています。"
fn_brand: "Fotollectionの名前とロゴは、@hoangphi01が作る公式アプリを示します。公式のダウンロードはfotollection.orgとプロジェクトのGitHubリリースからのみです。GPL-3.0ライセンスにより、このライセンスを保ちソースコードを提供する限り、誰でも改変の有無にかかわらずコピーを共有・販売できます。改変・再販されたコピーは、公式アプリであるかのようにFotollectionの名前やロゴを使うことはできません。"
fn_notify: "Fotollectionを共有・販売したり、その上に何かを作ったりする予定ですか？まずはGitHubでissueを開いて（github.com/hoangphi01/fotollection/issues）作者に知らせてください。アプリは無料で、空き時間に作られています。短いメッセージが何よりのお礼です。"
fn_cite: "アプリを引用・レビュー・紹介したり、これらのスクリーンショットを使ったりしますか？Fotollectionの名前を記し、fotollection.orgへリンクしてください。"
fn_independent: "Fotollectionは独立したオープンソースのプロジェクトです。これらの企業とは提携・スポンサー・承認の関係になく、その他の商標はすべて各所有者に帰属します。"
shield: "プライベート – 写真がパソコンの外に出ることはありません"
privacy_title: "あなたの写真は、あなたのもの。"
privacy_lead: "Fotollectionはインターネットなしで動くように作られています。何もアップロードせず、何も追跡せず、そのすべてのコードを確かめられます。"
p1_title: "アップロードなし、クラウドなし"
p1_text: "写真の読み込みも書き込みも、自分のディスク上で行います。写真を送る先のサーバーはありません。"
p2_title: "アカウントなし、追跡なし"
p2_text: "登録は不要で、アプリにアナリティクスやテレメトリーはありません。v0.13.0からは、起動時に一度だけGitHubに新しいバージョンがあるかを確認します。これは設定でオフにできます。"
p6_title: "広告なし"
p6_text: "何かを売りつけることはなく、あなたに届くためにお金を払う人もいません。広告も、スポンサー付きのおすすめも、アプリ内課金も、今もこれからもありません。"
p3_title: "地図サービスなしで地名を"
p3_text: "町の名前はアプリに内蔵された地図データベースから引くので、GPSデータが第三者に渡ることはありません。"
p4_title: "書き出し時にGPSを削除"
p4_text: "書き出した画像からは標準で位置情報が削除されるので、写真店に渡した写真から自宅がわかることはありません。"
p5_title: "オープンソース"
p5_text: "コードはGPL-3.0で公開しています。誰でも読み、ビルドし、このページに書かれているとおりに動くことを確かめられます。"
charts_more: "すべての計測を、わかりやすく"
footer_story: "ストーリー"
footer_wiki: "Wiki"
footer_signing: "コード署名ポリシー"
dl_warn_title: "v0.14.0以降にアップデートしてください。"
dl_warn_text: "以前のバージョンでは、起動時に接続されていなかったドライブ上のフォルダーの編集が失われることがあり、ひとつのエラーでアプリ全体が閉じてしまうことがありました。v0.14.0で両方を修正しました。設定とプロジェクトはそのまま残ります。"
install_title: "1分でインストール。"
install_lead: "インストーラーはまだ有料の証明書で署名されていないため、初回起動にはひと手間かかります。"
mac_title: "macOS"
mac_1: ".dmgファイルを開き、Fotollectionをアプリケーションフォルダーにドラッグします。"
mac_2: "開きます。macOSは初回の起動をブロックします。"
mac_3: "システム設定 → プライバシーとセキュリティで「このまま開く」をクリックします。"
win_title: "Windows"
win_1: "-setup.exeファイル（または .msi）を実行します。"
win_2: "SmartScreenに「WindowsによってPCが保護されました」と表示されたら、「詳細情報」をクリックします。"
win_3: "「実行」をクリックします。"
linux_title: "Linux"
linux_script_title: "コマンドひとつで"
linux_script_text: "システムに合ったパッケージを選びます。Ubuntu、Debian、MintにはAPTリポジトリを、その他のディストリビューションにはAppImageを ~/.localに。アンインストール："
linux_apt_title: "またはAPTリポジトリを追加"
linux_apt_text: "Ubuntu、Debian、Mintとその仲間向け。以後のアップデートはこれで届きます："
