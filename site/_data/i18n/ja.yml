modes_manual: "マニュアルの全文"
postcard_title: "自分の写真でポストカード"
postcard_text: "コラージュモードでは、スイッチひとつですべてのプリントがポストカードに。半分にあなたの写真、もう半分に点線の切手枠と、メッセージや宛名用の罫線。タイプライター書体で入力するか、細い油性ペンで手書きもできます。"
pc_type_title: "タイプでも、手書きでも"
pc_type_text: "メッセージと宛名にはそれぞれ専用の行があり、太字・斜体・下線が使え、タイプライター書体か自分のフォントで書けます。ラテン文字で書くヨーロッパの言語の文字はすべてそろっているので、プラハやクラクフの住所も入力したとおりにプリントされます。インクは黒・青・セピア・赤から選び、下に小さなクレジット行も入れられます。写真の側はコラージュモードと同じく、周りに白い縁を付けるか、端まで写真で埋めます。"
collage_title: "1 枚に 2 枚の写真"
collage_text: "ハーフサイズのフィルムカメラから生まれたアイデア。10 × 15 のプリント 1 枚に 10 × 7.5 の写真が 2 枚入るので、セットの費用は半分に。写真は順番に組になり、ドラッグで入れ替えられます。アプリは白い縁付きのサイズを提案し、2:3 の写真なら 6 × 9 cm です。細いカットラインでプリントを二分するか、なくしてハーフサイズのストリップにもできます。"
show_collage: "コラージュモード：プリントされるとおりのシート。写真の比率、提案サイズ、カットライン付き"
collage_preview_title: "プリントする前に確かめる"
collage_preview_text: "シートを写真と同じように開けます。コピー機が仕上げるとおりの大きな画像で、2 枚の写真が日付とフレーム付きで並びます。1 か 2 でどちらかの写真を選んでトリミングや回転ができ、ほかのシートは矢印キーで送れます。"
show_collage_preview: "シートのプレビュー：夜の路面電車とプラハの国立博物館を 10 × 15 のプリント 1 枚に"
simple_title: "シンプル：残すか捨てるか、そしてプリント"
simple_text: "1 枚ずつ、プリントされるとおりに表示。数字キーでルックを付け、↑ で残し、↓ で捨てると、すぐに次の写真へ。サイズと日付を選んで、残した写真を書き出します。"
show_simple: "シンプルモード：プリントされるとおりの写真、残す・捨てる、残した写真の書き出し"
swipe_title: "↑ でプリントへ、↓ で脇へ"
swipe_text: "最初の写真を開き、キーひとつで決めます。↑ でプリントバスケットへ、↓ で脇へ置くと、次の写真がもう画面に。何も削除されません。バスケットと脇に置いた写真はサイドバーで待っているので、考え直すこともできます。"
select_title: "ギャラリーでチェックしても"
select_text: "「選択」でグリッドが iPhone のようにチェックボックスに変わり、Shift クリックで連写をまとめて選べます。写真の上でスペースキーを長押しすると、プリントされるとおりに大きく表示。離せば続きへ。"
estimate_title: "書き出す前にサイズがわかる"
estimate_text: "書き出しカードは、書き込む前にファイルのサイズを教えてくれます。あなたの設定で数枚をエンコードして見積もります。Facebook 向けのカメラの写真はおよそ 6 分の 1 の軽さになり、それがクリックする前にわかります。"
