perf_trip_title: "本物の旅：プラハの422ファイル"
perf_trip_text: "テスト用のセットは実際より良く見せることがあります。そこで、プラハでの週末のあとにLumix GX9から取り込んだままのフォルダーを使いました。1枚約11 MBの20 MPのJPEGが396枚と、RAWファイルが26枚、合計4.7 GB。開くと0.23秒ですべてのファイルのEXIFを読み込みます。プレビューは19 msで再描画し、RAWは0.35秒で現像、ポストカード10枚は21 msで再描画します。2026年11月3日、これらの大きなファイルで2つの数字が予算に収まりませんでした。書き出しは毎秒7.6枚、メモリのピークは2.14 GB。原因を突き止めてv0.9.7で修正し、今ではJPEGの書き出しは毎秒10.1枚、実行全体で1.31 GB以下に収まります。"
trip_stats:
  - { v: "0.23秒", l: "422ファイルすべてをEXIFごと開く" }
  - { v: "19 ms", l: "プレビューの再描画、p95（予算：50 ms）" }
  - { v: "0.35秒", l: "20 MPのRAWを1枚現像（中央値）" }
  - { v: "21 ms", l: "ポストカード10枚の再描画（予算：100 ms）" }
  - { v: "10.1 / 秒", l: "JPEGの書き出し（予算：8 / 秒）" }
  - { v: "1.31 GB", l: "メモリのピーク、JPEGとRAW（上限：2 GB）" }
fn_trip: "プラハのフォルダーは作者自身のもので、公開していません（© @hoangphi01、無断転載禁止）。bench/trip.shと、そのJPEGに対するmeasure_folderをそれぞれ3回実行した中央値で、Apple M3・16 GB、ほかのアプリを開いた状態、2026年11月4日、v0.9.7の書き出しで計測しました。比べるなら自分のフォルダーで実行してください。"
fn_simd: "SIMD（single instruction, multiple data）は、プロセッサーが多くの値を一度に処理する仕組みです。1つの命令が、幅の広いベクトルレジスターに並べた複数の数、たとえば多数のピクセルの赤・緑・青の成分に同時に作用します。IntelとAMDのプロセッサーではSSEとAVX、AppleシリコンなどのArmプロセッサーではNEONとして使えます。Intel、AMD、Armは各所有者の商標です。"
fn_pct: "p50とp95はパーセンタイルです。p50（中央値）は実行の半分が収まった時間、p95は100回中95回が収まった時間で、平均では隠れてしまう遅いケースを示します。"
fn_psnr: "PSNR（ピーク信号対雑音比）は2つの画像をピクセルごとに比べ、その差をデシベルで表します。大きいほど近く、約40 dBを超えると差はほとんど見えません。"
fn_sensor: "CMOSとCCDは2種類のイメージセンサーで、光を電荷に変える受光セルの格子です。今日ではほぼすべてのカメラとスマートフォンがCMOS（相補型金属酸化膜半導体）を使い、CCD（電荷結合素子）は以前のカメラで一般的でした。"
fn_tiff: "TIFF（Tagged Image File Format）は柔軟な画像形式で、現在はAdobeが管理しています。DNGを含む多くのRAW形式がその構造に基づいています。"
fn_gpg: "GPG（GNU Privacy Guard）はOpenPGP規格のフリーな実装です。APTリポジトリはGPG鍵で署名されているので、システムはすべてのパッケージがそこから変更されずに届いたことを確認できます。"
fn_rust: "RustおよびRustロゴはRust Foundationの商標です。FotollectionのコアはRustで書かれ、パソコン上で直接動きます。"
fn_webview: "アプリのウインドウはTauriで作られ、OS自身のWebビューが描画します。macOSではWebKit（WKWebView）、WindowsではMicrosoft Edge WebView2、LinuxではWebKitのGTK版であるWebKitGTKです。TauriはCommons Conservancy内のTauri Programmeのプロジェクト、WebKitはApple Inc. の商標、GTKはGNOME Foundationのプロジェクト、Microsoft EdgeとWebView2はMicrosoft Corporationの商標です。ブラウザーとの比較は、同じ処理をGoogle ChromeのもとになっているオープンソースプロジェクトであるヘッドレスChromium 156で、プロセッサーのコアごとに1つのWeb Workerを使って実行しました。"
fn_de: "ΔE2000（CIEDE2000）は国際照明委員会（CIE）の色差式で、ISO/CIE 11664-6として標準化されています。計算に使うCIELAB色空間はISO/CIE 11664-4です。"
fn_ssim: "SSIMはZhou Wang、Alan C. Bovik、Hamid R. Sheikh、Eero P. Simoncelliが論文「Image quality assessment: from error visibility to structural similarity」（IEEE Transactions on Image Processing, 13(4), 2004）で提案しました。"
fn_srgb: "sRGBは1996年にHPとMicrosoftが作り、IEC 61966-2-1として標準化されました。"
fn_p3: "Display P3はApple Inc. が定めた色空間で、映画業界（SMPTE）のDCI-P3色空間に基づいています。"
fn_adobe: "Adobe RGB (1998) はAdobe Inc. が仕様を定めた色空間です。AdobeはAdobe Inc. の登録商標です。"
fn_charts: "すべてのグラフ：数字は目安で、ごく普通のノートパソコン（Apple M3、16 GB）で計測したものです。実際の値はお使いのマシンによって変わります。"
fn_dng: "このページのためにAdobe DNG Converterは実行していません。数字は外部の見積もり（最新のハードウェアでCR3ファイル1,000個に20〜30分、マシン名の記載なし）で、convertintomp4.comのRAWからDNGへの一括変換に関するブログ記事によるものです。AdobeはAdobe Inc. の登録商標です。"
chart_budgets: "速さとメモリ、コードを書く前に決めた予算と比べて"
