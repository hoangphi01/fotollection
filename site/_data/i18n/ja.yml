perf_explain_title: "数字の裏にある用語"
perf_explain_lead: "写真とプリントの専門用語を、友だちに話すように説明します。"
perf_faq:
  - q: "ΔE（デルタE）とは？"
    fn: [fn_de]
    a: "ΔEは、2つの色が人の目にどれだけ違って見えるかを、私たちの見え方に合わせた色空間（CIELAB、2000年の式）で計算したものです。0は同一。約1は、慣れた目が並べて見て気づく最小の差。2〜3はたいていの人に見え、5を超えると違う色に見えます。Fotollectionのプリント用の書き出しは平均0.19です。"
  - q: "SSIMとは？"
    fn: [fn_ssim]
    a: "SSIM（構造的類似性指標）は、個々のピクセルではなく2つの画像の形やテクスチャーを比べます。ぼけやブロック状の圧縮ノイズに私たちが気づく仕方に近い指標です。1は同一で、約0.98を超えると、たいていの人は拡大しない限り見分けられません。"
  - q: "JPEGはいくつの色を記録できますか？"
    fn: [fn_jpeg, fn_heic]
    a: "JPEGは赤・緑・青それぞれに8ビット、つまり各256段階、合計約1670万色を記録します。写真ラボもこれからプリントします。カメラのRAWファイルは12〜14ビット、最近のiPhoneは10ビットのHEICでも保存でき、編集のときに役立ちます。仕上がったプリントなら、きちんと作った8ビットのJPEGでトーンに段差は出ません。"
  - q: "JPGとJPEGの違いは？PNGを使うべき？"
    a: "JPGとJPEGは同じ形式です。昔のWindowsが3文字の拡張子しか使えなかっただけです。PNGは可逆なので何も失われませんが、PNGで保存した写真は3〜5倍の大きさになることが多く、ほとんどのコピー機やラボはJPEGを求めます。Fotollectionがプリント用に書き出す、品質90以上・色の解像度フル（4:4:4）のJPEGなら、紙の上では元の写真と見分けがつきません。"
  - q: "4:4:4と4:2:0とは？"
    a: "私たちの目は細部を主に明るさで見ていて、色ではそれほど見ていません。そのためJPEGは色を低い解像度で記録できます。4:4:4は色の解像度をすべて保ち、4:2:0は4分の1だけを保ちます。ファイルは小さくなりますが、赤い文字や葉の向こうの青空のような色の境界がにじみます。プリントには4:4:4がふさわしく、SNSはどのみちすべてを4:2:0に再圧縮します。"
  - q: "sRGB、Display P3、Adobe RGBとカラープロファイル"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "カラープロファイルは、ファイルの中の数字が何を意味するかをソフトに伝えます。sRGBはWebで使われる標準的な色域です。iPhoneや最近のカメラが使うDisplay P3は、おもに赤と緑で約25 % 多くの色を表せます。P3の写真がプロファイルを失うと、その数字はsRGBとして読まれ、くすんで見えます。私たちが計測した13 % の彩度の低下がこれです。一部のカメラがプリント用に用意するAdobe RGBもsRGBより広く、おもに緑とシアンで差があります。Fotollectionはプリント用には写真のプロファイルを何であれそのまま保ち、SNS用にはきちんとsRGBに変換します。"
  - q: "プリントには何DPI必要？"
    a: "DPIは用紙1インチあたりのピクセル数です。300 DPIなら近くで見てもシャープで、腕を伸ばした距離なら150〜200 DPIで十分です。10 × 15 cmのプリントなら300 DPIで1800 × 1200ピクセルが必要なので、スマートフォンやカメラの写真ならどれでも足ります。アプリのサイズ提案が、それぞれの写真をどこまで大きくできるかを教えてくれます。"
  - q: "Facebookで写真がきれいに見えないのはなぜ？"
    a: "Facebookはすべての写真を最大2048 pxにリサイズし、低めの品質と半分の色解像度で再圧縮して、カラープロファイルを捨てます。大きすぎる写真は、あなたとFacebookで2回リサイズされます。最初から2048 px、sRGB、軽くシャープにして送れば、Facebookの再圧縮は1回だけで、色も最初から正しいままです。"
