  - { t: "同じものを二度作らない", d: "カラースライダーは色だけを変え、サイズは変えません。すべてのカラースライダーは 33 × 33 × 33 色のテーブルひとつにまとめられるので、スライダー 10 本でも 1 本と同じコストです。", v: "2 ms", l: "プレビュー上のカラースライダー 10 本" }
