distro_lead: "Fotollectionは64ビットLinux（x86_64またはARM64）、glibc 2.35以降で動きます。"
distro_groups:
  - title: "動作します"
    items:
      - text: "AppImage：Ubuntu 22.04以降、Debian 12以降、Linux Mint 21以降、Pop!_OS 22.04以降、elementary OS 7以降、Zorin OS 17以降、Fedora 36以降、openSUSE Tumbleweed、Arch、Manjaro、その他同じ時期のシステム。"
      - text: ".debとAPTリポジトリ：Ubuntu、Debian、Mint、Pop!_OS、elementary OS、Zorin OS。"
  - title: "ひと手間で動作します"
    items:
      - text: "Ubuntu 24.04以降：AppImageには一度だけFUSE 2が必要です："
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: "。または次のように実行します："
        code2: "--appimage-extract-and-run"
        after2: "。.debには何も必要ありません。"
      - text: "NixOS：次のコマンドで起動します："
        code: appimage-run
      - text: "Fedora Silverblueなどのイミュータブルなシステム：AppImageを使ってください。"
      - text: "NVIDIAのグラフィックス：対応は不要です。アプリがWebKitの空白ウインドウの不具合を自動で回避します。"
        fn: [fn_nvidia]
  - title: "動作しません"
    items:
      - text: "glibc 2.35より古いもの：Ubuntu 20.04、Debian 11、RHEL、CentOS、RockyまたはAlma 8、openSUSE Leap 15。"
      - text: "Alpineなどmuslベースのシステム。"
      - text: "32ビットのマシン。"
      - text: "LinuxコンテナなしのChromeOS。"
  - title: "すべてのディストリビューションでの制限"
    items:
      - text: "HEIC（iPhone）の写真はまだ非対応：先にJPEGに変換してください。"
        fn: [fn_pf_heic_linux]
      - text: "USB接続のカメラでの撮影はできません。"
      - text: "RAWはmacOSが加えるレンズ補正なしで開きます。"
        fn: [fn_pf_raw]
