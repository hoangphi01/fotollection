fn_back: "本文に戻る"
fn_open: "無料とは、価格も広告もアプリ内課金もないということです。作者にコーヒーをおごるかどうかはあなたの自由で、Fotollection の開発を続ける力になります。オープンソースとは、ソースコードのすべてが GitHub で GPL-3.0 ライセンスのもとに公開されていて、誰でも読み、ビルドし、アプリが何をしているかを確かめられるということです。アカウント不要とは、アプリがあなたが誰かを尋ねることはなく、ログインするものも何もないということです。"
fn_photo: "路面電車の写真は作者自身のもので（© @hoangphi01、無断転載禁止）、2026 年 11 月にプラハで Lumix GX9 で撮影しました。ルックはすべて Fotollection 独自のエンジンで描画しており、ほかでレタッチはしていません。"
fn_downloads: "GitHub の集計による。"
uses_title: "プリントしたい写真のために"
uses_lead: "Fotollection が生まれた 4 つの場面。"
uses_items: [{"icon": "plane", "t": "旅のあとで", "d": "400 枚の写真が家に帰ってきます。ベストショット探しで連写ごとにいちばんシャープな 1 枚を残し、プリントバスケットにプリントする価値のある 30 枚を集めれば、すべて日付入りで、お店のサイズにトリミングされて仕上がります。"}, {"icon": "book-open", "t": "家族のアルバム", "d": "家族がずっと残すアルバムのためのプリント。フィルムカメラがそうしていたように、隅に日付と町の名前を。シンプルモードだけで十分です。"}, {"icon": "mail", "t": "ポストカードとテーマ別のセット", "d": "1 枚に 2 枚の写真、または写真の横に自分の言葉を添えたポストカード。旧市街、料理、路面電車と、セットごとに専用のフォルダータブで。"}, {"icon": "share-2", "t": "色を失わずに共有", "d": "同じ写真を Facebook や Instagram 向けのサイズに。アップロード後も色がくすまずに残ります。"}]
compare_title: "比較"
compare_lead: "Fotollection は本格的な RAW エディターに取って代わるものではありません。それらが任せきりにしている部分、つまり旅のフォルダーから手に取れるプリントまでのために作られています。"
compare_caption: "Fotollection と Lightroom Classic、darktable、RawTherapee の比較"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["用途", "旅の写真を選び、日付を入れ、プリント用のサイズに", "カタログ、現像、プリント、共有までの一連のワークフロー", "写真のワークフローと RAW 現像", "RAW 現像"], ["宛名面付きのポストカード", "あり", "なし", "なし", "なし"], ["写真に日付と場所", "あり、フィルム風", "なし", "あり、透かし", "なし"], ["ラボのプリントサイズにトリミング", "あり、シャープネスの確認付き", "あり、プリントモジュール", "あり、プリントビュー", "なし"], ["連写のベストショット", "あり、目を開けたいちばんシャープな 1 枚", "あり、Assisted Culling", "なし", "なし"], ["1 枚ずつ残すか捨てるか", "あり、シンプルモード", "あり、フラグ", "あり、スター", "あり、ランク"], ["1 枚のプリントに 2 枚の写真", "あり", "あり", "あり", "なし"], ["ワンタップでルック", "あり", "あり、プリセット", "あり、スタイル", "あり、プロファイル"], ["Lightroom プリセット", "あり、読み込み", "あり", "なし", "なし"], ["LUT", "あり、.cube と HaldCLUT", "プロファイルとして", "あり", "あり、HaldCLUT"], ["RAW 現像", "あり", "あり", "あり", "あり"], ["価格", "無料", "Creative Cloud のサブスクリプション", "無料", "無料"], ["ソースコード", "オープン、GPL-3.0", "非公開", "オープン、GPL-3.0 以降", "オープン、GPL-3.0"], ["対応 OS", "macOS、Windows、Linux", "macOS、Windows", "macOS（Apple シリコン）、Windows、Linux", "macOS、Windows、Linux"], ["アカウント", "不要", "Adobe アカウント", "不要", "不要"]]
compare_note: "さらに先へ進むなら、いちばん深い RAW 現像には darktable と RawTherapee、一生分の写真をひとつのカタログで管理するなら Lightroom。"
fn_lightroom: "Adobe、Lightroom、Lightroom Classic は、米国およびその他の国における Adobe Inc. の商標です。Fotollection は Adobe と提携しておらず、Adobe の承認も受けていません。Lightroom のユーザーが知っているショートカットとレイアウトに合わせています。Lightroom のロゴは、文字のみのロゴとしてパブリックドメインである Wikimedia Commons のものです。"
fn_lut: "LUT（ルックアップテーブル）は、各色がどの色になるかを定めたものです。Fotollection は .cube ファイルと HaldCLUT 画像を読み込みます。LUMIX は Panasonic Holdings Corporation の商標です。Fotollection は Panasonic と提携しておらず、Panasonic の承認も受けていません。"
fn_compare: "Creative Cloud は Adobe Inc. の商標です。darktable と RawTherapee は、それぞれのコミュニティによるフリーソフトウェアのプロジェクトです。情報は darktable.org とそのユーザーマニュアル、rawtherapee.com、Adobe の Lightroom Classic ヘルプ、Wikipedia の Adobe のライセンスと動作環境の概要によるもので、2026 年 11 月 14 日に確認しました。Fotollection はいずれとも関係ありません。"
fn_exif: "EXIF（Exchangeable Image File Format）は、日本の JEITA と CIPA が管理する規格で、カメラが写真ごとに書き込む情報を定めています。カメラとレンズ、日付と時刻、露出、しばしば GPS の位置、そして小さな埋め込みサムネールです。"
fn_units: "単位：px はピクセルで、画像を構成する 1 つの点。MP（メガピクセル）は 100 万ピクセルで、20 MP の写真は約 5472 × 3648 px。ms はミリ秒で、1 秒の 1000 分の 1。MB と GB はメガバイトとギガバイト。RAM（ランダムアクセスメモリ）はパソコンの作業用メモリです。"
fn_raw: "RAW ファイルは、カメラが画像に変換する前にセンサーがとらえたものを記録しています。そのため色、明るさ、ディテールを、ネガを現像するように後から決められます。メーカーごとに独自の形式があり（Canon は CR3、Nikon は NEF、Sony は ARW、Panasonic は RW2 など）、DNG（Digital Negative）は Adobe が公開したオープンな RAW 形式です。"
fn_heic: "HEIF（High Efficiency Image File Format）は ISO/IEC 23008-12 の画像形式で、HEIC はそれを HEVC（H.265）で圧縮したもの。iPhone は標準でこの形式で写真を保存します。HEIC の写真は、同程度の品質の JPEG のおよそ半分のサイズです。"
fn_png: "PNG（Portable Network Graphics）は ISO/IEC 15948 として公開された可逆圧縮の画像形式です。すべてのピクセルがそのまま残るのでグラフィックやスクリーンショットに向いていますが、写真は JPEG の何倍ものサイズになります。"
fn_dpi: "DPI（dots per inch）は、プリントの 1 インチ（2.54 cm）あたりに写真のピクセルがいくつ入るかを表します。約 300 DPI なら手に取って見てもシャープに見え、それより少なくても、大きめのプリントを少し離れて見るなら十分きれいです。"
fn_444: "4:4:4 と 4:2:0 はクロマサブサンプリング、つまり JPEG が明るさに対して色の情報をどれだけ残すかを表します。4:4:4 はすべてのピクセルの色を残し、4:2:0 は 4 ピクセルのブロックごとに 1 色を残します。ファイルは小さくなりますが、赤い文字やくっきりした地平線のような細かい色の境界がにじみます。"
fn_usb: "USB（Universal Serial Bus）は、機器を接続するための USB Implementers Forum の規格です。SD カードは SD Association の Secure Digital 規格によるメモリーカードで、多くのカメラが使っています。"
fn_gps: "GPS（Global Positioning System）は米国の衛星測位システムです。スマートフォンや多くのカメラは、しばしば Galileo、GLONASS、BeiDou と組み合わせてこれを使い、写真を撮った場所を記録します。"
fn_iso: "ISO は ISO 12232 規格によるカメラの光に対する感度です。ISO 100 から 200 のように 2 倍にするごとに必要な光は半分になり、その分ノイズが増えます。"
fn_gpl: "GPL-3.0 は Free Software Foundation が公開する GNU General Public License のバージョン 3 です。誰でもプログラムを使い、調べ、共有し、改変でき、共有する人は改変の有無にかかわらず、同じ条件でソースコードも共有します。"
fn_vnlf: "VNLF（Vietnam Linux Family）は、フリーソフトウェアと Linux のためのベトナムのコミュニティです。その App Explorer はベトナムのユーザー向けにフリーなアプリを紹介し、CaramOS はそのコミュニティの Linux ディストリビューションです。"
fn_led: "LED（発光ダイオード）：1980〜90 年代のフィルムカメラは、小さなオレンジ色の LED の数字で日付をフィルムに写し込んでいました。日付スタンプはその見た目を再現しています。"
fn_arch: "x86_64（amd64 とも）は、ほとんどの Windows・Linux PC のプロセッサーアーキテクチャです。ARM64（aarch64、arm64 とも）は Apple シリコン、多くのノートパソコン、Raspberry Pi のような小型ボードのものです。それぞれに専用のビルドが必要です。"
fn_linux_pkg: ".deb は Debian パッケージで、Debian、Ubuntu、Linux Mint とその仲間のインストール形式です。APT（Advanced Package Tool）がリポジトリからそれらをインストール・更新します。AppImage は、アプリとその実行に必要なものすべてを含む単一のファイルで、ほとんどのディストリビューションでインストールせずに動きます。"
fn_fuse: "FUSE（Filesystem in Userspace）を使うと、プログラムがカーネルを変更せずにファイルシステムを提供できます。AppImage はこれを使って自分自身を開きますが、Ubuntu 24.04 ではそのバージョン 2 が標準でインストールされなくなりました。"
fn_sha: "SHA-256 は SHA-2 ファミリーの暗号学的ハッシュ関数で、米国 NIST が FIPS 180-4 で標準化しました。ファイルから 64 文字のフィンガープリントを作り、ファイルが 1 ビットでも変わればフィンガープリントも変わります。"
fn_jpeg: "JPEG は Joint Photographic Experts Group の画像形式で、ISO/IEC 10918-1 および ITU-T T.81 として標準化されています。"
fn_pf_raw: "macOS では、DNG 以外の RAW 形式は OS がレンズ補正付きで現像します。Linux と Windows では Fotollection に内蔵されたリーダーがそれらなしで処理します。Windows では、Microsoft Raw Image Extension がインストールされていれば最後の手段としてだけ使います。"
fn_pf_heic_win: "Microsoft Store の無料の HEIF Image Extensions と HEVC Video Extensions を使います。"
fn_pf_heic_linux: "HEIC には HEVC デコーダーが必要ですが、Linux には同梱されておらず、Fotollection も特許のため同梱していません。今後のバージョンでは、ディストリビューションがインストールした libheif を使う予定です。それまでは HEIC の写真を JPEG に変換してください。"
fn_pf_tether: "まず Sony a6400 から。ほかのカメラも続きます。"
fn_pf_openwith: ".deb パッケージまたはインストールスクリプトを使った場合。単体で実行した AppImage は、AppImageLauncher のようなツールが登録しない限りファイルマネージャーに登録されません。"
fn_pf_update: "AppImage は新しい AppImage をダウンロードします。.deb はリリースページを開き、APT リポジトリを使っていれば sudo apt upgrade で新しいバージョンになります。"
fn_glibc: "glibc（GNU C Library）は、すべての Linux プログラムが動く土台のライブラリです。自分のバージョンはターミナルで ldd --version と入力すれば確認できます。Fotollection は glibc 2.35 を搭載した Ubuntu 22.04 でビルドしているため、このバージョン以降が必要です。"
fn_nvidia: "NVIDIA 独自のドライバーでは、WebKitGTK の DMA-BUF レンダラーがウインドウを空白のままにすることがあります。このドライバーが読み込まれている場合、Fotollection はそのレンダラーをオフにして一度だけ自身を再起動します。"
fn_dm: "dm および dm ロゴは dm-drogerie markt GmbH + Co. KG の商標です。"
fn_rossmann: "ROSSMANN および ROSSMANN ロゴは Dirk Rossmann GmbH の商標です。"
fn_cewe: "dm と Rossmann の写真サービスは CEWE が提供しており、CEWE は CEWE Stiftung & Co. KGaA の商標です。プリントサイズは 2026 年 10 月に dm の価格表と照合しました。店舗が変更する場合があります。"
fn_seven: "7-Eleven および 7-Eleven ロゴは 7-Eleven, Inc. の商標です。"
fn_lawson: "LAWSON および LAWSON ロゴは株式会社ローソン（Lawson, Inc.）の商標です。"
fn_familymart: "FamilyMart および FamilyMart ロゴは株式会社ファミリーマート（FamilyMart Co., Ltd.）の商標です。"
fn_konbini: "日本のコンビニの写真プリントは L 判（89 × 127 mm）、2L 判（127 × 178 mm）、ましかく（89 × 89 mm）で、2026 年 11 月に各社のページで確認しました。Fotollection の 9 × 13、13 × 18、10 × 10 は、コピー機が切り落とす端の内側で形を保ちます。サイズは店舗が変更する場合があります。"
fn_photos: "スクリーンショットのプラハの写真（路面電車、街並み、ヴルタヴァ川）は、@hoangphi01 が 2026 年 11 月に Lumix GX9 で撮影したものです：© @hoangphi01、無断転載禁止。アプリのライセンスの対象外で、再利用はできません。そのほかのデモ写真は Wikimedia Commons のパブリックドメイン（CC0）で、作者は Dktue（7 枚）、パリの Pierre Blaché（2 枚）、Kate Branch（1 枚）です。プリントバスケットとベストショットのスクリーンショットに写っている猫も @hoangphi01 が GX9 で撮影したもので、無断転載禁止です。隣の、よりソフトな・ブレた・暗いコピーは、ベストショットがどう選ばれるかを示すためにこの 1 枚から作りました。"
fn_photos_link: "すべてのファイルとそのページ、チェックサム。"
fn_rawsamples: "RAW の計測には raw.pixls.us のパブリックドメイン（CC0）のサンプルを形式ごとに 1 つ、計 9 つ使っています。scripts/fetch-raw-samples.py がダウンロードと検証を行います。"
fn_rawformats: "このページで触れている RAW 形式は、それを定めたメーカーのものです：RW2（Panasonic Holdings Corporation）、CR2 と CR3（Canon Inc.）、NEF（Nikon Corporation）、ARW（Sony Group Corporation）、RAF（FUJIFILM Corporation）、ORF（OM Digital Solutions Corporation、旧 Olympus）。DNG は Adobe Inc. が公開したオープンな仕様です。Fotollection は内蔵のリーダーでこれらを読み、macOS ではまず OS のコーデックを使います（Windows では Microsoft Raw Image Extension がインストールされていれば最後の手段として）。いずれの会社も Fotollection を作っておらず、承認もしていません。"
fn_cameras: "スクリーンショットやアプリの情報フレームに表示されるカメラの名前とロゴは各所有者の商標で、どのカメラで撮った写真かを示すためだけに表示しています：Apple（Apple Inc.）、Canon（Canon Inc.）、Fujifilm（FUJIFILM Corporation）、Hasselblad（Victor Hasselblad AB）、Leica（Leica Camera AG）、Lumix（Panasonic Holdings Corporation）、Nikon（Nikon Corporation）、Noritsu（Noritsu Koki Co., Ltd.）、Phase One（Phase One A/S）、Ricoh（Ricoh Company, Ltd.）、Samsung（Samsung Electronics Co., Ltd.）、Sony（Sony Group Corporation）。"
fn_others: "Apple と macOS は Apple Inc. の商標です。Windows は Microsoft Corporation の、Linux は米国およびその他の国における Linus Torvalds の登録商標です。Ubuntu は Canonical Ltd. の、Debian は Software in the Public Interest, Inc. の、Fedora、Red Hat、RHEL、CentOS は Red Hat, Inc. の、openSUSE は SUSE LLC の、Pop!_OS は System76, Inc. の、Rocky Linux は Rocky Enterprise Software Foundation の、AlmaLinux は AlmaLinux OS Foundation の、ChromeOS は Google LLC の、NVIDIA は NVIDIA Corporation の商標です。その他の Linux ディストリビューションの名前は各プロジェクトのものです。Facebook と Instagram は Meta Platforms, Inc. の、GitHub は GitHub, Inc. の、Google Analytics は Google LLC の、Lightroom は Adobe Inc. の、IrfanView は Irfan Škiljan の、VietQR は NAPAS の、Wikimedia Commons は Wikimedia Foundation のものです。Apple、Windows、Linux（Tux、最初の作者は Larry Ewing）のマークは Simple Icons（CC0）のもので、列や手順がどの OS のものかを示すためだけに使っています。"
fn_brand: "Fotollection の名前とロゴは、@hoangphi01 が作る公式アプリを示します。公式のダウンロードは fotollection.org とプロジェクトの GitHub リリースからのみです。GPL-3.0 ライセンスにより、このライセンスを保ちソースコードを提供する限り、誰でも改変の有無にかかわらずコピーを共有・販売できます。改変・再販されたコピーは、公式アプリであるかのように Fotollection の名前やロゴを使うことはできません。"
fn_notify: "Fotollection を共有・販売したり、その上に何かを作ったりする予定ですか？まずは GitHub で issue を開いて（github.com/hoangphi01/fotollection/issues）作者に知らせてください。アプリは無料で、空き時間に作られています。短いメッセージが何よりのお礼です。"
fn_cite: "アプリを引用・レビュー・紹介したり、これらのスクリーンショットを使ったりしますか？Fotollection の名前を記し、fotollection.org へリンクしてください。"
fn_independent: "Fotollection は独立したオープンソースのプロジェクトです。これらの企業とは提携・スポンサー・承認の関係になく、その他の商標はすべて各所有者に帰属します。"
shield: "プライベート – 写真がパソコンの外に出ることはありません"
privacy_title: "あなたの写真は、あなたのもの"
privacy_lead: "Fotollection はインターネットなしで動くように作られています。何もアップロードせず、何も追跡せず、そのすべてのコードを確かめられます。"
p1_title: "アップロードなし、クラウドなし"
p1_text: "写真の読み込みも書き込みも、自分のディスク上で行います。写真を送る先のサーバーはありません。"
p2_title: "アカウントなし、追跡なし"
p2_text: "登録は不要で、アプリにアナリティクスやテレメトリーはありません。v0.13.0 からは、起動時に一度だけ GitHub に新しいバージョンがあるかを確認します。これは設定でオフにできます。"
p6_title: "広告なし"
p6_text: "何かを売りつけることはなく、あなたに届くためにお金を払う人もいません。広告も、スポンサー付きのおすすめも、アプリ内課金も、今もこれからもありません。"
p3_title: "地図サービスなしで地名を"
p3_text: "町の名前はアプリに内蔵された地図データベースから引くので、GPS データが第三者に渡ることはありません。"
p4_title: "書き出し時に GPS を削除"
p4_text: "書き出した画像からは標準で位置情報が削除されるので、写真店に渡した写真から自宅がわかることはありません。"
p5_title: "オープンソース"
p5_text: "コードは GPL-3.0 で公開しています。誰でも読み、ビルドし、このページに書かれているとおりに動くことを確かめられます。"
charts_more: "すべての計測を、わかりやすく"
