distro_title: "動作する Linux ディストリビューション"
distro_lead: "Fotollection は 64 ビット Linux（x86_64 または ARM64）、glibc 2.35 以降で動きます。"
distro_groups:
  - title: "動作します"
    items:
      - text: "AppImage：Ubuntu 22.04 以降、Debian 12 以降、Linux Mint 21 以降、Pop!_OS 22.04 以降、elementary OS 7 以降、Zorin OS 17 以降、Fedora 36 以降、openSUSE Tumbleweed、Arch、Manjaro、その他同じ時期のシステム。"
      - text: ".deb と APT リポジトリ：Ubuntu、Debian、Mint、Pop!_OS、elementary OS、Zorin OS。"
  - title: "ひと手間で動作します"
    items:
      - text: "Ubuntu 24.04 以降：AppImage には一度だけ FUSE 2 が必要です："
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: "。または次のように実行します："
        code2: "--appimage-extract-and-run"
        after2: "。.deb には何も必要ありません。"
      - text: "NixOS：次のコマンドで起動します："
        code: appimage-run
      - text: "Fedora Silverblue などのイミュータブルなシステム：AppImage を使ってください。"
      - text: "NVIDIA のグラフィックス：対応は不要です。アプリが WebKit の空白ウインドウの不具合を自動で回避します。"
        fn: [fn_nvidia]
  - title: "動作しません"
    items:
      - text: "glibc 2.35 より古いもの：Ubuntu 20.04、Debian 11、RHEL、CentOS、Rocky または Alma 8、openSUSE Leap 15。"
      - text: "Alpine など musl ベースのシステム。"
      - text: "32 ビットのマシン。"
      - text: "Linux コンテナなしの ChromeOS。"
  - title: "すべてのディストリビューションでの制限"
    items:
      - text: "HEIC（iPhone）の写真はまだ非対応：先に JPEG に変換してください。"
        fn: [fn_pf_heic_linux]
      - text: "USB 接続のカメラでの撮影はできません。"
      - text: "RAW は macOS が加えるレンズ補正なしで開きます。"
        fn: [fn_pf_raw]
