perf_explain_lead: "写真とプリントの専門用語を、友だちに話すように説明します。"
perf_faq:
  - q: "ΔE（デルタ E）とは？"
    fn: [fn_de]
    a: "ΔE は、2 つの色が人の目にどれだけ違って見えるかを、私たちの見え方に合わせた色空間（CIELAB、2000 年の式）で計算したものです。0 は同一。約 1 は、慣れた目が並べて見て気づく最小の差。2〜3 はたいていの人に見え、5 を超えると違う色に見えます。Fotollection のプリント用の書き出しは平均 0.19 です。"
  - q: "SSIM とは？"
    fn: [fn_ssim]
    a: "SSIM（構造的類似性指標）は、個々のピクセルではなく 2 つの画像の形やテクスチャーを比べます。ぼけやブロック状の圧縮ノイズに私たちが気づく仕方に近い指標です。1 は同一で、約 0.98 を超えると、たいていの人は拡大しない限り見分けられません。"
  - q: "JPEG はいくつの色を記録できますか？"
    fn: [fn_jpeg, fn_heic]
    a: "JPEG は赤・緑・青それぞれに 8 ビット、つまり各 256 段階、合計約 1670 万色を記録します。写真ラボもこれからプリントします。カメラの RAW ファイルは 12〜14 ビット、最近の iPhone は 10 ビットの HEIC でも保存でき、編集のときに役立ちます。仕上がったプリントなら、きちんと作った 8 ビットの JPEG でトーンに段差は出ません。"
  - q: "JPG と JPEG の違いは？PNG を使うべき？"
    a: "JPG と JPEG は同じ形式です。昔の Windows が 3 文字の拡張子しか使えなかっただけです。PNG は可逆なので何も失われませんが、PNG で保存した写真は 3〜5 倍の大きさになることが多く、ほとんどのコピー機やラボは JPEG を求めます。Fotollection がプリント用に書き出す、品質 90 以上・色の解像度フル（4:4:4）の JPEG なら、紙の上では元の写真と見分けがつきません。"
  - q: "4:4:4 と 4:2:0 とは？"
    a: "私たちの目は細部を主に明るさで見ていて、色ではそれほど見ていません。そのため JPEG は色を低い解像度で記録できます。4:4:4 は色の解像度をすべて保ち、4:2:0 は 4 分の 1 だけを保ちます。ファイルは小さくなりますが、赤い文字や葉の向こうの青空のような色の境界がにじみます。プリントには 4:4:4 がふさわしく、SNS はどのみちすべてを 4:2:0 に再圧縮します。"
  - q: "sRGB、Display P3、Adobe RGB とカラープロファイル"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "カラープロファイルは、ファイルの中の数字が何を意味するかをソフトに伝えます。sRGB は Web で使われる標準的な色域です。iPhone や最近のカメラが使う Display P3 は、おもに赤と緑で約 25 % 多くの色を表せます。P3 の写真がプロファイルを失うと、その数字は sRGB として読まれ、くすんで見えます。私たちが計測した 13 % の彩度の低下がこれです。一部のカメラがプリント用に用意する Adobe RGB も sRGB より広く、おもに緑とシアンで差があります。Fotollection はプリント用には写真のプロファイルを何であれそのまま保ち、SNS 用にはきちんと sRGB に変換します。"
  - q: "プリントには何 DPI 必要？"
    a: "DPI は用紙 1 インチあたりのピクセル数です。300 DPI なら近くで見てもシャープで、腕を伸ばした距離なら 150〜200 DPI で十分です。10 × 15 cm のプリントなら 300 DPI で 1800 × 1200 ピクセルが必要なので、スマートフォンやカメラの写真ならどれでも足ります。アプリのサイズ提案が、それぞれの写真をどこまで大きくできるかを教えてくれます。"
  - q: "Facebook で写真がきれいに見えないのはなぜ？"
    a: "Facebook はすべての写真を最大 2048 px にリサイズし、低めの品質と半分の色解像度で再圧縮して、カラープロファイルを捨てます。大きすぎる写真は、あなたと Facebook で 2 回リサイズされます。最初から 2048 px、sRGB、軽くシャープにして送れば、Facebook の再圧縮は 1 回だけで、色も最初から正しいままです。"
