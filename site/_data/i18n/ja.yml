faq_title: "ダウンロードの前に"
faq_lead: "なぜ新しい写真アプリなのか、何が違うのか。"
faq_groups:
  - label: "なぜ Fotollection か"
    items:
      - q: "Lightroom で十分では？"
        a: "Lightroom、OS 標準の写真アプリ、IrfanView は編集と閲覧のためのもので、写真プリントのためには作られていません。これらでプリントするなら、すべての写真を自分で用紙の比率にトリミングするか、ファイルをそのまま渡して店の機械やスタッフに任せることになり、頭や看板の端が切れてしまうこともよくあります。Fotollection はプリントから考えます。セブン‐イレブン、ローソン、ファミリーマートのマルチコピー機のサイズを知っていて、写真をそれぞれに合わせてトリミングするので、見たとおりにプリントされます。写真が小さすぎれば知らせ、フィルムカメラのように日付を入れ、コピー機が受け付けるファイルで書き出します。軽くて速く、無料で、Lightroom とも共存できます。元の写真は一切変更されず、Lightroom プリセットはルックとして使えます。"
      - q: "パソコンにはもう写真アプリがあるし、IrfanView も使っています。なぜ別のアプリが？"
        a: "OS 標準の写真アプリも IrfanView も、それぞれの OS で優れたビューアーです。でも、コンビニのマルチコピー機の L 判がどのサイズかも知らず、写真が小さすぎても教えてくれず、フィルムカメラのように日付も入れず、5 つのフォルダーのベストショットをひとつのプリントバスケットに集めることもできません。Fotollection はそのすべてができ、Mac でも Windows でも Linux でも同じ見た目と使い勝手。写真を開くビューアーとしても使えます。写真を右クリックして「このアプリケーションで開く」から Fotollection へ。カメラの RAW も開けます。"
  - label: "速さと軽さ"
    items:
      - q: "重くないですか？古いノートパソコンでも動きますか？"
        a: "小さいです。Windows のインストーラーは約 18 MB。ブラウザーを丸ごと同梱せず、OS にすでにある Web ビューでウインドウを描くからです。コアは Rust で書かれ、パソコン上で直接動きます。プレビューは最大 1600 px なので、32 MP の写真も小さな写真と同じ速さで開き、フルサイズの画像は拡大したときだけ読み込みます。5,035 枚を書き出しても、メモリのピークは約 1.45 GB です。"
      - q: "何千枚もの写真でどれくらい速いですか？"
        a: "1,000 枚の写真を開くのに約 0.12 秒。Fotollection はまず各ファイルに内蔵された小さなサムネールを読むからです。設定を変えるとプレビューを 17 ms で再描画し、書き出しは毎秒 18 枚のフルサイズ写真、初回起動後は約 0.4 秒で開きます。どの数字もごく普通のノートパソコンで計測したもので、自分で計測する方法はパフォーマンスのページで説明しています。"
  - label: "対応 OS と料金"
    items:
      - q: "Mac、Windows、Linux で動きますか？本当に無料ですか？"
        a: "はい。macOS 11 以降用（Apple シリコンと Intel の両方）、Windows 10 と 11 用をそれぞれひとつずつ。64 ビット Linux 用には AppImage または .deb があり、Intel/AMD でも ARM でも、glibc 2.35 以降のどのディストリビューションでも動きます。Linux 版は軽量版で、HEIC（iPhone）の写真にはまだ対応せず、USB 接続のカメラでの撮影もなく、RAW には macOS が加えるレンズ補正が付きません。違いはすべて「機能」の下の表にあります。広告なし、アカウントなし、アプリ内課金なしの無料で、ソースコードは GPL-3.0 で公開されているので、何をしているかは誰でも確かめられます。"
        fn: [fn_heic, fn_arch, fn_linux_pkg]
tabs_row_title: "フォルダーはタブに、チェックはどこへでも"
tabs_text: "フォルダーをクリックすればそのフォルダーだけを、ワークスペースをクリックすればすべてのフォルダーをまとめて扱えます。あるフォルダーで写真にチェックを入れ、別のフォルダーに移ってもチェックを続けられます。バーがすべてを数えるので、各フォルダーのベストをワンステップでプリントバスケットへ。複数のフォルダーにチェックを入れて、まとめて、またはフォルダーごとに書き出し、終わったら × でタブを閉じます。写真はディスクに残ります。"
