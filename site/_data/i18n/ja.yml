wiki_title: "Wiki"
wiki_kicker: "最初の画面から"
wiki_description: "Fotollectionが最初の画面からどう育ってきたか、バージョンごとに。それぞれが何をもたらし、リリース時にどんな姿だったか。"
wiki_lead: "今日から最初の空っぽのウインドウまで、すべてのバージョン。何をもたらし、リリース時のFotollectionがどんな姿だったかを、プロジェクトの歴史から。"
wiki_first: "最初の画面へ"
wiki_toc: "バージョン"
wiki_foot: "どの画像も、そのバージョンがリリースされたときのFotollectionを、プロジェクトの歴史から写したものです。初期のものは英語のみです。新しいバージョンもすべてここに加わります。"
man_title: "マニュアル"
man_kicker: "ヘルプ"
man_description: "Fotollectionの使い方を、手順ごとにスクリーンショット付きで。プリントする写真の選び方、ルックと色、拡大、RAW、カメラの時計、日付と場所、接続したカメラでの撮影、すべてのキーボードショートカット。"
man_lead: "どの手順も、アプリに表示されるとおりに。マニュアルはアプリに合わせて更新され、バージョンアップで画面が変われば、このページも一緒に変わります。"
man_toc: "章"
man_source: "GitHubのこのマニュアル"
cs_title: "コード署名ポリシー"
cs_kicker: "信頼"
cs_description: "Fotollectionのインストーラーがどのように作られ公開されるか、誰がリリースを承認するか、アプリがネットワークに何を送り、何を送らないか。"
cs_lead: "インストーラーはまだ証明書で署名されていません。Windowsは初回起動時にSmartScreenの警告を表示し、macOSのビルドはアドホック署名のみ、LinuxのAppImageと .debも未署名です。各リリースではSHA-256チェックサムをSHA256SUMS.txtに掲載しているので、ダウンロードしたものがここで公開したものと同じかを確認できます。fotollection.org/aptのAPTリポジトリはプロジェクトのGPG鍵で署名されているので、aptがそこからインストールするすべてのパッケージを検証します。"
cs_parts:
  - id: team
    title: "役割"
    lead: "すべてのインストーラーは、公開リポジトリのタグ付きリリースからGitHub Actionsがビルドします。個人のマシンでビルドしたものは公開しません。ビルドのワークフロー："
    items:
      - title: "コミッターとレビュアー"
        author: true
        text: "ソースコードのすべての変更を書き、レビューします。"
      - title: "リリース承認者"
        author: true
        text: "すべてのリリースを手作業で確認し、公開します。"
  - id: privacy
    title: "プライバシーポリシー"
    lead: "このプログラムは、ユーザーまたはインストール・運用する人から明示的に求められない限り、ほかのネットワークシステムに一切の情報を送信しません。"
    items:
      - title: "オフラインで動作"
        text: "写真、フォルダー、プロジェクト、設定がパソコンの外に出ることはありません。アカウントも、テレメトリーも、クラッシュレポートのアップロードもありません。"
      - title: "アップデートの確認"
        text: "唯一のネットワークリクエストです。クリックしたとき、そしてv0.13.0からは設定でオフにしない限り起動時に一度、プロジェクトの最新リリースをGitHub（api.github.com）に問い合わせます。自動でダウンロードされるものはありません。これにはGitHubのプライバシーに関する声明が適用されます。"
      - title: "書き出しに位置情報なし"
        text: "書き出した写真からは、標準でGPS座標が削除されます。"
      - title: "このウェブサイト"
        text: "アプリではなくウェブサイトが、Google Analyticsで訪問数とダウンロードリンクのクリック数を数えています。これにはGoogleのプライバシーポリシーが適用されます。ダウンロード数はGitHubから取得しています。"
      - title: "支援"
        text: "Fotollectionへの支援金は、Ko-fi、GitHub Sponsors、VietQRコードの先の銀行がそれぞれのプライバシーポリシーに従って扱います。ウェブサイトはそれらにリンクするだけで、何も読み込みません。支援はアプリやFotollection内のあなたのデータとは一切関係ありません。"
  - id: system
    title: "システムへの変更"
    lead: "インストールではアプリに必要なものだけを追加し、アンインストールで削除します。"
    items:
      - title: "このアプリケーションで開く"
        text: "インストーラー（Linuxでは .deb）が、写真ファイルの「このアプリケーションで開く」メニューにFotollectionを追加します。勝手に既定のアプリになることはありません。"
      - title: "アンインストール"
        text: "Windowsの設定からアンインストールするか、macOSではアプリを削除します。Windowsのアンインストーラーは「このアプリケーションで開く」の項目も削除します。Linuxではsudo apt remove fotollectionを実行するか、AppImageを削除するか、インストールスクリプトを --uninstall付きで実行するとAPTリポジトリと鍵も削除されます。設定とプロジェクトはホームフォルダーに残ります。"
perf_title: "パフォーマンス"
perf_description: "Fotollectionを支えるすべての計測を、わかりやすく。速さ、メモリ、プリント品質、SNS向けの写真、ベストショットの提案。ΔE、SSIM、JPEG、カラープロファイルの意味とともに。"
perf_kicker: "約束ではなく、計測"
perf_lead: "このページの数字はすべて、ごく普通のノートパソコン（Apple M3、16 GB）で本物の写真から計測したもので、それを出すスクリプトはリポジトリにあるので誰でも再実行できます。各グラフの下にはプリントにとっての意味を、最後には数字の裏にある用語の説明を載せています。"
perf_how_title: "Fotollectionが速い理由"
perf_how_lead: "魔法はありません。最初のコードを書く前に決めたいくつかの方針と、そのすべての計測です。"
perf_how_items:
  - { t: "すべてのコアでネイティブコード", d: "Fotollectionの処理はRustで動き、あなたのプロセッサー向けにコンパイルされてすべてのコアに分散され、プロセッサーがピクセル処理のために持つベクトル命令（SIMD）を使います。", v: "23.5 / 秒", l: "16 MPでの写真の書き出し", fn: [fn_simd, fn_units, fn_rust] }
  - { t: "必要なものだけ", d: "フォルダーを開くときは、各ファイルのEXIFと小さな埋め込みサムネールだけを読み、写真全体は読みません。サムネールはディスクのキャッシュに保存されます。", v: "0.12秒", l: "1,000枚の写真を開く", fn: [fn_exif] }
  - { t: "画面より多いピクセルは扱わない", d: "プレビューは最大1600 pxで、メモリに保持した2048 pxのコピーから作ります。写真全体は拡大したときだけ、部分ごとに読み込みます。", v: "17 ms", l: "プレビューの再描画" }
  - { t: "クリックする前に準備完了", d: "サムネールができると、すべての写真のプレビューをバックグラウンドで作ってディスクに保存し、メモリの4分の1で画面上の写真の前後を保持します。", v: "27 ms", l: "どの写真を開くのも" }
  - { t: "同じものを二度作らない", d: "カラースライダーは色だけを変え、サイズは変えません。すべてのカラースライダーは33 × 33 × 33色のテーブルひとつにまとめられるので、スライダー10本でも1本と同じコストです。", v: "2 ms", l: "プレビュー上のカラースライダー10本" }
  - { t: "予算内のメモリ", d: "Fotollectionが同時に扱うフルサイズの写真は、メモリ予算が許す枚数だけ。その予算は書き出しでいちばん大きな写真で決まります。", v: "1.45 GB", l: "5,035枚でのメモリのピーク" }
  - { t: "計測で調整したエンコーダー", d: "プリント用ファイルでは、サイズを1 % も小さくしないのにエンコード時間の3分の1を使っていたテーブルの最適化を省いています。", v: "−33 %", l: "プリント用ファイルのエンコード時間" }
  - { t: "編集中はグラフィックスカード", d: "カラースライダーを動かしている間は、コアが作ったテーブルからグラフィックスカードが描画します。書き出しはプロセッサーで行うので、プリントはどのマシンでも同じになります。", v: "1–2 ms", l: "スライダー1ステップあたり（26 msから）" }
perf_gpu_title: "編集にはグラフィックスカード、書き出しにはすべてのコア"
perf_gpu_text: "カラースライダーをドラッグしている間は、Fotollectionのコアが作るのと同じテーブルからグラフィックスカードがルックを描画し、手を離すと正確なレンダリングに切り替わります。書き出しはプロセッサーで行うので、プリントはどのマシンでも同じに仕上がります。"
gpu_stats:
  - { v: "1–2 ms", l: "グラフィックスカードでのスライダー1ステップ（約26 msから）" }
  - { v: "0.13", l: "カードのルックと正確なレンダリングの ΔE2000" }
  - { v: "10.8", l: "26 MPの写真を毎秒書き出し、6枚同時" }
chart_gpu: "カラースライダーの1ステップ：プロセッサーとグラフィックスカード"
chart_inflight: "同時に処理する写真の枚数ごとの書き出し速度"
chart_open: "写真を開く：v0.9.0とv0.10.0をv0.11.0と比べて、旅の422枚で"
perf_open_title: "最大20倍速く。メモリの新しい使い方。"
perf_open_text: "v0.11.0では、Fotollectionが写真を保持する方法を見直しました。サムネールができるとすぐに、すべての写真のプレビューをバックグラウンドで作ってディスクに保存し、パソコンのメモリの4分の1で見ている写真の前後を保持し、画面上の写真はいつも最優先です。その結果、近くても遠くても、JPEGでもRAWでも、どの写真も27ミリ秒で開きます。同じ旅の422枚で計測して、RAWを開くのはv0.9.0の最大20倍、JPEGは10倍の速さです。"
perf_open_fn: [fn_raw, fn_jpeg]
open_stats:
  - { v: "20×", l: "v0.9.0より速くRAWの写真を開く（531 → 27 ms）" }
  - { v: "10×", l: "v0.9.0より速くJPEGを開く（274 → 27 ms）" }
  - { v: "27 ms", l: "近くても遠くても、どの写真も開く（予算：100 ms）" }
perf_speed_title: "速さ：1,000枚の写真を一瞬で"
perf_speed_text: "フォルダーを開くときは、各写真のEXIFと小さな埋め込みサムネールだけを読み、画像全体は読みません。設定を変えたときに再描画するのはプレビューだけです。ネイティブのRustは、同じことをするWebブラウザーにも勝ります。書き出し速度は同じで、プレビューはより速く、メモリは4分の1少なくて済みます。"
speed_stats:
  - { v: "0.12秒", l: "1,000枚のフォルダーの読み込み、予算の8分の1" }
  - { v: "17 ms", l: "変更後のプレビューの再描画" }
  - { v: "23.5", l: "16 MPの写真を毎秒書き出し" }
perf_memory_title: "メモリ：5,035枚でも安定"
perf_memory_text: "Fotollectionがメモリに保持するのは写真1枚あたり数バイトだけ。サムネールはディスクのキャッシュに書き込み、同時に扱うフルサイズの画像はメモリ予算に収まる枚数だけです。だから旅の写真が何千枚に増えても、メモリは安定しています。"
memory_stats:
  - { v: "1.45 GB", l: "5,035枚でのメモリのピーク" }
  - { v: "1.35 GB", l: "95枚でのメモリのピーク" }
  - { v: "53×", l: "0.1 GB多いメモリで扱える写真の枚数" }
perf_print_title: "プリント品質：プリントは、写真のとおりに"
perf_print_text: "Webエディターで作ったプリントは、くすんで見えることがよくあります。エディターがカラープロファイルを捨て、写真を2000 pxに縮小し、品質80、色を半分にして保存するからです。Fotollectionはプロファイルを保ち、フル解像度の4:4:4で書き出します。"
print_stats:
  - { v: "0.19", l: "色の誤差。目が気づき始めるのは1から" }
  - { v: "4:4:4", l: "色の解像度はフル。Webエディターは半分に" }
  - { v: "87 %", l: "Webエディターの2000 pxで失われる細部" }
