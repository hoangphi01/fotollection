faq_title: "ダウンロードの前に。"
faq_lead: "なぜ新しい写真アプリなのか、何が違うのか。"
faq_groups:
  - label: "なぜFotollectionか"
    items:
      - q: "Lightroomで十分では？"
        a: "Lightroom、OS標準の写真アプリ、IrfanViewは編集と閲覧のためのもので、写真プリントのためには作られていません。これらでプリントするなら、すべての写真を自分で用紙の比率にトリミングするか、ファイルをそのまま渡して店の機械やスタッフに任せることになり、頭や看板の端が切れてしまうこともよくあります。Fotollectionはプリントから考えます。セブン‐イレブン、ローソン、ファミリーマートのマルチコピー機のサイズを知っていて、写真をそれぞれに合わせてトリミングするので、見たとおりにプリントされます。写真が小さすぎれば知らせ、フィルムカメラのように日付を入れ、コピー機が受け付けるファイルで書き出します。軽くて速く、無料で、Lightroomとも共存できます。元の写真は一切変更されず、Lightroomプリセットはルックとして使えます。"
      - q: "パソコンにはもう写真アプリがあるし、IrfanViewも使っています。なぜ別のアプリが？"
        a: "OS標準の写真アプリもIrfanViewも、それぞれのOSで優れたビューアーです。でも、コンビニのマルチコピー機のL判がどのサイズかも知らず、写真が小さすぎても教えてくれず、フィルムカメラのように日付も入れず、5つのフォルダーのベストショットをひとつのプリントバスケットに集めることもできません。Fotollectionはそのすべてができ、MacでもWindowsでもLinuxでも同じ見た目と使い勝手。写真を開くビューアーとしても使えます。写真を右クリックして「このアプリケーションで開く」からFotollectionへ。カメラのRAWも開けます。"
  - label: "速さと軽さ"
    items:
      - q: "重くないですか？古いノートパソコンでも動きますか？"
        a: "小さいです。Windowsのインストーラーは約18 MB。ブラウザーを丸ごと同梱せず、OSにすでにあるWebビューでウインドウを描くからです。コアはRustで書かれ、パソコン上で直接動きます。プレビューは最大1600 pxなので、32 MPの写真も小さな写真と同じ速さで開き、フルサイズの画像は拡大したときだけ読み込みます。5,035枚を書き出しても、メモリのピークは約1.45 GBです。"
      - q: "何千枚もの写真でどれくらい速いですか？"
        a: "1,000枚の写真を開くのに約0.12秒。Fotollectionはまず各ファイルに内蔵された小さなサムネールを読むからです。設定を変えるとプレビューを17 msで再描画し、書き出しは毎秒18枚のフルサイズ写真、初回起動後は約0.4秒で開きます。どの数字もごく普通のノートパソコンで計測したもので、自分で計測する方法はパフォーマンスのページで説明しています。"
  - label: "対応OSと料金"
    items:
      - q: "Mac、Windows、Linuxで動きますか？本当に無料ですか？"
        a: "はい。macOS 11以降用（AppleシリコンとIntelの両方）、Windows 10と11用をそれぞれひとつずつ。64ビットLinux用にはAppImageまたは .debがあり、Intel/AMDでもARMでも、glibc 2.35以降のどのディストリビューションでも動きます。Linux版は軽量版で、HEIC（iPhone）の写真にはまだ対応せず、USB接続のカメラでの撮影もなく、RAWにはmacOSが加えるレンズ補正が付きません。違いはすべて「機能」の下の表にあります。広告なし、アカウントなし、アプリ内課金なしの無料で、ソースコードはGPL-3.0で公開されているので、何をしているかは誰でも確かめられます。"
tabs_row_title: "フォルダーはタブに。チェックはどこでも。"
tabs_text: "フォルダーをクリックすればそのフォルダーだけを、作業スペースをクリックすればすべてのフォルダーをまとめて扱えます。あるフォルダーで写真にチェックを入れ、別のフォルダーに移ってもチェックを続けられます。バーがすべてを数えるので、各フォルダーのベストをワンステップでプリントバスケットへ。複数のフォルダーにチェックを入れて、まとめて、またはフォルダーごとに書き出し、終わったら × でタブを閉じます。写真はディスクに残ります。"
modes_title: "3つのモード。3つの仕事。"
modes_lead: "やりたいことに合うモードを、サイドバーの上部かCmd/Ctrl+1、2、3で選びます。写真、プリントバスケット、設定はどのモードでも共通です。"
