perf_trip_fn: [fn_trip, fn_pct]
perf_trip_title: "本物の旅：プラハの 422 ファイル"
perf_trip_text: "テスト用のセットは実際より良く見せることがあります。そこで、プラハでの週末のあとに Lumix GX9 から取り込んだままのフォルダーを使いました。1 枚約 11 MB の 20 MP の JPEG が 396 枚と、RAW ファイルが 26 枚、合計 4.7 GB。開くと 0.23 秒ですべてのファイルの EXIF を読み込みます。プレビューは 19 ms で再描画し、RAW は 0.35 秒で現像、ポストカード 10 枚は 21 ms で再描画します。2026 年 11 月 3 日、これらの大きなファイルで 2 つの数字が予算に収まりませんでした。書き出しは毎秒 7.6 枚、メモリのピークは 2.14 GB。原因を突き止めて v0.9.7 で修正し、今では JPEG の書き出しは毎秒 10.1 枚、実行全体で 1.31 GB 以下に収まります。"
trip_stats:
  - { v: "0.23 秒", l: "422 ファイルすべてを EXIF ごと開く" }
  - { v: "19 ms", l: "プレビューの再描画、p95（予算：50 ms）" }
  - { v: "0.35 秒", l: "20 MP の RAW を 1 枚現像（中央値）" }
  - { v: "21 ms", l: "ポストカード 10 枚の再描画（予算：100 ms）" }
  - { v: "10.1 / 秒", l: "JPEG の書き出し（予算：8 / 秒）" }
  - { v: "1.31 GB", l: "メモリのピーク、JPEG と RAW（上限：2 GB）" }
fn_trip: "プラハのフォルダーは作者自身のもので、公開していません（© @hoangphi01、無断転載禁止）。bench/trip.sh と、その JPEG に対する measure_folder をそれぞれ 3 回実行した中央値で、Apple M3・16 GB、ほかのアプリを開いた状態、2026 年 11 月 4 日、v0.9.7 の書き出しで計測しました。比べるなら自分のフォルダーで実行してください。"
fn_simd: "SIMD（single instruction, multiple data）は、プロセッサーが多くの値を一度に処理する仕組みです。1 つの命令が、幅の広いベクトルレジスターに並べた複数の数、たとえば多数のピクセルの赤・緑・青の成分に同時に作用します。Intel と AMD のプロセッサーでは SSE と AVX、Apple シリコンなどの Arm プロセッサーでは NEON として使えます。Intel、AMD、Arm は各所有者の商標です。"
fn_pct: "p50 と p95 はパーセンタイルです。p50（中央値）は実行の半分が収まった時間、p95 は 100 回中 95 回が収まった時間で、平均では隠れてしまう遅いケースを示します。"
fn_psnr: "PSNR（ピーク信号対雑音比）は 2 つの画像をピクセルごとに比べ、その差をデシベルで表します。大きいほど近く、約 40 dB を超えると差はほとんど見えません。"
fn_sensor: "CMOS と CCD は 2 種類のイメージセンサーで、光を電荷に変える受光セルの格子です。今日ではほぼすべてのカメラとスマートフォンが CMOS（相補型金属酸化膜半導体）を使い、CCD（電荷結合素子）は以前のカメラで一般的でした。"
fn_tiff: "TIFF（Tagged Image File Format）は柔軟な画像形式で、現在は Adobe が管理しています。DNG を含む多くの RAW 形式がその構造に基づいています。"
fn_gpg: "GPG（GNU Privacy Guard）は OpenPGP 規格のフリーな実装です。APT リポジトリは GPG 鍵で署名されているので、システムはすべてのパッケージがそこから変更されずに届いたことを確認できます。"
fn_rust: "Rust および Rust ロゴは Rust Foundation の商標です。Fotollection のコアは Rust で書かれ、パソコン上で直接動きます。"
fn_webview: "アプリのウインドウは Tauri で作られ、OS 自身の Web ビューが描画します。macOS では WebKit（WKWebView）、Windows では Microsoft Edge WebView2、Linux では WebKit の GTK 版である WebKitGTK です。Tauri は Commons Conservancy 内の Tauri Programme のプロジェクト、WebKit は Apple Inc. の商標、GTK は GNOME Foundation のプロジェクト、Microsoft Edge と WebView2 は Microsoft Corporation の商標です。ブラウザーとの比較は、同じ処理を Google Chrome のもとになっているオープンソースプロジェクトであるヘッドレス Chromium 156 で、プロセッサーのコアごとに 1 つの Web Worker を使って実行しました。"
fn_de: "ΔE2000（CIEDE2000）は国際照明委員会（CIE）の色差式で、ISO/CIE 11664-6 として標準化されています。計算に使う CIELAB 色空間は ISO/CIE 11664-4 です。"
fn_ssim: "SSIM は Zhou Wang、Alan C. Bovik、Hamid R. Sheikh、Eero P. Simoncelli が論文「Image quality assessment: from error visibility to structural similarity」（IEEE Transactions on Image Processing, 13(4), 2004）で提案しました。"
fn_srgb: "sRGB は 1996 年に HP と Microsoft が作り、IEC 61966-2-1 として標準化されました。"
fn_p3: "Display P3 は Apple Inc. が定めた色空間で、映画業界（SMPTE）の DCI-P3 色空間に基づいています。"
fn_adobe: "Adobe RGB (1998) は Adobe Inc. が仕様を定めた色空間です。Adobe は Adobe Inc. の登録商標です。"
fn_charts: "すべてのグラフ：数字は目安で、ごく普通のノートパソコン（Apple M3、16 GB）で計測したものです。実際の値はお使いのマシンによって変わります。"
fn_dng: "このページのために Adobe DNG Converter は実行していません。数字は外部の見積もり（最新のハードウェアで CR3 ファイル 1,000 個に 20〜30 分、マシン名の記載なし）で、convertintomp4.com の RAW から DNG への一括変換に関するブログ記事によるものです。Adobe は Adobe Inc. の登録商標です。"
