estimate_title: "書き出す前に、サイズがわかる。"
estimate_text: "書き出しカードは、書き込む前にファイルのサイズを教えてくれます。あなたの設定で数枚をエンコードして見積もります。Facebook向けのカメラの写真はおよそ6分の1の軽さになり、それがクリックする前にわかります。"
