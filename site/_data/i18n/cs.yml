perf_trip_title: "Skutečná cesta: 422 souborů z Prahy"
perf_trip_text: "Testovací sady mohou výsledky přikrášlit, proto tady je jedna složka přesně tak, jak vyšla z fotoaparátu Lumix GX9 po víkendu v Praze: 396 JPEGů s 20 MP, každý asi 11 MB, a vedle nich 26 souborů RAW, celkem 4,7 GB. Při otevření se EXIF všech souborů přečte za 0,23 sekundy. Náhled se překreslí za 19 ms, RAW se vyvolá za 0,35 sekundy a deset pohlednic se překreslí za 21 ms. Dne 2026-11-03 dvě čísla na těchto velkých souborech překročila svůj limit: export běžel rychlostí 7,6 fotky za sekundu a špička paměti dosáhla 2,14 GB. Příčina byla nalezena a opravena ve v0.9.7: JPEGy se teď exportují rychlostí 10,1 za sekundu a celý běh zůstane pod 1,31 GB."
trip_stats:
  - { v: "0,23 s", l: "na otevření všech 422 souborů včetně EXIF" }
  - { v: "19 ms", l: "překreslení náhledu, p95 (limit 50 ms)" }
  - { v: "0,35 s", l: "na vyvolání RAW s 20 MP (medián)" }
  - { v: "21 ms", l: "na překreslení deseti pohlednic (limit 100 ms)" }
  - { v: "10,1 / s", l: "exportovaných JPEGů (limit 8 / s)" }
  - { v: "1,31 GB", l: "špička paměti, JPEG i RAW (strop 2 GB)" }
fn_trip: "Pražská složka je autorova vlastní a není zveřejněná (© @hoangphi01, všechna práva vyhrazena). Mediány ze 3 běhů bench/trip.sh a measure_folder na jejích JPEGech, na Apple M3 s 16 GB, s otevřenými dalšími aplikacemi, dne 2026-11-04, s exportem z v0.9.7; pro srovnání je spusť na vlastní složce."
fn_simd: "SIMD (single instruction, multiple data) umožňuje procesoru pracovat s mnoha hodnotami najednou: jedna instrukce působí na několik čísel uložených vedle sebe v širokém vektorovém registru, třeba na červenou, zelenou a modrou mnoha pixelů. Procesory Intel a AMD to nabízejí jako SSE a AVX; Apple silicon a další procesory Arm jako NEON. Intel, AMD a Arm jsou ochranné známky svých vlastníků."
fn_pct: "p50 a p95 jsou percentily: p50, medián, je čas, pod kterým zůstala polovina běhů; p95 je čas, pod kterým zůstalo 95 běhů ze 100, takže ukazuje pomalé případy, které průměr skryje."
fn_psnr: "PSNR (peak signal-to-noise ratio, špičkový poměr signálu k šumu) porovná dva obrázky pixel po pixelu a udá jejich rozdíl v decibelech: čím víc, tím jsou si bližší. Nad zhruba 40 dB je rozdíl těžko vidět."
fn_sensor: "CMOS a CCD jsou dva druhy obrazového snímače, mřížky buněk citlivých na světlo, které mění světlo na elektrický náboj. Téměř každý dnešní fotoaparát a telefon používá CMOS (complementary metal-oxide-semiconductor); CCD (charge-coupled device) bylo běžné ve starších fotoaparátech."
fn_tiff: "TIFF (Tagged Image File Format) je flexibilní obrazový formát, který dnes spravuje Adobe; mnoho formátů RAW, mezi nimi DNG, je postaveno na jeho struktuře."
fn_gpg: "GPG (GNU Privacy Guard) je svobodná implementace standardu OpenPGP. Repozitář APT je podepsaný klíčem GPG, takže tvůj systém může ověřit, že každý balíček pochází z něj a je nezměněný."
fn_rust: "Rust a logo Rustu jsou ochranné známky Rust Foundation. Jádro Fotollection je napsané v Rustu a běží přímo na tvém počítači."
fn_webview: "Okno aplikace je postavené na Tauri a vykresluje ho webové zobrazení samotného systému: WebKit (WKWebView) na macOS, Microsoft Edge WebView2 na Windows a WebKitGTK, port WebKitu pro GTK, na Linuxu. Tauri je projekt Tauri Programme v rámci Commons Conservancy; WebKit je ochranná známka Apple Inc.; GTK je projekt GNOME Foundation; Microsoft Edge a WebView2 jsou ochranné známky Microsoft Corporation. Srovnání s prohlížečem spustilo stejnou úlohu v headless Chromiu 156, open-source projektu, na kterém stojí Google Chrome, s jedním Web Workerem na každé jádro procesoru."
fn_de: "ΔE2000 (CIEDE2000) je vzorec barevného rozdílu Mezinárodní komise pro osvětlení (CIE), standardizovaný jako ISO/CIE 11664-6; barevný prostor CIELAB, ve kterém pracuje, je ISO/CIE 11664-4."
fn_ssim: "SSIM představili Zhou Wang, Alan C. Bovik, Hamid R. Sheikh a Eero P. Simoncelli v článku Image quality assessment: from error visibility to structural similarity, IEEE Transactions on Image Processing, 13(4), 2004."
fn_srgb: "sRGB vytvořily HP a Microsoft v roce 1996 a standardizováno bylo jako IEC 61966-2-1."
fn_p3: "Display P3 je barevný prostor definovaný společností Apple Inc., založený na barevném prostoru DCI-P3 filmového průmyslu (SMPTE)."
fn_adobe: "Adobe RGB (1998) je barevný prostor specifikovaný společností Adobe Inc.; Adobe je registrovaná ochranná známka Adobe Inc."
fn_charts: "Všechny grafy: čísla jsou orientační, změřená na běžném notebooku (Apple M3, 16 GB); ta tvoje závisí na počítači, který používáš."
fn_dng: "Adobe DNG Converter se pro tuto stránku nespouštěl. Údaj je odhad třetí strany (1 000 souborů CR3 za 20–30 minut na moderním hardwaru, stroj neuveden) z článku na blogu convertintomp4.com o hromadném převodu RAW do DNG. Adobe je registrovaná ochranná známka Adobe Inc."
