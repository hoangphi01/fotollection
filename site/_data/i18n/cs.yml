perf_explain_lead: "Pojmy z fotografie a tisku, vysvětlené srozumitelně."
perf_faq:
  - q: "Co je ΔE (Delta E)?"
    fn: [fn_de]
    a: "ΔE měří, jak daleko od sebe dvě barvy lidskému oku připadají, počítané v barevném prostoru vytvořeném tak, aby odpovídal tomu, jak vidíme (CIELAB, se vzorcem z roku 2000). 0 znamená shodné. Kolem 1 je nejmenší rozdíl, který cvičené oko pozná při porovnání vedle sebe; 2 až 3 vidí většina lidí; nad 5 vypadají barvy odlišně. Export Fotollection pro tisk má průměr 0,19."
  - q: "Co je SSIM?"
    fn: [fn_ssim]
    a: "SSIM, index strukturní podobnosti, porovnává tvary a textury dvou obrázků místo jednotlivých pixelů, což je blíž tomu, jak si všímáme rozmazání nebo kostičkovité komprese. 1 znamená shodné. Nad zhruba 0,98 většina lidí ty dva obrázky bez přiblížení nerozezná."
  - q: "Kolik barev pojme JPEG?"
    fn: [fn_jpeg, fn_heic]
    a: "JPEG ukládá 8 bitů pro každou z červené, zelené a modré: po 256 úrovních, asi 16,7 milionu barev. Z JPEGu tisknou i fotolaby. Soubory RAW z fotoaparátu mají 12 až 14 bitů a novější iPhony umí ukládat 10bitový HEIC, což pomáhá při úpravách; pro hotový tisk neukáže dobře udělaný 8bitový JPEG mezi tóny žádné schody."
  - q: "JPG, nebo JPEG? A mám použít PNG?"
    a: "JPG a JPEG jsou stejný formát: staré Windows dovolovaly jen třípísmenné přípony. PNG je bezeztrátový, takže se nic nezahodí, ale fotka uložená jako PNG je často třikrát až pětkrát větší a většina fotokiosků a fotolabů čeká JPEG. JPEG v kvalitě 90 nebo vyšší s plným barevným rozlišením (4:4:4), jak ho Fotollection exportuje pro tisk, je na papíře od originálu k nerozeznání."
  - q: "Co znamenají 4:4:4 a 4:2:0?"
    a: "Naše oči vidí detaily hlavně v jasu, méně v barvě, takže JPEG může ukládat barvu v nižším rozlišení. 4:4:4 zachová plné barevné rozlišení; 4:2:0 zachová jeho čtvrtinu, což zmenší soubory, ale změkčí barevné hrany, třeba červený text nebo modré nebe za listím. Pro tisk je vhodné 4:4:4; sociální sítě stejně všechno znovu zkomprimují na 4:2:0."
  - q: "sRGB, Display P3, Adobe RGB a barevné profily"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "Barevný profil říká softwaru, co znamenají čísla v souboru. sRGB je klasický rozsah barev používaný na webu. Display P3, který používají iPhony a novější fotoaparáty, obsáhne asi o 25 % víc barev, hlavně červených a zelených. Když fotka v P3 ztratí profil, její čísla se čtou jako sRGB a vypadá vybledle: to je naměřená ztráta 13 % sytosti. Adobe RGB, které některé fotoaparáty nabízejí pro tisk, je také širší než sRGB, hlavně v zelených a azurových. Fotollection pro tisk zachová jakýkoli profil, který fotka má, a pro sociální sítě ji správně převede do sRGB."
  - q: "Jaké DPI tisk potřebuje?"
    a: "DPI udává, kolik pixelů připadá na každý palec papíru. Při 300 DPI vypadá výtisk ostře i zblízka; 150 až 200 DPI stačí na vzdálenost natažené paže. Výtisk 10 × 15 cm při 300 DPI potřebuje 1 800 × 1 200 pixelů, takže stačí jakákoli fotka z telefonu nebo fotoaparátu; ukazatel velikosti ve Fotollection zobrazí největší formát tisku pro každou fotku."
  - q: "Proč fotky na Facebooku vypadají hůř?"
    a: "Facebook zmenší každou fotku nejvýš na 2 048 px, znovu ji zkomprimuje v nižší kvalitě s polovičním barevným rozlišením a zahodí barevné profily. Fotka, která přijde moc velká, se zmenšuje dvakrát, jednou při exportu a jednou Facebookem. Fotka odeslaná rovnou ve 2 048 px, v sRGB a lehce doostřená se zkomprimuje jen jednou a barvy zůstanou správné."
