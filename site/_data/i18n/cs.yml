man_toc: "Kapitoly"
man_source: "Tato příručka na GitHubu"
cs_title: "Zásady podepisování kódu"
cs_kicker: "Důvěra"
cs_description: "Jak se instalátory Fotollection sestavují a zveřejňují, kdo schvaluje každé vydání a co aplikace po síti posílá a co ne."
cs_lead: "Instalátory zatím nejsou podepsané certifikátem: Windows při prvním spuštění ukáže varování SmartScreen, sestavení pro macOS mají jen ad-hoc podpis a linuxový AppImage i .deb jsou také nepodepsané. Každé vydání uvádí kontrolní součty SHA-256 v SHA256SUMS.txt, takže si můžete ověřit, že stažený soubor je ten, který byl zveřejněn tady. Repozitář APT na fotollection.org/apt je podepsaný klíčem GPG projektu, takže apt ověří každý balíček, který z něj instaluje."
cs_parts:
  - id: team
    title: "Role v týmu"
    lead: "Každý instalátor sestavuje GitHub Actions z veřejného repozitáře, z označeného vydání; nic sestaveného na osobním počítači se nezveřejňuje. Workflow sestavení je"
    items:
      - title: "Autoři a recenzenti změn"
        author: true
        text: "Píše a kontroluje každou změnu zdrojového kódu."
      - title: "Schvalovatel vydání"
        author: true
        text: "Kontroluje a zveřejňuje každé vydání ručně."
  - id: privacy
    title: "Zásady ochrany soukromí"
    lead: "Tento program nepředává žádné informace jiným síťovým systémům, pokud o to výslovně nepožádá uživatel nebo osoba, která ho instaluje či provozuje."
    items:
      - title: "Funguje offline"
        text: "Fotky, složky, projekty a nastavení nikdy neopustí váš počítač. Není tu žádný účet, žádná telemetrie a žádné odesílání hlášení o pádech."
      - title: "Kontrola aktualizací"
        text: "Jediný síťový požadavek: Fotollection se po kliknutí a od verze 0.13.0 také jednou při spuštění (lze vypnout v Nastavení) dotáže GitHubu (api.github.com) na nejnovější vydání. Nic sám nestahuje. Platí pro něj zásady ochrany soukromí GitHubu."
      - title: "Žádná poloha v exportech"
        text: "Souřadnice GPS se z exportovaných fotek ve výchozím stavu odstraní."
      - title: "Tento web"
        text: "Web, ne aplikace, počítá návštěvy a kliknutí na své odkazy ke stažení pomocí Google Analytics; platí pro něj zásady ochrany soukromí Googlu. Počet stažení pochází z GitHubu."
      - title: "Platby na podporu"
        text: "Platby na podporu Fotollection zpracovávají Ko-fi, GitHub Sponsors a banka stojící za kódem VietQR, každý podle vlastních zásad ochrany soukromí. Web na ně jen odkazuje a nic z nich nenačítá a platba nemá nic společného s aplikací ani s vašimi daty ve Fotollection."
  - id: system
    title: "Změny ve vašem systému"
    lead: "Instalace přidá jen to, co aplikace potřebuje, a odinstalace to odstraní."
    items:
      - title: "Otevřít v aplikaci"
        text: "Instalátor, a na Linuxu balíček .deb, přidá Fotollection do nabídky Otevřít v aplikaci pro soubory fotek. Nikdy se sám nenastaví jako výchozí aplikace."
      - title: "Odinstalace"
        text: "Ve Windows ho odeberte v Nastavení, na macOS aplikaci smažte. Odinstalátor pro Windows odstraní i položky Otevřít v aplikaci. Na Linuxu spusťte sudo apt remove fotollection, smažte AppImage, nebo spusťte instalační skript s --uninstall, který odstraní i repozitář APT a jeho klíč. Nastavení a projekty zůstanou ve vaší domovské složce."
