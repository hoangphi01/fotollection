fn_open: "Zdarma znamená bez ceny, bez reklam a bez nákupů v aplikaci; koupit autorovi kávu je tvoje volba a pomáhá mu Fotollection dál vylepšovat. Open source znamená, že celý zdrojový kód je veřejně na GitHubu pod licencí GPL-3.0, takže si kdokoli může přečíst, sestavit a ověřit, co aplikace dělá. Bez účtu znamená, že se aplikace nikdy neptá, kdo jsi, a nemá se kam přihlašovat."
