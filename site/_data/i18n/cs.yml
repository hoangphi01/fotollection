dl_warn_title: "Aktualizuj na v0.14.0 nebo novější."
dl_warn_text: "Starší verze mohly ztratit úpravy složky na disku, který nebyl při spuštění připojený, a jedna chyba mohla zavřít celou aplikaci. v0.14.0 opravuje obojí; tvoje nastavení a projekty se přenesou."
install_title: "Instalace za minutu"
install_lead: "Instalátory zatím nejsou podepsané placeným certifikátem, takže první spuštění potřebuje jedno kliknutí navíc."
