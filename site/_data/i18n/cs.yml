  - title: "Funguje"
    items:
      - text: "AppImage: Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Pop!_OS 22.04+, elementary OS 7+, Zorin OS 17+, Fedora 36+, openSUSE Tumbleweed, Arch, Manjaro a další podobného stáří."
      - text: ".deb a repozitář APT: Ubuntu, Debian, Mint, Pop!_OS, elementary OS a Zorin OS."
  - title: "Funguje s jedním krokem"
    items:
      - text: "Ubuntu 24.04 a novější: AppImage jednou potřebuje FUSE 2,"
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: ", nebo ho spusť s"
        code2: "--appimage-extract-and-run"
        after2: ". Balíček .deb nepotřebuje nic."
      - text: "NixOS: spusť ho přes"
        code: appimage-run
      - text: "Fedora Silverblue a další neměnné systémy: použij AppImage."
      - text: "Grafika NVIDIA: nemusíš nic dělat, aplikace se problému WebKitu s prázdným oknem vyhne sama."
        fn: [fn_nvidia]
  - title: "Neběží"
    items:
      - text: "glibc starší než 2.35: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky nebo Alma 8, openSUSE Leap 15."
