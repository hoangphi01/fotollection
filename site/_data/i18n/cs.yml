fn_title: "Poznámky"
fn_label: "Poznámka"
fn_back: "Zpět k textu"
fn_open: "Zdarma znamená bez ceny, bez reklam a bez nákupů v aplikaci; koupit autorovi kávu je dobrovolné a pomáhá mu Fotollection dál vylepšovat. Open source znamená, že celý zdrojový kód je veřejně na GitHubu pod licencí GPL-3.0, takže si kdokoli může přečíst, sestavit a ověřit, co aplikace dělá. Bez účtu znamená, že aplikace nežádá žádné osobní údaje a nemá žádné přihlášení."
fn_photo: "Fotka tramvaje je autorova vlastní (© @hoangphi01, všechna práva vyhrazena), pořízená fotoaparátem Lumix GX9 v Praze v listopadu 2026; každý look vykresluje vlastní jádro Fotollection a nebyla jinak retušována."
fn_downloads: "Počítá GitHub."
compare_title: "Fotollection ve srovnání"
compare_lead: "Fotollection nenahrazuje plnohodnotný RAW editor; je určený pro krok, který tyto editory nechávají na uživateli, od složky z cesty k hotovým výtiskům."
compare_caption: "Fotollection vedle Lightroomu Classic, darktable a RawTherapee"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["Určeno pro", "Výběr, datování a příprava fotek z cesty k tisku", "Kompletní workflow: katalog, úpravy, tisk a sdílení", "Workflow fotografií a vyvolávání RAW", "Vyvolávání RAW"], ["Pohlednice se stranou pro adresu", "Ano", "Ne", "Ne", "Ne"], ["AddAssist", "Ano, v některých zemích", "Ne", "Ne", "Ne", "fn_addassist"], ["Datum a místo na fotce", "Ano, jako z filmu", "Ne", "Ano, vodoznak", "Ne"], ["Ořez na formáty fotolabu", "Ano, s kontrolou ostrosti", "Ano, modul Print", "Ano, tiskové zobrazení", "Ne"], ["Nejlepší snímek ze série", "Ano, nejostřejší s otevřenýma očima", "Ano, Assisted Culling", "Ne", "Ne"], ["Nechat, nebo vyřadit, fotku po fotce", "Ano, režim Simple", "Ano, příznaky", "Ano, hvězdičky", "Ano, hodnocení"], ["Dvě fotky na jednom výtisku", "Ano", "Ano", "Ano", "Ne"], ["Looky jedním kliknutím", "Ano", "Ano, presety", "Ano, styly", "Ano, profily"], ["Presety Lightroomu", "Ano, importované", "Ano", "Ne", "Ne"], ["LUT", "Ano, .cube a HaldCLUT", "Jako profily", "Ano", "Ano, HaldCLUT"], ["Vyvolávání RAW", "Ano", "Ano", "Ano", "Ano"], ["Cena", "Zdarma", "Předplatné Creative Cloud", "Zdarma", "Zdarma"], ["Zdrojový kód", "Otevřený, GPL-3.0", "Proprietární", "Otevřený, GPL-3.0 nebo novější", "Otevřený, GPL-3.0"], ["Systémy", "macOS, Windows, Linux", "macOS, Windows", "macOS (Apple silicon), Windows, Linux", "macOS, Windows, Linux"], ["Účet", "Žádný", "Účet Adobe", "Žádný", "Žádný"]]
compare_note: "Pro náročnější práci: darktable a RawTherapee pro nejpodrobnější vyvolávání RAW, Lightroom pro celoživotní archiv fotek v jednom katalogu."
fn_lightroom: "Adobe, Lightroom a Lightroom Classic jsou ochranné známky společnosti Adobe Inc. ve Spojených státech a dalších zemích. Fotollection není se společností Adobe spojen ani jí schvalován; drží se kláves a rozvržení, které lidé používající Lightroom už znají. Logo Lightroomu pochází z Wikimedia Commons, kde je jako textové logo volným dílem."
fn_lut: "LUT (look-up table, vyhledávací tabulka) přiřazuje každé vstupní barvě výstupní barvu; Fotollection čte soubory .cube a obrázky HaldCLUT. LUMIX je ochranná známka Panasonic Holdings Corporation; Fotollection není se společností Panasonic spojen ani jí schvalován."
fn_compare: "Creative Cloud je ochranná známka Adobe Inc.; darktable a RawTherapee jsou svobodné projekty svých vlastních komunit. Údaje pocházejí z darktable.org a jeho příručky, rawtherapee.com, nápovědy Adobe k Lightroom Classic a ze shrnutí licencí a požadavků Adobe na Wikipedii, ověřeno 14. listopadu 2026. Fotollection není spojen s žádným z nich."
fn_addassist: "AddAssist funguje v zemích, jejichž poštovní data Fotollection obsahuje, nyní v Japonsku a Koreji: tam se adresa vyplní sama podle PSČ; v ostatních zemích se adresa zadává jako obvykle."
fn_privacy_site: "Platí to pro aplikaci. Web počítá návštěvy anonymně přes Google Analytics, podle země a stránky, nikdy ne podle osoby."
fn_exif: "EXIF (Exchangeable Image File Format) je standard, který spravují japonské JEITA a CIPA, pro informace, které fotoaparát zapisuje do každé fotky: fotoaparát a objektiv, datum a čas, expozici, často polohu GPS a malý vložený náhled."
fn_units: "Jednotky: px je pixel, jeden bod obrázku; MP (megapixel) je milion pixelů, takže fotka s 20 MP má asi 5 472 × 3 648 px; ms je milisekunda, tisícina sekundy; MB a GB jsou megabajty a gigabajty; RAM (paměť s náhodným přístupem) je pracovní paměť počítače."
fn_raw: "Soubor RAW obsahuje to, co zaznamenal snímač fotoaparátu, ještě než z toho fotoaparát udělal obrázek, takže o barvě, jasu a detailech se dá rozhodnout později, podobně jako když se vyvolává negativ. Každý výrobce má svůj formát (CR3 pro Canon, NEF pro Nikon, ARW pro Sony, RW2 pro Panasonic a další); DNG (Digital Negative) je otevřený formát RAW, který vydala společnost Adobe."
fn_heic: "HEIF (High Efficiency Image File Format) je obrazový formát normy ISO/IEC 23008-12; HEIC je jeho varianta komprimovaná pomocí HEVC (H.265), ve které iPhony ve výchozím stavu ukládají fotky. Fotka HEIC je zhruba o polovinu menší než JPEG podobné kvality."
fn_png: "PNG (Portable Network Graphics) je bezeztrátový obrazový formát vydaný jako ISO/IEC 15948: každý pixel zůstane přesně zachován, což se hodí pro grafiku a snímky obrazovky, kdežto fotka vyjde několikrát větší než jako JPEG."
fn_arch: "x86_64, také amd64, je architektura procesorů většiny počítačů s Windows a Linuxem; ARM64, také aarch64 nebo arm64, je architektura Apple silicon, mnoha notebooků a malých desek jako Raspberry Pi. Každá potřebuje vlastní sestavení."
fn_linux_pkg: "Soubor .deb je balíček Debianu, instalační formát Debianu, Ubuntu, Linux Mintu a jejich příbuzných; APT (Advanced Package Tool) takové balíčky instaluje a aktualizuje z repozitáře. AppImage je jediný soubor s aplikací a vším, co potřebuje, který běží na většině distribucí bez instalace."
fn_fuse: "FUSE (Filesystem in Userspace) umožňuje programu poskytnout souborový systém bez změny jádra. AppImage ho používá k otevření sebe sama a Ubuntu 24.04 už jeho verzi 2 ve výchozím stavu neinstaluje."
fn_sha: "SHA-256 je kryptografická hašovací funkce z rodiny SHA-2, standardizovaná americkým NIST ve FIPS 180-4. Ze souboru vytvoří otisk o 64 znacích; změna jediného bitu v souboru otisk změní."
fn_jpeg: "JPEG je obrazový formát skupiny Joint Photographic Experts Group, standardizovaný jako ISO/IEC 10918-1 a ITU-T T.81."
fn_pf_raw: "Na macOS vyvolává formáty RAW kromě DNG systém, s jeho korekcemi objektivu. Linux a Windows používají čtečku zabudovanou do Fotollection, bez nich; na Windows je Raw Image Extension od Microsoftu, pokud je nainstalované, jen poslední záložní možností."
fn_pf_heic_win: "S bezplatnými rozšířeními HEIF Image Extensions a HEVC Video Extensions od Microsoftu z Microsoft Storu."
fn_pf_heic_linux: "HEIC vyžaduje dekodér HEVC, který Linux nedodává a Fotollection kvůli patentům nepřibaluje; fotky HEIC převeďte do JPEG."
fn_pf_tether: "Podporovaný fotoaparát: Sony a6400."
fn_pf_openwith: "S balíčkem .deb, nebo s instalačním skriptem. AppImage spuštěný samostatně se ve správci souborů nezaregistruje, pokud to neudělá nástroj jako AppImageLauncher."
fn_pf_update: "AppImage stáhne nový AppImage; .deb otevře stránku vydání a s repozitářem APT novou verzi nainstaluje příkaz sudo apt upgrade."
fn_glibc: "glibc, GNU C Library, je základní knihovna, na které běží každý linuxový program. Verzi zjistíte příkazem ldd --version v terminálu. Fotollection se sestavuje na Ubuntu 22.04, které má glibc 2.35, takže potřebuje tuto verzi nebo novější."
fn_nvidia: "S vlastním ovladačem NVIDIA může renderer DMA-BUF ve WebKitGTK nechat okno prázdné. Když je tento ovladač načtený, Fotollection se jednou sám restartuje s tímto rendererem vypnutým."
fn_dm: "dm a logo dm jsou ochranné známky dm-drogerie markt GmbH + Co. KG."
fn_rossmann: "ROSSMANN a logo ROSSMANN jsou ochranné známky Dirk Rossmann GmbH."
fn_cewe: "Fotoslužby v dm a Rossmannu zajišťuje CEWE, ochranná známka CEWE Stiftung & Co. KGaA. Formáty tisku byly ověřeny podle ceníku dm v říjnu 2026; obchody je mohou změnit."
fn_photos: "Pražské fotky na snímcích obrazovky (hrad, ulice, Vltava) pořídil @hoangphi01 fotoaparátem Lumix GX9 v listopadu 2026: © @hoangphi01, všechna práva vyhrazena. Nevztahuje se na ně licence aplikace a nesmí se dál používat. Ostatní ukázkové fotky jsou volným dílem (CC0) na Wikimedia Commons, od autorů Dktue (7 fotek), Pierre Blaché z Paříže, Francie (2) a Kate Branch (1). Kočku na snímcích košíku k tisku a nejlepšího snímku také vyfotil @hoangphi01 na GX9, všechna práva vyhrazena; měkčí, roztřesené a tmavší kopie vedle ní vznikly z té jedné fotky, aby bylo vidět, jak se nejlepší snímek vybírá."
fn_photos_link: "Každý soubor, jeho stránka a kontrolní součet."
fn_rawsamples: "Měření RAW používají devět vzorků s volnou licencí (CC0) z raw.pixls.us, jeden na formát; scripts/fetch-raw-samples.py je stáhne a ověří."
fn_rawformats: "Formáty RAW zmíněné na tomto webu patří výrobcům fotoaparátů, kteří je definují: RW2 (Panasonic Holdings Corporation), CR2 a CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) a ORF (OM Digital Solutions Corporation, dříve Olympus). DNG je otevřená specifikace, kterou vydala Adobe Inc. Fotollection je čte vlastní vestavěnou čtečkou a na macOS nejprve přes kodeky systému (na Windows je Raw Image Extension od Microsoftu, pokud je nainstalované, poslední záložní možností); žádná z těchto společností ho nevyrobila ani neschvaluje."
fn_cameras: "Názvy a loga fotoaparátů na snímcích obrazovky a v rámečku s údaji v aplikaci jsou ochranné známky svých vlastníků, použité jen k tomu, aby bylo vidět, jaký fotoaparát fotku pořídil: Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) a Sony (Sony Group Corporation)."
fn_others: "Apple a macOS jsou ochranné známky Apple Inc.; Windows společnosti Microsoft Corporation; Linux je registrovaná ochranná známka Linuse Torvaldse v USA a dalších zemích; Ubuntu společnosti Canonical Ltd.; Debian organizace Software in the Public Interest, Inc.; Fedora, Red Hat, RHEL a CentOS společnosti Red Hat, Inc.; openSUSE společnosti SUSE LLC; Pop!_OS společnosti System76, Inc.; Rocky Linux organizace Rocky Enterprise Software Foundation; AlmaLinux organizace AlmaLinux OS Foundation; ChromeOS společnosti Google LLC; NVIDIA společnosti NVIDIA Corporation; názvy ostatních linuxových distribucí patří jejich projektům; Facebook a Instagram společnosti Meta Platforms, Inc.; GitHub společnosti GitHub, Inc.; Google Analytics společnosti Google LLC; Lightroom společnosti Adobe Inc.; IrfanView Irfana Škiljana; VietQR společnosti NAPAS; Wikimedia Commons nadace Wikimedia Foundation. Značky Apple, Windows a Linux (Tux, kterého poprvé nakreslil Larry Ewing) pocházejí ze Simple Icons (CC0) a jen ukazují, o jakém systému sloupec nebo krok je."
fn_brand: "Název a logo Fotollection označují oficiální aplikaci od @hoangphi01. Oficiální stažení jsou jen z fotollection.org a z vydání projektu na GitHubu. Licence GPL-3.0 dovoluje komukoli sdílet nebo prodávat kopie, upravené, nebo ne, pokud zachová tuto licenci a nabídne zdrojový kód; upravená nebo přeprodávaná kopie nesmí používat název ani logo Fotollection tak, aby to vypadalo jako oficiální aplikace."
fn_notify: "Sdílíte nebo prodáváte Fotollection, nebo na něm stavíte? Dejte prosím nejdřív vědět autorovi otevřením issue na GitHubu (github.com/hoangphi01/fotollection/issues). Aplikace je zdarma a vzniká ve volném čase; krátká zpráva je férový způsob, jak poděkovat."
fn_cite: "Citujete, recenzujete nebo ukazujete aplikaci, nebo používáte tyto snímky obrazovky? Uveďte prosím Fotollection a odkaz na fotollection.org."
fn_independent: "Fotollection je nezávislý open-source projekt. Není přidružen k žádné z těchto společností, sponzorován ani schvalován žádnou z nich a každá další ochranná známka patří svému vlastníkovi."
shield: "Soukromé – vaše fotky nikdy neopustí váš počítač"
privacy_title: "Fotky zůstávají na vašem počítači"
privacy_lead: "Fotollection funguje zcela bez internetu: nic nenahrává, nic nesleduje a jeho zdrojový kód si může kdokoli ověřit."
p1_title: "Žádné nahrávání, žádný cloud"
p1_text: "Fotky se čtou a zapisují na vašem disku. Žádný server, kam by se posílaly, neexistuje."
p2_title: "Žádný účet, žádné sledování"
p2_text: "Bez registrace, bez analytiky a telemetrie. Od verze 0.13.0 se Fotollection při spuštění jednou dotáže GitHubu na novější verzi; v Nastavení lze kontrolu vypnout."
p6_title: "Žádné reklamy"
p6_text: "Bez reklam, sponzorovaných návrhů a nákupů v aplikaci."
p3_title: "Místa bez mapové služby"
p3_text: "Názvy měst pocházejí z mapové databáze přibalené v aplikaci, takže souřadnice GPS se nikdy nedostanou ke třetí straně."
p4_title: "GPS odstraněna při exportu"
p4_text: "Exportovaným fotkám k tisku se ve výchozím stavu odstraní souřadnice GPS."
p5_title: "Open source"
p5_text: "Kód je veřejný pod GPL-3.0. Kdokoli si ho může přečíst, sestavit a ověřit, že dělá to, co říká tahle stránka."
charts_more: "Všechna měření, vysvětlená"
footer_story: "Příběh"
footer_wiki: "Wiki"
footer_signing: "Zásady podepisování kódu"
dl_warn_title: "Aktualizujte na verzi 0.14.0 nebo novější."
dl_warn_text: "Starší verze mohly ztratit úpravy složky na disku, který nebyl při spuštění připojený, a jedna chyba mohla ukončit celou aplikaci. Verze 0.14.0 opravuje obojí; vaše nastavení a projekty se zachovají."
install_title: "Instalace za minutu"
install_lead: "Instalátory zatím nejsou podepsané placeným certifikátem, takže první spuštění vyžaduje jedno kliknutí navíc."
mac_title: "macOS"
mac_1: "Otevřete .dmg a přetáhněte Fotollection do složky Aplikace."
mac_2: "Spusťte ji. macOS první spuštění zablokuje."
mac_3: "V Nastavení systému → Soukromí a zabezpečení klikněte na Přesto otevřít."
win_title: "Windows"
win_1: "Spusťte -setup.exe (nebo .msi)."
win_2: "Pokud SmartScreen zobrazí „Systém Windows ochránil váš počítač“, klikněte na Další informace."
win_3: "Klikněte na Přesto spustit."
