modes_manual: "Celá příručka"
postcard_title: "Pohlednice z tvé vlastní fotky"
postcard_text: "V režimu Collage jeden přepínač udělá z každého tisku pohlednici: tvoje fotka na jedné polovině, na druhé čárkovaný rámeček na známku a řádky na vzkaz nebo adresu. Napiš text psacím strojem, nebo ho napiš ručně tenkým permanentním fixem. Tisk 10 × 15 se vejde do formátů pohlednic, které Deutsche Post přijímá."
pc_type_title: "Psané na stroji, nebo rukou"
pc_type_text: "Vzkaz i adresa mají své vlastní řádky, s tučným písmem, kurzívou a podtržením, písmem psacího stroje nebo vlastním fontem. Jsou tu všechna písmena evropských jazyků psaných latinkou, takže adresa v Praze nebo Krakově se vytiskne, jak ji napíšeš. Vyber inkoust – černý, modrý, sépiový nebo červený – a přidej dole malý řádek s poděkováním. Polovina s fotkou funguje jako v režimu Collage: bílý okraj kolem, nebo fotka až do kraje."
collage_title: "Dvě fotky na jednom tisku"
collage_text: "Inspirováno půlformátovými kinofilmovými fotoaparáty: tisk 10 × 15 pojme dvě fotky 10 × 7,5, takže sada stojí polovinu. Fotky se párují popořadě, přetažení je prohodí a aplikace navrhne velikost s bílým okrajem, 6 × 9 cm pro fotku 2:3. Tenká linka řezu rozdělí tisk na dvě, nebo ji vynech a máš půlformátový pás."
show_collage: "Režim Collage: listy tak, jak se vytisknou, s poměrem fotky, navrženou velikostí a linkou řezu"
collage_preview_title: "Uvidíš tisk dřív, než se vytiskne"
collage_preview_text: "Otevři list, jako otevíráš fotku: tisk velký, přesně tak, jak ho udělá kiosek, dvě fotky vedle sebe s datem a okrajem. Vyber kteroukoli fotku klávesou 1 nebo 2 a ořízni ji nebo otoč, a šipkami listuj dalšími listy."
show_collage_preview: "Náhled listu: tramvaj v noci a Národní muzeum v Praze na jednom tisku 10 × 15"
simple_title: "Simple: nechat, nebo zahodit, pak tisk"
simple_text: "Jedna fotka po druhé, tak jak se vytiskne. Číselná klávesa dá fotce look, nahoru ji ponechá, dolů ji zahodí a hned přijde další. Vyber formát a datum na fotce a pak exportuj, co sis nechal."
show_simple: "Režim Simple: fotka tak, jak se vytiskne, Nechat a Zahodit a Export ponechaných fotek"
swipe_title: "↑ k tisku, ↓ stranou"
swipe_text: "Otevři první fotku a rozhodni jednou klávesou: ↑ ji dá do košíku k tisku, ↓ ji odloží stranou a další fotka už je na obrazovce. Nic se nikdy nemaže: košík i hromádka odložených čekají v postranním panelu, takže si to můžeš rozmyslet."
select_title: "Nebo je zaškrtni v galerii"
select_text: "Select změní mřížku na zaškrtávací políčka, jako na iPhonu, a Shift-klik vybere celou řadu. Podrž mezerník nad fotkou a uvidíš ji velkou, přesně jak se vytiskne, pak pusť a pokračuj."
estimate_title: "Znáš velikost dřív, než exportuješ"
estimate_text: "Karta exportu ti řekne, jak velké budou soubory, ještě než se cokoli zapíše, podle pár fotek zakódovaných s tvým nastavením. Fotky z fotoaparátu sdílené na Facebook vyjdou asi šestkrát lehčí a vidíš to dřív, než klikneš."
