distro_groups:
  - title: "Funguje"
    items:
      - text: "AppImage: Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Pop!_OS 22.04+, elementary OS 7+, Zorin OS 17+, Fedora 36+, openSUSE Tumbleweed, Arch, Manjaro a další podobného stáří."
      - text: ".deb a repozitář APT: Ubuntu, Debian, Mint, Pop!_OS, elementary OS a Zorin OS."
  - title: "Funguje s jedním krokem"
    items:
      - text: "Ubuntu 24.04 a novější: AppImage jednou potřebuje FUSE 2,"
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: ", nebo ho spusťte s"
        code2: "--appimage-extract-and-run"
        after2: ". Balíček .deb nepotřebuje nic."
      - text: "NixOS: spusťte ho přes"
        code: appimage-run
      - text: "Fedora Silverblue a další neměnné systémy: použijte AppImage."
      - text: "Grafika NVIDIA: bez zásahu; Fotollection problém WebKitu s prázdným oknem obchází automaticky."
        fn: [fn_nvidia]
  - title: "Neběží"
    items:
      - text: "glibc starší než 2.35: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky nebo Alma 8, openSUSE Leap 15."
      - text: "Systémy s musl, například Alpine."
      - text: "32bitové počítače."
      - text: "ChromeOS bez jeho linuxového kontejneru."
  - title: "Omezení na všech distribucích"
    items:
      - text: "Bez fotek HEIC (iPhone): převeďte je do JPEG."
        fn: [fn_pf_heic_linux]
      - text: "Bez focení s fotoaparátem připojeným přes USB."
