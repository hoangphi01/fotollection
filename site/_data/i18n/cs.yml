mac_1: "Otevři .dmg a přetáhni Fotollection do Aplikací."
mac_2: "Spusť ji. macOS první spuštění zablokuje."
mac_3: "V Nastavení systému → Soukromí a zabezpečení klikni na Přesto otevřít."
win_title: "Windows"
win_1: "Spusť -setup.exe (nebo .msi)."
win_2: "Pokud SmartScreen hlásí „Systém Windows ochránil váš počítač“, klikni na Další informace."
win_3: "Klikni na Přesto spustit."
