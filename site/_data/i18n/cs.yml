faq_title: "Otázky před stažením"
faq_lead: "Proč další aplikace na fotky a čím je tahle jiná."
faq_groups:
  - label: "Proč Fotollection"
    items:
      - q: "Proč prostě nepoužít Lightroom?"
        a: "Lightroom, vestavěné aplikace Fotky a IrfanView jsou dělané na úpravy a prohlížení; žádná z nich není navržená pro tisk fotografií. Abys s nimi tiskl, musíš každou fotku sám oříznout na poměr papíru, nebo soubory odevzdat a nechat je oříznout stroj či obsluhu v prodejně, což často usekne hlavu nebo kraj nápisu. Fotollection začíná u tisku: zná formáty v dm a Rossmannu, ořízne na ně každou fotku, takže co vidíš, přesně vyjde ven, upozorní, když je fotka moc malá, přidá datum jako kinofilmový fotoaparát a exportuje soubory, které kiosek vezme. Je lehký a rychlý, zdarma a funguje vedle Lightroomu: tvoje originály se nikdy nezmění a tvoje presety z Lightroomu v něm fungují jako looky."
      - q: "Můj počítač už má Fotky, nebo používám IrfanView. Proč další aplikace?"
        a: "Vestavěné aplikace Fotky a IrfanView jsou skvělé prohlížeče, každý na svém systému. Žádný z nich nezná velikost tisku 10 × 15 v dm nebo Rossmannu, neupozorní tě, když je na něj fotka moc malá, nepřidá datum jako kinofilmový fotoaparát a nepošle nejlepší snímky z pěti složek do jednoho košíku k tisku. Fotollection to umí, vypadá a funguje stejně na Macu, na Windows i na Linuxu a může být prohlížečem, ve kterém fotky otevíráš: klikni pravým na fotku, Otevřít v aplikaci, Fotollection, včetně RAW z fotoaparátu."
  - label: "Rychlost a nároky"
    items:
      - q: "Je náročný? Poběží na mém starším notebooku?"
        a: "Je malý: instalátor pro Windows má asi 18 MB, protože okno používá webové zobrazení, které systém už má, místo aby s sebou nesl celý prohlížeč. Jádro je napsané v Rustu a běží přímo na tvém počítači. Náhled nikdy nemá víc než 1600 px, takže i fotka s 32 MP se otevře stejně rychle jako malá, a obrázek v plné velikosti se načte, až když přiblížíš. I při exportu 5 035 fotek je špička paměti asi 1,45 GB."
      - q: "Jak je rychlý s tisíci fotek?"
        a: "Otevření 1 000 fotek trvá asi 0,12 s, protože Fotollection nejdřív čte malý náhled vestavěný v každém souboru. Změna nastavení překreslí náhled za 17 ms, export běží rychlostí 18 fotek v plné velikosti za sekundu a po prvním spuštění se aplikace otevře asi za 0,4 s. Každé číslo bylo změřené na běžném notebooku a stránka Výkon vysvětluje, jak si je změříš sám."
  - label: "Platformy a cena"
    items:
      - q: "Funguje na Macu, Windows a Linuxu a je opravdu zdarma?"
        a: "Ano. Jedno stažení pro macOS 11 nebo novější, na Apple silicon i Intelu, jedno pro Windows 10 a 11 a pro 64bitový Linux AppImage nebo .deb, na Intel/AMD i ARM, pro každou distribuci s glibc 2.35 nebo novější. Linux dostává štíhlé sestavení: zatím bez fotek HEIC (iPhone), bez focení s fotoaparátem přes USB a RAW bez korekcí objektivu, které přidává macOS; tabulka pod Funkcemi ukazuje každý rozdíl. Je zdarma, bez reklam, bez účtu a bez nákupů v aplikaci a zdrojový kód je veřejný pod GPL-3.0, takže si kdokoli může ověřit, co dělá."
        fn: [fn_heic, fn_arch, fn_linux_pkg]
tabs_row_title: "Složky jako karty, zaškrtnutí, která jdou s tebou"
tabs_text: "Klikni na složku a pracuj jen s ní, nebo na Workspace pro všechny složky najednou. Zaškrtni fotky v jedné složce, přepni do jiné a zaškrtávej dál: lišta je spočítá všechny, takže to nejlepší z každé složky jde do košíku k tisku jedním tahem. Zaškrtni víc složek a exportuj je dohromady nebo každou do vlastní složky, a když skončíš, zavři kartu ×; fotky zůstanou na tvém disku."
modes_title: "Tři režimy, tři úkoly"
modes_lead: "Vyber ten, který odpovídá tomu, co chceš dělat, nahoře v postranním panelu nebo pomocí Cmd/Ctrl+1, 2 a 3. Tvoje fotky, košík k tisku a nastavení zůstávají v každém režimu stejné."
