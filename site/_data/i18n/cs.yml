faq_title: "Otázky před stažením"
faq_lead: "Proč vznikl Fotollection a čím se liší od jiných aplikací na fotky."
faq_groups:
  - label: "Proč Fotollection"
    items:
      - q: "Proč prostě nepoužít Lightroom?"
        a: "Lightroom, vestavěné aplikace Fotky a IrfanView jsou určené k úpravám a prohlížení; žádná z nich není navržená pro tisk fotografií. Při tisku z nich je nutné každou fotku ručně oříznout na poměr stran papíru, nebo soubory odevzdat a nechat je oříznout automat či obsluhu prodejny, což často usekne hlavu nebo okraj nápisu. Fotollection vychází z tisku: zná formáty tisku v dm a Rossmannu, ořízne na ně každou fotku, takže výtisk přesně odpovídá obrazovce, upozorní na příliš malou fotku, vloží datum ve stylu kinofilmového fotoaparátu a exportuje soubory, které fotokiosek přijme. Je malý a rychlý, zdarma a funguje vedle Lightroomu: originály se nikdy nezmění a presety z Lightroomu v něm fungují jako looky."
      - q: "Můj počítač už má Fotky, nebo používám IrfanView. Proč další aplikace?"
        a: "Vestavěné aplikace Fotky a IrfanView jsou výborné prohlížeče, každý na svém systému. Žádný z nich nezná formát tisku 10 × 15 v dm nebo Rossmannu, neupozorní na příliš malou fotku, nevloží datum ve stylu kinofilmového fotoaparátu a nevloží nejlepší snímky z pěti složek do jednoho košíku k tisku. Fotollection to umí, vypadá a funguje stejně na Macu, Windows i Linuxu a může sloužit jako výchozí prohlížeč, i pro RAW z fotoaparátu: klikněte pravým tlačítkem na fotku a zvolte Otevřít v aplikaci → Fotollection."
  - label: "Rychlost a nároky"
    items:
      - q: "Je náročný? Poběží na mém starším notebooku?"
        a: "Je malý: instalátor pro Windows má asi 18 MB, protože okno používá webové zobrazení, které systém už má, místo aby s sebou nesl celý prohlížeč. Jádro je napsané v Rustu a běží přímo na vašem počítači. Náhled nikdy nemá víc než 1600 px, takže i fotka s 32 MP se otevře stejně rychle jako malá, a obrázek v plné velikosti se načte až při přiblížení. I při exportu 5 035 fotek je špička paměti asi 1,45 GB."
      - q: "Jak je rychlý s tisíci fotek?"
        a: "Otevření 1 000 fotek trvá asi 0,12 s, protože Fotollection nejdřív čte malý náhled vestavěný v každém souboru. Změna nastavení překreslí náhled za 17 ms, export běží rychlostí 18 fotek v plné velikosti za sekundu a po prvním spuštění se aplikace otevře asi za 0,4 s. Každé číslo bylo změřené na běžném notebooku a stránka Výkon popisuje, jak je změřit."
  - label: "Platformy a cena"
    items:
      - q: "Funguje na Macu, Windows a Linuxu a je opravdu zdarma?"
        a: "Ano. Jedno stažení pro macOS 11 nebo novější, na Apple silicon i Intelu, jedno pro Windows 10 a 11 a pro 64bitový Linux AppImage nebo .deb, na Intel/AMD i ARM, pro každou distribuci s glibc 2.35 nebo novější. Sestavení pro Linux je odlehčené: bez fotek HEIC (iPhone), bez focení s fotoaparátem připojeným přes USB a RAW bez korekcí objektivu, které přidává macOS; tabulka pod Funkcemi uvádí každý rozdíl. Je zdarma, bez reklam, bez účtu a bez nákupů v aplikaci a zdrojový kód je veřejný pod GPL-3.0, takže si kdokoli může ověřit, co dělá."
tabs_row_title: "Složky jako karty, zaškrtnutí napříč složkami"
tabs_text: "Kliknutím na složku pracujete jen s ní, kliknutím na Workspace se všemi složkami najednou. Zaškrtnuté fotky zůstanou zaškrtnuté i po přepnutí do jiné složky a lišta je sečte, takže to nejlepší z každé složky přejde do košíku k tisku jedním krokem. Zaškrtnuté složky lze exportovat dohromady nebo každou do vlastní složky; kartu zavře ×, fotky zůstanou na disku."
