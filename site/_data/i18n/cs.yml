compare_title: "Jak si stojí ve srovnání"
compare_lead: "Fotollection se nesnaží nahradit plnohodnotný RAW editor. Je dělaný pro krok, který ti ty nechávají: od složky z cesty k fotkám, které vezmeš do ruky."
compare_caption: "Fotollection vedle Lightroomu Classic, darktable a RawTherapee"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["Určeno pro", "Výběr, datování a příprava fotek z cesty k tisku", "Kompletní workflow: katalog, úpravy, tisk a sdílení", "Workflow pro fotky a RAW vývojka", "Vyvolávání RAW"], ["Cena", "Zdarma", "Předplatné Creative Cloud", "Zdarma", "Zdarma"], ["Zdrojový kód", "Otevřený, GPL-3.0", "Proprietární", "Otevřený, GPL-3.0 nebo novější", "Otevřený, GPL-3.0"], ["Systémy", "macOS, Windows, Linux", "macOS, Windows", "macOS (Apple silicon), Windows, Linux", "macOS, Windows, Linux"], ["Účet", "Žádný", "Účet Adobe", "Žádný", "Žádný"]]
compare_note: "Chceš jít dál? darktable a RawTherapee na nejhlubší vyvolávání RAW, Lightroom na fotky celého života v jednom katalogu."
fn_lightroom: "Adobe, Lightroom a Lightroom Classic jsou ochranné známky společnosti Adobe Inc. ve Spojených státech a dalších zemích. Fotollection není se společností Adobe spojen ani jí podporován; drží se kláves a rozvržení, které lidé používající Lightroom už znají. Logo Lightroomu pochází z Wikimedia Commons, kde je jako textové logo volným dílem."
fn_lut: "LUT (look-up table, vyhledávací tabulka) dává každé barvě barvu, na kterou se změní; Fotollection čte soubory .cube a obrázky HaldCLUT. LUMIX je ochranná známka Panasonic Holdings Corporation; Fotollection není se společností Panasonic spojen ani jí podporován."
fn_compare: "Creative Cloud je ochranná známka Adobe Inc.; darktable a RawTherapee jsou svobodné projekty svých vlastních komunit. Údaje pocházejí z darktable.org, rawtherapee.com a ze shrnutí licencí a požadavků Adobe na Wikipedii, ověřeno 7. listopadu 2026. Fotollection není spojen s žádným z nich."
fn_exif: "EXIF (Exchangeable Image File Format) je standard, který spravují japonské JEITA a CIPA, pro informace, které fotoaparát zapisuje do každé fotky: fotoaparát a objektiv, datum a čas, expozici, často polohu GPS a malý vložený náhled."
fn_units: "Jednotky: px je pixel, jeden bod obrázku; MP (megapixel) je milion pixelů, takže fotka s 20 MP má asi 5 472 × 3 648 px; ms je milisekunda, tisícina sekundy; MB a GB jsou megabajty a gigabajty; RAM (paměť s náhodným přístupem) je pracovní paměť počítače."
fn_raw: "Soubor RAW obsahuje to, co zaznamenal snímač fotoaparátu, ještě než z toho fotoaparát udělal obrázek, takže o barvě, jasu a detailech se dá rozhodnout později, podobně jako když se vyvolává negativ. Každý výrobce má svůj formát (CR3 pro Canon, NEF pro Nikon, ARW pro Sony, RW2 pro Panasonic a další); DNG (Digital Negative) je otevřený formát RAW, který vydala společnost Adobe."
fn_heic: "HEIF (High Efficiency Image File Format) je obrazový formát normy ISO/IEC 23008-12; HEIC je jeho varianta komprimovaná pomocí HEVC (H.265), ve které iPhony ve výchozím stavu ukládají fotky. Fotka HEIC má zhruba poloviční velikost než JPEG podobné kvality."
fn_png: "PNG (Portable Network Graphics) je bezeztrátový obrazový formát vydaný jako ISO/IEC 15948: každý pixel zůstane přesně zachován, což se hodí pro grafiku a snímky obrazovky, kdežto fotka vyjde několikrát větší než jako JPEG."
fn_dpi: "DPI (body na palec) udává, kolik pixelů fotky připadá na každý palec (2,54 cm) tisku. Kolem 300 DPI vypadá v ruce ostře; méně stále vypadá dobře na větším tisku, na který se díváš z dálky."
fn_444: "4:4:4 a 4:2:0 popisují podvzorkování barev, tedy kolik barevných detailů JPEGu zůstane vedle jasu. 4:4:4 zachová barvu každého pixelu; 4:2:0 zachová jednu barvu pro každý blok čtyř pixelů, což zmenší soubor, ale změkčí jemné barevné hrany, třeba červený text nebo ostrý horizont."
fn_usb: "USB (Universal Serial Bus) je standard USB Implementers Forum pro připojování zařízení. SD karta je paměťová karta standardu Secure Digital od SD Association, jakou používá většina fotoaparátů."
fn_gps: "GPS (Global Positioning System) je satelitní navigační systém Spojených států. Telefony a mnoho fotoaparátů ho používají, často spolu s Galileo, GLONASS nebo BeiDou, aby zaznamenaly, kde byla fotka pořízena."
fn_iso: "ISO je citlivost fotoaparátu na světlo, definovaná normou ISO 12232: každé zdvojnásobení, z ISO 100 na 200, potřebuje poloviční množství světla, za cenu většího šumu."
fn_gpl: "GPL-3.0 je verze 3 licence GNU General Public License, kterou vydává Free Software Foundation: kdokoli smí program používat, studovat, sdílet a měnit, a kdo ho sdílí, ať upravený, nebo ne, sdílí i jeho zdrojový kód za stejných podmínek."
fn_vnlf: "VNLF (Vietnam Linux Family) je vietnamská komunita svobodného softwaru a Linuxu. Její App Explorer uvádí svobodné aplikace pro vietnamské uživatele a CaramOS je její linuxová distribuce."
fn_led: "LED (svítivá dioda): kinofilmové fotoaparáty 80. a 90. let vpisovaly datum na film malými oranžovými LED číslicemi, a právě tenhle vzhled datum na fotce napodobuje."
fn_arch: "x86_64, také amd64, je architektura procesorů většiny počítačů s Windows a Linuxem; ARM64, také aarch64 nebo arm64, je architektura Apple silicon, mnoha notebooků a malých desek jako Raspberry Pi. Každá potřebuje vlastní sestavení."
fn_linux_pkg: "Soubor .deb je balíček Debianu, instalační formát Debianu, Ubuntu, Linux Mintu a jejich příbuzných; APT (Advanced Package Tool) takové balíčky instaluje a aktualizuje z repozitáře. AppImage je jediný soubor s aplikací a vším, co potřebuje, který běží na většině distribucí bez instalace."
fn_fuse: "FUSE (Filesystem in Userspace) umožňuje programu poskytnout souborový systém bez změny jádra. AppImage ho používá k otevření sebe sama a Ubuntu 24.04 už jeho verzi 2 ve výchozím stavu neinstaluje."
fn_sha: "SHA-256 je kryptografická hašovací funkce z rodiny SHA-2, standardizovaná americkým NIST ve FIPS 180-4. Ze souboru udělá otisk o 64 znacích; změň v souboru jediný bit a otisk se změní."
fn_jpeg: "JPEG je obrazový formát skupiny Joint Photographic Experts Group, standardizovaný jako ISO/IEC 10918-1 a ITU-T T.81."
fn_pf_raw: "Na macOS vyvolává formáty RAW kromě DNG systém, s jeho korekcemi objektivu. Linux a Windows používají čtečku zabudovanou do Fotollection, bez nich; na Windows je Raw Image Extension od Microsoftu, pokud je nainstalované, jen poslední záložní možností."
fn_pf_heic_win: "S bezplatnými rozšířeními HEIF Image Extensions a HEVC Video Extensions od Microsoftu z Microsoft Storu."
fn_pf_heic_linux: "HEIC potřebuje dekodér HEVC, který Linux nedodává a Fotollection ho kvůli patentům nepřibalí. Pozdější verze použije libheif, který nainstaluje tvoje distribuce. Do té doby převeď fotky HEIC do JPEG."
fn_pf_tether: "Nejdřív Sony a6400; další fotoaparáty budou následovat."
fn_pf_openwith: "S balíčkem .deb, nebo s instalačním skriptem. AppImage spuštěný samostatně se ve správci souborů nezaregistruje, pokud to neudělá nástroj jako AppImageLauncher."
fn_pf_update: "AppImage stáhne nový AppImage; .deb otevře stránku vydání a s repozitářem APT přinese novou verzi sudo apt upgrade."
fn_glibc: "glibc, GNU C Library, je základní knihovna, na které běží každý linuxový program. Svou verzi zjistíš, když v terminálu napíšeš ldd --version. Fotollection se sestavuje na Ubuntu 22.04, které má glibc 2.35, takže potřebuje tuto verzi nebo novější."
fn_nvidia: "S vlastním ovladačem NVIDIA může renderer DMA-BUF ve WebKitGTK nechat okno prázdné. Když je tento ovladač načtený, Fotollection se jednou sám restartuje s tímto rendererem vypnutým."
fn_dm: "dm a logo dm jsou ochranné známky dm-drogerie markt GmbH + Co. KG."
fn_rossmann: "ROSSMANN a logo ROSSMANN jsou ochranné známky Dirk Rossmann GmbH."
fn_cewe: "Fotoslužby v dm a Rossmannu zajišťuje CEWE, ochranná známka CEWE Stiftung & Co. KGaA. Formáty tisku byly ověřeny podle ceníku dm v říjnu 2026; obchody je mohou změnit."
fn_photos: "Pražské fotky na snímcích obrazovky (tramvaje, ulice, Vltava) pořídil @hoangphi01 fotoaparátem Lumix GX9 v listopadu 2026: © @hoangphi01, všechna práva vyhrazena. Nevztahuje se na ně licence aplikace a nesmí se dál používat. Ostatní ukázkové fotky jsou volným dílem (CC0) na Wikimedia Commons, od autorů Dktue (7 fotek), Pierre Blaché z Paříže, Francie (2) a Kate Branch (1). Kočku na snímcích košíku k tisku a nejlepšího snímku také vyfotil @hoangphi01 na GX9, všechna práva vyhrazena; měkčí, roztřesené a tmavší kopie vedle ní vznikly z té jedné fotky, aby bylo vidět, jak se nejlepší snímek vybírá."
fn_photos_link: "Každý soubor, jeho stránka a kontrolní součet."
fn_rawsamples: "Měření RAW používají devět vzorků s volnou licencí (CC0) z raw.pixls.us, jeden na formát; scripts/fetch-raw-samples.py je stáhne a ověří."
fn_rawformats: "Formáty RAW zmíněné na tomto webu patří výrobcům fotoaparátů, kteří je definují: RW2 (Panasonic Holdings Corporation), CR2 a CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) a ORF (OM Digital Solutions Corporation, dříve Olympus). DNG je otevřená specifikace, kterou vydala Adobe Inc. Fotollection je čte čtečkou zabudovanou do Fotollection a na macOS nejprve přes kodeky systému (na Windows je Raw Image Extension od Microsoftu, pokud je nainstalované, poslední záložní možností); žádná z těchto společností ho nevyrobila ani nepodporuje."
fn_cameras: "Názvy a loga fotoaparátů na snímcích obrazovky a v rámečku s údaji v aplikaci jsou ochranné známky svých vlastníků, použité jen k tomu, aby bylo vidět, jaký fotoaparát fotku pořídil: Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) a Sony (Sony Group Corporation)."
fn_others: "Apple a macOS jsou ochranné známky Apple Inc.; Windows společnosti Microsoft Corporation; Linux je registrovaná ochranná známka Linuse Torvaldse v USA a dalších zemích; Ubuntu společnosti Canonical Ltd.; Debian organizace Software in the Public Interest, Inc.; Fedora, Red Hat, RHEL a CentOS společnosti Red Hat, Inc.; openSUSE společnosti SUSE LLC; Pop!_OS společnosti System76, Inc.; Rocky Linux organizace Rocky Enterprise Software Foundation; AlmaLinux organizace AlmaLinux OS Foundation; ChromeOS společnosti Google LLC; NVIDIA společnosti NVIDIA Corporation; názvy ostatních linuxových distribucí patří jejich projektům; Facebook a Instagram společnosti Meta Platforms, Inc.; GitHub společnosti GitHub, Inc.; Google Analytics společnosti Google LLC; Lightroom společnosti Adobe Inc.; IrfanView Irfana Škiljana; VietQR společnosti NAPAS; Wikimedia Commons nadace Wikimedia Foundation. Značky Apple, Windows a Linux (Tux, kterého poprvé nakreslil Larry Ewing) pocházejí ze Simple Icons (CC0) a jen ukazují, o jakém systému sloupec nebo krok je."
fn_brand: "Název a logo Fotollection označují oficiální aplikaci od @hoangphi01. Oficiální stažení jsou jen z fotollection.org a z vydání projektu na GitHubu. Licence GPL-3.0 dovoluje komukoli sdílet nebo prodávat kopie, upravené, nebo ne, pokud zachová tuto licenci a nabídne zdrojový kód; upravená nebo přeprodávaná kopie nesmí používat název ani logo Fotollection tak, aby to vypadalo jako oficiální aplikace."
fn_notify: "Sdílíš nebo prodáváš Fotollection, nebo na něm stavíš? Dej prosím nejdřív vědět autorovi tím, že otevřeš issue na GitHubu (github.com/hoangphi01/fotollection/issues). Aplikace je zdarma a vzniká ve volném čase; krátká zpráva je férový způsob, jak poděkovat."
fn_cite: "Cituješ, recenzuješ nebo ukazuješ aplikaci, nebo používáš tyto snímky obrazovky? Uveď prosím Fotollection a odkaz na fotollection.org."
fn_independent: "Fotollection je nezávislý open-source projekt. Není přidružen k žádné z těchto společností, sponzorován ani podporován žádnou z nich a každá další ochranná známka patří svému vlastníkovi."
shield: "Soukromé – tvoje fotky nikdy neopustí tvůj počítač"
privacy_title: "Tvoje fotky zůstanou tvoje"
privacy_lead: "Fotollection je postavený tak, aby fungoval úplně bez internetu. Nic se nenahrává, nic se nesleduje a každý jeho řádek si můžeš ověřit."
p1_title: "Žádné nahrávání, žádný cloud"
p1_text: "Fotky se čtou a zapisují na tvém vlastním disku. Není žádný server, kam by se posílaly."
p2_title: "Žádný účet, žádné sledování"
p2_text: "Žádná registrace a aplikace nemá žádnou analytiku ani telemetrii. Od v0.13.0 se při spuštění jednou zeptá GitHubu, jestli nevyšla novější verze; v Nastavení to můžeš vypnout."
p6_title: "Žádné reklamy"
p6_text: "Nic ti neprodává a nikdo neplatí za to, aby se k tobě dostal. Žádné reklamy, žádné sponzorované návrhy, žádné nákupy v aplikaci, ani teď, ani později."
p3_title: "Místa bez mapové služby"
p3_text: "Názvy měst pocházejí z mapové databáze přibalené přímo v aplikaci, takže tvoje GPS se nikdy nedostane k třetí straně."
p4_title: "GPS odstraněna při exportu"
p4_text: "Exportovaným fotkám k tisku se ve výchozím stavu odstraní poloha, takže fotka předaná do fotolabu neprozradí, kde bydlíš."
p5_title: "Open source"
p5_text: "Kód je veřejný pod GPL-3.0. Kdokoli si ho může přečíst, sestavit a ověřit, že dělá to, co říká tahle stránka."
