# RollSense on the home page and the Features page (#rollsense, FR-141)
sense_title: "Fotollection udělá pořádek ve fotkách z telefonu."
sense_lead: "RollSense roztřídí tisíce fotek na tomto počítači, takže ty, které stojí za tisk, se najdou rychle."
sense_p1: "Duplikáty, snímky obrazovky a fotky uložené z aplikací a chatů se sejdou v Úklidu, připravené ke smazání."
sense_p2: "Každá fotka se zařadí podle zdroje, námětu, dne, výletu a místa."
sense_p3: "Fotky se čtou na tomto počítači a nikdy ho neopustí."
sense_more: "Více o RollSense"
show_rollsense: "RollSense vedle fotek, s kalendářem a skupinami ve svém sloupci."
sense_f_title: "RollSense třídí fotky z telefonu přímo ve Fotollection."
sense_f_lead: "V telefonu se mísí fotky z fotoaparátu se snímky obrazovky, fotkami uloženými z aplikací a chatů, upravenými kopiemi a duplikáty. RollSense přečte každou fotku jednou, pozná, co ukazuje a které fotky jsou kopie, a roztřídí vše do skupin k úklidu nebo k tisku."
sense_clean_title: "Úklid"
sense_clean_text: "Úklid ukazuje to, co se nejčastěji maže, každý druh s počtem fotek a místem, které zabírá: duplikáty, snímky obrazovky, fotky uložené z aplikací a chatů a memy. Jedno kliknutí ukáže jen tyto fotky, připravené k označení ke smazání."
sense_groups_title: "Skupiny"
sense_groups_text: "Fotky se třídí podle Zdroje, Námětu, Kdy (kalendář měsíce), Výletů, Návštěv domova a Kde (mapa země) a duplikáty, Live Photos a série zůstávají pohromadě. Zaškrtnutí se kombinují, takže Krajina a 2021 ukážou krajinu z roku 2021."
sense_delete_title: "Smaže se jen to, co vyberete"
sense_delete_text: "Fotky lze odložit nebo označit ke smazání a seznam Ke smazání je ukáže všechny i s místem, které se uvolní. Přesunutí do Koše proběhne po jednom potvrzení a ze systémového Koše lze fotky ještě obnovit. RollSense nikdy fotku nezmění."
sense_private_title: "Rychle a soukromě"
sense_private_text: "15 000 fotek se na MacBooku Air s M3 roztřídí asi za 18 minut. Každá fotka se čte na tomto počítači a nic se nenahrává."
