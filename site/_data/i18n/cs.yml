modes_manual: "Celá příručka"
postcard_title: "Pohlednice z vaší fotky"
postcard_text: "V režimu Collage jeden přepínač změní každý výtisk na pohlednici: na jedné polovině je vaše fotka, na druhé čárkovaný rámeček na známku a řádky na vzkaz nebo adresu. Text napíšete na klávesnici písmem psacího stroje, nebo ho po vytištění dopíšete ručně tenkým permanentním fixem. Výtisk 10 × 15 odpovídá formátům pohlednic, které přijímá Deutsche Post."
pc_type_title: "Text z klávesnice, nebo psaný rukou"
pc_type_text: "Vzkaz i adresa mají vlastní řádky, s tučným písmem, kurzívou a podtržením, písmem psacího stroje nebo vlastním fontem. Písma obsahují všechny znaky evropských jazyků psaných latinkou, takže adresa v Praze nebo Krakově se vytiskne přesně. Barva inkoustu je černá, modrá, sépiová nebo červená a dole lze přidat malý řádek s poděkováním. Polovina s fotkou funguje jako v režimu Collage: s bílým okrajem, nebo fotka až do kraje."
collage_title: "Dvě fotky na jednom výtisku"
collage_text: "Inspirováno půlformátovými kinofilmovými fotoaparáty: výtisk 10 × 15 pojme dvě fotky 10 × 7,5, takže sada stojí polovinu ceny. Fotky se párují popořadě, přetažením se prohodí a Fotollection navrhne velikost s bílým okrajem, 6 × 9 cm pro fotku 2:3. Tenká linka řezu rozdělí výtisk na dvě části; bez ní vznikne půlformátový pás."
show_collage: "Režim Collage: listy tak, jak se vytisknou, s poměrem fotky, navrženou velikostí a linkou řezu"
collage_preview_title: "Náhled výtisku před tiskem"
collage_preview_text: "List se otevírá stejně jako fotka: výtisk ve velkém náhledu, přesně jak ho vytiskne fotokiosek, dvě fotky vedle sebe s datem a okrajem. Klávesa 1 nebo 2 vybere fotku k oříznutí nebo otočení, šipky přepínají listy."
show_collage_preview: "Náhled listu: podloubí a barokní kostel na pražském Starém Městě na jednom výtisku 10 × 15"
simple_title: "Simple: ponechat, nebo odložit, pak tisk"
simple_text: "Jedna fotka po druhé, tak jak se vytiskne. Číselná klávesa použije look, šipka nahoru fotku ponechá, šipka dolů ji odloží a zobrazí se další. Po volbě formátu a data na fotce se ponechané fotky exportují."
show_simple: "Režim Simple: fotka tak, jak se vytiskne, tlačítka Ponechat a Odložit a export ponechaných fotek"
swipe_title: "↑ k tisku, ↓ odložit"
swipe_text: "Po otevření první fotky rozhoduje jedna klávesa: ↑ vloží fotku do košíku k tisku, ↓ ji odloží a na obrazovce je hned další fotka. Nic se nemaže: košík i odložené fotky jsou v postranním panelu."
select_title: "Nebo je zaškrtněte v galerii"
select_text: "Select změní mřížku na zaškrtávací políčka a Shift+kliknutí vybere celou řadu. Podržením mezerníku nad fotkou se zobrazí velký náhled přesně jako výtisk; po uvolnění pokračuje výběr."
estimate_title: "Velikost souborů před exportem"
