man_title: "Příručka"
man_kicker: "Nápověda"
man_description: "Jak používat Fotollection, krok za krokem, se snímkem obrazovky ke každému kroku: výběr fotek k tisku, looky a barvy, zoom, RAW, hodiny fotoaparátů, data a místa, focení s připojeným fotoaparátem a všechny zkratky."
man_lead: "Každý krok tak, jak ho aplikace ukazuje. Příručka jde s aplikací: když verze změní něco, co je vidět, změní se s ní i tato stránka."
man_toc: "Kapitoly"
man_source: "Tato příručka na GitHubu"
cs_title: "Zásady podepisování kódu"
cs_kicker: "Důvěra"
cs_description: "Jak se instalátory Fotollection sestavují a zveřejňují, kdo schvaluje každé vydání a co aplikace po síti posílá a co ne."
cs_lead: "Instalátory zatím nejsou podepsané certifikátem: Windows při prvním spuštění ukáže varování SmartScreen, sestavení pro macOS mají jen ad-hoc podpis a linuxový AppImage i .deb jsou také nepodepsané. Každé vydání uvádí kontrolní součty SHA-256 v SHA256SUMS.txt, takže si můžeš ověřit, že stažený soubor je ten, který byl zveřejněn tady. Repozitář APT na fotollection.org/apt je podepsaný klíčem GPG projektu, takže apt ověří každý balíček, který z něj instaluje."
cs_parts:
  - id: team
    title: "Role v týmu"
    lead: "Každý instalátor sestavuje GitHub Actions z veřejného repozitáře, z označeného vydání; nic sestaveného na osobním počítači se nezveřejňuje. Workflow sestavení je"
    items:
      - title: "Autoři a recenzenti změn"
        author: true
        text: "Píše a kontroluje každou změnu zdrojového kódu."
      - title: "Schvalovatel vydání"
        author: true
        text: "Kontroluje a zveřejňuje každé vydání ručně."
  - id: privacy
    title: "Zásady ochrany soukromí"
    lead: "Tento program nepředává žádné informace jiným síťovým systémům, pokud o to výslovně nepožádá uživatel nebo osoba, která ho instaluje či provozuje."
    items:
      - title: "Funguje offline"
        text: "Fotky, složky, projekty a nastavení nikdy neopustí tvůj počítač. Není tu žádný účet, žádná telemetrie a žádné odesílání hlášení o pádech."
      - title: "Kontrola aktualizací"
        text: "Jediný síťový požadavek: když klikneš, a od v0.13.0 jednou při spuštění, pokud to nevypneš v Nastavení, se zeptá GitHubu (api.github.com) na nejnovější vydání tohoto projektu. Sám nic nestahuje. Platí pro něj prohlášení o ochraně soukromí GitHubu."
      - title: "Žádná poloha v exportech"
        text: "Souřadnice GPS se z exportovaných fotek ve výchozím stavu odstraní."
        fn: [fn_gps]
      - title: "Tento web"
        text: "Web, ne aplikace, počítá návštěvy a kliknutí na své odkazy ke stažení pomocí Google Analytics; platí pro něj zásady ochrany soukromí Googlu. Počet stažení pochází z GitHubu."
      - title: "Platby na podporu"
        text: "Platby na podporu Fotollection zpracovávají Ko-fi, GitHub Sponsors a banka stojící za kódem VietQR, každý podle vlastních zásad ochrany soukromí. Web na ně jen odkazuje a nic z nich nenačítá a platba nemá nic společného s aplikací ani s tvými daty ve Fotollection."
  - id: system
    title: "Změny v tvém systému"
    lead: "Instalace přidá jen to, co aplikace potřebuje, a odinstalace to odstraní."
    items:
      - title: "Otevřít v aplikaci"
        text: "Instalátor, a na Linuxu balíček .deb, přidá Fotollection do nabídky Otevřít v aplikaci pro soubory fotek. Nikdy se sám nenastaví jako výchozí aplikace."
      - title: "Odinstalace"
        text: "Odeber ho v Nastavení Windows, nebo na macOS aplikaci smaž. Odinstalátor pro Windows odstraní i položky Otevřít v aplikaci. Na Linuxu spusť sudo apt remove fotollection, nebo smaž AppImage, nebo spusť instalační skript s --uninstall, který odstraní i repozitář APT a jeho klíč. Nastavení a projekty zůstanou ve tvé domovské složce."
perf_title: "Výkon"
perf_description: "Každé měření za Fotollection, vysvětlené srozumitelně: rychlost, paměť, kvalita tisku, fotky pro sociální sítě a návrhy nejlepších snímků, a k tomu co znamenají ΔE, SSIM, JPEG a barevné profily."
perf_kicker: "Změřeno, ne slíbeno"
perf_lead: "Každé číslo na této stránce pochází ze skutečných fotek na běžném notebooku (Apple M3, 16 GB) a skripty, které je vytvořily, jsou v repozitáři, takže je kdokoli může spustit znovu. Pod každým grafem je, co znamená pro tvoje tisky, a na konci slova, která stojí za čísly."
perf_how_title: "Proč je Fotollection rychlý"
perf_how_lead: "Žádná magie. Pár rozhodnutí udělaných před prvním řádkem kódu, každé z nich změřené."
perf_how_items:
  - { t: "Nativní kód na každém jádře", d: "Práce Fotollection běží v Rustu, zkompilovaném pro tvůj procesor a rozloženém na všechna jeho jádra, s vektorovými instrukcemi (SIMD), které procesory pro pixely nabízejí.", v: "23,5 / s", l: "exportovaných fotek s 16 MP", fn: [fn_simd, fn_units, fn_rust] }
  - { t: "Jen to, co je potřeba", d: "Otevření složky přečte EXIF každého souboru a jeho malý vložený náhled, nikdy celou fotku. Náhledy se ukládají do mezipaměti na disku.", v: "0,12 s", l: "na otevření 1 000 fotek", fn: [fn_exif] }
  - { t: "Nikdy víc pixelů než obrazovka", d: "Náhled má nejvýš 1 600 px a vzniká z kopie o 2 048 px držené v paměti. Celá fotka se čte, až když přiblížíš, a to po částech.", v: "17 ms", l: "na překreslení náhledu" }
  - { t: "Připraveno dřív, než klikneš", d: "Jakmile jsou hotové miniatury, připraví se na pozadí náhled každé fotky a uloží se na disk, zatímco čtvrtina paměti drží fotky kolem té, která je na obrazovce.", v: "27 ms", l: "na otevření kterékoli fotky" }
  - { t: "Nic dvakrát", d: "Barevný posuvník mění jen barvu, nikdy velikost. Všechny barevné posuvníky se složí do jedné tabulky 33 × 33 × 33 barev, takže deset posuvníků stojí tolik co jeden.", v: "2 ms", l: "pro deset barevných posuvníků na náhledu" }
  - { t: "Paměť v rámci limitu", d: "Fotollection zpracovává najednou jen tolik fotek v plné velikosti, kolik dovolí jeho paměťový limit, určený podle největší fotky v exportu.", v: "1,45 GB", l: "špička paměti s 5 035 fotkami" }
  - { t: "Kodéry vyladěné měřením", d: "Soubory pro tisk vynechávají optimalizaci tabulek, která je zmenšovala o méně než 1 % a stála třetinu času kódování.", v: "−33 %", l: "času kódování souborů pro tisk" }
  - { t: "Grafická karta při úpravách", d: "Když se barevný posuvník hýbe, grafická karta kreslí z tabulky, kterou sestaví jádro. Exporty zůstávají na procesoru, takže tisk je na každém počítači stejný.", v: "1–2 ms", l: "na krok posuvníku, dřív 26 ms" }
perf_gpu_title: "Grafická karta při úpravách, všechna jádra při exportu"
perf_gpu_text: "Když táhneš barevným posuvníkem, grafická karta kreslí look ze stejné tabulky, kterou sestaví jádro Fotollection, a když pustíš, převezme to přesné vykreslení. Exporty zůstávají na procesoru, takže tisk vyjde na každém počítači stejně."
gpu_stats:
  - { v: "1–2 ms", l: "krok posuvníku na grafické kartě, proti asi 26 ms" }
  - { v: "0,13", l: "ΔE2000 mezi lookem z karty a přesným vykreslením" }
  - { v: "10,8", l: "exportovaných fotek s 26 MP za sekundu, šest najednou" }
chart_gpu: "Jeden krok barevného posuvníku: procesor proti grafické kartě"
chart_inflight: "Rychlost exportu podle počtu fotek zpracovávaných najednou"
chart_open: "Otevření fotky: v0.9.0 a v0.10.0 proti v0.11.0, na 422 fotkách z jedné cesty"
perf_open_title: "Až 20× rychlejší. Nový způsob, jak využít paměť."
perf_open_text: "v0.11.0 nově promýšlí, jak Fotollection drží tvoje fotky. Náhled každé fotky se připraví na pozadí, jakmile je hotová její miniatura, a uloží se na disk, čtvrtina paměti tvého počítače drží fotky kolem té, kterou vidíš, a fotka na obrazovce má vždy přednost. Výsledek: kterákoli fotka, blízká nebo vzdálená, JPEG nebo RAW, se otevře za 27 milisekund. Otevření RAW je až 20krát rychlejší než ve v0.9.0, JPEGu 10krát rychlejší, změřeno na stejných 422 fotkách z jedné cesty."
perf_open_fn: [fn_raw, fn_jpeg]
open_stats:
