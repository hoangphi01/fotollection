title: Fotollection - photos ready to print, fully offline
description: Free, open-source desktop app that prepares photos for printing on your own computer. Looks in one tap (your Lightroom presets and LUTs too), retro date stamp, camera info frame, best-shot suggestions, print-size crops and original-quality export, with no account and no upload.
