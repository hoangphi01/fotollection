cs_title: Code signing policy
cs_kicker: Trust
cs_description: "How Fotollection's installers are built and published, who approves each release, and what the app does and does not send over the network."
cs_lead: "The installers are not signed with a certificate yet: Windows shows a SmartScreen warning on the first launch, macOS builds carry an ad-hoc signature only, and the Linux AppImage and .deb are unsigned too. Every release lists SHA-256 checksums in SHA256SUMS.txt, so you can check that a download is the one published here. The APT repository at fotollection.org/apt is signed with the project's GPG key, so apt checks every package it installs from it."
cs_parts:
  - id: team
    title: Team roles
    lead: "Every installer is built by GitHub Actions from the public repository, from a tagged release; nothing built on a personal computer is published. The build workflow is"
    items:
      - title: Committers and reviewers
        author: true
        text: Writes and reviews every change to the source code.
      - title: Release approver
        author: true
        text: Checks and publishes every release by hand.
  - id: privacy
    title: Privacy policy
    lead: "This program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it."
    items:
      - title: Works offline
        text: "Photos, folders, projects and settings never leave your computer. There is no account, no telemetry and no crash upload."
      - title: Check for updates
        text: "The only network request: when you click, and from v0.13.0 once at start unless turned off in Settings, it asks GitHub (api.github.com) for this project's latest release. Nothing is downloaded by itself. GitHub's privacy statement applies to it."
      - title: No location in exports
        text: GPS coordinates are removed from exported photos by default.
        fn: [fn_gps]
      - title: This website
        text: "The website, not the app, counts visits and clicks on its download links with Google Analytics; Google's privacy policy applies to it. The download count comes from GitHub."
      - title: Support payments
        text: "Ko-fi, GitHub Sponsors and the bank behind a VietQR code process the payments made to support Fotollection, each under its own privacy policy. The website only links to them and loads nothing from them, and a payment has nothing to do with the app or your data in Fotollection."
  - id: system
    title: Changes to your system
    lead: Installing adds only what the app needs, and uninstalling removes it.
    items:
      - title: Open with
        text: "The installer, and on Linux the .deb, adds Fotollection to the Open with menu for photo files. It never makes itself the default app."
      - title: Uninstall
        text: "Remove it from Windows Settings, or delete the app on macOS. The Windows uninstaller also removes the Open with entries. On Linux, run sudo apt remove fotollection, or delete the AppImage, or run the install script with --uninstall, which also removes the APT repository and its key. Settings and projects stay in your home folder."
footer_signing: Code signing policy
perf_title: "Performance"
perf_description: "Every measurement behind Fotollection, explained in plain words: speed, memory, print quality, photos for social media and best-shot suggestions, with what ΔE, SSIM, JPEG and colour profiles mean."
perf_kicker: "Measured, not promised"
perf_lead: "Every number on this page comes from real photos on an ordinary laptop (Apple M3, 16 GB), and the scripts that produced them are in the repository, so anyone can run them again. Below each chart is what it means for your prints, and at the end, the words behind the numbers."
perf_how_title: "Why Fotollection is fast"
perf_how_lead: "No magic. A few decisions made before the first line of code, each one measured."
perf_how_items:
  - { t: "Native code on every core", d: "Fotollection's work runs in Rust, compiled for your processor and spread across all of its cores, with the vector instructions (SIMD) processors provide for pixels.", v: "23.5 / s", l: "photos exported at 16 MP", fn: [fn_simd, fn_units, fn_rust] }
  - { t: "Only what is needed", d: "Opening a folder reads each file's EXIF and its small embedded thumbnail, never the whole photo. Thumbnails are kept in a cache on disk.", v: "0.12 s", l: "to open 1,000 photos", fn: [fn_exif] }
  - { t: "Never more pixels than the screen", d: "A preview is at most 1,600 px, made from a 2,048 px copy held in memory. The full photo is read only when you zoom in, one part at a time.", v: "17 ms", l: "to redraw a preview" }
  - { t: "Ready before you click", d: "Once the thumbnails are done, a preview of every photo is prepared in the background and kept on disk, while a quarter of memory holds the photos around the one on screen.", v: "27 ms", l: "to open any photo" }
  - { t: "Nothing done twice", d: "A colour slider changes only the colour, never the size. Every colour slider is folded into one table of 33 × 33 × 33 colours, so ten sliders cost what one does.", v: "2 ms", l: "for ten colour sliders on a preview" }
  - { t: "Memory within budget", d: "Fotollection works on only as many full-size photos at once as its memory budget allows, set by the largest photo in the export.", v: "1.45 GB", l: "peak memory with 5,035 photos" }
  - { t: "Encoders tuned by measurement", d: "Print files skip a table optimisation that made them less than 1 % smaller and cost a third of the encoding time.", v: "−33 %", l: "encoding time for print files" }
  - { t: "The graphics card while you edit", d: "While a colour slider moves, the graphics card draws from the table the core builds. Exports stay on the processor, so a print is identical on every computer.", v: "1–2 ms", l: "per slider step, down from 26 ms" }
perf_gpu_title: "The graphics card while editing, every core for exports"
perf_gpu_text: "While you drag a colour slider, the graphics card draws the look from the same table Fotollection's core builds, and the exact render takes over when you let go. Exports stay on the processor, so a print comes out the same on every computer."
