car_presets_title: "Preset & LUT"
car_presets_text: "Look, LUT và preset Lightroom của bạn ở bên trái ảnh, theo nhóm; rê chuột lên một mục là ảnh hiện ngay trước khi bấm."
car_simple_title: "Look ở chế độ Đơn giản"
car_simple_text: "Một dải đánh số dưới ảnh: một phím số cho ảnh một look, ↑ để giữ, và ảnh tiếp theo hiện ra ngay."
car_many_title: "Nhiều ảnh cùng lúc"
car_many_text: "Áp một look cho các ảnh đã tick, hoặc mọi ảnh đang hiện, trong một bước ⌘Z hoàn tác được; lưới ảnh hiện đúng màu từng ảnh."
car_compare_title: "Trước và sau"
car_compare_text: "Cạnh nhau, chia đôi, hoặc ấn giữ ảnh để xem ảnh gốc, như trên iPhone."
car_data_title: "Cài đặt, và dữ liệu của bạn"
car_data_text: "Một cửa sổ cho mọi cài đặt. Cài đặt → Dữ liệu mang mọi thứ sang máy khác bằng một tệp."
car_collage_title: "Hai ảnh trên một tấm in"
car_collage_text: "Chế độ Ghép ảnh đặt hai ảnh lên mỗi tấm 10 × 15, như máy ảnh half-frame, mỗi ảnh một màu riêng."
compat_title: "Màu của bạn đi theo bạn."
