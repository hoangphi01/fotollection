perf_speed_title: "Tốc độ: một nghìn ảnh trong chớp mắt"
perf_speed_text: "Khi mở một thư mục, Fotollection chỉ đọc thông tin EXIF và ảnh thu nhỏ có sẵn trong tệp, chứ không đọc cả ảnh, và đổi một thiết lập thì chỉ vẽ lại bản xem trước. Rust chạy trực tiếp trên máy cũng hơn trình duyệt web làm cùng việc: xuất ảnh nhanh ngang, xem trước nhanh hơn và tốn ít hơn một phần tư RAM."
speed_stats:
  - { v: "0,12 giây", l: "đọc một thư mục 1.000 ảnh, nhanh gấp tám lần mức ngân sách" }
  - { v: "17 ms", l: "vẽ lại bản xem trước sau khi đổi thiết lập" }
  - { v: "23,5", l: "ảnh 16 MP xuất mỗi giây" }
perf_memory_title: "RAM: 5.035 ảnh vẫn không tăng"
perf_memory_text: "Fotollection chỉ giữ vài byte cho mỗi ảnh trong RAM, ghi ảnh thu nhỏ ra ổ đĩa và chỉ xử lý cùng lúc số ảnh cỡ lớn vừa với hạn mức RAM. Nhờ vậy RAM gần như không tăng khi chuyến đi lên tới hàng nghìn ảnh."
memory_stats:
  - { v: "1,45 GB", l: "RAM nhiều nhất với 5.035 ảnh" }
  - { v: "1,35 GB", l: "RAM nhiều nhất với 95 ảnh" }
  - { v: "53×", l: "số ảnh, mà chỉ thêm 0,1 GB" }
perf_print_title: "Chất lượng in: ảnh in giống ảnh gốc"
perf_print_text: "Ảnh in qua trình chỉnh sửa ảnh trên web thường trông nông màu: nó bỏ mất hồ sơ màu, thu ảnh xuống 2.000 px và lưu ở chất lượng 80 với độ phân giải màu giảm một nửa. Fotollection giữ nguyên hồ sơ màu và xuất ở độ phân giải đầy đủ, 4:4:4."
