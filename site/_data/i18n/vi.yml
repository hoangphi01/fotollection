features_title: Đủ mọi thứ cho một lần in ảnh
features_lead: Làm cho buổi tối sau chuyến đi, khi vài trăm tấm ảnh cần trở thành một xấp ảnh in nhỏ.
f_stamp_title: Dấu ngày kiểu máy film
f_stamp_text: Dòng ngày LED màu cam của máy film ngày xưa, tên nơi chụp cùng dòng và một dòng chữ của bạn bên dưới. Đặt riêng từng ảnh hoặc cho tất cả.
f_frame_title: Khung thông tin máy ảnh
f_frame_text: Viền "Shot on" gọn gàng với logo hãng, ống kính, tiêu cự, khẩu độ, tốc độ và ISO, lấy thẳng từ EXIF.
f_best_title: Gợi ý ảnh đẹp nhất
f_best_text: Ảnh chụp liên tiếp và các khung hình gần giống nhau được gom nhóm; ứng dụng gợi ý tấm nét nhất, ít rung, không nhắm mắt, kèm lý do.
f_crop_title: Cắt vừa khổ in
f_crop_text: Mỗi ảnh được cắt đúng khổ in, hiện DPI ngay khi kéo. Xoay ¼ vòng hoặc cân lại đường chân trời tới 15°.
f_quality_title: Giữ nguyên chất lượng gốc
f_quality_text: Đủ độ phân giải, giữ hồ sơ màu, JPEG 4:4:4 cho ảnh in. Ảnh in ra giống ảnh bạn đã chụp.
f_raw_title: Ảnh RAW, không cần chuyển đổi
f_raw_text: "RW2, CR2, CR3, NEF, ARW, RAF, ORF và DNG mở được nguyên dạng, đủ ngày chụp và thông số. Ảnh thu nhỏ lấy từ bản xem trước có sẵn trong mỗi tệp, nên duyệt RAW nhanh như JPEG."
f_open_title: Mở ảnh từ bất cứ đâu
f_speed_title: Nhanh trên mọi máy
f_speed_text: Một nghìn ảnh mở trong 0,12 giây, đổi một thiết lập thì ảnh xem trước vẽ lại trong 17 ms, và từ lần mở thứ hai ứng dụng khởi động trong khoảng 0,4 giây. Ảnh 32 MP xem trước nhanh như ảnh nhỏ.
f_open_text: Bấm chuột phải vào một ảnh trong Finder, Explorer hay trình quản lý file trên Linux và chọn Fotollection. Ảnh mở ngay, và thư mục của ảnh thành một tab.
