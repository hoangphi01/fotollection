compare_title: "So với các công cụ khác"
compare_lead: "Fotollection không nhằm thay thế một trình chỉnh sửa RAW đầy đủ. Ứng dụng được làm cho bước mà các công cụ ấy để lại cho bạn: từ thư mục ảnh của chuyến đi đến những tấm ảnh in cầm trên tay."
