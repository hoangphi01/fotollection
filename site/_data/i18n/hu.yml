linux_which: "Melyik disztribúciók?"
distro_title: "Mely Linux-disztribúciókon fut"
distro_lead: "A Fotollection 64 bites Linuxon fut, x86_64-en vagy ARM64-en, glibc 2.35-tel vagy újabbal."
distro_groups:
  - title: "Működik"
    items:
      - text: "AppImage: Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Pop!_OS 22.04+, elementary OS 7+, Zorin OS 17+, Fedora 36+, openSUSE Tumbleweed, Arch, Manjaro és más, hasonló korú rendszerek."
      - text: ".deb és az APT-tároló: Ubuntu, Debian, Mint, Pop!_OS, elementary OS és Zorin OS."
  - title: "Egy lépéssel működik"
    items:
      - text: "Ubuntu 24.04 és újabb: az AppImage-nek egyszer kell a FUSE 2,"
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: ", vagy futtasd így:"
        code2: "--appimage-extract-and-run"
        after2: ". A .deb-nek semmi sem kell."
      - text: "NixOS: indítsd ezzel:"
        code: appimage-run
      - text: "Fedora Silverblue és más megváltoztathatatlan rendszerek: használd az AppImage-et."
      - text: "NVIDIA-grafika: nincs teendő, az alkalmazás magától elkerüli a WebKit üresablak-hibáját."
        fn: [fn_nvidia]
  - title: "Nem fut"
    items:
      - text: "2.35-nél régebbi glibc: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky vagy Alma 8, openSUSE Leap 15."
      - text: "musl alapú rendszerek, például az Alpine."
      - text: "32 bites gépek."
      - text: "ChromeOS a Linux-konténere nélkül."
  - title: "Korlátok minden disztribúción"
    items:
      - text: "Még nincs HEIC (iPhone-) fotó: előbb alakítsd őket JPEG-gé."
        fn: [fn_pf_heic_linux]
      - text: "Nincs fotózás USB-n csatlakoztatott géppel."
      - text: "A RAW a macOS által hozzáadott objektívkorrekciók nélkül nyílik meg."
        fn: [fn_pf_raw]
