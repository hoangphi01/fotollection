perf_faq:
  - q: "Mi az a ΔE (Delta E)?"
    fn: [fn_de]
    a: "A ΔE azt méri, mennyire különbözőnek látszik két szín az emberi szem számára, egy olyan színtérben számolva, amely a látásunkhoz igazodik (CIELAB, a 2000-es képlettel). A 0 azonosat jelent. Kb. 1 a legkisebb különbség, amelyet egy gyakorlott szem egymás mellett észrevesz; 2–3 a legtöbb ember számára látható; 5 fölött a színek eltérőnek tűnnek. A Fotollection nyomtatási exportja átlagosan 0,19."
  - q: "Mi az az SSIM?"
    fn: [fn_ssim]
    a: "Az SSIM, a strukturális hasonlósági index, két kép formáit és textúráit veti össze egyes pixelek helyett, ami közelebb áll ahhoz, ahogy az elmosódást vagy a kockás tömörítést észrevesszük. Az 1 azonosat jelent. Kb. 0,98 fölött a legtöbb ember nagyítás nélkül nem tudja megkülönböztetni a kettőt."
  - q: "Hány színt tud tárolni egy JPEG?"
    fn: [fn_jpeg, fn_heic]
    a: "Egy JPEG a vörös, a zöld és a kék mindegyikére 8 bitet tárol: egyenként 256 szintet, összesen kb. 16,7 millió színt. A fotólaborok is ebből nyomtatnak. A fényképezőgépes RAW fájlok 12–14 bitet tárolnak, az újabb iPhone-ok pedig 10 bites HEIC-et is menthetnek, ami szerkesztéskor segít; egy kész nyomathoz egy jól elkészített 8 bites JPEG nem mutat lépcsőket a tónusok között."
  - q: "JPG vagy JPEG? És használjak PNG-t?"
    a: "A JPG és a JPEG ugyanaz a formátum: a régi Windows csak hárombetűs kiterjesztéseket engedett. A PNG veszteségmentes, így soha semmi nem vész el, de egy PNG-ként mentett fotó gyakran három-ötször nagyobb, és a legtöbb kioszk és labor JPEG-et vár. Egy legalább 90-es minőségű, teljes színfelbontású (4:4:4) JPEG, amilyet a Fotollection nyomtatáshoz exportál, papíron megkülönböztethetetlen az eredetitől."
  - q: "Mit jelent a 4:4:4 és a 4:2:0?"
    a: "A szemünk a részleteket főleg a fényerőben látja, kevésbé a színben, ezért a JPEG kisebb felbontásban tárolhatja a színt. A 4:4:4 megtartja a teljes színfelbontást; a 4:2:0 a negyedét tartja meg, amitől a fájlok kisebbek, de a színes élek, például egy piros szöveg vagy a levelek mögötti kék ég, elmosódnak. A nyomat 4:4:4-et érdemel; a közösségi média úgyis mindent 4:2:0-ra tömörít újra."
  - q: "sRGB, Display P3, Adobe RGB és színprofilok"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "A színprofil megmondja a szoftvernek, mit jelentenek a fájlban lévő számok. Az sRGB a weben használt klasszikus színtartomány. A Display P3, amelyet az iPhone-ok és az újabb fényképezőgépek használnak, kb. 25 %-kal több színt ér el, főleg a vörösökben és a zöldekben. Ha egy P3 fotó elveszíti a profilját, a számait sRGB-ként olvassák, és fakónak tűnik: ez az a 13 %-os telítettségvesztés, amelyet mértünk. Az Adobe RGB, amelyet egyes gépek nyomdai munkához kínálnak, szintén szélesebb az sRGB-nél, főleg a zöldekben és a ciánokban. A Fotollection nyomtatáshoz megtartja a fotó profilját, bármi legyen is, közösségi médiához pedig rendesen sRGB-re alakít."
  - q: "Hány DPI kell egy nyomathoz?"
    a: "A DPI azt adja meg, hány pixel jut a papír egy hüvelykére. 300 DPI-nél egy nyomat közelről is élesnek tűnik; 150–200 DPI karnyújtásnyiról elég. Egy 10 × 15 cm-es nyomathoz 300 DPI-nél 1800 × 1200 pixel kell, így bármely telefonos vagy gépes fotó elég; az alkalmazás méretjavaslata megmondja, mekkorára nagyítható egy-egy fotó."
  - q: "Miért néznek ki rosszabbul a fotók a Facebookon?"
    a: "A Facebook minden fotót legfeljebb 2048 px-re méretez át, gyengébb minőséggel és felezett színfelbontással tömöríti újra, és elhagyja a színprofilokat. Egy túl nagyként érkező fotót kétszer méreteznek át, egyszer te, egyszer a Facebook. Ha eleve 2048 px-en, sRGB-ben és enyhén élesítve küldöd, a Facebook csak egyszer tömöríti újra, és a színek már eleve jók."
