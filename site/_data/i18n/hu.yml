faq_title: "Kérdések letöltés előtt"
faq_lead: "Miért egy újabb fotós alkalmazás, és miben más ez."
faq_groups:
  - label: "Miért a Fotollection"
    items:
      - q: "Miért nem elég a Lightroom?"
        a: "A Lightroom, a beépített Fotók alkalmazások és az IrfanView szerkesztésre és nézegetésre készültek; egyiket sem fotónyomtatáshoz tervezték. Ha velük nyomtatsz, minden fotót magadnak kell a papír arányára vágnod, vagy átadod a fájlokat, és a bolt gépe vagy személyzete vágja meg őket, ami gyakran levág egy fejet vagy egy tábla szélét. A Fotollection a nyomatból indul ki: ismeri a dm és a Rossmann méreteit, mindegyik fotót ezekre vágja, így pontosan az jön ki, amit látsz, szól, ha egy fotó túl kicsi, filmes gép módjára rányomja a dátumot, és olyan fájlokat exportál, amelyeket a kioszk elfogad. Könnyű és gyors, ingyenes, és a Lightroom mellett is jól megfér: az eredetijeid sosem változnak, a Lightroom presetjeid pedig lookként működnek benne."
      - q: "A gépemen már ott a Fotók, vagy IrfanView-t használok. Minek még egy alkalmazás?"
        a: "A beépített Fotók alkalmazások és az IrfanView remek nézegetők, mindegyik a saját rendszerén. Egyik sem tudja, mekkora egy 10 × 15-ös kép a dm-ben vagy a Rossmannban, nem szól, ha egy fotó ehhez túl kicsi, nem nyomja rá a dátumot filmes gép módjára, és nem küldi öt mappa legjobb képeit egyetlen nyomtatási kosárba. A Fotollection igen, ugyanúgy néz ki és működik Macen, Windowson és Linuxon, és lehet az a nézegető is, amivel a fotóidat megnyitod: jobb klikk egy fotón, Megnyitás ezzel, Fotollection, a fényképezőgépes RAW-t is beleértve."
  - label: "Sebesség és méret"
    items:
      - q: "Nehézkes? Elfut a régebbi laptopomon?"
        a: "Kicsi: a Windows-telepítő kb. 18 MB, mert az ablak a rendszerben már meglévő webnézetet használja, nem egy egész böngészőt hoz magával. A mag Rustban íródott, és közvetlenül a gépeden fut. Az előnézet sosem nagyobb 1600 px-nél, így még egy 32 MP-es fotó is olyan gyorsan nyílik meg, mint egy kicsi, a teljes méretű kép pedig csak nagyításkor töltődik be. Még 5035 fotó exportálásakor is kb. 1,45 GB a memóriacsúcs."
      - q: "Mennyire gyors több ezer fotóval?"
        a: "1000 fotó megnyitása kb. 0,12 s, mert a Fotollection először minden fájl kis beépített bélyegképét olvassa be. Egy beállítás módosítása 17 ms alatt rajzolja újra az előnézetet, az exportálás másodpercenként 18 teljes méretű fotót készít, és az első indítás után kb. 0,4 s alatt nyílik meg a program. Minden számot egy átlagos laptopon mértünk, a Teljesítmény oldal pedig elmagyarázza, hogyan mérheted meg magad."
  - label: "Rendszerek és ár"
    items:
      - q: "Működik Macen, Windowson és Linuxon, és tényleg ingyenes?"
        a: "Igen. Egy letöltés macOS 11-re vagy újabbra, Apple siliconon és Intelen egyaránt, egy Windows 10-re és 11-re, 64 bites Linuxra pedig AppImage vagy .deb, Intel/AMD vagy ARM gépre, bármely disztribúcióra, amelyen glibc 2.35 vagy újabb van. A Linux a karcsú változatot kapja: még nincs HEIC (iPhone-) fotó, nincs fotózás USB-n csatlakoztatott géppel, és a RAW a macOS által hozzáadott objektívkorrekciók nélkül nyílik meg; a Funkciók alatti táblázat minden különbséget mutat. Ingyenes, reklámok, fiók és alkalmazáson belüli vásárlás nélkül, a forráskód pedig GPL-3.0 alatt nyilvános, így bárki ellenőrizheti, mit csinál."
tabs_row_title: "Mappák fülként, pipák, amelyek veled jönnek"
tabs_text: "Kattints egy mappára, hogy csak azzal dolgozz, vagy a Munkaterületre, hogy minden mappával egyszerre. Pipálj ki fotókat az egyik mappában, válts át egy másikra, és pipálj tovább: a sáv mindet számolja, így minden mappa legjobbjai egy mozdulattal kerülnek a nyomtatási kosárba. Pipálj ki több mappát, hogy együtt vagy mindegyiket a saját mappájába exportáld, és ha végeztél, zárd be a fület a ×-szel; a fotók a lemezeden maradnak."
