perf_trip_fn: [fn_trip, fn_pct]
perf_trip_title: "Egy valódi út: 422 fájl Prágából"
perf_trip_text: "A tesztkészletek szépíthetnek, ezért íme egy mappa pontosan úgy, ahogy egy prágai hétvége után lekerült egy Lumix GX9-ről: 396 darab 20 MP-es JPEG, egyenként kb. 11 MB, mellettük 26 RAW fájl, összesen 4,7 GB. Megnyitáskor 0,23 másodperc alatt beolvasódik minden fájl EXIF-je. Az előnézet 19 ms alatt rajzolódik újra, egy RAW 0,35 másodperc alatt dolgozódik ki, tíz képeslap pedig 21 ms alatt rajzolódik újra. 2026. november 3-án ezeken a nagy fájlokon két szám nem fért bele a keretébe: az exportálás másodpercenként 7,6 fotót készített, a memóriacsúcs pedig 2,14 GB volt. Az ok kiderült, és a v0.9.7 javította: a JPEG-ek exportálása most másodpercenként 10,1, és a teljes futás 1,31 GB alatt marad."
trip_stats:
  - { v: "0,23 s", l: "mind a 422 fájl megnyitása, EXIF-fel együtt" }
  - { v: "19 ms", l: "az előnézet újrarajzolása, p95 (keret: 50 ms)" }
  - { v: "0,35 s", l: "egy 20 MP-es RAW kidolgozása (medián)" }
  - { v: "21 ms", l: "tíz képeslap újrarajzolása (keret: 100 ms)" }
  - { v: "10,1 / s", l: "exportált JPEG (keret: 8 / s)" }
  - { v: "1,31 GB", l: "memóriacsúcs, JPEG és RAW (felső határ: 2 GB)" }
fn_trip: "A prágai mappa a szerző sajátja, és nincs közzétéve (© @hoangphi01, minden jog fenntartva). A bench/trip.sh és a JPEG-jein futtatott measure_folder 3-3 futásának mediánjai, Apple M3-on 16 GB-tal, más nyitott alkalmazások mellett, 2026. november 4-én, a v0.9.7 exportálásával; az összevetéshez futtasd őket egy saját mappán."
fn_simd: "A SIMD (single instruction, multiple data) lehetővé teszi, hogy a processzor sok értéken dolgozzon egyszerre: egyetlen utasítás több, egy széles vektorregiszterben egymás mellett tárolt számra hat, például sok pixel vörös, zöld és kék összetevőjére. Az Intel és az AMD processzoraiban SSE és AVX néven, az Apple siliconban és más Arm processzorokban NEON néven érhető el. Az Intel, az AMD és az Arm tulajdonosaik védjegyei."
fn_pct: "A p50 és a p95 percentilisek: a p50, a medián, az az idő, amely alatt a futások fele maradt; a p95 az az idő, amely alatt 100 futásból 95 maradt, így azokat a lassú eseteket mutatja, amelyeket egy átlag elrejt."
fn_psnr: "A PSNR (peak signal-to-noise ratio, csúcsjel–zaj viszony) két képet pixelről pixelre vet össze, és a különbségüket decibelben adja meg: minél nagyobb, annál közelebbiek. Kb. 40 dB fölött a különbség alig látható."
fn_sensor: "A CMOS és a CCD a képérzékelők két fajtája: fényérzékeny cellák rácsa, amely a fényt elektromos töltéssé alakítja. Ma szinte minden fényképezőgép és telefon CMOS-t (complementary metal-oxide-semiconductor) használ; a CCD (charge-coupled device) a korábbi gépekben volt elterjedt."
fn_tiff: "A TIFF (Tagged Image File Format) rugalmas képformátum, amelyet ma az Adobe gondoz; sok RAW-formátum, köztük a DNG, az ő szerkezetére épül."
fn_gpg: "A GPG (GNU Privacy Guard) az OpenPGP szabvány szabad megvalósítása. Az APT-tároló GPG-kulccsal van aláírva, így a rendszered ellenőrizheti, hogy minden csomag változatlanul onnan származik."
fn_rust: "A Rust és a Rust logó a Rust Foundation védjegyei. A Fotollection magja Rustban íródott, és közvetlenül a gépeden fut."
fn_webview: "Az alkalmazás ablaka Taurival készül, és a rendszer saját webnézete rajzolja: macOS-en a WebKit (WKWebView), Windowson a Microsoft Edge WebView2, Linuxon a WebKitGTK, a WebKit GTK-portja. A Tauri a Commons Conservancyn belüli Tauri Programme projektje; a WebKit az Apple Inc. védjegye; a GTK a GNOME Foundation projektje; a Microsoft Edge és a WebView2 a Microsoft Corporation védjegyei. A böngészős összevetés ugyanezt a feladatot headless Chromium 156-ban futtatta, amely a Google Chrome mögötti nyílt forráskódú projekt, processzormagonként egy Web Workerrel."
fn_de: "A ΔE2000 (CIEDE2000) a Nemzetközi Világítástechnikai Bizottság (CIE) színkülönbség-képlete, ISO/CIE 11664-6 néven szabványosítva; a CIELAB színtér, amelyben számol, az ISO/CIE 11664-4."
fn_ssim: "Az SSIM-et Zhou Wang, Alan C. Bovik, Hamid R. Sheikh és Eero P. Simoncelli vezette be az Image quality assessment: from error visibility to structural similarity című cikkben, IEEE Transactions on Image Processing, 13(4), 2004."
fn_srgb: "Az sRGB-t a HP és a Microsoft hozta létre 1996-ban, és IEC 61966-2-1 néven szabványosították."
fn_p3: "A Display P3 az Apple Inc. által meghatározott színtér, amely a filmipar (SMPTE) DCI-P3 színterén alapul."
fn_adobe: "Az Adobe RGB (1998) az Adobe Inc. által specifikált színtér; az Adobe az Adobe Inc. bejegyzett védjegye."
fn_charts: "Minden diagram: a számok tájékoztató jellegűek, egy átlagos laptopon (Apple M3, 16 GB) mérve; a tieid attól függnek, milyen gépet használsz."
fn_dng: "Az Adobe DNG Convertert ehhez az oldalhoz nem futtattuk. A szám külső becslés (1000 CR3 fájl 20–30 perc alatt modern hardveren, a gép megnevezése nélkül), a convertintomp4.com RAW–DNG kötegelt konvertálásról szóló blogbejegyzéséből. Az Adobe az Adobe Inc. bejegyzett védjegye."
chart_budgets: "Sebesség és memória, a kód megírása előtt kitűzött keretekhez mérve"
chart_quality: "Mit tart meg az exportálás az eredetiből, egy tipikus webes szerkesztőhöz képest"
chart_bestshot: "A legjobb kép ajánlásai, kézzel válogatott fotókhoz mérve"
chart_share: "Fotók Facebookra: amit a nézők látnak, miután a Facebook újratömörítette őket"
chart_memory: "A memóriacsúcs, ahogy a köteg 5035 fotóra nő"
chart_browser: "Ugyanaz a feladat a Fotollectionben és egy webböngészőben"
wiki_title: "Wiki"
wiki_kicker: "Az első képernyőtől"
wiki_description: "Hogyan nőtt fel a Fotollection az első képernyőjétől, verzióról verzióra: mit hozott mindegyik, és milyen volt a Fotollection a kiadásakor."
wiki_lead: "Minden verzió, a mai naptól az első üres ablakig: mit hozott, és milyen volt a Fotollection a kiadásakor, a projekt történetéből."
wiki_first: "Ugrás az első képernyőre"
wiki_toc: "Verziók"
wiki_foot: "Minden kép a Fotollectiont mutatja úgy, ahogy az adott verzió megjelent, a projekt történetéből; a legkorábbiak csak angolul vannak. Minden új verzió itt kap helyet."
man_title: "Kézikönyv"
man_kicker: "Súgó"
man_description: "Hogyan használd a Fotollectiont, lépésről lépésre, minden lépéshez képernyőképpel: a nyomtatandó fotók kiválasztása, lookok és szín, nagyítás, RAW, a gépek órái, dátumok és helyek, fotózás csatlakoztatott géppel, és minden billentyűparancs."
man_lead: "Minden lépés úgy, ahogy az alkalmazás mutatja. A kézikönyv követi az alkalmazást: ha egy verzió megváltoztat valamit, amit látsz, ez az oldal is vele változik."
man_toc: "Fejezetek"
man_source: "Ez a kézikönyv a GitHubon"
cs_title: "Kódaláírási szabályzat"
cs_kicker: "Bizalom"
cs_description: "Hogyan készülnek és jelennek meg a Fotollection telepítői, ki hagy jóvá egy-egy kiadást, és mit küld és mit nem küld az alkalmazás a hálózaton."
cs_lead: "A telepítők még nincsenek tanúsítvánnyal aláírva: a Windows az első indításkor SmartScreen-figyelmeztetést mutat, a macOS-buildek csak ad-hoc aláírást kapnak, és a Linuxos AppImage és .deb sincs aláírva. Minden kiadás felsorolja az SHA-256 ellenőrzőösszegeket a SHA256SUMS.txt fájlban, így ellenőrizheted, hogy egy letöltés az, amit itt közzétettünk. A fotollection.org/apt címen lévő APT-tároló a projekt GPG-kulcsával van aláírva, így az apt minden onnan telepített csomagot ellenőriz."
cs_parts:
  - id: team
    title: "Szerepkörök"
    lead: "Minden telepítőt a GitHub Actions épít a nyilvános tárolóból, egy címkézett kiadásból; semmi olyat nem teszünk közzé, ami személyes gépen készült. Az építési munkafolyamat:"
    items:
      - title: "Commitolók és ellenőrzők"
        author: true
        text: "Megírja és átnézi a forráskód minden változtatását."
      - title: "Kiadásjóváhagyó"
        author: true
        text: "Kézzel ellenőriz és tesz közzé minden kiadást."
  - id: privacy
    title: "Adatvédelmi szabályzat"
    lead: "Ez a program semmilyen információt nem továbbít más hálózati rendszerekre, hacsak ezt kifejezetten nem kéri a felhasználó vagy az, aki telepíti vagy üzemelteti."
    items:
      - title: "Offline működik"
        text: "A fotók, mappák, projektek és beállítások sosem hagyják el a gépedet. Nincs fiók, nincs telemetria és nincs összeomlási jelentés feltöltése."
      - title: "Frissítések keresése"
        text: "Az egyetlen hálózati kérés: amikor rákattintasz, és a v0.13.0 óta induláskor egyszer is, hacsak ki nem kapcsolod a Beállításokban, megkérdezi a GitHubot (api.github.com), mi a projekt legújabb kiadása. Magától semmi sem töltődik le. Erre a GitHub adatvédelmi nyilatkozata vonatkozik."
      - title: "Nincs helyadat az exportokban"
        text: "Az exportált fotókból alapból törlődnek a GPS-koordináták."
      - title: "Ez a weboldal"
        text: "A weboldal, nem az alkalmazás, a Google Analytics segítségével számolja a látogatásokat és a letöltési linkekre leadott kattintásokat; erre a Google adatvédelmi irányelvei vonatkoznak. A letöltések száma a GitHubtól származik."
      - title: "Támogatások"
        text: "A Fotollection támogatására szánt befizetéseket a Ko-fi, a GitHub Sponsors és egy VietQR-kód mögötti bank kezeli, mindegyik a saját adatvédelmi szabályzata szerint. A weboldal csak hivatkozik rájuk, és semmit sem tölt be tőlük, egy befizetésnek pedig semmi köze az alkalmazáshoz vagy a Fotollectionben lévő adataidhoz."
  - id: system
    title: "Változások a rendszereden"
    lead: "A telepítés csak azt adja hozzá, amire az alkalmazásnak szüksége van, az eltávolítás pedig törli."
    items:
      - title: "Megnyitás ezzel"
        text: "A telepítő, Linuxon pedig a .deb, felveszi a Fotollectiont a fotófájlok Megnyitás ezzel menüjébe. Sosem teszi magát alapértelmezett alkalmazássá."
      - title: "Eltávolítás"
        text: "Távolítsd el a Windows Gépházában, vagy töröld az alkalmazást macOS-en. A Windowsos eltávolító a Megnyitás ezzel bejegyzéseket is törli. Linuxon futtasd a sudo apt remove fotollection parancsot, vagy töröld az AppImage-et, vagy futtasd a telepítőszkriptet --uninstall kapcsolóval, amely az APT-tárolót és a kulcsát is eltávolítja. A beállítások és a projektek a saját mappádban maradnak."
perf_title: "Teljesítmény"
perf_description: "Minden mérés a Fotollection mögött, közérthetően elmagyarázva: sebesség, memória, nyomtatási minőség, fotók közösségi médiára és a legjobb kép ajánlásai, azzal együtt, mit jelent a ΔE, az SSIM, a JPEG és a színprofil."
perf_kicker: "Mérések, nem ígéretek"
perf_lead: "Ezen az oldalon minden szám valódi fotókból származik, egy átlagos laptopon (Apple M3, 16 GB), az ezeket előállító szkriptek pedig a tárolóban vannak, így bárki újra lefuttathatja őket. Minden diagram alatt ott áll, mit jelent a nyomataidra nézve, a végén pedig a számok mögötti fogalmak."
perf_how_title: "Miért gyors a Fotollection"
perf_how_lead: "Semmi varázslat. Néhány döntés, amely még az első kódsor előtt megszületett, és mindegyik mérve."
perf_how_items:
  - { t: "Natív kód minden magon", d: "A Fotollection munkája Rustban fut, a processzorodra fordítva és minden magjára elosztva, a processzorok pixelekhez kínált vektorutasításaival (SIMD).", v: "23,5 / s", l: "exportált fotó 16 MP-nél", fn: [fn_simd, fn_units, fn_rust] }
  - { t: "Csak ami kell", d: "Egy mappa megnyitása minden fájlnak csak az EXIF-jét és a kis beágyazott bélyegképét olvassa be, sosem a teljes fotót. A bélyegképek egy lemezes gyorsítótárba kerülnek.", v: "0,12 s", l: "1000 fotó megnyitása", fn: [fn_exif] }
  - { t: "Sosem több pixel, mint a képernyő", d: "Egy előnézet legfeljebb 1600 px, egy memóriában tartott 2048 px-es másolatból készül. A teljes fotót csak nagyításkor olvassa be, részenként.", v: "17 ms", l: "egy előnézet újrarajzolása" }
  - { t: "Kész, mielőtt kattintasz", d: "Amint a bélyegképek elkészültek, minden fotó előnézete elkészül a háttérben és a lemezre kerül, a memória negyede pedig a képernyőn lévő fotó körüli fotókat tartja.", v: "27 ms", l: "bármelyik fotó megnyitása" }
  - { t: "Semmi sem készül kétszer", d: "Egy színcsúszka csak a színt változtatja, a méretet sosem. Minden színcsúszka egyetlen 33 × 33 × 33 színből álló táblába olvad össze, így tíz csúszka annyiba kerül, mint egy.", v: "2 ms", l: "tíz színcsúszka egy előnézeten" }
  - { t: "Memória a kereten belül", d: "A Fotollection egyszerre csak annyi teljes méretű fotón dolgozik, amennyit a memóriakerete megenged; ezt az exportálás legnagyobb fotója határozza meg.", v: "1,45 GB", l: "memóriacsúcs 5035 fotóval" }
  - { t: "Méréssel hangolt kódolók", d: "A nyomtatási fájlok kihagynak egy táblaoptimalizálást, amely 1 %-nál kevesebbel tette kisebbé őket, és a kódolási idő harmadába került.", v: "−33 %", l: "kódolási idő a nyomtatási fájloknál" }
  - { t: "Szerkesztés közben a videokártya", d: "Amíg egy színcsúszka mozog, a videokártya a mag által felépített táblából rajzol. Az exportálás a processzoron marad, így egy nyomat minden gépen ugyanaz.", v: "1–2 ms", l: "csúszkalépésenként, 26 ms helyett" }
perf_gpu_title: "Szerkesztéskor a videokártya, exportáláskor minden mag"
perf_gpu_text: "Amíg egy színcsúszkát húzol, a videokártya ugyanabból a táblából rajzolja a lookot, amelyet a Fotollection magja épít, és amikor elengeded, a pontos renderelés veszi át a helyét. Az exportálás a processzoron marad, így egy nyomat minden gépen ugyanúgy jön ki."
gpu_stats:
  - { v: "1–2 ms", l: "egy csúszkalépés a videokártyán, kb. 26 ms helyett" }
  - { v: "0,13", l: "ΔE2000 a kártya lookja és a pontos renderelés között" }
  - { v: "10,8", l: "exportált 26 MP-es fotó másodpercenként, hat egyszerre" }
chart_gpu: "Egy színcsúszka egy lépése: a processzor a videokártyával szemben"
