support_title: "Hívj meg egy kávéra"
support_text: "A Fotollectiont egy vietnámi diák készíti az EU-ban, órák és részmunkaidős állás között. Ingyenes és nyílt forráskódú; ha megspórolt neked egy estényi fotóválogatást, egy kávé (vagy egy diákebéd 😄) segít, hogy folytatódjon."
support_sponsor: "Támogatás a GitHubon"
support_kofi: "Hívj meg egy kávéra a Ko-fin"
support_kofi_sub: "PayPal vagy kártya"
support_note_card: "A Ko-fi PayPallal vagy kártyával, a GitHub Sponsors kártyával fogad támogatást, egyszer vagy havonta, bármekkora összeggel. A Ko-fi oldala angol nyelvű: nyomd meg a „Tip” gombot, válaszd ki az összeget (euróban), és fizess kártyával vagy PayPallal."
kiosk_title: "Készen a fotókioszkra:"
kiosk_and: "és"
kiosk_lead: "A dm és a Rossmann fotószolgáltatásait a CEWE üzemelteti. A Fotollectionbe az árlistájuk minden mérete be van építve, így a vágás, amit látsz, pontosan az, ami a nyomtatóból kijön, meglepetésszerű levágás nélkül a széleken."
kiosk_standard: "Normál"
kiosk_square: "Négyzetes"
kiosk_strip: "Csík"
kiosk_more: "Saját arány (vágás nélkül) és bármilyen egyedi méret, cm-ben vagy hüvelykben"
kiosk_steps_title: "Az úttól a kész képekig"
kiosk_s1: "Válaszd ki a legjobb képeket és a nyomatméretet."
kiosk_s2: "Exportáld egy mappába, pendrive-ra vagy SD-kártyára."
kiosk_s3: "Nyomtasd ki a bolti kioszkon, vagy töltsd fel a bolt online szolgáltatásába."
fn_title: "Megjegyzések"
fn_label: "Megjegyzés"
fn_back: "Vissza a szöveghez"
fn_open: "Az ingyenes azt jelenti: nincs ár, nincsenek reklámok és alkalmazáson belüli vásárlások; ha meghívod a szerzőt egy kávéra, az a te döntésed, és segít neki tovább fejleszteni a Fotollectiont. A nyílt forráskód azt jelenti, hogy a teljes forráskód nyilvános a GitHubon, GPL-3.0 licenc alatt, így bárki elolvashatja, lefordíthatja és ellenőrizheti, mit csinál az alkalmazás. A fiók nélkül azt jelenti, hogy az alkalmazás sosem kérdezi meg, ki vagy, és nincs mibe bejelentkezni."
fn_photo: "A villamosos fotó a szerző sajátja (© @hoangphi01, minden jog fenntartva), Lumix GX9-cel készült Prágában, 2026 novemberében; minden lookot a Fotollection saját motorja rajzol, máshol nincs retusálva."
fn_downloads: "A GitHub számlálása szerint."
compare_title: "Összehasonlítás"
compare_lead: "A Fotollection nem akar egy teljes RAW-szerkesztőt leváltani. Arra a lépésre készült, amelyet azok rád hagynak: egy út mappájától a kézbe vehető képekig."
compare_caption: "A Fotollection a Lightroom Classic, a darktable és a RawTherapee mellett"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["Mire készült", "Egy út fotóinak kiválogatása, dátumozása és méretezése nyomtatáshoz", "Teljes munkafolyamat: katalógus, kidolgozás, nyomtatás és megosztás", "Fotós munkafolyamat és RAW-kidolgozó", "RAW-kidolgozás"], ["Képeslap címoldallal", "Igen", "Nem", "Nem", "Nem"], ["Dátum és hely a fotón", "Igen, filmes stílusban", "Nem", "Igen, vízjel", "Nem"], ["Vágás a labor nyomatméreteire", "Igen, élességellenőrzéssel", "Igen, Print modul", "Igen, nyomtatási nézet", "Nem"], ["Egy sorozat legjobb képe", "Igen, a legélesebb, nyitott szemmel", "Igen, Assisted Culling", "Nem", "Nem"], ["Megtartás vagy elvetés, fotónként", "Igen, Egyszerű mód", "Igen, jelölők", "Igen, csillagok", "Igen, rangsor"], ["Két fotó egy nyomaton", "Igen", "Igen", "Igen", "Nem"], ["Lookok egy kattintással", "Igen", "Igen, presetek", "Igen, stílusok", "Igen, profilok"], ["Lightroom-presetek", "Igen, importálva", "Igen", "Nem", "Nem"], ["LUT-ok", "Igen, .cube és HaldCLUT", "Profilként", "Igen", "Igen, HaldCLUT"], ["RAW-kidolgozás", "Igen", "Igen", "Igen", "Igen"], ["Ár", "Ingyenes", "Creative Cloud-előfizetés", "Ingyenes", "Ingyenes"], ["Forráskód", "Nyílt, GPL-3.0", "Zárt", "Nyílt, GPL-3.0 vagy újabb", "Nyílt, GPL-3.0"], ["Rendszerek", "macOS, Windows, Linux", "macOS, Windows", "macOS (Apple silicon), Windows, Linux", "macOS, Windows, Linux"], ["Fiók", "Nincs", "Adobe-fiók", "Nincs", "Nincs"]]
compare_note: "Ha tovább mennél: a darktable és a RawTherapee a legmélyebb RAW-kidolgozáshoz, a Lightroom egy életnyi fotóhoz egyetlen katalógusban."
fn_lightroom: "Az Adobe, a Lightroom és a Lightroom Classic az Adobe Inc. védjegyei az Egyesült Államokban és más országokban. A Fotollection nem áll kapcsolatban az Adobe-bal, és az Adobe nem támogatja; azokat a billentyűket és elrendezést követi, amelyeket a Lightroom felhasználói már ismernek. A Lightroom logója a Wikimedia Commonsról származik, ahol szöveges logóként közkincs."
fn_lut: "A LUT (look-up table, keresőtábla) minden színhez megadja, milyen színné válik; a Fotollection .cube fájlokat és HaldCLUT képeket olvas. A LUMIX a Panasonic Holdings Corporation védjegye; a Fotollection nem áll kapcsolatban a Panasonickal, és a Panasonic nem támogatja."
fn_compare: "A Creative Cloud az Adobe Inc. védjegye; a darktable és a RawTherapee saját közösségeik szabad szoftveres projektjei. Az adatok a darktable.org-ról és kézikönyvéből, a rawtherapee.com-ról, az Adobe Lightroom Classic súgójából és a Wikipédia Adobe-licencelésről és -követelményekről szóló összefoglalójából származnak, 2026. november 14-i állapot szerint. A Fotollection egyikükkel sem áll kapcsolatban."
fn_privacy_site: "Ez az alkalmazásra vonatkozik. A weboldal a látogatásokat névtelenül számolja a Google Analyticsszel, ország és oldal szerint, soha nem személyhez kötve."
fn_exif: "Az EXIF (Exchangeable Image File Format) a japán JEITA és CIPA által gondozott szabvány arra az információra, amelyet a fényképezőgép minden fotóba beír: a gép és az objektív, a dátum és az idő, az expozíció, gyakran a GPS-pozíció és egy kis beágyazott bélyegkép."
fn_units: "Mértékegységek: a px a pixel, egy kép egyetlen pontja; az MP (megapixel) egymillió pixel, így egy 20 MP-es fotó kb. 5472 × 3648 px; az ms a milliszekundum, a másodperc ezredrésze; az MB és a GB megabájt és gigabájt; a RAM (random-access memory) a számítógép munkamemóriája."
fn_raw: "A RAW fájl azt tárolja, amit a gép érzékelője rögzített, mielőtt a gép képpé alakította volna, így a szín, a fényerő és a részletek később is eldönthetők, ahogy egy negatívot előhívnak. Minden gyártónak saját formátuma van (CR3 a Canonnál, NEF a Nikonnál, ARW a Sonynál, RW2 a Panasonicnál és így tovább); a DNG (Digital Negative) az Adobe által közzétett nyílt RAW-formátum."
fn_heic: "A HEIF (High Efficiency Image File Format) az ISO/IEC 23008-12 képformátuma; a HEIC ennek HEVC-vel (H.265) tömörített változata, amelyben az iPhone-ok alapból mentik a fotókat. Egy HEIC fotó nagyjából fele akkora, mint egy hasonló minőségű JPEG."
fn_png: "A PNG (Portable Network Graphics) veszteségmentes képformátum, ISO/IEC 15948 néven közzétéve: minden pixel pontosan megmarad, ami grafikákhoz és képernyőképekhez ideális, egy fotó viszont többszörösen nagyobb lesz, mint JPEG-ként."
fn_arch: "Az x86_64, más néven amd64, a legtöbb Windowsos és Linuxos PC processzorarchitektúrája; az ARM64, más néven aarch64 vagy arm64, az Apple siliconé, sok laptopé és az olyan kis lapkáké, mint a Raspberry Pi. Mindegyikhez saját build kell."
fn_linux_pkg: "A .deb Debian-csomag, a Debian, az Ubuntu, a Linux Mint és rokonaik telepítőformátuma; az APT (Advanced Package Tool) telepíti és frissíti az ilyen csomagokat egy tárolóból. Az AppImage egyetlen fájl, amely egy alkalmazást és mindazt tartalmazza, amire szüksége van, és a legtöbb disztribúción telepítés nélkül fut."
fn_fuse: "A FUSE (Filesystem in Userspace) lehetővé teszi, hogy egy program a kernel módosítása nélkül biztosítson fájlrendszert. Az AppImage ezzel nyitja meg önmagát, az Ubuntu 24.04 pedig alapból már nem telepíti a 2-es verzióját."
fn_sha: "Az SHA-256 az SHA-2 család kriptográfiai hash-függvénye, az amerikai NIST szabványosította a FIPS 180-4-ben. Egy fájlból 64 karakteres ujjlenyomatot készít; ha a fájl egyetlen bitje megváltozik, az ujjlenyomat is megváltozik."
fn_jpeg: "A JPEG a Joint Photographic Experts Group képformátuma, ISO/IEC 10918-1 és ITU-T T.81 néven szabványosítva."
fn_pf_raw: "macOS-en a DNG-n kívüli RAW-formátumokat a rendszer dolgozza ki, az objektívkorrekcióival. Linuxon és Windowson a Fotollectionbe épített olvasó dolgozik, ezek nélkül; Windowson a Microsoft Raw Image Extension, ha telepítve van, csak utolsó tartalék."
fn_pf_heic_win: "A Microsoft ingyenes HEIF Image Extensions és HEVC Video Extensions bővítményével, a Microsoft Store-ból."
fn_pf_heic_linux: "A HEIC-hez HEVC-dekóder kell, amelyet a Linux nem szállít, a Fotollection pedig a szabadalmai miatt nem csomagol. Egy későbbi verzió a disztribúciód által telepített libheifet fogja használni. Addig alakítsd a HEIC fotókat JPEG-gé."
fn_pf_tether: "Először a Sony a6400; más gépek is követik."
fn_pf_openwith: "A .deb csomaggal vagy a telepítőszkripttel. A magában futtatott AppImage nincs regisztrálva a fájlkezelőben, hacsak egy eszköz, például az AppImageLauncher, el nem végzi ezt."
fn_pf_update: "Az AppImage letölti az új AppImage-et; a .deb megnyitja a kiadási oldalt, az APT-tárolóval pedig a sudo apt upgrade hozza az új verziót."
fn_glibc: "A glibc, a GNU C Library, az az alapkönyvtár, amelyen minden Linux-program fut. A sajátodat úgy nézheted meg, hogy beírod egy terminálba: ldd --version. A Fotollection Ubuntu 22.04-en készül, amelyen glibc 2.35 van, ezért ez a verzió vagy újabb kell hozzá."
fn_nvidia: "Az NVIDIA saját illesztőprogramjával a WebKitGTK DMA-BUF megjelenítője üresen hagyhatja az ablakot. Ha ez az illesztőprogram be van töltve, a Fotollection egyszer újraindítja magát ezzel a megjelenítővel kikapcsolva."
fn_dm: "A dm és a dm logó a dm-drogerie markt GmbH + Co. KG védjegyei."
fn_rossmann: "A ROSSMANN és a ROSSMANN logó a Dirk Rossmann GmbH védjegyei."
fn_cewe: "A dm és a Rossmann fotószolgáltatásait a CEWE üzemelteti, amely a CEWE Stiftung & Co. KGaA védjegye. A nyomatméreteket a dm árlistájával vetettük össze 2026 októberében; a boltok változtathatnak rajtuk."
fn_photos: "A képernyőképeken látható prágai fotókat (a villamosokat, az utcákat, a Moldvát) @hoangphi01 készítette Lumix GX9-cel 2026 novemberében: © @hoangphi01, minden jog fenntartva. Nem tartoznak az alkalmazás licence alá, és nem használhatók fel újra. A többi bemutatófotó közkincs (CC0) a Wikimedia Commonson, szerzőik Dktue (7 fotó), Pierre Blaché Párizsból (2) és Kate Branch (1). A nyomtatási kosaras és a legjobb képes képernyőképeken látható macskát szintén @hoangphi01 fotózta a GX9-cel, minden jog fenntartva; a mellette látható lágyabb, bemozdult és sötétebb másolatok ebből az egy fotóból készültek, hogy megmutassák, hogyan választódik ki a legjobb kép."
fn_photos_link: "Minden fájl, az oldala és az ellenőrzőösszege."
fn_rawsamples: "A RAW-mérések kilenc közkincs (CC0) mintát használnak a raw.pixls.us oldalról, formátumonként egyet; a scripts/fetch-raw-samples.py letölti és ellenőrzi őket."
fn_rawformats: "Az ezen az oldalon említett RAW-formátumok az őket meghatározó gyártókéi: RW2 (Panasonic Holdings Corporation), CR2 és CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) és ORF (OM Digital Solutions Corporation, korábban Olympus). A DNG az Adobe Inc. által közzétett nyílt specifikáció. A Fotollection a beépített olvasójával olvassa őket, macOS-en pedig elsősorban a rendszer kodekjeivel (Windowson a Microsoft Raw Image Extension, ha telepítve van, utolsó tartalék); egyik cég sem készítette vagy támogatja."
fn_cameras: "A képernyőképeken és az alkalmazás adatkeretében látható fényképezőgép-nevek és -logók tulajdonosaik védjegyei, és csak azt mutatják, melyik gép készítette a fotót: Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) és Sony (Sony Group Corporation)."
fn_others: "Az Apple és a macOS az Apple Inc. védjegyei; a Windows a Microsoft Corporationé; a Linux Linus Torvalds bejegyzett védjegye az Egyesült Államokban és más országokban; az Ubuntu a Canonical Ltd.-é; a Debian a Software in the Public Interest, Inc.-é; a Fedora, a Red Hat, a RHEL és a CentOS a Red Hat, Inc.-é; az openSUSE a SUSE LLC-é; a Pop!_OS a System76, Inc.-é; a Rocky Linux a Rocky Enterprise Software Foundationé; az AlmaLinux az AlmaLinux OS Foundationé; a ChromeOS a Google LLC-é; az NVIDIA az NVIDIA Corporationé; a többi Linux-disztribúció neve a projektjeiké; a Facebook és az Instagram a Meta Platforms, Inc.-é; a GitHub a GitHub, Inc.-é; a Google Analytics a Google LLC-é; a Lightroom az Adobe Inc.-é; az IrfanView Irfan Škiljané; a VietQR a NAPAS-é; a Wikimedia Commons a Wikimedia Foundationé. Az Apple, a Windows és a Linux (Tux, első rajzolója Larry Ewing) jelei a Simple Iconsból (CC0) származnak, és csak azt mutatják, melyik rendszerről szól egy oszlop vagy egy lépés."
fn_brand: "A Fotollection név és logó a hivatalos alkalmazást jelöli, amelyet @hoangphi01 készít. Hivatalos letöltések csak a fotollection.org oldalról és a projekt GitHub-kiadásaiból származnak. A GPL-3.0 licenc bárkinek megengedi, hogy másolatokat osszon meg vagy adjon el, módosítva vagy anélkül, amíg megtartja ezt a licencet és elérhetővé teszi a forráskódot; egy módosított vagy továbbértékesített másolat nem használhatja a Fotollection nevet vagy logót úgy, hogy azt sugallja, ez a hivatalos alkalmazás."
fn_notify: "Megosztanád vagy eladnád a Fotollectiont, vagy ráépítenél? Kérlek, előbb szólj a szerzőnek egy GitHub-issue megnyitásával (github.com/hoangphi01/fotollection/issues). Az alkalmazás ingyenes, és szabadidőben készül; egy rövid üzenet a tisztességes köszönet."
fn_cite: "Idézed, értékeled vagy bemutatod az alkalmazást, vagy felhasználod ezeket a képernyőképeket? Kérlek, tüntesd fel a Fotollectiont, és hivatkozz a fotollection.org oldalra."
fn_independent: "A Fotollection független, nyílt forráskódú projekt. Nem áll kapcsolatban ezekkel a cégekkel, nem szponzorálják és nem támogatják, és minden más védjegy a tulajdonosáé."
shield: "Privát – a fotóid sosem hagyják el a gépedet"
privacy_title: "A fotóid a tieid maradnak"
privacy_lead: "A Fotollection úgy készült, hogy internet nélkül is működjön. Semmi sem töltődik fel, semmit sem követ nyomon, és minden sorát ellenőrizheted."
p1_title: "Nincs feltöltés, nincs felhő"
p1_text: "A fotók olvasása és írása a saját lemezeden történik. Nincs szerver, ahová el lehetne küldeni őket."
p2_title: "Nincs fiók, nincs követés"
p2_text: "Nincs regisztráció, és az alkalmazásban nincs analitika vagy telemetria. A v0.13.0 óta induláskor egyszer megkérdezi a GitHubot, van-e újabb verzió; ezt a Beállításokban kikapcsolhatod."
p6_title: "Nincsenek reklámok"
p6_text: "Semmit nem akar eladni neked, és senki sem fizet azért, hogy elérjen. Nincsenek hirdetések, szponzorált ajánlások, alkalmazáson belüli vásárlások, sem most, sem később."
p3_title: "Helynevek térképszolgáltatás nélkül"
p3_text: "A településnevek az alkalmazásba épített térképadatbázisból jönnek, így a GPS-adataid sosem jutnak harmadik félhez."
p4_title: "GPS eltávolítva exportáláskor"
p4_text: "Az exportált képekből alapból törlődik a helyadat, így egy fotólabornak átadott fotó nem árulja el, hol laksz."
p5_title: "Nyílt forráskód"
p5_text: "A kód GPL-3.0 alatt nyilvános. Bárki elolvashatja, lefordíthatja, és meggyőződhet róla, hogy azt csinálja, amit ez az oldal állít."
charts_more: "Minden mérés, elmagyarázva"
footer_story: "A történet"
footer_wiki: "Wiki"
footer_signing: "Kódaláírási szabályzat"
dl_warn_title: "Frissíts a v0.14.0-ra vagy újabbra."
dl_warn_text: "A korábbi verziók elveszíthették egy olyan meghajtón lévő mappa szerkesztéseit, amely induláskor nem volt csatlakoztatva, és egyetlen hiba az egész alkalmazást bezárhatta. A v0.14.0 mindkettőt javítja; a beállításaid és projektjeid megmaradnak."
install_title: "Telepítés egy perc alatt"
install_lead: "A telepítők még nincsenek fizetős tanúsítvánnyal aláírva, ezért az első indításhoz kell egy plusz kattintás."
mac_title: "macOS"
mac_1: "Nyisd meg a .dmg fájlt, és húzd a Fotollectiont az Alkalmazások mappába."
mac_2: "Nyisd meg. A macOS letiltja az első indítást."
mac_3: "A Rendszerbeállítások → Adatvédelem és biztonság alatt kattints a Megnyitás mégis gombra."
win_title: "Windows"
win_1: "Futtasd a -setup.exe fájlt (vagy az .msi-t)."
win_2: "Ha a SmartScreen azt írja, hogy „A Windows megvédte a számítógépet”, kattints a További információ lehetőségre."
win_3: "Kattints a Futtatás mindenképp gombra."
linux_title: "Linux"
linux_script_title: "Egyetlen parancs"
linux_script_text: "Kiválasztja a rendszerednek megfelelő csomagot: az Ubuntu, a Debian és a Mint az APT-tárolót kapja, a többi disztribúció az AppImage-et a ~/.local mappába. Eltávolítás:"
linux_apt_title: "Vagy add hozzá az APT-tárolót"
linux_apt_text: "Ubuntura, Debianra, Mintre és a család többi tagjára. A frissítések ezután ezzel érkeznek:"
linux_appimage_title: "Vagy futtasd az AppImage-et"
linux_appimage_text: "Töltsd le, tedd futtathatóvá, és indítsd el. ARM-on a fájlnév _aarch64-re végződik."
