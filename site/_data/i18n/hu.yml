modes_manual: "A teljes kézikönyv"
postcard_title: "Képeslap a saját fotódból"
postcard_text: "Collage módban egyetlen kapcsoló minden képet képeslappá alakít: az egyik felén a fotód, a másikon szaggatott bélyegkeret és sorok az üzenetnek vagy a címnek. Gépeld be a szöveget írógépbetűvel, vagy írd kézzel, vékony alkoholos filccel. Egy 10 × 15-ös kép belefér a Deutsche Post által elfogadott képeslapméretekbe."
pc_type_title: "Gépelve vagy kézzel írva"
pc_type_text: "Az üzenetnek és a címnek saját sorai vannak, félkövérrel, dőlttel és aláhúzással, írógépbetűvel vagy saját betűtípussal. A latin betűs európai nyelvek minden betűje megvan, így egy prágai vagy krakkói cím is úgy nyomtatódik, ahogy begépelted. Válassz tintát, feketét, kéket, szépiát vagy pirosat, és tegyél egy kis forrássort az aljára. A fotós fél úgy működik, mint Collage módban: fehér keret körülötte, vagy a fotó a széléig kitölti."
collage_title: "Két fotó egy képen"
collage_text: "A félformátumú filmes gépek ihlették: egy 10 × 15-ös képre két 10 × 7,5-ös fotó fér, így egy sorozat fele annyiba kerül. A fotók sorrendben párosulnak, húzással cserélhetők, és az alkalmazás fehér szegélyes méretet javasol, 2:3-as fotóhoz 6 × 9 cm-t. Egy vékony vágóvonal kettéosztja a képet, vagy hagyd el, és félformátumú csíkot kapsz."
show_collage: "Collage mód: a lapok úgy, ahogy nyomtatva lesznek, a fotó arányával, a javasolt mérettel és a vágóvonallal"
collage_preview_title: "Lásd a képet, mielőtt kinyomtatják"
collage_preview_text: "Nyiss meg egy lapot úgy, ahogy egy fotót: a kép nagyban, pontosan úgy, ahogy a kioszk elkészíti, két fotó egymás mellett a dátummal és a kerettel. Az 1-gyel vagy a 2-vel válaszd ki bármelyik fotót, hogy megvágd vagy elforgasd, a többi lapot pedig a nyílbillentyűkkel lapozhatod."
show_collage_preview: "Egy lap előnézete: éjszakai villamos és a prágai Nemzeti Múzeum egyetlen 10 × 15-ös képen"
simple_title: "Simple: tartsd meg vagy dobd el, aztán nyomtass"
simple_text: "Egyszerre egy fotó, úgy, ahogy nyomtatva lesz. Egy számbillentyű lookot ad neki, a fel megtartja, a le elveti, és máris jön a következő. Válassz méretet és dátumot, aztán exportáld, amit megtartottál."
show_simple: "Simple mód: a fotó úgy, ahogy nyomtatva lesz, Megtartás és Elvetés, és a megtartott fotók exportálása"
swipe_title: "↑ nyomtatásra, ↓ félre"
swipe_text: "Nyisd meg az első fotót, és dönts egyetlen billentyűvel: a ↑ a nyomtatási kosárba teszi, a ↓ félreteszi, és a következő fotó már a képernyőn van. Semmi sem törlődik: a kosár és a félretett kupac az oldalsávban vár, így meggondolhatod magad."
select_title: "Vagy pipáld ki őket a galériában"
select_text: "A Kijelölés jelölőnégyzetekké alakítja a rácsot, mint az iPhone-on, Shift-kattintással egy egész sorozatra. Tartsd lenyomva a szóközt egy fotó fölött, hogy nagyban lásd, pontosan úgy, ahogy nyomtatva lesz, aztán engedd el, és folytasd."
estimate_title: "Tudd a méretet exportálás előtt"
estimate_text: "Az exportkártya még az írás előtt megmondja, mekkorák lesznek a fájlok, néhány, a beállításaiddal kódolt fotó alapján. A Facebookra szánt gépes fotók nagyjából hatszor könnyebbek lesznek, és ezt még kattintás előtt látod."
