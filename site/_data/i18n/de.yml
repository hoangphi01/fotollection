distro_lead: "Fotollection läuft unter 64-Bit-Linux, x86_64 oder ARM64, mit glibc 2.35 oder neuer."
distro_groups:
  - title: "Läuft"
    items:
      - text: "AppImage: Ubuntu 22.04+, Debian 12+, Linux Mint 21+, Pop!_OS 22.04+, elementary OS 7+, Zorin OS 17+, Fedora 36+, openSUSE Tumbleweed, Arch, Manjaro und andere aus dieser Zeit."
      - text: ".deb und das APT-Repository: Ubuntu, Debian, Mint, Pop!_OS, elementary OS und Zorin OS."
  - title: "Läuft mit einem Schritt"
    items:
      - text: "Ubuntu 24.04 und neuer: Das AppImage braucht einmalig FUSE 2,"
        code: sudo apt install libfuse2t64
        fn: [fn_fuse]
        after: ", oder starte es mit"
        code2: "--appimage-extract-and-run"
        after2: ". Das .deb braucht nichts."
      - text: "NixOS: Starte es über"
        code: appimage-run
      - text: "Fedora Silverblue und andere unveränderliche Systeme: Nutze das AppImage."
      - text: "NVIDIA-Grafik: nichts zu tun, die App umgeht das Problem mit dem leeren WebKit-Fenster von selbst."
        fn: [fn_nvidia]
  - title: "Läuft nicht"
    items:
      - text: "glibc älter als 2.35: Ubuntu 20.04, Debian 11, RHEL, CentOS, Rocky oder Alma 8, openSUSE Leap 15."
      - text: "musl-Systeme wie Alpine."
      - text: "32-Bit-Rechner."
      - text: "ChromeOS ohne seinen Linux-Container."
  - title: "Grenzen auf jeder Distribution"
    items:
      - text: "Noch keine HEIC-Fotos (iPhone): Wandle sie zuerst in JPEG um."
        fn: [fn_pf_heic_linux]
      - text: "Kein Fotografieren mit einer Kamera über USB."
      - text: "RAW öffnet sich ohne die Objektivkorrekturen, die macOS hinzufügt."
        fn: [fn_pf_raw]
