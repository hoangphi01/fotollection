man_title: "Handbuch"
man_kicker: "Hilfe"
man_description: "So benutzt du Fotollection, Schritt für Schritt, mit einem Screenshot zu jedem Schritt: die Fotos zum Drucken auswählen, Looks und Farbe, Zoom, RAW, Kamerauhren, Datum und Ort, Fotografieren mit angeschlossener Kamera, und jedes Tastenkürzel."
man_lead: "Jeder Schritt, wie die App ihn zeigt. Das Handbuch folgt der App: Wenn eine Version etwas Sichtbares ändert, ändert sich diese Seite mit."
man_toc: "Kapitel"
man_source: "Dieses Handbuch auf GitHub"
cs_title: "Richtlinie zur Code-Signierung"
cs_kicker: "Vertrauen"
cs_description: "Wie die Installer von Fotollection gebaut und veröffentlicht werden, wer jedes Release freigibt und was die App über das Netzwerk sendet und was nicht."
cs_lead: "Die Installer sind noch nicht mit einem Zertifikat signiert: Windows zeigt beim ersten Start eine SmartScreen-Warnung, die macOS-Builds tragen nur eine Ad-hoc-Signatur, und auch das Linux-AppImage und das .deb sind unsigniert. Jedes Release führt SHA-256-Prüfsummen in SHA256SUMS.txt auf, so kannst du prüfen, dass ein Download der hier veröffentlichte ist. Das APT-Repository unter fotollection.org/apt ist mit dem GPG-Schlüssel des Projekts signiert, so prüft apt jedes Paket, das es von dort installiert."
cs_parts:
  - id: team
    title: "Rollen im Team"
    lead: "Jeder Installer wird von GitHub Actions aus dem öffentlichen Repository gebaut, aus einem getaggten Release; nichts, was auf einem privaten Computer gebaut wurde, wird veröffentlicht. Der Build-Workflow ist"
    items:
      - title: "Committer und Reviewer"
        author: true
        text: "Schreibt und prüft jede Änderung am Quellcode."
      - title: "Freigabe der Releases"
        author: true
        text: "Prüft und veröffentlicht jedes Release von Hand."
  - id: privacy
    title: "Datenschutzerklärung"
    lead: "Dieses Programm überträgt keine Informationen an andere vernetzte Systeme, es sei denn, der Nutzer oder die Person, die es installiert oder betreibt, fordert dies ausdrücklich an."
    items:
      - title: "Arbeitet offline"
        text: "Fotos, Ordner, Projekte und Einstellungen verlassen nie deinen Computer. Es gibt kein Konto, keine Telemetrie und kein Hochladen von Absturzberichten."
      - title: "Nach Updates suchen"
        text: "Die einzige Netzwerkanfrage: Wenn du klickst, und ab v0.13.0 einmal beim Start, sofern nicht in den Einstellungen ausgeschaltet, fragt sie GitHub (api.github.com) nach dem neuesten Release dieses Projekts. Nichts wird von selbst heruntergeladen. Dafür gilt die Datenschutzerklärung von GitHub."
      - title: "Kein Standort in Exporten"
        text: "GPS-Koordinaten werden standardmäßig aus exportierten Fotos entfernt."
        fn: [fn_gps]
      - title: "Diese Website"
        text: "Die Website, nicht die App, zählt Besuche und Klicks auf ihre Download-Links mit Google Analytics; dafür gilt die Datenschutzerklärung von Google. Die Zahl der Downloads stammt von GitHub."
      - title: "Unterstützungszahlungen"
        text: "Ko-fi, GitHub Sponsors und die Bank hinter einem VietQR-Code wickeln die Zahlungen zur Unterstützung von Fotollection ab, jeweils nach ihrer eigenen Datenschutzerklärung. Die Website verlinkt sie nur und lädt nichts von ihnen, und eine Zahlung hat nichts mit der App oder deinen Daten in Fotollection zu tun."
  - id: system
    title: "Änderungen an deinem System"
    lead: "Die Installation fügt nur hinzu, was die App braucht, und die Deinstallation entfernt es."
    items:
      - title: "Öffnen mit"
        text: "Der Installer, unter Linux das .deb, trägt Fotollection in das Menü „Öffnen mit“ für Fotodateien ein. Es macht sich nie selbst zur Standard-App."
      - title: "Deinstallieren"
        text: "Entferne es in den Windows-Einstellungen, oder lösche die App unter macOS. Das Windows-Deinstallationsprogramm entfernt auch die Einträge unter „Öffnen mit“. Unter Linux führ sudo apt remove fotollection aus, lösche das AppImage, oder starte das Installationsskript mit --uninstall, das auch das APT-Repository und seinen Schlüssel entfernt. Einstellungen und Projekte bleiben in deinem Benutzerordner."
perf_title: "Leistung"
perf_description: "Jede Messung hinter Fotollection, in einfachen Worten erklärt: Tempo, Speicher, Druckqualität, Fotos für soziale Medien und Vorschläge für die besten Aufnahmen, dazu, was ΔE, SSIM, JPEG und Farbprofile bedeuten."
perf_kicker: "Gemessen, nicht versprochen"
perf_lead: "Jede Zahl auf dieser Seite stammt von echten Fotos auf einem gewöhnlichen Laptop (Apple M3, 16 GB), und die Skripte, die sie erzeugt haben, liegen im Repository, sodass jeder sie wiederholen kann. Unter jedem Diagramm steht, was es für deine Abzüge bedeutet, und am Ende die Begriffe hinter den Zahlen."
perf_how_title: "Warum Fotollection schnell ist"
perf_how_lead: "Keine Magie. Ein paar Entscheidungen, getroffen vor der ersten Zeile Code, jede gemessen."
perf_how_items:
  - { t: "Nativer Code auf jedem Kern", d: "Die Arbeit von Fotollection läuft in Rust, kompiliert für deinen Prozessor und verteilt auf alle seine Kerne, mit den Vektorbefehlen (SIMD), die Prozessoren für Pixel bieten.", v: "23,5 / s", l: "exportierte Fotos mit 16 MP", fn: [fn_simd, fn_units, fn_rust] }
  - { t: "Nur, was nötig ist", d: "Beim Öffnen eines Ordners werden die EXIF-Daten jeder Datei und ihr kleines eingebettetes Vorschaubild gelesen, nie das ganze Foto. Die Vorschaubilder liegen in einem Cache auf der Festplatte.", v: "0,12 s", l: "um 1.000 Fotos zu öffnen", fn: [fn_exif] }
  - { t: "Nie mehr Pixel als der Bildschirm", d: "Eine Vorschau hat höchstens 1.600 px und entsteht aus einer Kopie mit 2.048 px im Speicher. Das ganze Foto wird erst gelesen, wenn du hineinzoomst, und zwar Stück für Stück.", v: "17 ms", l: "um eine Vorschau neu zu zeichnen" }
  - { t: "Bereit, bevor du klickst", d: "Sind die Vorschaubilder fertig, wird im Hintergrund für jedes Foto eine Vorschau vorbereitet und auf der Festplatte abgelegt, während ein Viertel des Speichers die Fotos rund um das auf dem Bildschirm hält.", v: "27 ms", l: "um ein beliebiges Foto zu öffnen" }
  - { t: "Nichts doppelt", d: "Ein Farbregler ändert nur die Farbe, nie die Größe. Jeder Farbregler wird in eine einzige Tabelle mit 33 × 33 × 33 Farben eingerechnet, so kosten zehn Regler so viel wie einer.", v: "2 ms", l: "für zehn Farbregler auf einer Vorschau" }
  - { t: "Speicher im Budget", d: "Fotollection bearbeitet nur so viele Fotos in voller Größe gleichzeitig, wie sein Speicherbudget erlaubt, festgelegt nach dem größten Foto im Export.", v: "1,45 GB", l: "Spitzenspeicher bei 5.035 Fotos" }
  - { t: "Encoder, per Messung abgestimmt", d: "Druckdateien verzichten auf eine Tabellenoptimierung, die sie um weniger als 1 % kleiner machte und ein Drittel der Kodierzeit kostete.", v: "−33 %", l: "Kodierzeit für Druckdateien" }
  - { t: "Die Grafikkarte beim Bearbeiten", d: "Während sich ein Farbregler bewegt, zeichnet die Grafikkarte aus der Tabelle, die der Kern erstellt. Exporte bleiben auf dem Prozessor, so ist ein Abzug auf jedem Computer identisch.", v: "1–2 ms", l: "pro Reglerschritt, statt 26 ms" }
perf_gpu_title: "Die Grafikkarte beim Bearbeiten, jeder Kern für Exporte"
perf_gpu_text: "Während du einen Farbregler ziehst, zeichnet die Grafikkarte den Look aus derselben Tabelle, die der Kern von Fotollection erstellt, und sobald du loslässt, übernimmt die exakte Berechnung. Exporte bleiben auf dem Prozessor, so wird ein Abzug auf jedem Computer gleich."
