modes_manual: "Das ganze Handbuch"
postcard_title: "Eine Postkarte aus deinem eigenen Foto"
postcard_text: "Im Collage-Modus macht ein Schalter aus jedem Abzug eine Postkarte: dein Foto auf der einen Hälfte, auf der anderen ein gestricheltes Briefmarkenfeld und Linien für Nachricht oder Adresse. Tipp den Text ein, gesetzt in einer Schreibmaschinenschrift, oder schreib ihn von Hand mit einem feinen Permanentmarker. Ein 10 × 15-Abzug liegt innerhalb der Postkartenformate, die die Deutsche Post annimmt."
pc_type_title: "Getippt oder von Hand geschrieben"
pc_type_text: "Nachricht und Adresse haben jeweils eigene Linien, mit fett, kursiv und unterstrichen, in einer Schreibmaschinenschrift oder einer eigenen Schrift. Jeder Buchstabe der europäischen Sprachen in lateinischer Schrift ist dabei, so wird eine Adresse in Praha oder Kraków gedruckt, wie du sie tippst. Wähl die Tinte, Schwarz, Blau, Sepia oder Rot, und füg unten eine kleine Credit-Zeile hinzu. Die Fotohälfte funktioniert wie im Collage-Modus: mit weißem Rand ringsum oder randlos bis an die Kante."
collage_title: "Zwei Fotos auf einem Abzug"
collage_text: "Inspiriert von Halbformat-Filmkameras: Ein 10 × 15-Abzug fasst zwei Fotos im Format 10 × 7,5, so kostet ein Satz nur die Hälfte. Die Fotos werden der Reihe nach gepaart, Ziehen tauscht sie, und die App schlägt eine Größe mit weißem Rand vor, 6 × 9 cm für ein 2:3-Foto. Eine feine Schnittlinie teilt den Abzug in zwei, oder lass sie weg für einen Halbformat-Streifen."
show_collage: "Collage-Modus: Bögen, wie sie gedruckt werden, mit Seitenverhältnis, vorgeschlagener Größe und Schnittlinie"
collage_preview_title: "Sieh den Abzug, bevor er gedruckt wird"
collage_preview_text: "Öffne einen Bogen wie ein Foto: der Abzug groß, genau so, wie der Automat ihn macht, zwei Fotos nebeneinander mit Datumsstempel und Rand. Wähl eines der Fotos mit 1 oder 2, um es zuzuschneiden oder zu drehen, und blättere mit den Pfeiltasten durch die anderen Bögen."
show_collage_preview: "Vorschau eines Bogens: eine Straßenbahn bei Nacht und das Nationalmuseum in Prag auf einem 10 × 15-Abzug"
simple_title: "Simple: behalten oder verwerfen, dann drucken"
simple_text: "Ein Foto nach dem anderen, so wie es gedruckt wird. Eine Zifferntaste gibt ihm einen Look, nach oben behält es, nach unten verwirft es, und sofort kommt das nächste. Wähl Format und Datumsstempel, dann exportier, was du behalten hast."
show_simple: "Simple-Modus: das Foto, wie es gedruckt wird, Behalten und Verwerfen, und Export der behaltenen Fotos"
swipe_title: "↑ zum Drucken, ↓ zur Seite"
swipe_text: "Öffne das erste Foto und entscheide mit einer Taste: ↑ legt es in den Druckkorb, ↓ legt es beiseite, und das nächste Foto ist schon da. Nichts wird je gelöscht: Der Korb und der Stapel daneben warten in der Seitenleiste, falls du es dir anders überlegst."
select_title: "Oder hak sie in der Galerie ab"
select_text: "Auswählen macht aus dem Raster Kästchen zum Abhaken, wie auf dem iPhone, mit Umschalt-Klick für eine ganze Reihe. Halte die Leertaste über einem Foto, um es groß zu sehen, genau so, wie es gedruckt wird, dann lass los und mach weiter."
estimate_title: "Kenne die Größe vor dem Export"
estimate_text: "Die Exportkarte sagt dir, wie groß die Dateien werden, bevor etwas geschrieben wird, anhand einiger Fotos, die mit deinen Einstellungen kodiert werden. Kamerafotos für Facebook werden etwa sechsmal leichter, und du siehst es, bevor du klickst."
