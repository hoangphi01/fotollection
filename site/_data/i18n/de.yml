uses_items: [{"icon": "plane", "t": "Nach einer Reise", "d": "Vierhundert Fotos kommen mit nach Hause. Find best shots behält die schärfste jeder Serie, der Druckkorb sammelt die dreißig, die einen Abzug wert sind, und jedes kommt mit Datum und im Format des Ladens heraus."}, {"icon": "book-open", "t": "Ein Familienalbum", "d": "Abzüge für ein Album, das die Familie aufhebt, jeder mit Datum und Ort in der Ecke, wie Filmkameras sie druckten. Der Simple-Modus genügt."}, {"icon": "mail", "t": "Postkarten und Themenserien", "d": "Zwei Fotos auf einem Abzug, oder eine Postkarte mit deinen eigenen Worten neben dem Foto: die Altstadt, das Essen, die Straßenbahnen, jede Serie in einem eigenen Ordner-Tab."}, {"icon": "share-2", "t": "Geteilt, ohne Farbe zu verlieren", "d": "Dieselben Fotos, passend für Facebook und Instagram, behalten nach dem Hochladen ihre Farbe, statt flau zu werden."}]
compare_title: "Im Vergleich"
compare_lead: "Fotollection will keinen vollwertigen RAW-Editor ersetzen. Es ist für den Schritt gemacht, den diese dir überlassen: vom Ordner einer Reise zu Abzügen, die du in der Hand hältst."
compare_caption: "Fotollection neben Lightroom Classic, darktable und RawTherapee"
compare_cols: ["", "Fotollection", "Lightroom Classic", "darktable", "RawTherapee"]
compare_rows: [["Gemacht für", "Fotos einer Reise auswählen, datieren und für den Druck zuschneiden", "Ein kompletter Workflow: Katalog, Entwicklung, Druck und Teilen", "Ein Foto-Workflow und ein RAW-Entwickler", "RAW-Entwicklung"], ["RAW-Entwicklung", "Ja", "Ja", "Ja", "Ja"], ["Behalten oder weglegen, Foto für Foto", "Ja, Modus Einfach", "Ja, Markierungen", "Ja, Sterne", "Ja, Bewertungen"], ["Beste Aufnahme einer Serie", "Ja, die schärfste mit offenen Augen", "Ja, Assisted Culling", "Nein", "Nein"], ["Zuschnitt auf die Formate des Labors", "Ja, mit Schärfeprüfung", "Ja, Modul Drucken", "Ja, Druckansicht", "Nein"], ["Datum und Ort auf dem Foto", "Ja, im Filmstil", "Nein", "Ja, Wasserzeichen", "Nein"], ["Zwei Fotos auf einem Abzug", "Ja", "Ja", "Ja", "Nein"], ["Postkarten mit Adressseite", "Ja", "Nein", "Nein", "Nein"], ["Looks mit einem Klick", "Ja", "Ja, Vorgaben", "Ja, Stile", "Ja, Profile"], ["Lightroom-Presets", "Ja, importiert", "Ja", "Nein", "Nein"], ["LUTs", "Ja, .cube und HaldCLUT", "Als Profile", "Ja", "Ja, HaldCLUT"], ["Preis", "Kostenlos", "Ein Creative-Cloud-Abo", "Kostenlos", "Kostenlos"], ["Quellcode", "Offen, GPL-3.0", "Proprietär", "Offen, GPL-3.0 oder neuer", "Offen, GPL-3.0"], ["Systeme", "macOS, Windows, Linux", "macOS, Windows", "macOS (Apple Silicon), Windows, Linux", "macOS, Windows, Linux"], ["Konto", "Keins", "Ein Adobe-Konto", "Keins", "Keins"]]
compare_note: "Für mehr: darktable und RawTherapee für die tiefste RAW-Entwicklung, Lightroom für die Fotos eines ganzen Lebens in einem Katalog."
fn_lightroom: "Adobe, Lightroom und Lightroom Classic sind Marken von Adobe Inc. in den USA und anderen Ländern. Fotollection steht in keiner Verbindung zu Adobe und wird nicht von Adobe unterstützt; es folgt den Tasten und dem Aufbau, die Lightroom-Nutzer schon kennen. Das Lightroom-Logo stammt von Wikimedia Commons, wo es als Textlogo gemeinfrei ist."
fn_lut: "Eine LUT (Look-up-Table, Farbnachschlagetabelle) gibt jeder Farbe die Farbe, zu der sie wird; Fotollection liest .cube-Dateien und HaldCLUT-Bilder. LUMIX ist eine Marke der Panasonic Holdings Corporation; Fotollection steht in keiner Verbindung zu Panasonic und wird nicht von Panasonic unterstützt."
fn_compare: "Creative Cloud ist eine Marke von Adobe Inc.; darktable und RawTherapee sind freie Softwareprojekte ihrer eigenen Communitys. Die Angaben stammen von darktable.org und seinem Handbuch, rawtherapee.com, Adobes Hilfe zu Lightroom Classic und Wikipedias Zusammenfassung von Adobes Lizenzen und Anforderungen, geprüft am 14. November 2026. Fotollection steht mit keinem von ihnen in Verbindung."
fn_exif: "EXIF (Exchangeable Image File Format) ist der Standard, gepflegt von Japans JEITA und CIPA, für die Informationen, die eine Kamera in jedes Foto schreibt: Kamera und Objektiv, Datum und Uhrzeit, die Belichtung, oft die GPS-Position, und ein kleines eingebettetes Vorschaubild."
fn_units: "Einheiten: px ist ein Pixel, ein Punkt eines Bildes; MP (Megapixel) sind eine Million Pixel, ein 20-MP-Foto hat also etwa 5.472 × 3.648 px; ms ist eine Millisekunde, eine tausendstel Sekunde; MB und GB sind Megabyte und Gigabyte; RAM (Random-Access Memory) ist der Arbeitsspeicher des Computers."
fn_raw: "Eine RAW-Datei enthält, was der Sensor der Kamera aufgezeichnet hat, bevor die Kamera daraus ein Bild machte, so lassen sich Farbe, Helligkeit und Details noch später festlegen, ähnlich wie ein Negativ entwickelt wird. Jeder Hersteller hat sein eigenes Format (CR3 bei Canon, NEF bei Nikon, ARW bei Sony, RW2 bei Panasonic und andere); DNG (Digital Negative) ist das offene RAW-Format, veröffentlicht von Adobe."
fn_heic: "HEIF (High Efficiency Image File Format) ist das Bildformat nach ISO/IEC 23008-12; HEIC ist seine mit HEVC (H.265) komprimierte Variante, in der iPhones Fotos standardmäßig speichern. Ein HEIC-Foto ist etwa halb so groß wie ein JPEG ähnlicher Qualität."
fn_png: "PNG (Portable Network Graphics) ist ein verlustfreies Bildformat, veröffentlicht als ISO/IEC 15948: Jedes Pixel bleibt exakt erhalten, was zu Grafiken und Screenshots passt, während ein Foto mehrfach größer wird als als JPEG."
fn_dpi: "DPI (dots per inch) gibt an, wie viele Pixel des Fotos auf jeden Zoll (2,54 cm) des Abzugs fallen. Um 300 DPI wirkt in der Hand scharf; weniger sieht auf einem größeren Abzug, aus mehr Abstand betrachtet, noch gut aus."
fn_444: "4:4:4 und 4:2:0 beschreiben die Farbunterabtastung, also wie viel Farbdetail ein JPEG neben der Helligkeit behält. 4:4:4 behält die Farbe jedes Pixels; 4:2:0 behält eine Farbe für jeden Block aus vier Pixeln, was die Datei kleiner macht, aber feine Farbkanten wie roten Text oder einen scharfen Horizont weicher werden lässt."
fn_usb: "USB (Universal Serial Bus) ist der Standard des USB Implementers Forum zum Anschließen von Geräten. Eine SD-Karte ist eine Speicherkarte nach dem Secure-Digital-Standard der SD Association, wie sie die meisten Kameras nutzen."
fn_gps: "GPS (Global Positioning System) ist das Satellitennavigationssystem der Vereinigten Staaten. Smartphones und viele Kameras nutzen es, oft zusammen mit Galileo, GLONASS oder BeiDou, um festzuhalten, wo ein Foto aufgenommen wurde."
fn_iso: "ISO ist die Lichtempfindlichkeit der Kamera, definiert in der Norm ISO 12232: Jede Verdopplung, von ISO 100 auf 200, braucht nur halb so viel Licht, auf Kosten von mehr Rauschen."
fn_gpl: "GPL-3.0 ist Version 3 der GNU General Public License, veröffentlicht von der Free Software Foundation: Jeder darf das Programm nutzen, untersuchen, weitergeben und ändern, und wer es weitergibt, verändert oder nicht, gibt auch seinen Quellcode zu denselben Bedingungen weiter."
fn_vnlf: "VNLF (Vietnam Linux Family) ist eine vietnamesische Community für freie Software und Linux. Ihr App Explorer listet freie Anwendungen für vietnamesische Nutzer, und CaramOS ist ihre Linux-Distribution."
fn_led: "LED (Leuchtdiode): Filmkameras der 1980er- und 1990er-Jahre belichteten das Datum mit kleinen orangefarbenen LED-Ziffern auf den Film, der Look, den der Datumsstempel nachbildet."
fn_arch: "x86_64, auch amd64 genannt, ist die Prozessorarchitektur der meisten Windows- und Linux-PCs; ARM64, auch aarch64 oder arm64, die von Apple Silicon, vielen Laptops und kleinen Boards wie dem Raspberry Pi. Jede braucht ihre eigene Version."
fn_linux_pkg: "Ein .deb ist ein Debian-Paket, das Installationsformat von Debian, Ubuntu, Linux Mint und ihren Verwandten; APT (Advanced Package Tool) installiert und aktualisiert solche Pakete aus einem Repository. Ein AppImage ist eine einzelne Datei mit einer Anwendung und allem, was sie braucht, die auf den meisten Distributionen ohne Installation läuft."
fn_fuse: "FUSE (Filesystem in Userspace) lässt ein Programm ein Dateisystem bereitstellen, ohne den Kernel zu ändern. Ein AppImage nutzt es, um sich selbst zu öffnen, und Ubuntu 24.04 installiert dessen Version 2 nicht mehr standardmäßig."
fn_sha: "SHA-256 ist eine kryptografische Hashfunktion der SHA-2-Familie, standardisiert vom US-amerikanischen NIST in FIPS 180-4. Sie macht aus einer Datei einen Fingerabdruck aus 64 Zeichen; ändert sich ein einziges Bit der Datei, ändert sich der Fingerabdruck."
fn_jpeg: "JPEG ist das Bildformat der Joint Photographic Experts Group, standardisiert als ISO/IEC 10918-1 und ITU-T T.81."
fn_pf_raw: "Unter macOS entwickelt das System RAW-Formate außer DNG, mit seinen Objektivkorrekturen. Linux und Windows nutzen den in Fotollection eingebauten Reader, ohne sie; unter Windows ist Microsofts Raw Image Extension, falls installiert, nur ein letzter Ausweg."
fn_pf_heic_win: "Mit Microsofts kostenlosen HEIF Image Extensions und HEVC Video Extensions aus dem Microsoft Store."
fn_pf_heic_linux: "HEIC braucht einen HEVC-Decoder, den Linux nicht mitliefert und Fotollection wegen seiner Patente nicht beilegen wird. Eine spätere Version wird das libheif nutzen, das deine Distribution installiert. Bis dahin wandle HEIC-Fotos in JPEG um."
fn_pf_tether: "Zuerst die Sony a6400; weitere Kameras folgen."
fn_pf_openwith: "Mit dem .deb oder mit dem Installationsskript. Ein AppImage, das du einfach startest, ist beim Dateimanager nicht registriert, außer ein Werkzeug wie AppImageLauncher übernimmt das."
fn_pf_update: "Das AppImage lädt das neue AppImage; das .deb öffnet die Release-Seite, und mit dem APT-Repository bringt sudo apt upgrade die neue Version."
fn_glibc: "glibc, die GNU C Library, ist die Basisbibliothek, auf der jedes Linux-Programm läuft. Deine Version siehst du, wenn du ldd --version in ein Terminal tippst. Fotollection wird auf Ubuntu 22.04 gebaut, das glibc 2.35 hat, und braucht daher diese Version oder eine neuere."
fn_nvidia: "Mit NVIDIAs eigenem Treiber kann der DMA-BUF-Renderer von WebKitGTK das Fenster leer lassen. Ist dieser Treiber geladen, startet sich Fotollection einmal neu, mit diesem Renderer ausgeschaltet."
fn_dm: "dm und das dm-Logo sind Marken der dm-drogerie markt GmbH + Co. KG."
fn_rossmann: "ROSSMANN und das ROSSMANN-Logo sind Marken der Dirk Rossmann GmbH."
fn_cewe: "Die Fotoservices bei dm und Rossmann stammen von CEWE, einer Marke der CEWE Stiftung & Co. KGaA. Die Druckformate wurden im Oktober 2026 mit der Preisliste von dm abgeglichen; die Läden können sie ändern."
fn_photos: "Die Prager Fotos in den Screenshots (die Straßenbahnen, die Straßen, die Moldau) hat @hoangphi01 im November 2026 mit einer Lumix GX9 aufgenommen: © @hoangphi01, alle Rechte vorbehalten. Sie fallen nicht unter die Lizenz der App und dürfen nicht weiterverwendet werden. Die übrigen Demofotos sind gemeinfrei (CC0) auf Wikimedia Commons, von Dktue (7 Fotos), Pierre Blaché aus Paris, Frankreich (2) und Kate Branch (1). Die Katze in den Screenshots von Druckkorb und bester Aufnahme hat ebenfalls @hoangphi01 mit der GX9 fotografiert, alle Rechte vorbehalten; die weichere, verwackelte und dunklere Kopie daneben wurden aus diesem einen Foto gemacht, um zu zeigen, wie die beste Aufnahme gewählt wird."
fn_photos_link: "Jede Datei, ihre Seite und ihre Prüfsumme."
fn_rawsamples: "Die RAW-Messungen nutzen neun gemeinfreie Beispiele (CC0) von raw.pixls.us, eines pro Format; scripts/fetch-raw-samples.py lädt und prüft sie."
fn_rawformats: "Die auf dieser Website genannten RAW-Formate gehören den Kameraherstellern, die sie definieren: RW2 (Panasonic Holdings Corporation), CR2 und CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) und ORF (OM Digital Solutions Corporation, früher Olympus). DNG ist eine offene Spezifikation, veröffentlicht von Adobe Inc. Fotollection liest sie mit einem in Fotollection eingebauten Reader, unter macOS zuerst über die Codecs des Systems (unter Windows ist Microsofts Raw Image Extension, falls installiert, ein letzter Ausweg); es wird von keinem dieser Unternehmen hergestellt oder unterstützt."
fn_cameras: "Kameranamen und -logos in den Screenshots und im Info-Rahmen der App sind Marken ihrer Inhaber und werden nur verwendet, um zu zeigen, welche Kamera ein Foto aufgenommen hat: Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) und Sony (Sony Group Corporation)."
fn_others: "Apple und macOS sind Marken von Apple Inc.; Windows von Microsoft Corporation; Linux ist die eingetragene Marke von Linus Torvalds in den USA und anderen Ländern; Ubuntu von Canonical Ltd.; Debian von Software in the Public Interest, Inc.; Fedora, Red Hat, RHEL und CentOS von Red Hat, Inc.; openSUSE von SUSE LLC; Pop!_OS von System76, Inc.; Rocky Linux von der Rocky Enterprise Software Foundation; AlmaLinux von der AlmaLinux OS Foundation; ChromeOS von Google LLC; NVIDIA von NVIDIA Corporation; die Namen der anderen Linux-Distributionen gehören ihren Projekten; Facebook und Instagram von Meta Platforms, Inc.; GitHub von GitHub, Inc.; Google Analytics von Google LLC; Lightroom von Adobe Inc.; IrfanView von Irfan Škiljan; VietQR von NAPAS; Wikimedia Commons von der Wikimedia Foundation. Die Zeichen von Apple, Windows und Linux (Tux, zuerst gezeichnet von Larry Ewing) stammen von Simple Icons (CC0) und zeigen nur, um welches System es in einer Spalte oder einem Schritt geht."
fn_brand: "Name und Logo von Fotollection kennzeichnen die offizielle App von @hoangphi01. Offizielle Downloads gibt es nur auf fotollection.org und in den GitHub-Releases des Projekts. Die Lizenz GPL-3.0 erlaubt jedem, Kopien weiterzugeben oder zu verkaufen, verändert oder nicht, solange diese Lizenz bleibt und der Quellcode angeboten wird; eine veränderte oder weiterverkaufte Kopie darf Namen oder Logo von Fotollection nicht so verwenden, dass sie wie die offizielle App wirkt."
fn_notify: "Du möchtest Fotollection weitergeben, verkaufen oder darauf aufbauen? Sag dem Autor bitte vorher Bescheid, mit einem Issue auf GitHub (github.com/hoangphi01/fotollection/issues). Die App ist kostenlos und in der Freizeit entstanden; eine kurze Nachricht ist der faire Weg, Danke zu sagen."
fn_cite: "Du zitierst, testest oder zeigst die App, oder nutzt diese Screenshots? Bitte nenne Fotollection und verlinke fotollection.org."
fn_independent: "Fotollection ist ein unabhängiges Open-Source-Projekt. Es ist mit keinem dieser Unternehmen verbunden und wird von keinem gesponsert oder unterstützt, und jede andere Marke gehört ihrem Inhaber."
shield: "Privat – deine Fotos verlassen nie deinen Computer"
privacy_title: "Deine Fotos bleiben deine"
privacy_lead: "Fotollection ist gebaut, um ganz ohne Internet zu arbeiten. Nichts wird hochgeladen, nichts wird verfolgt, und du kannst jede Zeile davon prüfen."
p1_title: "Kein Upload, keine Cloud"
p1_text: "Fotos werden auf deiner eigenen Festplatte gelesen und geschrieben. Es gibt keinen Server, an den sie gehen könnten."
p2_title: "Kein Konto, kein Tracking"
p2_text: "Keine Registrierung, und die App hat weder Analytics noch Telemetrie. Ab v0.13.0 fragt sie beim Start einmal bei GitHub, ob es eine neuere Version gibt, was sich in den Einstellungen abschalten lässt."
p6_title: "Keine Werbung"
p6_text: "Nichts, was man dir verkaufen will, und niemand, der zahlt, um dich zu erreichen. Keine Anzeigen, keine gesponserten Vorschläge, keine In-App-Käufe, weder jetzt noch später."
p3_title: "Orte ohne Kartendienst"
p3_text: "Ortsnamen kommen aus einer Kartendatenbank, die in der App steckt, so erreicht dein GPS nie einen Dritten."
p4_title: "GPS beim Export entfernt"
p4_text: "Exportierte Abzüge verlieren standardmäßig ihren Standort, so verrät ein Foto, das du im Fotolabor abgibst, nicht, wo du wohnst."
p5_title: "Open Source"
p5_text: "Der Code ist öffentlich unter GPL-3.0. Jeder kann ihn lesen, bauen und bestätigen, dass er tut, was diese Seite sagt."
