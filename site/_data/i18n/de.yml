faq_title: "Fragen vor dem Download"
faq_lead: "Warum noch eine Foto-App, und was diese anders macht."
faq_groups:
  - label: "Warum Fotollection"
    items:
      - q: "Warum nicht einfach Lightroom?"
        a: "Lightroom, die eingebauten Fotos-Apps und IrfanView sind zum Bearbeiten und Ansehen gemacht; keine davon ist für den Fotodrucker gedacht. Um damit zu drucken, schneidest du jedes Foto selbst auf das Seitenverhältnis des Papiers zu, oder du gibst die Dateien ab und lässt Automat oder Personal im Laden zuschneiden, was oft einen Kopf oder den Rand eines Schilds kostet. Fotollection beginnt beim Abzug: Es kennt die Formate bei dm und Rossmann, schneidet jedes Foto darauf zu, sodass du genau siehst, was herauskommt, warnt, wenn ein Foto zu klein ist, druckt das Datum ein wie eine Filmkamera und exportiert Dateien, die der Automat annimmt. Es ist leicht und schnell, kostenlos und arbeitet neben Lightroom: Deine Originale bleiben unverändert, und deine Lightroom-Presets funktionieren darin als Looks."
      - q: "Mein Computer hat schon Fotos, oder ich nutze IrfanView. Wozu noch eine App?"
        a: "Die eingebauten Fotos-Apps und IrfanView sind tolle Betrachter, jeder auf seinem eigenen System. Keiner kennt das Format eines 10 × 15-Abzugs bei dm oder Rossmann, warnt dich, wenn ein Foto dafür zu klein ist, druckt das Datum ein wie eine Filmkamera oder schickt die besten Aufnahmen aus fünf Ordnern in einen Druckkorb. Fotollection schon, es sieht auf dem Mac, unter Windows und unter Linux gleich aus und funktioniert gleich, und es kann der Betrachter sein, mit dem du Fotos öffnest: Rechtsklick auf ein Foto, Öffnen mit, Fotollection, Kamera-RAW inklusive."
  - label: "Tempo und Größe"
    items:
      - q: "Ist es schwer? Läuft es auf meinem älteren Laptop?"
        a: "Es ist klein: Der Windows-Installer hat etwa 18 MB, weil das Fenster die Web-Ansicht nutzt, die das System schon hat, statt einen ganzen Browser mitzuliefern. Der Kern ist in Rust geschrieben und läuft direkt auf deinem Computer. Eine Vorschau ist nie größer als 1600 px, so öffnet sich selbst ein 32-MP-Foto so schnell wie ein kleines, und das Bild in voller Größe wird erst geladen, wenn du hineinzoomst. Selbst beim Export von 5.035 Fotos liegt der Speicher in der Spitze bei etwa 1,45 GB."
      - q: "Wie schnell ist es mit Tausenden Fotos?"
        a: "1.000 Fotos öffnen in etwa 0,12 s, weil Fotollection zuerst das kleine eingebaute Vorschaubild jeder Datei liest. Eine geänderte Einstellung zeichnet die Vorschau in 17 ms neu, der Export schafft 18 Fotos in voller Größe pro Sekunde, und nach dem ersten Start öffnet sich die App in etwa 0,4 s. Jede Zahl wurde auf einem gewöhnlichen Laptop gemessen, und die Seite Leistung erklärt, wie du sie selbst misst."
  - label: "Systeme und Kosten"
    items:
      - q: "Läuft es auf Mac, Windows und Linux, und ist es wirklich kostenlos?"
        a: "Ja. Ein Download für macOS 11 oder neuer, auf Apple Silicon wie auf Intel, einer für Windows 10 und 11, und für 64-Bit-Linux ein AppImage oder ein .deb, auf Intel/AMD oder ARM, für jede Distribution mit glibc 2.35 oder neuer. Linux bekommt die schlanke Version: noch keine HEIC-Fotos (iPhone), kein Fotografieren mit einer Kamera über USB, und RAW ohne die Objektivkorrekturen, die macOS hinzufügt; die Tabelle unter Funktionen zeigt jeden Unterschied. Es ist kostenlos, ohne Werbung, ohne Konto und ohne In-App-Käufe, und der Quellcode ist öffentlich unter GPL-3.0, sodass jeder prüfen kann, was es tut."
        fn: [fn_heic, fn_arch, fn_linux_pkg]
tabs_row_title: "Ordner als Tabs, Häkchen, die mitkommen"
tabs_text: "Klick auf einen Ordner, um nur an ihm zu arbeiten, oder auf den Workspace für alle Ordner auf einmal. Hak Fotos in einem Ordner ab, wechsle zum nächsten und hak weiter ab: Die Leiste zählt alle, so landen die besten aus jedem Ordner mit einem Griff im Druckkorb. Hak mehrere Ordner ab, um sie zusammen oder jeden in einen eigenen Ordner zu exportieren, und schließ einen Tab mit ×, wenn du fertig bist; die Fotos bleiben auf deiner Festplatte."
modes_title: "Drei Modi, drei Aufgaben"
modes_lead: "Wähl den, der zu deinem Vorhaben passt, oben in der Seitenleiste oder mit Cmd/Ctrl+1, 2 und 3. Deine Fotos, der Druckkorb und die Einstellungen bleiben in jedem Modus gleich."
