  - { v: "0,12 s", l: "um einen Ordner mit 1.000 Fotos zu lesen, achtmal unter dem Budget" }
  - { v: "17 ms", l: "um die Vorschau nach einer Änderung neu zu zeichnen" }
  - { v: "23,5", l: "Fotos mit 16 MP pro Sekunde exportiert" }
perf_memory_title: "Speicher: 5.035 Fotos, und er bleibt flach"
perf_memory_text: "Fotollection hält pro Foto nur wenige Bytes im Speicher, schreibt Vorschaubilder in einen Cache auf der Festplatte und bearbeitet nur so viele Bilder in voller Größe gleichzeitig, wie in sein Speicherbudget passen. So bleibt der Speicher flach, auch wenn eine Reise auf Tausende Fotos wächst."
