fn_back: "Zurück zum Text"
fn_open: "Kostenlos heißt: kein Preis, keine Werbung und keine In-App-Käufe; dem Autor einen Kaffee zu spendieren ist deine Wahl und hilft ihm, Fotollection weiter zu verbessern. Open Source heißt: Der vollständige Quellcode ist auf GitHub unter der Lizenz GPL-3.0 öffentlich, sodass jeder lesen, bauen und prüfen kann, was die App tut. Ohne Konto heißt: Die App fragt nie, wer du bist, und es gibt nichts, wo du dich anmelden musst."
