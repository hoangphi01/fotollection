perf_explain_title: "Die Begriffe hinter den Zahlen"
perf_explain_lead: "Foto- und Druckjargon, so erklärt, wie wir es einem Freund erklären würden."
perf_faq:
  - q: "Was ist ΔE (Delta E)?"
    fn: [fn_de]
    a: "ΔE misst, wie weit zwei Farben für ein menschliches Auge auseinanderliegen, berechnet in einem Farbraum, der unserem Sehen nachgebildet ist (CIELAB, mit der Formel von 2000). 0 heißt identisch. Um 1 liegt der kleinste Unterschied, den ein geschultes Auge im direkten Vergleich erkennt; 2 bis 3 sehen die meisten Menschen; über 5 wirken die Farben verschieden. Der Druckexport von Fotollection liegt im Mittel bei 0,19."
  - q: "Was ist SSIM?"
    fn: [fn_ssim]
    a: "SSIM, der Index der strukturellen Ähnlichkeit, vergleicht die Formen und Texturen zweier Bilder statt einzelner Pixel, was näher daran ist, wie wir Unschärfe oder blockige Kompression bemerken. 1 heißt identisch. Über etwa 0,98 können die meisten Menschen die beiden ohne Hineinzoomen nicht unterscheiden."
  - q: "Wie viele Farben fasst ein JPEG?"
    fn: [fn_jpeg, fn_heic]
    a: "Ein JPEG speichert 8 Bit für Rot, Grün und Blau: je 256 Stufen, etwa 16,7 Millionen Farben. Das ist auch das, wovon Fotolabore drucken. Kamera-RAW-Dateien fassen 12 bis 14 Bit, und neuere iPhones können 10-Bit-HEIC speichern, was beim Bearbeiten hilft; für einen fertigen Abzug zeigt ein gut gemachtes 8-Bit-JPEG keine Stufen zwischen den Tönen."
  - q: "JPG oder JPEG? Und sollte ich PNG nehmen?"
    a: "JPG und JPEG sind dasselbe Format: Das alte Windows erlaubte nur Endungen mit drei Buchstaben. PNG ist verlustfrei, es wird also nie etwas verworfen, aber ein als PNG gespeichertes Foto ist oft drei- bis fünfmal größer, und die meisten Automaten und Labore erwarten JPEG. Ein JPEG mit Qualität 90 oder mehr und voller Farbauflösung (4:4:4), wie Fotollection es für den Druck exportiert, ist auf Papier nicht vom Original zu unterscheiden."
  - q: "Was bedeuten 4:4:4 und 4:2:0?"
    a: "Unsere Augen sehen Details vor allem in der Helligkeit, weniger in der Farbe, deshalb kann JPEG die Farbe mit geringerer Auflösung speichern. 4:4:4 behält die volle Farbauflösung; 4:2:0 behält ein Viertel davon, was Dateien kleiner macht, aber farbige Kanten weicher werden lässt, etwa roten Text oder einen blauen Himmel hinter Blättern. Abzüge verdienen 4:4:4; soziale Medien komprimieren ohnehin alles neu in 4:2:0."
  - q: "sRGB, Display P3, Adobe RGB und Farbprofile"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "Ein Farbprofil sagt der Software, was die Zahlen in einer Datei bedeuten. sRGB ist der klassische Farbumfang des Webs. Display P3, genutzt von iPhones und neueren Kameras, erreicht etwa 25 % mehr Farben, besonders Rot- und Grüntöne. Verliert ein P3-Foto sein Profil, werden seine Zahlen als sRGB gelesen, und es wirkt ausgewaschen: Das ist der Sättigungsverlust von 13 %, den wir gemessen haben. Adobe RGB, das manche Kameras für die Druckarbeit anbieten, ist ebenfalls größer als sRGB, vor allem bei Grün- und Cyantönen. Fotollection behält für Abzüge das Profil, das ein Foto hat, und wandelt für soziale Medien sauber in sRGB um."
  - q: "Welche DPI braucht ein Abzug?"
    a: "DPI gibt an, wie viele Pixel auf jeden Zoll Papier fallen. Bei 300 DPI wirkt ein Abzug selbst aus der Nähe scharf; 150 bis 200 DPI genügen auf Armlänge. Ein 10 × 15-cm-Abzug mit 300 DPI braucht 1.800 × 1.200 Pixel, also reicht jedes Foto von Smartphone oder Kamera; die Größenempfehlung in der App sagt dir, wie groß jedes Foto werden kann."
  - q: "Warum sehen Fotos auf Facebook schlechter aus?"
    a: "Facebook verkleinert jedes Foto auf höchstens 2.048 px, komprimiert es mit geringerer Qualität und halbierter Farbauflösung neu und verwirft Farbprofile. Ein Foto, das zu groß ankommt, wird zweimal verkleinert, einmal von dir und einmal von Facebook. Schickst du es schon mit 2.048 px, in sRGB und leicht geschärft, komprimiert Facebook es nur einmal neu, und die Farben stimmen bereits."
