dl_warn_title: "Aktualisiere auf v0.14.0 oder neuer."
dl_warn_text: "Ältere Versionen konnten die Bearbeitungen eines Ordners auf einem Laufwerk verlieren, das beim Start nicht angeschlossen war, und ein einzelner Fehler konnte die ganze App schließen. v0.14.0 behebt beides; deine Einstellungen und Projekte bleiben erhalten."
install_title: "In einer Minute installiert"
install_lead: "Die Installer sind noch nicht mit einem kostenpflichtigen Zertifikat signiert, daher braucht der erste Start einen Klick mehr."
mac_title: "macOS"
mac_1: "Öffne die .dmg und zieh Fotollection in „Programme“."
mac_2: "Öffne es. macOS blockiert den ersten Start."
mac_3: "Klick in Systemeinstellungen → Datenschutz & Sicherheit auf „Trotzdem öffnen“."
win_title: "Windows"
win_1: "Starte die -setup.exe (oder die .msi)."
win_2: "Meldet SmartScreen „Der Computer wurde durch Windows geschützt“, klick auf „Weitere Informationen“."
win_3: "Klick auf „Trotzdem ausführen“."
