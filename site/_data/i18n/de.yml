perf_speed_title: "Tempo: tausend Fotos im Handumdrehen"
perf_speed_text: "Beim Öffnen eines Ordners werden die EXIF-Daten jedes Fotos und sein kleines eingebettetes Vorschaubild gelesen, nicht das ganze Bild, und eine geänderte Einstellung zeichnet nur die Vorschau neu. Natives Rust schlägt auch einen Webbrowser bei derselben Aufgabe: dasselbe Exporttempo, eine schnellere Vorschau und ein Viertel weniger Speicher."
