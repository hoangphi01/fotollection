chart_open: "Ein Foto öffnen: v0.9.0 und v0.10.0 gegen v0.11.0, mit den 422 Fotos einer Reise"
perf_open_title: "Bis zu 20× schneller. Eine neue Art, den Speicher zu nutzen."
perf_open_text: "v0.11.0 denkt neu, wie Fotollection deine Fotos bereithält. Die Vorschau jedes Fotos wird im Hintergrund vorbereitet, sobald sein Vorschaubild fertig ist, und auf der Festplatte abgelegt, ein Viertel des Speichers deines Computers hält die Fotos rund um das, das du siehst, und das Foto auf dem Bildschirm kommt immer zuerst. Das Ergebnis: Jedes Foto, nah oder fern, JPEG oder RAW, öffnet sich in 27 Millisekunden. Ein RAW öffnet sich bis zu 20-mal schneller als in v0.9.0, ein JPEG 10-mal schneller, gemessen an denselben 422 Fotos einer Reise."
