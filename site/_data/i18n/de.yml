perf_trip_title: "Eine echte Reise: 422 Dateien aus Prag"
perf_trip_text: "Testsätze können schmeicheln, darum hier ein Ordner genau so, wie er nach einem Wochenende in Prag von einer Lumix GX9 kam: 396 JPEGs mit 20 MP, je etwa 11 MB, und 26 RAW-Dateien daneben, insgesamt 4,7 GB. Beim Öffnen werden die EXIF-Daten jeder Datei in 0,23 Sekunden gelesen. Die Vorschau wird in 19 ms neu berechnet, ein RAW in 0,35 Sekunden entwickelt, und zehn Postkarten werden in 21 ms neu gezeichnet. Am 2026-11-03 verfehlten zwei Werte bei diesen großen Dateien ihr Budget: Der Export schaffte 7,6 Fotos pro Sekunde, und der Speicher lag in der Spitze bei 2,14 GB. Die Ursache wurde gefunden und in v0.9.7 behoben: Die JPEGs werden jetzt mit 10,1 pro Sekunde exportiert, und der ganze Lauf bleibt unter 1,31 GB."
trip_stats:
  - { v: "0,23 s", l: "um alle 422 Dateien zu öffnen, samt EXIF" }
  - { v: "19 ms", l: "Neuberechnung der Vorschau, p95 (Budget 50 ms)" }
  - { v: "0,35 s", l: "um ein 20-MP-RAW zu entwickeln (Median)" }
  - { v: "21 ms", l: "um zehn Postkarten neu zu zeichnen (Budget 100 ms)" }
  - { v: "10,1 / s", l: "exportierte JPEGs (Budget 8 / s)" }
  - { v: "1,31 GB", l: "Spitzenspeicher, JPEG und RAW (Obergrenze 2 GB)" }
fn_trip: "Der Prager Ordner gehört dem Autor und ist nicht veröffentlicht (© @hoangphi01, alle Rechte vorbehalten). Mediane aus 3 Läufen von bench/trip.sh und von measure_folder auf seinen JPEGs, auf einem Apple M3 mit 16 GB, mit anderen geöffneten Apps, am 2026-11-04, mit dem Export von v0.9.7; führ sie zum Vergleich auf einem eigenen Ordner aus."
fn_simd: "SIMD (single instruction, multiple data) lässt einen Prozessor an vielen Werten zugleich arbeiten: Ein Befehl wirkt auf mehrere Zahlen, die nebeneinander in einem breiten Vektorregister liegen, etwa das Rot, Grün und Blau vieler Pixel. Prozessoren von Intel und AMD bieten es als SSE und AVX; Apple Silicon und andere Arm-Prozessoren als NEON. Intel, AMD und Arm sind Marken ihrer Inhaber."
fn_pct: "p50 und p95 sind Perzentile: p50, der Median, ist die Zeit, unter der die Hälfte der Läufe blieb; p95 ist die Zeit, unter der 95 von 100 Läufen blieben, so zeigt sie die langsamen Fälle, die ein Durchschnitt verdeckt."
fn_psnr: "PSNR (peak signal-to-noise ratio, Spitzen-Signal-Rausch-Verhältnis) vergleicht zwei Bilder Pixel für Pixel und gibt ihren Unterschied in Dezibel an: je höher, desto näher. Über etwa 40 dB ist der Unterschied kaum zu sehen."
fn_sensor: "CMOS und CCD sind die beiden Arten von Bildsensoren, ein Raster lichtempfindlicher Zellen, das Licht in elektrische Ladung umwandelt. Fast jede Kamera und jedes Smartphone nutzt heute CMOS (complementary metal-oxide-semiconductor); CCD (charge-coupled device) war in früheren Kameras verbreitet."
fn_tiff: "TIFF (Tagged Image File Format) ist ein flexibles Bildformat, das heute Adobe pflegt; viele RAW-Formate, darunter DNG, bauen auf seiner Struktur auf."
fn_gpg: "GPG (GNU Privacy Guard) ist eine freie Umsetzung des OpenPGP-Standards. Das APT-Repository ist mit einem GPG-Schlüssel signiert, so kann dein System prüfen, dass jedes Paket unverändert von dort kommt."
fn_rust: "Rust und das Rust-Logo sind Marken der Rust Foundation. Der Kern von Fotollection ist in Rust geschrieben und läuft direkt auf deinem Computer."
fn_webview: "Das Fenster der App ist mit Tauri gebaut und wird von der Web-Ansicht des Systems gezeichnet: WebKit (WKWebView) unter macOS, Microsoft Edge WebView2 unter Windows und WebKitGTK, die GTK-Portierung von WebKit, unter Linux. Tauri ist ein Projekt des Tauri Programme innerhalb der Commons Conservancy; WebKit ist eine Marke von Apple Inc.; GTK ist ein Projekt der GNOME Foundation; Microsoft Edge und WebView2 sind Marken der Microsoft Corporation. Der Browservergleich lief mit derselben Aufgabe in Headless Chromium 156, dem Open-Source-Projekt hinter Google Chrome, mit einem Web Worker pro Prozessorkern."
fn_de: "ΔE2000 (CIEDE2000) ist die Farbabstandsformel der Internationalen Beleuchtungskommission (CIE), genormt als ISO/CIE 11664-6; der CIELAB-Farbraum, in dem sie arbeitet, ist ISO/CIE 11664-4."
fn_ssim: "SSIM wurde von Zhou Wang, Alan C. Bovik, Hamid R. Sheikh und Eero P. Simoncelli eingeführt in Image quality assessment: from error visibility to structural similarity, IEEE Transactions on Image Processing, 13(4), 2004."
fn_srgb: "sRGB wurde 1996 von HP und Microsoft geschaffen und als IEC 61966-2-1 genormt."
fn_p3: "Display P3 ist ein von Apple Inc. definierter Farbraum, der auf dem Farbraum DCI-P3 der Kinoindustrie (SMPTE) beruht."
fn_adobe: "Adobe RGB (1998) ist ein von Adobe Inc. spezifizierter Farbraum; Adobe ist eine eingetragene Marke von Adobe Inc."
fn_charts: "Für jedes Diagramm gilt: Die Werte dienen zur Orientierung, gemessen auf einem gewöhnlichen Laptop (Apple M3, 16 GB); deine hängen von deinem Computer ab."
fn_dng: "Adobe DNG Converter wurde für diese Seite nicht ausgeführt. Der Wert ist eine Schätzung Dritter (1.000 CR3-Dateien in 20–30 Minuten auf moderner Hardware, Rechner nicht angegeben), aus dem Blogbeitrag von convertintomp4.com zur Stapelumwandlung von RAW in DNG. Adobe ist eine eingetragene Marke von Adobe Inc."
