linux_script_title: "Ein Befehl"
linux_script_text: "Wählt das passende Paket für dein System: Ubuntu, Debian und Mint bekommen das APT-Repository, andere Distributionen das AppImage in ~/.local. Zum Entfernen:"
linux_apt_title: "Oder füg das APT-Repository hinzu"
linux_apt_text: "Für Ubuntu, Debian, Mint und den Rest dieser Familie. Updates kommen dann mit"
linux_appimage_title: "Oder starte das AppImage"
linux_appimage_text: "Lad es herunter, mach es ausführbar und starte es. Auf ARM endet die Datei auf _aarch64."
