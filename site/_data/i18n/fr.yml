perf_speed_text: "Ouvrir un dossier lit l’EXIF de chaque photo et sa petite vignette intégrée, pas l’image entière, et un réglage modifié ne redessine que l’aperçu. Le Rust natif bat aussi un navigateur web qui fait la même tâche : la même vitesse d’export, un aperçu plus rapide et un quart de mémoire en moins."
