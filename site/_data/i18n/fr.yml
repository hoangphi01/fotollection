perf_faq:
  - q: "Qu’est-ce que le ΔE (Delta E) ?"
    fn: [fn_de]
    a: "Le ΔE mesure à quel point deux couleurs semblent éloignées pour l’œil humain, calculé dans un espace colorimétrique construit pour correspondre à notre vision (CIELAB, avec la formule de 2000). 0 veut dire identique. Autour de 1, c’est la plus petite différence qu’un œil exercé repère côte à côte ; de 2 à 3, elle est visible pour la plupart des gens ; au-dessus de 5, les couleurs semblent différentes. L’export pour le tirage de Fotollection est en moyenne à 0,19."
  - q: "Qu’est-ce que le SSIM ?"
    fn: [fn_ssim]
    a: "Le SSIM, l’indice de similarité structurelle, compare les formes et les textures de deux images plutôt que des pixels isolés, ce qui est plus proche de la façon dont on remarque le flou ou une compression en blocs. 1 veut dire identique. Au-dessus d’environ 0,98, la plupart des gens ne distinguent pas les deux sans zoomer."
  - q: "Combien de couleurs un JPEG peut-il contenir ?"
    fn: [fn_jpeg, fn_heic]
    a: "Un JPEG stocke 8 bits pour chacun du rouge, du vert et du bleu : 256 niveaux chacun, environ 16,7 millions de couleurs. C’est aussi ce à partir de quoi impriment les labos photo. Les fichiers RAW des appareils contiennent 12 à 14 bits et les iPhone récents peuvent enregistrer du HEIC 10 bits, ce qui aide à la retouche ; pour un tirage fini, un JPEG 8 bits bien fait ne montre aucune marche entre les tons."
  - q: "JPG ou JPEG ? Et faut-il utiliser le PNG ?"
    a: "JPG et JPEG sont le même format : l’ancien Windows n’autorisait que des extensions de trois lettres. Le PNG est sans perte, donc rien n’est jamais jeté, mais une photo enregistrée en PNG est souvent trois à cinq fois plus lourde, et la plupart des bornes et des labos attendent du JPEG. Un JPEG en qualité 90 ou plus avec la pleine résolution des couleurs (4:4:4), comme Fotollection l’exporte pour le tirage, ne se distingue pas de l’original sur papier."
  - q: "Que veulent dire 4:4:4 et 4:2:0 ?"
    a: "Nos yeux voient le détail surtout dans la luminosité, moins dans la couleur, donc le JPEG peut stocker la couleur à une résolution plus basse. Le 4:4:4 garde la pleine résolution des couleurs ; le 4:2:0 en garde un quart, ce qui allège les fichiers mais adoucit les bords colorés, comme un texte rouge ou un ciel bleu derrière des feuilles. Les tirages méritent le 4:4:4 ; les réseaux sociaux recompressent tout en 4:2:0 de toute façon."
  - q: "sRGB, Display P3, Adobe RGB et profils de couleur"
    fn: [fn_srgb, fn_p3, fn_adobe]
    a: "Un profil de couleur dit au logiciel ce que signifient les nombres d’un fichier. Le sRGB est la gamme de couleurs classique du web. Le Display P3, utilisé par les iPhone et les appareils récents, atteint environ 25 % de couleurs en plus, surtout dans les rouges et les verts. Si une photo P3 perd son profil, ses nombres sont lus comme du sRGB et elle paraît délavée : c’est la perte de saturation de 13 % que nous avons mesurée. L’Adobe RGB, que certains appareils proposent pour le tirage, est aussi plus large que le sRGB, surtout dans les verts et les cyans. Fotollection garde le profil qu’a une photo pour les tirages et convertit correctement en sRGB pour les réseaux sociaux."
  - q: "Quel DPI faut-il pour un tirage ?"
    a: "Le DPI, c’est le nombre de pixels qui tombent sur chaque pouce de papier. À 300 DPI, un tirage paraît net même de près ; de 150 à 200 DPI suffit à bout de bras. Un tirage 10 × 15 cm à 300 DPI demande 1 800 × 1 200 pixels, donc n’importe quelle photo de téléphone ou d’appareil suffit ; le conseil de taille dans l’application vous dit jusqu’où chaque photo peut aller."
  - q: "Pourquoi les photos paraissent-elles moins belles sur Facebook ?"
    a: "Facebook redimensionne chaque photo à 2 048 px au plus, la recompresse en qualité inférieure avec la résolution des couleurs divisée par deux, et jette les profils de couleur. Une photo qui arrive trop grande est redimensionnée deux fois, une fois par vous et une fois par Facebook. L’envoyer déjà en 2 048 px, en sRGB et légèrement accentuée, signifie que Facebook ne la recompresse qu’une fois, et les couleurs sont déjà justes."
