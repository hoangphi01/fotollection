perf_print_title: "Qualité de tirage : le tirage ressemble à la photo"
perf_print_text: "Les tirages faits via un éditeur web semblent souvent ternes : il jette le profil de couleur, réduit la photo à 2 000 px et l’enregistre en qualité 80 avec la couleur divisée par deux. Fotollection garde le profil et exporte en pleine résolution en 4:4:4."
