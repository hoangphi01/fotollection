compare_note: "Pour aller plus loin : darktable et RawTherapee pour le développement RAW le plus poussé, Lightroom pour une vie de photos dans un seul catalogue."
fn_lightroom: "Adobe, Lightroom et Lightroom Classic sont des marques d’Adobe Inc. aux États-Unis et dans d’autres pays. Fotollection n’a aucun lien avec Adobe et n’est pas approuvé par Adobe ; il reprend les raccourcis et la disposition que connaissent déjà les utilisateurs de Lightroom. Le logo Lightroom provient de Wikimedia Commons, où il est dans le domaine public en tant que logo textuel."
fn_lut: "Une LUT (table de correspondance) donne à chaque couleur la couleur qu’elle devient ; Fotollection lit les fichiers .cube et les images HaldCLUT. LUMIX est une marque de Panasonic Holdings Corporation ; Fotollection n’a aucun lien avec Panasonic et n’est pas approuvé par Panasonic."
fn_compare: "Creative Cloud est une marque d’Adobe Inc. ; darktable et RawTherapee sont des projets de logiciel libre de leurs propres communautés. Les faits viennent de darktable.org et de son manuel, de rawtherapee.com, de l’aide de Lightroom Classic d’Adobe et du résumé de Wikipédia sur les licences et la configuration requise d’Adobe, vérifiés le 14 novembre 2026. Fotollection n’a aucun lien avec aucun d’eux."
fn_privacy_site: "Ceci concerne l’application. Le site compte les visites de façon anonyme avec Google Analytics, par pays et par page, sans jamais les lier à une personne."
fn_simd: "Le SIMD (single instruction, multiple data) permet à un processeur de traiter plusieurs valeurs à la fois : une instruction agit sur plusieurs nombres placés côte à côte dans un large registre vectoriel, comme le rouge, le vert et le bleu de nombreux pixels. Les processeurs Intel et AMD le proposent sous le nom de SSE et AVX ; Apple silicon et les autres processeurs Arm sous celui de NEON. Intel, AMD et Arm sont des marques de leurs propriétaires."
fn_exif: "L’EXIF (Exchangeable Image File Format) est la norme, tenue par la JEITA et la CIPA japonaises, des informations qu’un appareil écrit dans chaque photo : l’appareil et l’objectif, la date et l’heure, l’exposition, souvent la position GPS, et une petite vignette intégrée."
fn_units: "Unités : px est un pixel, un point d’une image ; MP (mégapixel) est un million de pixels, donc une photo de 20 MP fait environ 5 472 × 3 648 px ; ms est une milliseconde, un millième de seconde ; Mo et Go sont des mégaoctets et des gigaoctets ; la RAM (mémoire vive) est la mémoire de travail de l’ordinateur."
fn_raw: "Un fichier RAW contient ce que le capteur de l’appareil a enregistré avant que l’appareil n’en fasse une image, donc la couleur, la luminosité et le détail peuvent encore être décidés plus tard, un peu comme on développe un négatif. Chaque fabricant a son format (CR3 pour Canon, NEF pour Nikon, ARW pour Sony, RW2 pour Panasonic et d’autres) ; le DNG (Digital Negative) est le format RAW ouvert publié par Adobe."
fn_heic: "Le HEIF (High Efficiency Image File Format) est le format d’image de la norme ISO/IEC 23008-12 ; le HEIC en est la variante compressée en HEVC (H.265), dans laquelle les iPhone enregistrent leurs photos par défaut. Une photo HEIC fait environ la moitié d’un JPEG de qualité semblable."
fn_png: "Le PNG (Portable Network Graphics) est un format d’image sans perte, publié comme ISO/IEC 15948 : chaque pixel est conservé exactement, ce qui convient aux graphiques et aux captures d’écran, alors qu’une photo y est plusieurs fois plus lourde qu’en JPEG."
fn_pct: "p50 et p95 sont des centiles : p50, la médiane, est le temps sous lequel est restée la moitié des passages ; p95 est le temps sous lequel sont restés 95 passages sur 100, il montre donc les cas lents qu’une moyenne cache."
fn_psnr: "Le PSNR (peak signal-to-noise ratio) compare deux images pixel par pixel et donne leur différence en décibels : plus il est haut, plus elles sont proches. Au-dessus d’environ 40 dB, la différence est difficile à voir."
fn_sensor: "CMOS et CCD sont les deux types de capteur d’image, une grille de cellules sensibles à la lumière qui transforme la lumière en charge électrique. Presque tous les appareils photo et téléphones utilisent aujourd’hui le CMOS (complementary metal-oxide-semiconductor) ; le CCD (charge-coupled device) était courant dans les appareils plus anciens."
fn_tiff: "Le TIFF (Tagged Image File Format) est un format d’image souple, aujourd’hui tenu par Adobe ; de nombreux formats RAW, dont le DNG, reposent sur sa structure."
fn_arch: "x86_64, aussi appelé amd64, est l’architecture de processeur de la plupart des PC Windows et Linux ; ARM64, aussi aarch64 ou arm64, celle d’Apple silicon, de nombreux portables et de petites cartes comme le Raspberry Pi. Chacune a besoin de sa propre version."
fn_linux_pkg: "Un .deb est un paquet Debian, le format d’installation de Debian, Ubuntu, Linux Mint et de leurs proches ; APT (Advanced Package Tool) installe et met à jour ces paquets depuis un dépôt. Une AppImage est un fichier unique qui contient une application et ce dont elle a besoin, et qui fonctionne sur la plupart des distributions sans installation."
fn_fuse: "FUSE (Filesystem in Userspace) permet à un programme de fournir un système de fichiers sans modifier le noyau. Une AppImage s’en sert pour s’ouvrir, et Ubuntu 24.04 n’installe plus sa version 2 par défaut."
fn_sha: "SHA-256 est une fonction de hachage cryptographique de la famille SHA-2, normalisée par le NIST américain dans la FIPS 180-4. Elle transforme un fichier en une empreinte de 64 caractères ; changez un seul bit du fichier et l’empreinte change."
fn_gpg: "GPG (GNU Privacy Guard) est une implémentation libre de la norme OpenPGP. Le dépôt APT est signé avec une clé GPG, donc votre système peut vérifier que chaque paquet en vient sans modification."
fn_rust: "Rust et le logo Rust sont des marques de la Rust Foundation. Le cœur de Fotollection est écrit en Rust et tourne directement sur votre ordinateur."
fn_webview: "La fenêtre de l’application est construite avec Tauri et dessinée par la vue web du système : WebKit (WKWebView) sous macOS, Microsoft Edge WebView2 sous Windows et WebKitGTK, le portage GTK de WebKit, sous Linux. Tauri est un projet du Tauri Programme au sein de la Commons Conservancy ; WebKit est une marque d’Apple Inc. ; GTK est un projet de la GNOME Foundation ; Microsoft Edge et WebView2 sont des marques de Microsoft Corporation. La comparaison avec le navigateur a exécuté la même tâche dans Chromium 156 sans interface, le projet open source derrière Google Chrome, avec un Web Worker par cœur de processeur."
fn_de: "ΔE2000 (CIEDE2000) est la formule d’écart de couleur de la Commission internationale de l’éclairage (CIE), normalisée comme ISO/CIE 11664-6 ; l’espace colorimétrique CIELAB dans lequel elle travaille est l’ISO/CIE 11664-4."
fn_ssim: "Le SSIM a été présenté par Zhou Wang, Alan C. Bovik, Hamid R. Sheikh et Eero P. Simoncelli dans Image quality assessment: from error visibility to structural similarity, IEEE Transactions on Image Processing, 13(4), 2004."
fn_jpeg: "Le JPEG est le format d’image du Joint Photographic Experts Group, normalisé comme ISO/IEC 10918-1 et UIT-T T.81."
fn_srgb: "Le sRGB a été créé par HP et Microsoft en 1996 et normalisé comme CEI 61966-2-1."
fn_p3: "Display P3 est un espace colorimétrique défini par Apple Inc., fondé sur l’espace DCI-P3 de l’industrie du cinéma (SMPTE)."
fn_adobe: "Adobe RGB (1998) est un espace colorimétrique spécifié par Adobe Inc. ; Adobe est une marque déposée d’Adobe Inc."
fn_charts: "Pour chaque graphique : les chiffres sont donnés à titre indicatif, mesurés sur un portable ordinaire (Apple M3, 16 Go) ; les vôtres dépendent de l’ordinateur que vous utilisez."
fn_dng: "Adobe DNG Converter n’a pas été lancé pour cette page. Le chiffre est une estimation d’un tiers (1 000 fichiers CR3 en 20 à 30 minutes sur du matériel récent, machine non précisée), tirée de l’article de blog de convertintomp4.com sur la conversion RAW vers DNG par lots. Adobe est une marque déposée d’Adobe Inc."
fn_pf_raw: "Sous macOS, les formats RAW autres que le DNG sont développés par le système, avec ses corrections d’objectif. Linux et Windows utilisent le lecteur intégré à Fotollection, sans elles ; sous Windows, la Raw Image Extension de Microsoft, si elle est installée, n’est qu’un dernier recours."
fn_pf_heic_win: "Avec les extensions gratuites HEIF Image Extensions et HEVC Video Extensions de Microsoft, depuis le Microsoft Store."
fn_pf_heic_linux: "Le HEIC demande un décodeur HEVC, que Linux ne fournit pas et que Fotollection n’embarquera pas, à cause de ses brevets. Une version ultérieure utilisera la libheif qu’installe votre distribution. D’ici là, convertissez les photos HEIC en JPEG."
fn_pf_tether: "Le Sony a6400 d’abord ; d’autres appareils suivront."
fn_pf_openwith: "Avec le .deb, ou avec le script d’installation. Une AppImage lancée seule n’est pas déclarée au gestionnaire de fichiers, sauf si un outil comme AppImageLauncher s’en charge."
fn_pf_update: "L’AppImage télécharge la nouvelle AppImage ; le .deb ouvre la page de la version, et avec le dépôt APT, sudo apt upgrade apporte la nouvelle version."
fn_glibc: "La glibc, la bibliothèque C de GNU, est la bibliothèque de base sur laquelle tourne tout programme Linux. Pour voir la vôtre, tapez ldd --version dans un terminal. Fotollection est compilé sur Ubuntu 22.04, qui a la glibc 2.35, il lui faut donc cette version ou une plus récente."
fn_nvidia: "Avec le pilote propriétaire de NVIDIA, le moteur de rendu DMA-BUF de WebKitGTK peut laisser la fenêtre vide. Quand ce pilote est chargé, Fotollection redémarre une fois tout seul avec ce moteur de rendu désactivé."
fn_dm: "dm et le logo dm sont des marques de dm-drogerie markt GmbH + Co. KG."
fn_rossmann: "ROSSMANN et le logo ROSSMANN sont des marques de Dirk Rossmann GmbH."
fn_cewe: "Les services photo de dm et Rossmann sont assurés par CEWE, une marque de CEWE Stiftung & Co. KGaA. Les formats d’impression ont été vérifiés sur la liste de prix de dm en octobre 2026 ; les magasins peuvent les changer."
fn_seven: "7-Eleven et le logo 7-Eleven sont des marques de 7-Eleven, Inc."
fn_lawson: "LAWSON et le logo LAWSON sont des marques de Lawson, Inc."
fn_familymart: "FamilyMart et le logo FamilyMart sont des marques de FamilyMart Co., Ltd."
fn_konbini: "Les tirages photo des supérettes japonaises sont en L (89 × 127 mm), 2L (127 × 178 mm) et carré (89 × 89 mm), d’après les pages des enseignes en novembre 2026 ; les 9 × 13, 13 × 18 et 10 × 10 de Fotollection gardent leur forme dans la marge que rogne la borne. Les enseignes peuvent changer leurs formats."
fn_cu: "CU et le logo CU sont des marques de BGF Retail Co., Ltd."
fn_gs25: "GS25 et le logo GS25 sont des marques de GS Retail Co., Ltd."
fn_printingbox: "Dans les supérettes coréennes, les photos se tirent aux bornes Printing Box (printingbox.kr, environ 1 300, chez CU, GS25 et emart24), en 4 × 6 pouces, soit 10 × 15 cm, un format intégré à Fotollection ; vérifié en novembre 2026, les bornes peuvent le changer."
fn_leclerc: "E.Leclerc et le logo E.Leclerc sont des marques de l’Association des Centres Distributeurs E.Leclerc."
fn_intermarche: "Intermarché et le logo Intermarché sont des marques d’ITM Entreprises (Groupement Les Mousquetaires)."
fn_fnac: "Fnac et le logo Fnac sont des marques de Fnac Darty SA."
fn_kiosk_fr: "En France, les photos se tirent aux bornes CEWE (environ 3 500, chez E.Leclerc, Intermarché, U, Cora et à la Fnac), aux bornes Kodak de Carrefour et à celles de la Fnac ; la page de chaque enseigne met en avant le 10 × 15, un format qu’a Fotollection, comme le 13 × 18, le 15 × 20, le 20 × 30 et les carrés. Vérifié sur les pages des enseignes en novembre 2026 ; les magasins peuvent changer leurs formats."
fn_photos: "Les photos de Prague des captures d’écran (les tramways, les rues, la Vltava) ont été prises par @hoangphi01 avec un Lumix GX9 en novembre 2026 : © @hoangphi01, tous droits réservés. Elles ne sont pas couvertes par la licence de l’application et ne peuvent pas être réutilisées. Les autres photos de démonstration sont dans le domaine public (CC0) sur Wikimedia Commons, par Dktue (7 photos), Pierre Blaché de Paris, France (2) et Kate Branch (1). Le chat des captures du panier d’impression et de la meilleure photo a aussi été photographié par @hoangphi01 avec le GX9, tous droits réservés ; les copies plus floues, bougées et plus sombres à côté ont été faites à partir de cette seule photo, pour montrer comment la meilleure photo est choisie."
fn_photos_link: "Chaque fichier, sa page et sa somme de contrôle."
fn_rawsamples: "Les mesures RAW utilisent neuf échantillons du domaine public (CC0) de raw.pixls.us, un par format ; scripts/fetch-raw-samples.py les télécharge et les vérifie."
fn_rawformats: "Les formats RAW cités sur ce site appartiennent aux fabricants d’appareils qui les définissent : RW2 (Panasonic Holdings Corporation), CR2 et CR3 (Canon Inc.), NEF (Nikon Corporation), ARW (Sony Group Corporation), RAF (FUJIFILM Corporation) et ORF (OM Digital Solutions Corporation, anciennement Olympus). Le DNG est une spécification ouverte publiée par Adobe Inc. Fotollection les lit avec un lecteur intégré à Fotollection, et sous macOS d’abord avec les codecs du système (sous Windows, la Raw Image Extension de Microsoft est un dernier recours si elle est installée) ; il n’est fait ni approuvé par aucune de ces entreprises."
fn_cameras: "Les noms et logos d’appareils des captures d’écran et du cadre d’infos de l’application sont des marques de leurs propriétaires, utilisées uniquement pour montrer quel appareil a pris une photo : Apple (Apple Inc.), Canon (Canon Inc.), Fujifilm (FUJIFILM Corporation), Hasselblad (Victor Hasselblad AB), Leica (Leica Camera AG), Lumix (Panasonic Holdings Corporation), Nikon (Nikon Corporation), Noritsu (Noritsu Koki Co., Ltd.), Phase One (Phase One A/S), Ricoh (Ricoh Company, Ltd.), Samsung (Samsung Electronics Co., Ltd.) et Sony (Sony Group Corporation)."
fn_others: "Apple et macOS sont des marques d’Apple Inc. ; Windows de Microsoft Corporation ; Linux est la marque déposée de Linus Torvalds aux États-Unis et dans d’autres pays ; Ubuntu de Canonical Ltd. ; Debian de Software in the Public Interest, Inc. ; Fedora, Red Hat, RHEL et CentOS de Red Hat, Inc. ; openSUSE de SUSE LLC ; Pop!_OS de System76, Inc. ; Rocky Linux de la Rocky Enterprise Software Foundation ; AlmaLinux de l’AlmaLinux OS Foundation ; ChromeOS de Google LLC ; NVIDIA de NVIDIA Corporation ; les noms des autres distributions Linux appartiennent à leurs projets ; Facebook et Instagram de Meta Platforms, Inc. ; GitHub de GitHub, Inc. ; Google Analytics de Google LLC ; Lightroom d’Adobe Inc. ; IrfanView d’Irfan Škiljan ; VietQR de NAPAS ; Wikimedia Commons de la Wikimedia Foundation. Les marques Apple, Windows et Linux (Tux, dessiné à l’origine par Larry Ewing) viennent de Simple Icons (CC0) et montrent seulement de quel système parle une colonne ou une étape."
fn_brand: "Le nom et le logo Fotollection désignent l’application officielle, faite par @hoangphi01. Les téléchargements officiels viennent uniquement de fotollection.org et des versions GitHub du projet. La licence GPL-3.0 permet à chacun de partager ou de vendre des copies, modifiées ou non, à condition de garder cette licence et de proposer le code source ; une copie modifiée ou revendue ne doit pas utiliser le nom ou le logo Fotollection d’une manière qui laisse croire qu’il s’agit de l’application officielle."
fn_notify: "Vous partagez ou vendez Fotollection, ou vous construisez dessus ? Merci de prévenir l’auteur d’abord en ouvrant une issue sur GitHub (github.com/hoangphi01/fotollection/issues). L’application est gratuite et faite sur le temps libre ; un petit mot est la façon juste de dire merci."
fn_cite: "Vous citez, testez ou présentez l’application, ou utilisez ces captures d’écran ? Merci de créditer Fotollection et de mettre un lien vers fotollection.org."
fn_independent: "Fotollection est un projet open source indépendant. Il n’est ni affilié à, ni sponsorisé, ni approuvé par aucune de ces entreprises, et toute autre marque appartient à son propriétaire."
shield: "Privé – vos photos ne quittent jamais votre ordinateur"
privacy_title: "Vos photos restent à vous"
privacy_lead: "Fotollection est conçu pour fonctionner sans aucune connexion internet. Rien n’est envoyé, rien n’est pisté, et vous pouvez en vérifier chaque ligne."
p1_title: "Pas d’envoi, pas de cloud"
p1_text: "Les photos sont lues et écrites sur votre propre disque. Il n’y a aucun serveur où les envoyer."
p2_title: "Pas de compte, pas de pistage"
p2_text: "Pas d’inscription, et l’application n’a ni statistiques ni télémétrie. Depuis la v0.13.0, elle demande une fois au démarrage à GitHub si une nouvelle version est sortie, ce que les Réglages peuvent désactiver."
p6_title: "Pas de publicité"
p6_text: "Rien à vous vendre et personne qui paie pour vous atteindre. Pas de publicité, pas de suggestions sponsorisées, pas d’achat intégré, ni maintenant ni plus tard."
p3_title: "Des lieux sans service de cartes"
p3_text: "Les noms de villes viennent d’une base de données cartographique intégrée à l’application, donc votre GPS ne parvient jamais à un tiers."
p4_title: "GPS retiré à l’export"
p4_text: "Les tirages exportés perdent leur position par défaut, donc une photo confiée à un labo ne révèle pas où vous habitez."
p5_title: "Open source"
p5_text: "Le code est public sous GPL-3.0. Chacun peut le lire, le compiler et confirmer qu’il fait ce que dit cette page."
chart_budgets: "Vitesse et mémoire, face aux budgets fixés avant d’écrire le code"
chart_quality: "Ce que l’export garde de l’original, face à un éditeur web courant"
chart_bestshot: "Suggestions de meilleure photo, notées face à des photos triées à la main"
charts_more: "Toutes les mesures, expliquées"
chart_share: "Photos pour Facebook : ce que voient les gens après la recompression de Facebook"
chart_memory: "Pic de mémoire à mesure que le lot grandit jusqu’à 5 035 photos"
chart_browser: "La même tâche dans Fotollection et dans un navigateur web"
story_title: "L’histoire"
story_kicker: "Un journal"
story_description: "L’histoire derrière Fotollection : vingt ans de photos jamais revues, un hiver à regarder en arrière, et les premiers kilomètres d’un marathon pour refaire des souvenirs des tirages."
story_lead: "Pourquoi Fotollection existe, et comment il a trouvé sa propre voie : un journal des premiers kilomètres, raconté à partir des notes du projet et de l’historique de son code."
story_wiki: "Voir l’application à chaque version, dans le Wiki"
footer_story: "L’histoire"
wiki_title: "Wiki"
wiki_kicker: "Depuis le premier écran"
wiki_description: "Comment Fotollection a grandi depuis son premier écran, version après version : ce que chacune a apporté, avec Fotollection tel qu’il a été publié."
wiki_lead: "Chaque version, d’aujourd’hui jusqu’à la première fenêtre vide : ce qu’elle a apporté, et Fotollection tel qu’il a été publié, tiré de l’historique du projet."
wiki_first: "Aller au premier écran"
wiki_toc: "Versions"
wiki_foot: "Chaque image montre Fotollection tel que cette version a été publiée, tirée de l’historique du projet ; les plus anciennes sont seulement en anglais. Chaque nouvelle version ajoute la sienne ici."
footer_wiki: "Wiki"
man_short_note: "Ceci est le guide abrégé. Le manuel complet, avec chaque détail, est en anglais."
