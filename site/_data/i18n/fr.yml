man_title: "Manuel"
man_kicker: "Aide"
man_description: "Comment utiliser Fotollection, étape par étape, avec une capture d’écran de chaque étape : choisir les photos à imprimer, looks et couleur, zoom, RAW, horloges des appareils, dates et lieux, prise de vue avec un appareil branché, et chaque raccourci."
man_lead: "Chaque étape, telle que l’application la montre. Le manuel suit l’application : quand une version change quelque chose de visible, cette page change avec elle."
man_toc: "Chapitres"
man_source: "Ce manuel sur GitHub"
cs_title: "Politique de signature du code"
cs_kicker: "Confiance"
cs_description: "Comment les installateurs de Fotollection sont compilés et publiés, qui approuve chaque version, et ce que l’application envoie ou non sur le réseau."
cs_lead: "Les installateurs ne sont pas encore signés avec un certificat : Windows affiche un avertissement SmartScreen au premier lancement, les versions macOS ne portent qu’une signature ad hoc, et l’AppImage et le .deb Linux ne sont pas signés non plus. Chaque version liste des sommes de contrôle SHA-256 dans SHA256SUMS.txt, pour que vous puissiez vérifier qu’un téléchargement est bien celui publié ici. Le dépôt APT de fotollection.org/apt est signé avec la clé GPG du projet, donc apt vérifie chaque paquet qu’il en installe."
cs_parts:
  - id: team
    title: "Rôles de l’équipe"
    lead: "Chaque installateur est compilé par GitHub Actions à partir du dépôt public, depuis une version étiquetée ; rien de compilé sur un ordinateur personnel n’est publié. Le workflow de compilation est"
    items:
      - title: "Contributeurs et relecteurs"
        author: true
        text: "Écrit et relit chaque modification du code source."
      - title: "Approbateur des versions"
        author: true
        text: "Vérifie et publie chaque version à la main."
  - id: privacy
    title: "Politique de confidentialité"
    lead: "Ce programme ne transmet aucune information à d’autres systèmes en réseau sauf demande expresse de l’utilisateur ou de la personne qui l’installe ou l’exploite."
    items:
      - title: "Fonctionne hors ligne"
        text: "Les photos, les dossiers, les projets et les réglages ne quittent jamais votre ordinateur. Il n’y a pas de compte, pas de télémétrie et pas d’envoi de rapports de plantage."
      - title: "Rechercher les mises à jour"
        text: "La seule requête réseau : quand vous cliquez, et depuis la v0.13.0 une fois au démarrage sauf désactivation dans les Réglages, elle demande à GitHub (api.github.com) la dernière version de ce projet. Rien n’est téléchargé tout seul. La déclaration de confidentialité de GitHub s’y applique."
      - title: "Pas de position dans les exports"
        text: "Les coordonnées GPS sont retirées des photos exportées par défaut."
      - title: "Ce site"
        text: "Le site, et non l’application, compte les visites et les clics sur ses liens de téléchargement avec Google Analytics ; la politique de confidentialité de Google s’y applique. Le nombre de téléchargements vient de GitHub."
      - title: "Paiements de soutien"
        text: "Ko-fi, GitHub Sponsors et la banque derrière un code VietQR traitent les paiements faits pour soutenir Fotollection, chacun selon sa propre politique de confidentialité. Le site ne fait que les lier et ne charge rien d’eux, et un paiement n’a rien à voir avec l’application ni avec vos données dans Fotollection."
  - id: system
    title: "Modifications de votre système"
    lead: "L’installation n’ajoute que ce dont l’application a besoin, et la désinstallation le retire."
    items:
      - title: "Ouvrir avec"
        text: "L’installateur, et sous Linux le .deb, ajoute Fotollection au menu Ouvrir avec pour les fichiers photo. Il ne se définit jamais comme application par défaut."
      - title: "Désinstaller"
        text: "Supprimez-le depuis les Paramètres de Windows, ou supprimez l’application sous macOS. Le programme de désinstallation Windows retire aussi les entrées Ouvrir avec. Sous Linux, lancez sudo apt remove fotollection, ou supprimez l’AppImage, ou lancez le script d’installation avec --uninstall, qui retire aussi le dépôt APT et sa clé. Les réglages et les projets restent dans votre dossier personnel."
footer_signing: "Politique de signature du code"
perf_title: "Performances"
perf_description: "Chaque mesure derrière Fotollection, expliquée en mots simples : vitesse, mémoire, qualité de tirage, photos pour les réseaux sociaux et suggestions de meilleure photo, avec ce que veulent dire ΔE, SSIM, JPEG et profils de couleur."
perf_kicker: "Mesuré, pas promis"
perf_lead: "Chaque chiffre de cette page vient de vraies photos sur un portable ordinaire (Apple M3, 16 Go), et les scripts qui les ont produits sont dans le dépôt, donc chacun peut les relancer. Sous chaque graphique, ce que cela veut dire pour vos tirages, et à la fin, les mots derrière les chiffres."
perf_how_title: "Pourquoi Fotollection est rapide"
perf_how_lead: "Pas de magie. Quelques décisions prises avant la première ligne de code, chacune mesurée."
perf_how_items:
  - { t: "Du code natif sur chaque cœur", d: "Le travail de Fotollection tourne en Rust, compilé pour votre processeur et réparti sur tous ses cœurs, avec les instructions vectorielles (SIMD) que les processeurs offrent pour les pixels.", v: "23,5 / s", l: "photos de 16 MP exportées", fn: [fn_simd, fn_units, fn_rust] }
  - { t: "Seulement le nécessaire", d: "Ouvrir un dossier lit l’EXIF de chaque fichier et sa petite vignette intégrée, jamais la photo entière. Les vignettes sont gardées dans un cache sur disque.", v: "0,12 s", l: "pour ouvrir 1 000 photos", fn: [fn_exif] }
  - { t: "Jamais plus de pixels que l’écran", d: "Un aperçu fait au plus 1 600 px, tiré d’une copie de 2 048 px gardée en mémoire. La photo entière n’est lue que quand vous zoomez, une partie à la fois.", v: "17 ms", l: "pour redessiner un aperçu" }
  - { t: "Prêt avant que vous cliquiez", d: "Une fois les vignettes faites, un aperçu de chaque photo est préparé en arrière-plan et gardé sur disque, pendant qu’un quart de la mémoire garde les photos autour de celle à l’écran.", v: "27 ms", l: "pour ouvrir n’importe quelle photo" }
  - { t: "Rien de fait deux fois", d: "Un curseur de couleur ne change que la couleur, jamais la taille. Tous les curseurs de couleur sont réunis dans une seule table de 33 × 33 × 33 couleurs, donc dix curseurs coûtent autant qu’un seul.", v: "2 ms", l: "pour dix curseurs de couleur sur un aperçu" }
  - { t: "La mémoire dans le budget", d: "Fotollection ne travaille que sur autant de photos en taille réelle à la fois que son budget mémoire le permet, fixé par la plus grande photo de l’export.", v: "1,45 Go", l: "pic de mémoire avec 5 035 photos" }
  - { t: "Des encodeurs réglés par la mesure", d: "Les fichiers pour le tirage sautent une optimisation de table qui les rendait moins de 1 % plus petits et coûtait un tiers du temps d’encodage.", v: "−33 %", l: "de temps d’encodage pour les fichiers de tirage" }
  - { t: "La carte graphique pendant la retouche", d: "Pendant qu’un curseur de couleur bouge, la carte graphique dessine à partir de la table que construit le cœur. Les exports restent sur le processeur, donc un tirage est identique sur chaque ordinateur.", v: "1–2 ms", l: "par pas de curseur, contre 26 ms avant" }
perf_gpu_title: "La carte graphique pendant la retouche, chaque cœur pour les exports"
perf_gpu_text: "Pendant que vous faites glisser un curseur de couleur, la carte graphique dessine le look à partir de la même table que construit le cœur de Fotollection, et le rendu exact prend le relais quand vous relâchez. Les exports restent sur le processeur, donc un tirage sort identique sur chaque ordinateur."
