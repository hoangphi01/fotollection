dl_warn_title: "Passez à la v0.14.0 ou plus récente."
dl_warn_text: "Les versions précédentes pouvaient perdre les retouches d’un dossier sur un disque non branché au démarrage, et une seule erreur pouvait fermer toute l’application. La v0.14.0 corrige les deux ; vos réglages et vos projets sont conservés."
chart_open: "Ouvrir une photo : v0.9.0 et v0.10.0 face à v0.11.0, sur les 422 photos d’un voyage"
perf_open_title: "Jusqu’à 20× plus rapide. Une nouvelle façon d’utiliser la mémoire."
perf_open_text: "La v0.11.0 repense la façon dont Fotollection garde vos photos. L’aperçu de chaque photo est préparé en arrière-plan dès que sa vignette est faite et gardé sur disque, un quart de la mémoire de votre ordinateur garde les photos autour de celle que vous voyez, et la photo à l’écran passe toujours en premier. Résultat : n’importe quelle photo, proche ou lointaine, JPEG ou RAW, s’ouvre en 27 millisecondes. Ouvrir un RAW est jusqu’à 20 fois plus rapide qu’avec la v0.9.0, un JPEG 10 fois plus, mesuré sur les mêmes 422 photos d’un voyage."
