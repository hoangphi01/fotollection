fn_open: "Gratuit veut dire sans prix, sans publicité et sans achat intégré ; offrir un café à l’auteur est votre choix, et cela l’aide à continuer d’améliorer Fotollection. Open source veut dire que tout le code source est public sur GitHub sous la licence GPL-3.0, donc chacun peut lire, compiler et vérifier ce que fait l’application. Sans compte veut dire que l’application ne demande jamais qui vous êtes et n’a rien où se connecter."
