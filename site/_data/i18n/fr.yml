perf_memory_title: "Mémoire : 5 035 photos, et elle reste stable"
perf_memory_text: "Fotollection ne garde que quelques octets par photo en mémoire, écrit les vignettes dans un cache sur disque et ne travaille que sur autant d’images en taille réelle à la fois que son budget mémoire le permet. La mémoire reste donc stable quand un voyage grandit jusqu’à des milliers de photos."
