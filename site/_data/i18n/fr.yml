faq_title: "Questions avant de télécharger"
faq_lead: "Pourquoi une application photo de plus, et ce qui rend celle-ci différente."
faq_groups:
  - label: "Pourquoi Fotollection"
    items:
      - q: "Pourquoi ne pas simplement utiliser Lightroom ?"
        a: "Lightroom, les applications Photos intégrées et IrfanView sont faits pour retoucher et regarder ; aucun n’est pensé pour une imprimante photo. Pour imprimer avec eux, vous recadrez vous-même chaque photo au rapport du papier, ou vous confiez les fichiers et laissez la machine ou le personnel du magasin les recadrer, ce qui coupe souvent une tête ou le bord d’une enseigne. Fotollection part du tirage : il connaît les formats des bornes photo d’E.Leclerc, d’Intermarché et de la Fnac, y recadre chaque photo pour que ce que vous voyez soit exactement ce qui sort, prévient quand une photo est trop petite, incruste la date comme un appareil argentique et exporte des fichiers que la borne accepte. Il est léger et rapide, gratuit, et fonctionne à côté de Lightroom : vos originaux ne sont jamais modifiés, et vos presets Lightroom y fonctionnent comme des looks."
      - q: "Mon ordinateur a déjà Photos, ou j’utilise IrfanView. Pourquoi une autre application ?"
        a: "Les applications Photos intégrées et IrfanView sont d’excellentes visionneuses, chacune sur son propre système. Aucune ne connaît le format d’un tirage 10 × 15 à une borne d’E.Leclerc ou de la Fnac, ne vous prévient quand une photo est trop petite pour lui, n’incruste la date comme un appareil argentique, ni n’envoie les meilleures photos de cinq dossiers vers un seul panier d’impression. Fotollection le fait, il a le même aspect et fonctionne de la même façon sur Mac, sous Windows et sous Linux, et il peut être la visionneuse avec laquelle vous ouvrez vos photos : clic droit sur une photo, Ouvrir avec, Fotollection, RAW de l’appareil compris."
  - label: "Vitesse et poids"
    items:
      - q: "Est-il lourd ? Fonctionnera-t-il sur mon vieux portable ?"
        a: "Il est petit : l’installateur Windows pèse environ 18 Mo, car la fenêtre utilise la vue web que le système a déjà au lieu d’embarquer tout un navigateur. Le cœur est écrit en Rust et tourne directement sur votre ordinateur. Un aperçu ne dépasse jamais 1 600 px, donc même une photo de 32 MP s’ouvre aussi vite qu’une petite, et l’image en taille réelle n’est chargée que quand vous zoomez. Même en exportant 5 035 photos, la mémoire culmine à environ 1,45 Go."
      - q: "Est-il rapide avec des milliers de photos ?"
        a: "Ouvrir 1 000 photos prend environ 0,12 s, car Fotollection lit d’abord la petite vignette intégrée à chaque fichier. Changer un réglage redessine l’aperçu en 17 ms, l’export tourne à 18 photos en taille réelle par seconde, et après le premier lancement l’application s’ouvre en 0,4 s environ. Chaque chiffre a été mesuré sur un portable ordinaire, et la page Performances explique comment les mesurer vous-même."
  - label: "Plateformes et prix"
    items:
      - q: "Fonctionne-t-il sur Mac, Windows et Linux, et est-il vraiment gratuit ?"
        a: "Oui. Un téléchargement pour macOS 11 ou plus récent, sur Apple silicon comme sur Intel, un pour Windows 10 et 11, et pour Linux 64 bits une AppImage ou un .deb, sur Intel/AMD ou ARM, pour toute distribution avec glibc 2.35 ou plus récente. Linux a la version allégée : pas encore de photos HEIC (iPhone), pas de prise de vue avec un appareil branché en USB, et le RAW sans les corrections d’objectif qu’ajoute macOS ; le tableau sous Fonctions montre chaque différence. Il est gratuit, sans publicité, sans compte et sans achat intégré, et le code source est public sous GPL-3.0, donc chacun peut vérifier ce qu’il fait."
tabs_row_title: "Des dossiers en onglets, des coches qui vous suivent"
tabs_text: "Cliquez sur un dossier pour travailler sur lui seul, ou sur l’espace de travail pour tous les dossiers à la fois. Cochez des photos dans un dossier, passez à un autre et continuez à cocher : la barre les compte toutes, donc le meilleur de chaque dossier part au panier d’impression en un geste. Cochez plusieurs dossiers pour les exporter ensemble ou chacun dans son propre dossier, et fermez un onglet avec × quand vous avez fini ; les photos restent sur votre disque."
modes_title: "Trois modes, trois usages"
modes_lead: "Choisissez celui qui correspond à ce que vous voulez faire, en haut de la barre latérale ou avec Cmd/Ctrl+1, 2 et 3. Vos photos, votre panier d’impression et vos réglages restent les mêmes dans chaque mode."
mode_simple: "Simple"
mode_simple_for: "De retour de voyage, vous voulez des tirages vite."
mode_simple_s1: "Déposez un dossier de photos sur l’application."
mode_simple_s2: "Une touche chiffrée donne un look ; haut garde la photo, bas la met de côté."
mode_simple_s3: "Choisissez le format d’impression et la date incrustée, puis Exporter."
mode_collage: "Collage"
mode_collage_for: "Deux photos sur un tirage pour moitié prix, ou des cartes postales."
mode_collage_s1: "Mettez les photos voulues dans le panier d’impression."
mode_collage_s2: "Elles vont par deux sur un tirage ; faites-en glisser une pour les échanger."
mode_collage_s3: "Activez Carte postale pour les envoyer par la poste, puis Exporter."
mode_pro: "Pro"
mode_pro_for: "Des centaines de photos, choisies et finies avec soin."
mode_pro_s1: "Étoiles, drapeaux et la photo la plus nette de chaque rafale."
mode_pro_s2: "Recadrage, redressement, date incrustée et cadre d’infos."
mode_pro_s3: "Exportez pour la borne, ou plus léger pour partager en ligne."
modes_manual: "Le manuel complet"
postcard_title: "Une carte postale de votre propre photo"
postcard_text: "En mode Collage, un seul interrupteur fait de chaque tirage une carte postale : votre photo sur une moitié, et sur l’autre un cadre de timbre en pointillés et des lignes pour un message ou une adresse. Tapez le texte, composé dans une police machine à écrire, ou écrivez-le à la main avec un feutre permanent fin. Un tirage 10 × 15 entre dans les formats de carte postale de La Poste (de 90 × 140 à 162 × 235 mm)."
pc_type_title: "Tapé, ou écrit à la main"
pc_type_text: "Le message et l’adresse ont chacun leurs lignes, avec gras, italique et souligné, dans une police machine à écrire ou une police à vous. Chaque lettre des langues européennes écrites en alphabet latin est là, donc une adresse à Praha ou à Kraków s’imprime telle que tapée. Choisissez l’encre, noire, bleue, sépia ou rouge, et ajoutez une petite ligne de crédit en pied. La moitié photo fonctionne comme en mode Collage : une bordure blanche autour, ou la photo jusqu’au bord."
collage_title: "Deux photos sur un tirage"
collage_text: "Inspiré des appareils argentiques demi-format : un tirage 10 × 15 contient deux photos 10 × 7,5, donc une série coûte moitié moins. Les photos vont par deux dans l’ordre, un glisser les échange, et l’application suggère une taille avec du blanc autour, 6 × 9 cm pour une photo 2:3. Une fine ligne de coupe sépare le tirage en deux, ou laissez-la de côté pour une bande demi-format."
show_collage: "Le mode Collage : les feuilles telles qu’elles seront imprimées, avec le rapport de la photo, la taille suggérée et la ligne de coupe"
collage_preview_title: "Voir le tirage avant qu’il soit imprimé"
collage_preview_text: "Ouvrez une feuille comme vous ouvrez une photo : le tirage en grand, exactement comme la borne le fera, deux photos côte à côte avec la date incrustée et la bordure. Choisissez l’une ou l’autre photo avec 1 ou 2 pour la recadrer ou la tourner, et feuilletez les autres feuilles avec les flèches."
show_collage_preview: "L’aperçu d’une feuille : un tramway de nuit et le Musée national de Prague sur un même tirage 10 × 15"
simple_title: "Simple : garder ou écarter, puis imprimer"
simple_text: "Une photo à la fois, telle qu’elle sera imprimée. Une touche chiffrée lui donne un look, haut la garde, bas l’écarte, et la suivante arrive aussitôt. Choisissez un format et la date incrustée, puis exportez ce que vous avez gardé."
show_simple: "Le mode Simple : la photo telle qu’elle sera imprimée, Garder et Écarter, et l’export des photos gardées"
swipe_title: "↑ pour imprimer, ↓ pour mettre de côté"
swipe_text: "Ouvrez la première photo et décidez d’une touche : ↑ la met dans le panier d’impression, ↓ la met de côté, et la photo suivante est déjà à l’écran. Rien n’est jamais supprimé : le panier et la pile des photos mises de côté attendent dans la barre latérale, vous pouvez donc changer d’avis."
select_title: "Ou cochez-les dans la galerie"
select_text: "Sélectionner transforme la grille en cases à cocher, comme sur un iPhone, avec Maj-clic pour toute une série. Maintenez Espace sur une photo pour la voir en grand, exactement comme elle sera imprimée, puis relâchez et continuez."
estimate_title: "Connaître la taille avant d’exporter"
estimate_text: "La carte d’export vous dit combien pèseront les fichiers avant que rien ne soit écrit, à partir de quelques photos encodées avec vos réglages. Les photos d’appareil partagées pour Facebook sortent environ six fois plus légères, et vous le voyez avant de cliquer."
