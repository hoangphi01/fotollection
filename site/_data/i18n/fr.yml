title: "Fotollection – des photos prêtes à imprimer, entièrement hors ligne"
description: "Application de bureau gratuite et open source qui prépare vos photos pour le tirage sur votre propre ordinateur. Des looks en un clic (vos presets Lightroom et vos LUT aussi), une date incrustée rétro, un cadre d’infos de l’appareil, des suggestions de meilleure photo, des recadrages au format d’impression et un export en qualité d’origine, sans compte et sans envoi en ligne."
