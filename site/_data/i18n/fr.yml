perf_trip_title: "Un vrai voyage : 422 fichiers de Prague"
perf_trip_text: "Les jeux de test peuvent flatter, alors voici un dossier tel qu’il est sorti d’un Lumix GX9 après un week-end à Prague : 396 JPEG de 20 MP, environ 11 Mo chacun, et 26 fichiers RAW à côté, 4,7 Go en tout. L’ouvrir lit l’EXIF de chaque fichier en 0,23 seconde. L’aperçu se redessine en 19 ms, un RAW se développe en 0,35 seconde et dix cartes postales se redessinent en 21 ms. Le 2026-11-03, deux chiffres ont manqué leur budget sur ces gros fichiers : l’export tournait à 7,6 photos par seconde et la mémoire culminait à 2,14 Go. La cause a été trouvée et corrigée dans la v0.9.7 : les JPEG s’exportent désormais à 10,1 par seconde, et tout le passage reste sous 1,31 Go."
