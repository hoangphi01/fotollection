fn_trip: "Le dossier de Prague appartient à l’auteur et n’est pas publié (© @hoangphi01, tous droits réservés). Médianes de 3 passages de bench/trip.sh et de measure_folder sur ses JPEG, sur un Apple M3 avec 16 Go, avec d’autres applications ouvertes, le 2026-11-04, avec l’export de la v0.9.7 ; lancez-les sur un dossier à vous pour comparer."
fn_photo: "La photo du tramway appartient à l’auteur (© @hoangphi01, tous droits réservés), prise avec un Lumix GX9 à Prague en novembre 2026 ; chaque look est rendu par le moteur de Fotollection et retouché nulle part ailleurs."
fn_downloads: "Compté par GitHub."
fn_payment: "VietQR et NAPAS 247 et leurs logos sont des marques de la National Payment Corporation of Vietnam (NAPAS) ; Techcombank de la Vietnam Technological and Commercial Joint Stock Bank. Montrés comme les marques du paiement qu’utilise le code ; Fotollection n’a aucun lien avec eux."
compare_title: "Comment il se compare"
compare_lead: "Fotollection ne cherche pas à remplacer un éditeur RAW complet. Il est fait pour l’étape que ceux-ci vous laissent : du dossier d’un voyage aux tirages que l’on tient en main."
compare_caption: "Fotollection à côté de Lightroom Classic, darktable et RawTherapee"
