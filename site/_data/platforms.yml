# The "By system" table on the home page (site/_includes/home.html), one row per feature.
# The facts live here once, so English and Vietnamese cannot drift; the words live in
# i18n.yml: the row label is `pf_<key>`, the marks are `pf_ok`, `pf_soon` and `pf_none`.
# A mark is ok (✓), soon (not yet) or none (—). `<system>_fn` is the number of the
# footnote that cell carries (the `notes` list in _layouts/default.html); `coming` marks
# a row whose feature is not in the download yet, like the "coming in vX" text elsewhere.
# Source of truth: README.md "By system" and ADR-0034 (the lean Linux build).
systems: [mac, win, linux]
rows:
  - key: cull
    mac: ok
    win: ok
    linux: ok
  - key: print
    mac: ok
    win: ok
    linux: ok
  - key: places
    mac: ok
    win: ok
    linux: ok
  - key: export
    mac: ok
    win: ok
    linux: ok
  - key: looks
    mac: ok
    win: ok
    linux: ok
  - key: modes
    mac: ok
    win: ok
    linux: ok
  - key: jpeg
    label_fn: [fn_png]
    mac: ok
    win: ok
    linux: ok
  - key: raw
    mac: ok
    mac_fn: [fn_pf_raw]
    win: ok
    linux: ok
  - key: heic
    label_fn: [fn_heic]
    mac: ok
    win: ok
    win_fn: [fn_pf_heic_win]
    linux: soon
    linux_fn: [fn_pf_heic_linux]
  - key: tether
    label_fn: [fn_usb]
    mac: soon
    win: ok
    win_fn: [fn_pf_tether]
    linux: none
  - key: openwith
    mac: ok
    win: ok
    linux: ok
    linux_fn: [fn_pf_openwith]
  - key: update
    mac: ok
    win: ok
    linux: ok
    linux_fn: [fn_pf_update]
