# SPDX-License-Identifier: GPL-3.0-only
# The website (site/README.md), built by .github/workflows/pages.yml with GitHub Pages' Jekyll.
# Served at the custom domain fotollection.org (Cloudflare DNS, set in the repository's
# Pages settings; site/README.md). Moving it means changing url and baseurl.
title: Fotollection
url: https://fotollection.org
baseurl: ""
repository: hoangphi01/fotollection
repo_url: https://github.com/hoangphi01/fotollection
author: hoangphi01
# Google Analytics for the website only (the app has none). Loaded in production builds.
google_analytics: G-6S9X5DN7GL

plugins:
  - jekyll-github-metadata

exclude:
  - README.md
  - screenshots/

markdown: kramdown
