{%- comment -%} The GitHub star button: a plain link, no third-party script, and no count (owner, 2026-11-14: an invitation, not a tally). pages.yml still writes repo.json; nothing shows it. {%- endcomment -%}

  {% include icons/star.svg %}<span class="pill-label">{{ t.star }}</span>
</a>
