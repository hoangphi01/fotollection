<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotollection</title>
    <!-- Start-up screen (FR-060): painted with the first frame, before any script runs, and
         removed by the app once the session is back (features/startup). Colours are the
         theme's background and primary (index.css). -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: oklch(0.988 0.006 88);
        transition: opacity 200ms ease-out;
        cursor: default;
        user-select: none;
      }
      #splash img { width: 128px; height: 128px; }
      #splash .track {
        position: relative;
        width: 180px;
        height: 4px;
        overflow: hidden;
        border-radius: 2px;
        background: oklch(0.552 0.089 172.9 / 0.18);
      }
      #splash .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 35%;
        border-radius: 2px;
        background: oklch(0.552 0.089 172.9);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      /* Known progress (an import while the session comes back) replaces the slide. */
      #splash[data-progress] .fill {
        animation: none;
        width: var(--splash-progress);
        transition: width 150ms linear;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(290%); }
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: oklch(0.185 0.006 70); }
        #splash .track { background: oklch(0.685 0.106 61.2 / 0.2); }
        #splash .fill { background: oklch(0.685 0.106 61.2); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .fill { animation-duration: 3s; }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="progressbar" aria-label="Fotollection">
      <img src="/brand/icon-256.png" alt="" />
      <div class="track"><div class="fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
