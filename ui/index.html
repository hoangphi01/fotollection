<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotollection</title>
    <!-- Start-up screen (FR-060): painted with the first frame, before any script runs, and
         removed by the app once the session is back (features/startup). Its styles are a file,
         not an inline <style> (SECURITY.md §2). -->
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <div id="splash" role="progressbar" aria-label="Fotollection">
      <img src="/brand/icon-256.png" alt="" />
      <div class="track"><div class="fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
