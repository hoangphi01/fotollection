[workspace]
resolver = "3"
members = ["crates/core", "crates/geodata", "crates/oscamera", "crates/oscodec", "crates/rawlgpl", "src-tauri"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/hoangphi01/fotollection"
rust-version = "1.99"

[workspace.dependencies]
fotollection-core = { path = "crates/core" }
fotollection-oscodec = { path = "crates/oscodec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
ab_glyph = "0.2.32"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
fast_image_resize = "6.1.0"
jpeg-encoder = "0.7.1"
qcms = "0.3.0"
kamadak-exif = "0.6.1"
png = "0.18.1"
rayon = "1.12.0"
walkdir = "2.5.0"
# Project bundles (ADR-0016): deflate only, through flate2 on pure-Rust miniz_oxide.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Best-shot face models (ADR-0018): pure-Rust ONNX inference.
tract-onnx = "0.23.9"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
# dev / bench
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
little_exif = "0.6.23"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Graphics code conventionally uses x, y, w, h.
many_single_char_names = "allow"
unwrap_used = "warn"
expect_used = "warn"

# Build-size profiles: see docs/DEVELOPMENT.md §4.1
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

# Our own image code is hot too: unoptimized it made dev thumbnails ~10× slower.
[profile.dev.package.fotollection-core]
opt-level = 3

[profile.release]
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "unwind"
