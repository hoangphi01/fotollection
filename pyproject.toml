# Python tooling only (benchmarks, icon and screenshot helpers); nothing here ships in the app.
# Managed with uv: `uv sync` once, then `uv run <script>` (docs/DEVELOPMENT.md §1.3).
[project]
name = "fotollection-tools"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",   # BSD-3-Clause
  "pillow>=11.0", # MIT-CMU
]

[tool.uv]
package = false
