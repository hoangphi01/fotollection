[package]
name = "fotollection"
description = "Fast, private, offline photo-print preparation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "fotollection_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
fotollection-core.workspace = true
# FR-062, FR-063: cameras over USB through the OS stack (ADR-0026, ADR-0028).
fotollection-oscamera.workspace = true
chrono.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
# FR-054: a second launch ("Open with" while running) hands its paths to this one.
tauri-plugin-single-instance = "2"
# FR-061: "Check for updates", only when the user clicks: one HTTPS request to GitHub, and the
# download page opened in the browser from Rust (never a URL from the webview).
semver = "1"
tauri-plugin-opener = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tauri-specta.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
