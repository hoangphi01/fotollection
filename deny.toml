# Dependency policy enforced by `cargo deny check` (docs/SECURITY.md §6, ADR-0008).
# Only permissive licenses are allowed so the project keeps its relicensing option.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Flag unmaintained crates we depend on directly; transitive ones (e.g. via GTK on Linux) are
# tracked upstream by Tauri. Real vulnerabilities are always denied.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# Our own crates are GPL-3.0-only; that's fine for them, not for dependencies.
[[licenses.exceptions]]
crate = "fotollection"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "fotollection-core"
allow = ["GPL-3.0-only"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
