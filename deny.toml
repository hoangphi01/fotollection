# Dependency policy enforced by `cargo deny check` (docs/SECURITY.md §6, ADR-0008).
# Only permissive licenses are allowed so the project keeps its relicensing option.

[graph]
all-features = true
# Only what ships to users is checked. Dev-dependencies (e.g. little_exif, which builds
# synthetic test fixtures) never process user data and are not distributed.
exclude-dev = true

[advisories]
version = 2
yanked = "deny"
# Flag unmaintained crates we depend on directly; transitive ones (e.g. via GTK on Linux) are
# tracked upstream by Tauri. Real vulnerabilities are always denied.
unmaintained = "workspace"
# RUSTSEC-2026-0543: chrono is unmaintained (no known vulnerability). Our code and rawler both
# use it, so it cannot leave the build alone; ignored by the owner's decision (2026-11-17) until
# a move to jiff that rawler shares (SECURITY.md §6). RUSTSEC-2026-0192 (ttf-parser) was
# ignored the same way for v0.14.2, until FR-134.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; used by our code and rawler; move to jiff later (SECURITY.md §6)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  # jpeg-encoder is "(MIT OR Apache-2.0) AND IJG"; IJG is permissive but requires
  # attribution, which README and the About section provide.
  "IJG",
  # walkdir and friends are dual "Unlicense OR MIT".
  "Unlicense",
]
# Our own crates are GPL-3.0-only; that's fine for them, not for dependencies.
[[licenses.exceptions]]
crate = "fotollection"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "fotollection-core"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "fotollection-oscodec"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "fotollection-oscamera"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "fotollection-rawcore"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "fotollection-rawlgpl"
allow = ["GPL-3.0-only"]

# ADR-0029: rawler (LGPL-2.1) reads camera RAW with nothing to install. The only LGPL
# dependency, used only by fotollection-rawlgpl; it must be removed before any relicensing
# (ADR-0008). Its own dependencies all pass the permissive allowlist above.
[[licenses.exceptions]]
crate = "rawler"
allow = ["LGPL-2.1"]

[[licenses.exceptions]]
crate = "fotollection-geodata"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "fotollection-addassistdata"
allow = ["GPL-3.0-only"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
