name: ci

# Only when code or the toolchain changes: a docs- or website-only push skips the builds
# (RELEASE.md §4). The release workflow always runs it in full before building.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src-tauri/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "src-tauri/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "rust-toolchain.toml"
      - "deny.toml"
      - ".github/workflows/ci.yml"
  # The release workflow runs the full CI before building (RELEASE.md §4).
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release never cancels the push CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest glibc (2.35) the Linux builds support (ADR-0034).
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Reads the pinned toolchain from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      # Tauri's system libraries on Linux, as scripts/bootstrap.sh installs them.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      # The AppStream metadata software centres read (Flathub, GNOME Software, the VNLF App
      # Explorer); screenshots are URLs, so they are not fetched here.
      - name: AppStream metadata
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y appstream
          appstreamcli validate --no-net --explain src-tauri/linux/com.hoangphi01.fotollection.metainfo.xml

      # The Flatpak's files (scripts/flatpak-files.mjs): its metainfo checked by Flathub's own
      # linter, which knows the newer tags Ubuntu 22.04's appstream does not, and its launcher.
      - name: Flatpak metadata
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate src-tauri/linux/flatpak/org.fotollection.Fotollection.desktop
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/flathub/flatpak-builder-lint:latest \
            appstream src-tauri/linux/flatpak/org.fotollection.Fotollection.metainfo.xml

      - name: Install JS dependencies
        run: npm ci

      - name: UI typecheck, lint, build
        run: |
          npm run ui:typecheck
          npm run ui:lint
          npm run ui:build

      - name: Rust fmt
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests (also regenerates IPC bindings)
        run: cargo test --workspace --locked

      - name: IPC bindings are up to date
        shell: bash
        run: git diff --exit-code -- ui/src/ipc/bindings.ts

      - name: Core has no Tauri or networking dependency (ADR-0002, NFR-006)
        shell: bash
        run: |
          if cargo tree -p fotollection-core -e normal --prefix none | grep -E '^(tauri|reqwest|hyper|ureq) '; then
            echo "forbidden dependency in fotollection-core"; exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny (licenses, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Dangerous DOM APIs are not used (SECURITY.md §7)
        run: |
          if grep -rnE "dangerouslySetInnerHTML|innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(|new Function" ui/src --include='*.ts' --include='*.tsx' --exclude-dir=ipc; then
            echo "dangerous DOM API found"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: npm audit (production deps)
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
