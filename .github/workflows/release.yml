name: release

# Releases when the version in Cargo.toml has no tag yet (RELEASE.md §4, ADR-0021).
# `scripts/release.sh` makes that commit; only pushes that touch Cargo.toml start this workflow,
# and those without a new version stop after `detect`.
on:
  push:
    branches: [main]
    # A release commit always changes the version in Cargo.toml; other pushes never start.
    paths: ["Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.1" ] || git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released (or the placeholder); nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version."
          fi
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  check:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [detect, check]
    name: build (${{ matrix.os }})
    strategy:
      # Every system finishes and reports, so one run shows every failure; publish still
      # needs all four.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
            bundle: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*-setup.exe
          # Linux (ADR-0034): built on 22.04, so glibc 2.35 is the floor; x86_64 and ARM64.
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            bundle: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            args: --bundles appimage,deb
            bundle: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Reads the pinned toolchain from rust-toolchain.toml and adds the targets.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.targets }}
          cache: false

      - uses: Swatinem/rust-cache@v2

      # Tauri's system libraries on Linux, as scripts/bootstrap.sh installs them.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf xvfb

      - name: Install JS dependencies
        run: npm ci

      - name: Build installers (macOS ad-hoc signed, ADR-0009)
        shell: bash
        env:
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          args="${{ matrix.args }}"
          # MSI versions cannot carry a pre-release tag such as -beta.1: pre-releases ship NSIS only.
          if [ "$PRERELEASE" = "true" ]; then args="${args/msi,/}"; fi
          # shellcheck disable=SC2086 # the arguments are meant to split
          npm run build -- $args

      # Uploaded before the smoke test, so a failed test leaves the installers to try by hand;
      # publish still needs every build job to pass.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

      # Linux has no machine of ours to try it on, so the release proves it starts
      # (TESTING §7): the .deb installs and registers its file types, and the AppImage
      # runs for 20 s without a crash, here (glibc 2.35) and on Debian 12.
      - name: Linux smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls target/release/bundle/deb/*.deb)
          sudo apt-get install -y "./$deb"
          desktop=$(dpkg -L fotollection | grep -m1 '\.desktop$')
          grep -q 'image/jpeg' "$desktop"
          grep -q 'application/vnd.fotollection.project+zip' "$desktop"
          test -f /usr/share/mime/packages/fotollection.xml
          appimage=$(ls target/release/bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          code=0; timeout 20 xvfb-run -a "$appimage" --appimage-extract-and-run || code=$?
          [ "$code" = 124 ] || { echo "the AppImage exited with $code"; exit 1; }
          code=0
          # A bare debian:12 image has no desktop libraries at all. An AppImage leaves out the
          # ones every desktop ships (fontconfig, GL, X11: the AppImage exclude list), so the
          # container first gets GTK 3 and Mesa (GL, EGL, GLES, DRI), the floor of any Debian
          # desktop, then lists any library the AppImage still cannot find before it runs.
          # WebKit opens GLES at run time, which ldd cannot see (LESSONS 2026-11-01).
          docker run --rm -v "$PWD/$appimage:/app.AppImage:ro" debian:12 bash -c \
            'apt-get update -qq &&
             apt-get install -y -qq xvfb xauth libgtk-3-0 libgl1 libegl1 libgles2 libgbm1 libgl1-mesa-dri >/dev/null &&
             cd /tmp && /app.AppImage --appimage-extract >/dev/null &&
             export LD_LIBRARY_PATH=$(find squashfs-root/usr -name "*.so*" -printf "%h\n" | sort -u | paste -sd:) &&
             missing=$(find squashfs-root/usr -type f \( -name "*.so*" -o -perm -u+x \) -exec ldd {} + 2>/dev/null |
               grep "not found" | sort -u) &&
             unset LD_LIBRARY_PATH &&
             [ -z "$missing" ] || { echo "missing on Debian 12: $missing"; exit 1; };
             timeout 20 xvfb-run -a squashfs-root/AppRun' || code=$?
          [ "$code" = 124 ] || { echo "the AppImage exited with $code on Debian 12"; exit 1; }

  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      actions: write # start the website build
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          # Artifacts keep their folders (msi/, nsis/); release assets are flat.
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && (/^## \[/ || /^---$/) { exit }
            on { print }
          ' CHANGELOG.md > section.md
          test -s section.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          # The release page shows only the short Highlights; the full list stays in the CHANGELOG.
          awk '/^### Highlights/ { on=1; next } on && /^### / { exit } on { print }' section.md > notes.md
          test -s notes.md || cp section.md notes.md
          {
            echo
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md"
            echo
            cat .github/release-notes.md
            # The oldest version still safe to use (FR-103), read by the app's check at start;
            # an HTML comment, so the release page does not show it.
            echo
            echo "<!-- fotollection-update $(jq -c . .github/update.json) -->"
          } >> notes.md

      - name: Tag and publish
        run: |
          flags=""
          [ "${{ needs.detect.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          # A name after the date in the CHANGELOG heading ("## [0.8.0] - 2026-10-27 — Places and
          # Lightroom") joins the title.
          name=$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md | sed -nE 's/^## \[[^]]+\] - [0-9-]+ — (.+)$/\1/p')
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Fotollection v$VERSION${name:+ — $name}" \
            --notes-file notes.md $flags

      - name: Rebuild the website for the new version
        run: |
          if [ -f .github/workflows/pages.yml ]; then gh workflow run pages.yml --ref main; fi
