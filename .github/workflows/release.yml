name: release

# Releases when the version in Cargo.toml has no tag yet (RELEASE.md §4, ADR-0021).
# `scripts/release.sh` makes that commit; only pushes that touch Cargo.toml start this workflow,
# and those without a new version stop after `detect`.
on:
  push:
    branches: [main]
    # A release commit always changes the version in Cargo.toml; other pushes never start.
    paths: ["Cargo.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.1" ] || git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released (or the placeholder); nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$version."
          fi
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  check:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [detect, check]
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
            bundle: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # Reads the pinned toolchain from rust-toolchain.toml and adds the targets.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.targets }}
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: npm ci

      - name: Build installers (macOS ad-hoc signed, ADR-0009)
        shell: bash
        env:
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          args="${{ matrix.args }}"
          # MSI versions cannot carry a pre-release tag such as -beta.1: pre-releases ship NSIS only.
          if [ "$PRERELEASE" = "true" ]; then args="${args/msi,/}"; fi
          # shellcheck disable=SC2086 # the arguments are meant to split
          npm run build -- $args

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      actions: write # start the website build
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          # Artifacts keep their folders (msi/, nsis/); release assets are flat.
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > section.md
          test -s section.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          # The release page shows only the short Highlights; the full list stays in the CHANGELOG.
          awk '/^### Highlights/ { on=1; next } on && /^### / { exit } on { print }' section.md > notes.md
          test -s notes.md || cp section.md notes.md
          {
            echo
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md"
            echo
            cat .github/release-notes.md
          } >> notes.md

      - name: Tag and publish
        run: |
          flags=""
          [ "${{ needs.detect.outputs.prerelease }}" = "true" ] && flags="--prerelease"
          # A name after the date in the CHANGELOG heading ("## [0.8.0] - 2026-10-27 — Places and
          # Lightroom") joins the title.
          name=$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md | sed -nE 's/^## \[[^]]+\] - [0-9-]+ — (.+)$/\1/p')
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Fotollection v$VERSION${name:+ — $name}" \
            --notes-file notes.md $flags

      - name: Rebuild the website for the new version
        run: |
          if [ -f .github/workflows/pages.yml ]; then gh workflow run pages.yml --ref main; fi
