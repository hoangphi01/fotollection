name: docs

# Only when a document or a file that check-docs.sh compares with the docs changes.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "bench/results/**"
      - "Cargo.toml"
      - "package-lock.json"
      - "ui/package.json"
      - "src-tauri/tauri.conf.json"
      - "scripts/check-docs.sh"
      - "site/assets/img/**"
      - ".markdownlint*"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "bench/results/**"
      - "Cargo.toml"
      - "package-lock.json"
      - "ui/package.json"
      - "src-tauri/tauri.conf.json"
      - "scripts/check-docs.sh"
      - "site/assets/img/**"
      - ".markdownlint*"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bench/chart.mjs, which check-docs runs to find stale charts, reads the site's language
      # registry through js-yaml: only that package (and its one dependency), installed aside and
      # copied in, since `npm install <pkg>` at the root installs the whole workspace, and with
      # Eleventy present check-docs builds the site, which needs the pages workflow's changelog.
      - name: The one package the chart check reads
        run: |
          npm install --prefix "$RUNNER_TEMP/jsy" --no-save --ignore-scripts js-yaml@4.1.0
          cp -R "$RUNNER_TEMP/jsy/node_modules" ./node_modules

      - name: Requirement & index consistency
        run: bash scripts/check-docs.sh

      # Out of the way of the lint and the link check, which would read its Markdown.
      - name: Remove the chart check's package
        run: rm -rf node_modules

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

      - name: Internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: check only repository-internal links (deterministic, no flaky network).
          args: --offline --include-fragments --no-progress "**/*.md"
          fail: true
