name: docs

# Only when a document or a file that check-docs.sh compares with the docs changes.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "bench/results/**"
      - "Cargo.toml"
      - "package-lock.json"
      - "ui/package.json"
      - "src-tauri/tauri.conf.json"
      - "scripts/check-docs.sh"
      - "site/assets/img/**"
      - ".markdownlint*"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "bench/results/**"
      - "Cargo.toml"
      - "package-lock.json"
      - "ui/package.json"
      - "src-tauri/tauri.conf.json"
      - "scripts/check-docs.sh"
      - "site/assets/img/**"
      - ".markdownlint*"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Requirement & index consistency
        run: bash scripts/check-docs.sh

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

      - name: Internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: check only repository-internal links (deterministic, no flaky network).
          args: --offline --include-fragments --no-progress "**/*.md"
          fail: true
