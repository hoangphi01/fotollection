name: pages

# The website in site/ (site/README.md), built with GitHub Pages' own Jekyll. Rebuilt when the
# site changes, by release.yml after a release so the download buttons show it, and every six
# hours so the star count and the visit count in the footer stay current.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "scripts/ga-visits.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The star count for the header button, read at build time (no script in the page).
      - name: Repository facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{stars: .stargazers_count}' > site/_data/repo.json

      # Total visits for the landing page footer, from Google Analytics (scripts/ga-visits.mjs).
      # Without the secrets it writes nothing and the footer leaves the line out.
      - name: Visit count
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
        run: node scripts/ga-visits.mjs

      # The CHANGELOG, from the first version heading on, for the "What's new" box.
      - name: Changelog for the page
        run: awk '/^## \[/{p=1} p' CHANGELOG.md > site/_includes/changelog.md

      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
          token: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
