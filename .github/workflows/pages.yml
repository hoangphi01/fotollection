name: pages

# The website in site/ (site/README.md), built with GitHub Pages' own Jekyll. Rebuilt when the
# site changes, by release.yml after a release so the download buttons show it, and every six
# hours so the star count and the visit count in the footer stay current.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "docs/USER_GUIDE.md", "docs/USER_GUIDE.vi.md", "scripts/site-manual.sh", "scripts/ga-visits.mjs", "scripts/download-stats.mjs", "scripts/apt-repo.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The star count for the header button, read at build time (no script in the page).
      - name: Repository facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{stars: .stargazers_count}' > site/_data/repo.json

      # Total visits for the landing page footer, from Google Analytics (scripts/ga-visits.mjs).
      # Without the secrets it writes nothing and the footer leaves the line out.
      - name: Visit count
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
        run: node scripts/ga-visits.mjs

      # How often the installers were downloaded, from GitHub's release counts, split by the
      # clicks on the site's own links (scripts/download-stats.mjs). Nothing on any error.
      - name: Download count
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-stats.mjs

      # The CHANGELOG, from the first released version (or its series' rule) on, for the "What's new" box.
      - name: Changelog for the page
        run: awk '/^## \[Unreleased\]/{u=1; next} u && (/^---$/ || /^## \[/){p=1} p' CHANGELOG.md > site/_includes/changelog.md

      # The user guide, both languages, for the manual page (ADR-0031).
      - name: Manual for the page
        run: scripts/site-manual.sh

      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
          token: ${{ github.token }}

      # The signed APT repository at /apt, from the latest release's .deb files (ADR-0035).
      # Without the key secret, or before a release has a .deb, the site goes out without it.
      - name: APT repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          scripts/apt-repo.sh _site/apt

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
